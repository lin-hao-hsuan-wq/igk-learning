        }

        const App = () => {
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const [isLocked, setIsLocked] = useState(false);
            const ADMIN_PASSWORD = "8888";

            const [currentView, setCurrentView] = useState('setup');
            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [logs, setLogs] = useState([]);
            const [attendanceData, setAttendanceData] = useState({});
            const [timecardText, setTimecardText] = useState('');
            const [payMonth, setPayMonth] = useState('2026-09');
            const [activeLocation, setActiveLocation] = useState('rokko');
            const [activeEmployeeId, setActiveEmployeeId] = useState('r1');
            const [processedFiles, setProcessedFiles] = useState([]);

            const [batchStart, setBatchStart] = useState('');
            const [batchEnd, setBatchEnd] = useState('');
            
            const [ftSelected, setFtSelected] = useState([]);
            const [ftShiftStart, setFtShiftStart] = useState('');
            const [ftShiftEnd, setFtShiftEnd] = useState('');
            const [ftReason, setFtReason] = useState('');

            const [globalStaffIn, setGlobalStaffIn] = useState('');
            const [globalStaffOut, setGlobalStaffOut] = useState('');
            const [globalStaffIgka, setGlobalStaffIgka] = useState('');
            const [staffDays, setStaffDays] = useState({});

            const [showEmpModal, setShowEmpModal] = useState(false);
            const [newEmpNum, setNewEmpNum] = useState('');
            const [newEmpName, setNewEmpName] = useState('');
            const [newEmpType, setNewEmpType] = useState('part');
            const [newEmpLoc, setNewEmpLoc] = useState('rokko');

            const addLog = (msg, type = 'info') => setLogs(prev => [`[${dayjs().format('HH:mm:ss')}] ${msg}`, ...prev]);

            useEffect(() => {
                docRef.get().then((doc) => {
                    if (doc.exists) {
                        const cloudData = doc.data();
                        if (cloudData.employees && cloudData.employees.length >= INITIAL_EMPLOYEES.length) {
                            setEmployees(cloudData.employees);
                        } else {
                            setEmployees(INITIAL_EMPLOYEES);
                        }
                        if (cloudData.attendanceData) setAttendanceData(cloudData.attendanceData);
                        if (cloudData.processedFiles) setProcessedFiles(cloudData.processedFiles);
                        if (cloudData.isLocked !== undefined) setIsLocked(cloudData.isLocked);
                    }
                    setIsCloudLoaded(true);
                }).catch(err => { console.error("Firestore 讀取失敗:", err); setIsCloudLoaded(true); });
            }, []);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const unsubscribe = docRef.onSnapshot((doc) => { if (doc.exists && doc.data().isLocked !== undefined) setIsLocked(doc.data().isLocked); });
                return () => unsubscribe();
            }, [isCloudLoaded]);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const timer = setTimeout(() => {
                    docRef.set({ employees, attendanceData, processedFiles, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                }, 1500);
                return () => clearTimeout(timer);
            }, [employees, attendanceData, processedFiles, isCloudLoaded]);

            useEffect(() => {
                const d = dayjs(`${payMonth}-01`);
                setBatchStart(d.subtract(1, 'month').date(16).format('YYYY-MM-DD'));
                setBatchEnd(d.date(15).format('YYYY-MM-DD'));
            }, [payMonth]);

            const handleToggleLock = () => {
                if (isLocked) {
                    const pwd = window.prompt("パスワードを入力:");
                    if (pwd === ADMIN_PASSWORD) { docRef.set({ isLocked: false }, { merge: true }); addLog('システムロックを解除しました。', 'success'); }
                    else if (pwd !== null) alert("パスワードが違います");
                } else {
                    if (window.confirm("全員の編集をロックしますか？")) { docRef.set({ isLocked: true }, { merge: true }); addLog('システムをロックしました。', 'info'); }
                }
            };

            const handleInputUpdate = (empId, date, field, val) => {
                setAttendanceData(prev => {
                    const newData = { ...prev };
                    newData[empId] = { ...newData[empId] }; 
                    if (!newData[empId][date]) newData[empId][date] = {};
                    else newData[empId][date] = { ...newData[empId][date] }; 

                    newData[empId][date][field] = val;

                    if (field === 'remark') {
                        const emp = employees.find(e => e.id === empId);
                        if (emp && (emp.type === 'driver' || emp.type === 'part')) {
                            const driveMinsCalc = calculateDriveMinsFromRemark(val);
                            if (driveMinsCalc > 0) {
                                newData[empId][date].driveMins = driveMinsCalc;
                            }
                        }
                    }
                    return newData;
                });
            };

            const handleResetMonthData = () => {
                if(window.confirm(`【警告】${payMonth} のシフト・交通費データを全てリセットしますか？\n(手動入力したデータも消えます)`)) {
                    const payDateObj = dayjs(`${payMonth}-01`);
                    const periodStart = payDateObj.subtract(1, 'month').date(16);
                    const periodEnd = payDateObj.date(15);
                    
                    setAttendanceData(prev => {
                        const newData = { ...prev };
                        Object.keys(newData).forEach(empId => {
                            let curr = periodStart;
                            while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                                const dateStr = curr.format('YYYY/MM/DD');
                                if (newData[empId][dateStr]) {
                                    const { in: timeIn, out: timeOut, in2: timeIn2, out2: timeOut2 } = newData[empId][dateStr];
                                    newData[empId][dateStr] = {};
                                    if (timeIn) newData[empId][dateStr].in = timeIn;
                                    if (timeOut) newData[empId][dateStr].out = timeOut;
                                    if (timeIn2) newData[empId][dateStr].in2 = timeIn2;
                                    if (timeOut2) newData[empId][dateStr].out2 = timeOut2;
                                }
                                curr = curr.add(1, 'day');
                            }
                        });
                        return newData;
                    });
                    setProcessedFiles([]);
                    addLog(`${payMonth} のデータをリセットしました。`, 'success');
                }
            };

            const exportToExcel = async () => {
                try {
                    const wb = new ExcelJS.Workbook();
                    
                    employees.sort((a,b) => a.num - b.num).forEach(emp => {
                        const safeName = `${padNum(emp.num)}_${emp.name}`.replace(/[\\/?*[\]]/g, '').substring(0, 31);
                        const ws = wb.addWorksheet(safeName);
                        
                        const feeHeaderStr = emp.type === 'full' ? '出張費(円)' : '交通費(円)';
                        
                        ws.columns = [
                            { header: '対象月', width: 10 },
                            { header: '社員No', width: 8 },
                            { header: '氏名', width: 25 },
                            { header: '日付', width: 12 },
                            { header: '入室1', width: 8 },
                            { header: '退室1', width: 8 },
                            { header: '入室2', width: 8 },
                            { header: '退室2', width: 8 },
                            { header: '休憩(分)', width: 10 },
                            { header: 'シフト', width: 13 },
                            { header: '勤務時間', width: 18 },
                            { header: '早残業', width: 15 },
                            { header: '後残業', width: 15 },
                            { header: 'IGKA', width: 18 },
                            { header: 'IGKB', width: 18 },
                            { header: '運転', width: 18 },
                            { header: feeHeaderStr, width: 11 },
                            { header: '備考', width: 45 }
                        ];
                        
                        ws.getRow(1).font = { bold: true };
                        ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3F4F6' } };

                        const empData = attendanceData[emp.id] || {};
                        const payDateObj = dayjs(`${payMonth}-01`);
                        const periodStart = payDateObj.subtract(1, 'month').date(16);
                        const periodEnd = payDateObj.date(15);
                        let curr = periodStart;
                        
                        let workDays = 0, earlyTotal = 0, lateTotal = 0, totalTrans = 0;
                        let totalIgkA = 0, totalIgkB = 0, totalDrive = 0, totalWorkMinsGlobal = 0;
                        let leave2H = 0, leave4H = 0, leave6H = 0, leave8H = 0, sick = 0, absent = 0;
                        
                        while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                            const dateStr = curr.format('YYYY/MM/DD');
                            const isH = isHoliday(dateStr);
                            const d = empData[dateStr] || {};
                            const hasData = !!(d.in?.trim() || d.out?.trim() || d.in2?.trim() || d.out2?.trim()); 
                            
                            let shiftStart = d.shiftStart || '';
                            let shiftEnd = d.shiftEnd || '';
                            
                            // ★ 需求2: Excel匯出中，正社員即使有休/欠勤，仍顯示班表
                            if (emp.type === 'full' && !isH && !shiftStart && !shiftEnd) {
                                shiftStart = emp.location === 'rokko' ? '09:30' : '09:15';
                                shiftEnd = emp.location === 'rokko' ? '18:30' : '18:15';
                            }
                            
                            if (hasData || parseFloat(d.igkAHours) > 0 || parseInt(d.driveMins) > 0) {
                                workDays++;
                            }

                            if (d.leaveType === '有休(2時間)') leave2H++;
                            if (d.leaveType === '有休(4時間)') leave4H++;
                            if (d.leaveType === '有休(6時間)') leave6H++;
                            if (d.leaveType === '有休(8時間)') leave8H++;
                            if (d.leaveType && d.leaveType.includes('病欠')) sick++;
                            if (d.leaveType && d.leaveType.includes('欠勤')) absent++;

                            const mins1 = calculateMinutes(d.in, d.out);
                            const mins2 = calculateMinutes(d.in2, d.out2);
                            const inOutMins = mins1 + mins2;

                            const leaveMatch = d.leaveType ? d.leaveType.match(/\((\d)時間\)/) : null;
                            const leaveHrs = leaveMatch ? parseInt(leaveMatch[1]) : 0;
                            
                            let breakMins = hasData ? (emp.type === 'full' ? (leaveHrs >= 4 ? 0 : 60) : (d.break || 0)) : 0;
                            const workMins = Math.max(0, inOutMins - breakMins);
                            const workHours = workMins / 60;
                            totalWorkMinsGlobal += workMins;
                            
                            let early = 0, late = 0;
                            if (emp.type === 'full' && hasData && shiftStart && shiftEnd) {
                                let sStart = dayjs(`2000-01-01 ${shiftStart}`);
                                let sEnd = dayjs(`2000-01-01 ${shiftEnd}`);
                                let aIn = d.in ? dayjs(`2000-01-01 ${d.in}`) : null;
                                let latestOutTime = d.out2 || d.out;
                                let aOut = latestOutTime ? dayjs(`2000-01-01 ${latestOutTime}`) : null;

                                if (sEnd.isBefore(sStart)) sEnd = sEnd.add(1, 'day');
                                if (aIn && aOut && aOut.isBefore(aIn)) aOut = aOut.add(1, 'day');

                                let adjustedSStart = sStart.clone();
                                if (leaveHrs > 0) {
                                    if (leaveHrs === 2) {
                                        adjustedSStart = adjustedSStart.add(2, 'hour');
                                    } else if (leaveHrs >= 4) {
                                        adjustedSStart = adjustedSStart.add(leaveHrs + 1, 'hour');
                                    }
                                }

                                if (aIn) early = Math.max(0, adjustedSStart.diff(aIn, 'minute'));
                                if (aOut) late = Math.max(0, aOut.diff(sEnd, 'minute'));

                                earlyTotal += early;
                                lateTotal += late;
                            }
                            
                            let drive = parseInt(d.driveMins) || 0;
                            let igkA = parseFloat(d.igkAHours) || 0;
                            let igkB = 0;

                            if (emp.type === 'driver') {
                                igkB = Math.max(0, workHours - (drive / 60)); 
                                totalDrive += drive;
                            } else if (emp.type === 'part') {
                                igkB = Math.max(0, workHours - igkA);
                            }
                            totalIgkA += igkA;
                            totalIgkB += igkB;
                            
                            const transFee = parseInt(d.transFee) || 0;
                            totalTrans += transFee;

                            const shiftStr = shiftStart && shiftEnd ? `${shiftStart}-${shiftEnd}` : '';
                            const displayRemark = [d.leaveType, d.remark].filter(Boolean).join(' / ');

                            const row = ws.addRow([
                                payMonth,
                                padNum(emp.num),
                                emp.name,
                                `${dayjs(dateStr).format('MM/DD')}(${['日','月','火','水','木','金','土'][dayjs(dateStr).day()]})`,
                                d.in || '',
                                d.out || '',
                                d.in2 || '',
                                d.out2 || '',
                                breakMins || '',
                                shiftStr,
                                workMins > 0 ? formatVerboseMins(workMins) : '',
                                early > 0 ? formatVerboseMins(early) : '',
                                late > 0 ? formatVerboseMins(late) : '',
                                d.igkAHours ? formatVerboseHours(d.igkAHours) : '',
                                igkB > 0 ? formatVerboseHours(igkB) : '',
                                d.driveMins ? formatVerboseMins(d.driveMins) : '',
                                transFee || '',
                                displayRemark
                            ]);
                            
                            const isLeave = d.leaveType && (d.leaveType.includes('休') || d.leaveType.includes('欠'));
                            
                            if (isLeave) {
                                row.eachCell({ includeEmpty: true }, (cell) => {
                                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFF6FF' } }; 
                                });
                            } else if (isH) {
                                row.eachCell({ includeEmpty: true }, (cell) => {
                                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF2F2' } }; 
                                    cell.font = { color: { argb: 'FFB91C1C' }, bold: true };
                                });
                            } else if (hasData) {
                                row.eachCell({ includeEmpty: true }, (cell) => {
                                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAF5FF' } }; 
                                });
                            }
                            
                            curr = curr.add(1, 'day');
                        }
                        
                        ws.addRow([]);
                        const sumTitleRow = ws.addRow([]);
                        sumTitleRow.getCell(16).value = '【月間集計】';
                        sumTitleRow.getCell(16).font = { bold: true, size: 12 };
                        
                        const addSum = (label, value) => {
                            const r = ws.addRow([]);
                            r.getCell(16).value = label;
                            r.getCell(17).value = value;
                            r.getCell(16).font = { bold: true };
                            r.getCell(16).alignment = { horizontal: 'right' };
                            r.getCell(17).font = { bold: true };
                        };
                        
                        addSum('実出勤日数:', `${workDays} 日`);
                        
                        if (emp.type === 'full') {
                            if (leave8H || leave6H || leave4H || leave2H) {
                                let yqStr = [
                                    leave8H ? `8H×${leave8H}` : '',
                                    leave6H ? `6H×${leave6H}` : '',
                                    leave4H ? `4H×${leave4H}` : '',
                                    leave2H ? `2H×${leave2H}` : ''
                                ].filter(Boolean).join(', ');
                                addSum('有休:', yqStr);
                            }
                            if (sick > 0) addSum('病欠:', `${sick} 日`);
                            if (absent > 0) addSum('欠勤:', `${absent} 日`);

                            addSum('残業合計(早+後):', formatVerboseMins(earlyTotal + lateTotal) || '0分 (0.00H)');
                        }

                        if (emp.type === 'part' || emp.type === 'driver') {
                            const strA = formatVerboseHours(totalIgkA) || '0分 (0.00H)';
                            const strB = formatVerboseHours(totalIgkB) || '0分 (0.00H)';
                            const strTotal = formatVerboseHours(totalIgkA+totalIgkB) || '0分 (0.00H)';
                            addSum('A+B 総労働:', `${strA} + ${strB} = ${strTotal}`);
                        }
                        if (emp.type === 'driver') {
                            addSum('運転実績:', formatVerboseMins(totalDrive) || '0分 (0.00H)');
                        }
                        
                        addSum('実働総時間:', formatVerboseMins(totalWorkMinsGlobal) || '0分 (0.00H)');
                        
                        const feeRow = ws.addRow([]);
                        feeRow.getCell(16).value = emp.type === 'full' ? '出張費合計:' : '交通費合計:';
                        feeRow.getCell(17).value = `${totalTrans.toLocaleString()} 円`;
                        feeRow.getCell(16).font = { bold: true, color: { argb: 'FF92400E' } };
                        feeRow.getCell(16).alignment = { horizontal: 'right' };
                        feeRow.getCell(17).font = { bold: true, color: { argb: 'FF92400E' } };
                        feeRow.getCell(16).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF3C7' } };
                        feeRow.getCell(17).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF3C7' } };
                    });
                    
                    const buffer = await wb.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = `IGK_Attendance_${payMonth}.xlsx`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                    
                    addLog('Excelで出力しました。（集計データと色付き）', 'success');
                } catch (error) {
                    console.error("Excel出力エラー:", error);
                    addLog('Excel出力中にエラーが発生しました。', 'error');
                }
            };

            const handleParseTimecardText = () => {
                if (!timecardText.trim()) return;
                const cleanText = timecardText.replace(/[\u3000\u200B-\u200D\uFEFF]/g, ' '); 
                const lines = cleanText.split('\n').map(l => l.trim()).filter(l => l);
                
                let currentName = null, parsedCount = 0;
                const newData = { ...attendanceData };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (/^\d{8}$/.test(line)) { 
                        if (i + 1 < lines.length) currentName = lines[++i].replace(/\s+/g, ''); 
                    }
                    else if (line === '入室' || line === '退室') {
                        const action = line === '入室' ? 'in' : 'out';
                        if (i + 1 < lines.length) {
                            const timeMatch = lines[i+1].match(/(\d{4}\/\d{1,2}\/\d{1,2})\s+(\d{1,2}:\d{2})/);
                            if (timeMatch && currentName) {
                                const emp = employees.find(e => {
                                    let s = [e.name.replace(/\s+/g, ''), ...(e.aliases || []).map(a => a.replace(/\s+/g, ''))];
                                    return s.some(n => n.includes(currentName) || currentName.includes(n));
                                });
                                if (emp) {
                                    const dateKey = dayjs(timeMatch[1], 'YYYY/M/D').format('YYYY/MM/DD');
                                    if (!newData[emp.id]) newData[emp.id] = {};
                                    if (!newData[emp.id][dateKey]) newData[emp.id][dateKey] = { location: emp.location };
                                    
                                    if (!newData[emp.id][dateKey][action]) {
                                        newData[emp.id][dateKey][action] = timeMatch[2];
                                    } else if (!newData[emp.id][dateKey][action + '2']) {
                                        newData[emp.id][dateKey][action + '2'] = timeMatch[2];
                                    }
                                    parsedCount++;
                                }
                            }
                        }
                    } 
                }

                setAttendanceData(newData);
                addLog(`打刻解析完了: ${parsedCount}件反映 (複数回打刻対応)`, 'success');
                setTimecardText('');
            };

            const processTransportAndDriverData = (grid2D, localEmps, newData, resIdsSet = new Set(), sessionTracker = { trans: new Set(), drive: new Set() }) => {
                let shiftCount = 0, transCount = 0;
                grid2D.forEach((row, rIdx) => {
                    if (rIdx === 0) return; 
                    let dateCell = '', nameCell = '', amountCell = '0';
                    let driveTimeStr = ''; 
                    let startMatch = null, endMatch = null;
                    
                    let r0 = getSafeText(row[0]);
                    if (row.length > 15 && r0.includes('利用料金')) {
                        let resId = getSafeText(row[20]);
                        if (resId) {
                            if (resIdsSet.has(resId)) return; 
                            resIdsSet.add(resId);
                        }
                        dateCell = getSafeText(row[3]); 
                        nameCell = getSafeText(row[7]);
                        startMatch = getSafeText(row[3]).match(/(\d{1,2}:\d{2})/);
                        endMatch = getSafeText(row[4]).match(/(\d{1,2}:\d{2})/);
                        if (startMatch && endMatch) driveTimeStr = `${startMatch[1]}-${endMatch[1]}`;
                    } else if (row.length <= 15 && r0.match(/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/)) {
                        dateCell = r0;
                        nameCell = getSafeText(row[1]);
                        amountCell = getSafeText(row[4]);
                    } else return;
                    
                    if (!dateCell || !nameCell) return;
                    nameCell = nameCell.trim().toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');
                    
                    let dateStr = '';
                    const dMatch = dateCell.match(/(\d{4})[年\/\-](\d{1,2})[月\/\-](\d{1,2})/);
                    if (dMatch) dateStr = dayjs(`${dMatch[1]}/${dMatch[2]}/${dMatch[3]}`).format('YYYY/MM/DD');
                    if (!dateStr) return;

                    const amount = parseInt(amountCell.replace(/,/g, '')) || 0;
                    const driveMinsCalc = (startMatch && endMatch) ? calculateMinutes(startMatch[1], endMatch[1]) : 0;

                    if (amount === 0 && driveMinsCalc === 0) return;

                    const emp = localEmps.find(e => {
                        let s = [e.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''), ...(e.aliases||[]).map(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''))];
                        return s.includes(nameCell) || s.some(n => nameCell.includes(n) && n.length >= 2) || s.some(n => n.includes(nameCell) && nameCell.length >= 2);
                    });

                    if (emp) {
                        if (!newData[emp.id]) newData[emp.id] = {};
                        if (!newData[emp.id][dateStr]) newData[emp.id][dateStr] = { location: emp.location };
                        
                        let sessionKey = `${emp.id}_${dateStr}`; 

                        if (amount > 0) {
                            if (!sessionTracker.trans.has(sessionKey)) {
                                newData[emp.id][dateStr].transFee = 0;
                                sessionTracker.trans.add(sessionKey);
                            }
                            newData[emp.id][dateStr].transFee = (parseInt(newData[emp.id][dateStr].transFee) || 0) + amount;
                            transCount++;
                        }
                        if (driveMinsCalc > 0) {
                            if (!sessionTracker.drive.has(sessionKey)) {
                                newData[emp.id][dateStr].driveMins = 0;
                                sessionTracker.drive.add(sessionKey);
                            }
                            newData[emp.id][dateStr].driveMins = (parseInt(newData[emp.id][dateStr].driveMins) || 0) + driveMinsCalc;
                            if (driveTimeStr) {
                                let existingRemark = newData[emp.id][dateStr].remark || '';
                                if (!existingRemark.includes(driveTimeStr)) {
                                    newData[emp.id][dateStr].remark = existingRemark ? `${existingRemark} / ${driveTimeStr}` : driveTimeStr;
                                }
                            }
                            shiftCount++;
                        }
                    }
                });
                return { newData, shiftCount, transCount, resIdsSet };
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (processedFiles.includes(file.name)) return alert(`エラー: ${file.name} は既に読込済です`); 

                addLog(`[Excel] 解析中: ${file.name}...`);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let globalNewData = JSON.parse(JSON.stringify(attendanceData));
                        let totalShift = 0, totalTrans = 0;
                        
                        let sessionTracker = { trans: new Set(), drive: new Set() };

                        wb.worksheets.forEach(ws => {
                            let grid2D = [];
                            ws.eachRow((row) => {
                                let rowData = [];
                                row.eachCell({ includeEmpty: true }, (cell, colNumber) => rowData[colNumber - 1] = cell.value);
                                grid2D.push(rowData);
                            });
                            const { newData, shiftCount, transCount } = processTransportAndDriverData(grid2D, employees, globalNewData, new Set(), sessionTracker);
                            globalNewData = newData;
                            totalShift += shiftCount;
                            totalTrans += transCount;
                        });

                        if (totalShift > 0 || totalTrans > 0) {
                            setAttendanceData(globalNewData);
                            setProcessedFiles(prev => [...prev, file.name]);
                            addLog(`[Excel] 完了: 運転 ${totalShift}件, 交通費 ${totalTrans}件`, 'success');
                        } else addLog(`[Excel] データなし`, 'info');
                    } catch (err) { addLog(`[Excel] エラー: ${err.message}`, 'error'); }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const [processedResIds, setProcessedResIds] = useState(new Set());
            const handleCsvUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (processedFiles.includes(file.name)) return alert(`エラー: ${file.name} は既に読込済です`);

                addLog(`[CSV] 解析中: ${file.name}...`);
                let encoding = file.name.includes("details") ? "Shift-JIS" : "UTF-8";

                Papa.parse(file, {
                    encoding: encoding,
                    complete: function(results) {
                        try {
                            let globalNewData = JSON.parse(JSON.stringify(attendanceData)); 
                            let sessionTracker = { trans: new Set(), drive: new Set() }; 
                            
                            const { newData, shiftCount, transCount, resIdsSet } = processTransportAndDriverData(results.data, employees, globalNewData, new Set(processedResIds), sessionTracker);
                            
                            if (shiftCount > 0 || transCount > 0) {
                                setAttendanceData(newData);
                                setProcessedResIds(resIdsSet);
                                setProcessedFiles(prev => [...prev, file.name]);
                                addLog(`[CSV] 完了: 運転 ${shiftCount}件, 交通費 ${transCount}件`, 'success');
                            } else addLog(`[CSV] データなし`, 'info');
                        } catch (err) { addLog(`[CSV] エラー: ${err.message}`, 'error'); }
                    }
                });
                e.target.value = null;
            };

            const handleApplyFullTimers = () => {
                if (ftSelected.length === 0) return alert('社員を選択してください');
                if (!batchStart || !batchEnd) return alert('期間を設定してください');
                
                setAttendanceData(prev => {
                    const next = { ...prev };
                    let curr = dayjs(batchStart);
                    const end = dayjs(batchEnd);
                    
                    while(curr.isBefore(end) || curr.isSame(end, 'day')) {
                        const dStr = curr.format('YYYY/MM/DD');
                        
                        if (isHoliday(dStr)) {
                            curr = curr.add(1, 'day');
                            continue;
                        }
                        
                        ftSelected.forEach(empId => {
                            if (!next[empId]) next[empId] = {};
                            if (!next[empId][dStr]) next[empId][dStr] = {};
                            
                            if (ftShiftStart) next[empId][dStr].shiftStart = ftShiftStart;
                            if (ftShiftEnd) next[empId][dStr].shiftEnd = ftShiftEnd;
                            
                            if (ftReason) next[empId][dStr].remark = ftReason;
                        });
                        curr = curr.add(1, 'day');
                    }
                    return next;
                });
                addLog('正社員設定を一括適用しました（休日はスキップしました）。', 'success');
            };

            const handleClearFullTimers = () => {
                if (ftSelected.length === 0) return alert('社員を選択してください');
                if (!batchStart || !batchEnd) return alert('期間を設定してください');
                if (!window.confirm(`選択した社員・期間（${batchStart} 〜 ${batchEnd}）のシフト・備考をクリアしますか？`)) return;

                setAttendanceData(prev => {
                    const next = { ...prev };
                    let curr = dayjs(batchStart);
                    const end = dayjs(batchEnd);
                    
                    while(curr.isBefore(end) || curr.isSame(end, 'day')) {
                        const dStr = curr.format('YYYY/MM/DD');
                        ftSelected.forEach(empId => {
                            if (next[empId] && next[empId][dStr]) {
                                next[empId][dStr].shiftStart = '';
                                next[empId][dStr].shiftEnd = '';
                                next[empId][dStr].remark = '';
                                next[empId][dStr].leaveType = '';
                            }
                        });
                        curr = curr.add(1, 'day');
                    }
                    return next;
                });
                addLog('指定した期間の設定をクリアしました。', 'success');
            };

            const handleStaffDayToggle = (empId, dayIdx) => {
                setStaffDays(prev => {
                    const current = prev[empId] || {};
                    return { ...prev, [empId]: { ...current, [dayIdx]: !current[dayIdx] } };
                });
            };

            const handleApplyStaff = () => {
                if (!batchStart || !batchEnd) return alert('期間を設定してください');
                if (!globalStaffIn && !globalStaffOut && !globalStaffIgka) return alert('入室、退室、またはIGKAを入力してください');
                
                let appliedCount = 0;
                setAttendanceData(prev => {
                    const next = { ...prev };
                    let curr = dayjs(batchStart);
                    const end = dayjs(batchEnd);
                    
                    while(curr.isBefore(end) || curr.isSame(end, 'day')) {
                        const dayOfWeek = curr.day(); 
                        
                        Object.keys(staffDays).forEach(empId => {
                            if (staffDays[empId][dayOfWeek]) {
                                const dStr = curr.format('YYYY/MM/DD');
                                if (!next[empId]) next[empId] = {};
                                if (!next[empId][dStr]) next[empId][dStr] = {};
                                
                                if (globalStaffIn) next[empId][dStr].shiftStart = globalStaffIn;
                                if (globalStaffOut) next[empId][dStr].shiftEnd = globalStaffOut;
                                if (globalStaffIgka) next[empId][dStr].igkAHours = parseFloat(globalStaffIgka);
                                appliedCount++;
                            }
                        });
                        curr = curr.add(1, 'day');
                    }
                    return next;
                });
                
                if (appliedCount > 0) {
                    addLog(`スタッフのシフトを適用しました。(${appliedCount}件)`, 'success');
                } else {
                    addLog(`適用対象がありません。曜日が選択されているか確認してください。`, 'error');
                }
            };

            const handleAddEmployee = () => {
                if(!newEmpNum || !newEmpName) return alert('番号と氏名を入力してください。');
                if(employees.some(e => e.num === parseInt(newEmpNum))) return alert('この番号は既に存在します。');
                const newId = newEmpLoc === 'rokko' ? `r_new_${Date.now()}` : `m_new_${Date.now()}`;
                const newEmp = { num: parseInt(newEmpNum), id: newId, name: newEmpName.trim(), type: newEmpType, location: newEmpLoc, aliases: [newEmpName.trim()] };
                setEmployees(prev => [...prev, newEmp]);
                setNewEmpNum(''); setNewEmpName('');
                addLog(`従業員 ${newEmp.name} を追加しました。`, 'success');
            };

            const handleDeleteEmployee = (id, name) => {
                if(window.confirm(`${name} を削除してもよろしいですか？`)) {
                    setEmployees(prev => prev.filter(e => e.id !== id));
                    addLog(`従業員 ${name} を削除しました。`, 'success');
                }
            };

            const renderSetupScreen = () => (
                <div className={`p-4 w-full max-w-[1600px] mx-auto overflow-hidden ${isLocked ? 'locked-overlay' : ''}`}>
                    <div className="grid grid-cols-1 lg:grid-cols-[250px_1fr] gap-4 items-start min-w-0">
                        {/* 左側：工具區 */}
                        <div className="flex flex-col gap-4 min-w-0">
                            <SettingPanel title="Excel分析">
                                <div className="flex flex-col gap-2">
                                    <label className="border border-dashed border-gray-400 rounded p-4 text-center bg-gray-50 hover:bg-gray-100 cursor-pointer text-xs font-bold text-gray-700 shadow-sm transition">
                                        <i className="fa-solid fa-file-excel mr-2 text-green-600"></i>Excel 交通費
                                        <input type="file" accept=".xlsx" onChange={handleExcelUpload} className="hidden" />
                                    </label>
                                    <label className="border border-dashed border-gray-400 rounded p-4 text-center bg-gray-50 hover:bg-gray-100 cursor-pointer text-xs font-bold text-gray-700 shadow-sm transition">
                                        <i className="fa-solid fa-file-csv mr-2 text-blue-600"></i>CSV 交通費・明細
                                        <input type="file" accept=".csv" onChange={handleCsvUpload} className="hidden" />
                                    </label>
                                </div>
                            </SettingPanel>

                            <SettingPanel title="Wagaco 打刻テキスト貼付">
                                <div className="flex flex-col gap-2">
                                    <textarea 
                                        className="w-full h-24 border border-gray-300 rounded p-2 text-xs font-mono resize-y outline-none focus:border-blue-500 shadow-inner bg-gray-50"
                                        placeholder="打刻履歴を貼付。1日に2回打刻があっても自動判別します。"
                                        value={timecardText}
                                        onChange={(e) => setTimecardText(e.target.value)}
                                    ></textarea>
                                    <button onClick={handleParseTimecardText} className="bg-blue-600 text-white text-xs px-4 py-2 rounded shadow font-bold hover:bg-blue-700 transition">
                                        <i className="fa-solid fa-wand-magic-sparkles mr-1"></i>テキスト解析
                                    </button>
                                </div>
                            </SettingPanel>

                            <SettingPanel title="分析記録">
                                <div className="bg-[#1e1e1e] font-mono text-[10px] p-3 rounded shadow-inner text-gray-300 min-h-[150px] max-h-[300px] overflow-y-auto custom-scrollbar">
                                    {logs.length === 0 ? <span className="text-gray-500">待命中...</span> : 
                                        logs.map((log, i) => (
                                            <div key={i} className={`mb-1.5 ${log.includes('エラー') ? 'text-red-400' : (log.includes('完了') || log.includes('適用') || log.includes('クリア') ? 'text-green-400 font-bold' : '')}`}>{log}</div>
                                        ))
                                    }
                                </div>
                            </SettingPanel>
                        </div>

                        {/* 右側：一括設定區 */}
                        <div className="flex flex-col gap-4 min-w-0">
                            
                            <SettingPanel title={<><i className="fa-solid fa-calendar-days text-blue-600 mr-1"></i> 期間設定・一括適用</>}>
                                <div className="flex flex-col xl:flex-row gap-4 min-w-0">
                                    
                                    {/* 期間設定與正社員設定 */}
                                    <div className="w-full xl:w-[280px] shrink-0 flex flex-col gap-4 min-w-0">
                                        <div className="flex flex-col gap-3 bg-blue-50/50 p-4 rounded-lg border border-blue-100 shadow-sm relative min-w-0">
                                            <div className="font-black text-blue-800 text-sm"><i className="fa-regular fa-clock mr-1"></i> 期間設定</div>
                                            <div className="flex items-center gap-2">
                                                <input type="date" value={batchStart} onChange={e=>setBatchStart(e.target.value)} className="w-full border border-gray-300 rounded px-2 py-1.5 text-[10px] outline-none focus:border-blue-500 font-mono shadow-inner min-w-0" />
                                                <span className="text-gray-500 font-bold">〜</span>
                                                <input type="date" value={batchEnd} onChange={e=>setBatchEnd(e.target.value)} className="w-full border border-gray-300 rounded px-2 py-1.5 text-[10px] outline-none focus:border-blue-500 font-mono shadow-inner min-w-0" />
                                            </div>
                                            <button onClick={() => setShowEmpModal(true)} className="mt-1 bg-gray-700 text-white text-xs font-bold px-4 py-2 rounded shadow hover:bg-gray-800 transition flex items-center justify-center gap-1">
                                                <i className="fa-solid fa-users-gear"></i> 名簿編集
                                            </button>
                                        </div>

                                        <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 shadow-sm flex flex-col min-w-0">
                                            <div className="font-black text-gray-800 text-sm mb-3 border-b-2 border-gray-200 pb-2">正社員 設定</div>
                                            
                                            <div className="flex gap-2 mb-3 min-w-0">
                                                <div className="flex-1 min-w-0">
                                                    <div className="text-[10px] text-blue-600 font-bold mb-2 bg-blue-50 px-1.5 py-1 rounded inline-block">六甲校</div>
                                                    <div className="flex flex-col gap-1.5 min-w-0">
                                                        {employees.filter(e => e.type === 'full' && e.location === 'rokko').map(emp => (
                                                            <label key={emp.id} className="text-[11px] flex items-center gap-1.5 cursor-pointer hover:bg-gray-200 p-1 rounded transition min-w-0">
                                                                <input type="checkbox" className="shrink-0 w-3.5 h-3.5 text-blue-600 rounded focus:ring-blue-500" checked={ftSelected.includes(emp.id)} onChange={(e) => {
                                                                    if (e.target.checked) setFtSelected(prev => [...prev, emp.id]);
                                                                    else setFtSelected(prev => prev.filter(id => id !== emp.id));
                                                                }}/> <span className="font-semibold text-gray-700 truncate">{emp.name}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="flex-1 border-l border-gray-200 pl-2 min-w-0">
                                                    <div className="text-[10px] text-green-600 font-bold mb-2 bg-green-50 px-1.5 py-1 rounded inline-block">名谷校</div>
                                                    <div className="flex flex-col gap-1.5 min-w-0">
                                                        {employees.filter(e => e.type === 'full' && e.location === 'myodani').map(emp => (
                                                            <label key={emp.id} className="text-[11px] flex items-center gap-1.5 cursor-pointer hover:bg-gray-200 p-1 rounded transition min-w-0">
                                                                <input type="checkbox" className="shrink-0 w-3.5 h-3.5 text-blue-600 rounded focus:ring-blue-500" checked={ftSelected.includes(emp.id)} onChange={(e) => {
                                                                    if (e.target.checked) setFtSelected(prev => [...prev, emp.id]);
                                                                    else setFtSelected(prev => prev.filter(id => id !== emp.id));
                                                                }}/> <span className="font-semibold text-gray-700 truncate">{emp.name}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex flex-col gap-2 bg-white p-3 rounded-lg border border-gray-200 shadow-inner min-w-0">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[11px] font-bold text-gray-600 w-8 shrink-0">シフト</span>
                                                    <div className="flex items-center gap-1 flex-1 min-w-0">
                                                        <input type="text" placeholder="09:00" className="w-full min-w-0 text-center border border-gray-300 rounded px-1 py-1.5 text-xs outline-none font-mono" value={ftShiftStart} onChange={e=>setFtShiftStart(e.target.value)} />
                                                        <span className="text-gray-400 shrink-0">-</span>
                                                        <input type="text" placeholder="18:00" className="w-full min-w-0 text-center border border-gray-300 rounded px-1 py-1.5 text-xs outline-none font-mono" value={ftShiftEnd} onChange={e=>setFtShiftEnd(e.target.value)} />
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[11px] font-bold text-gray-600 w-8 shrink-0">原因</span>
                                                    <input type="text" placeholder="夏季特別..." className="flex-1 min-w-0 border border-gray-300 rounded px-2 py-1.5 text-xs outline-none" value={ftReason} onChange={e=>setFtReason(e.target.value)} />
                                                </div>
                                                <div className="flex gap-2 mt-2">
                                                    <button onClick={handleApplyFullTimers} className="flex-1 bg-blue-600 text-white text-[11px] font-bold py-2 rounded-md shadow hover:bg-blue-700 transition">社員へ適用</button>
                                                    <button onClick={handleClearFullTimers} className="bg-red-50 text-red-600 border border-red-200 text-[11px] font-bold px-2 py-2 rounded-md shadow hover:bg-red-100 transition shrink-0" title="選択期間の設定をクリア"><i className="fa-solid fa-eraser"></i> クリア</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* アルバイト/運転手 設定區 */}
                                    <div className="flex-1 min-w-0 bg-white border border-gray-200 rounded-xl shadow-sm flex flex-col">
                                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-gray-50 border-b border-gray-200 p-3 gap-2">
                                            <div className="font-black text-gray-800 text-sm shrink-0">スタッフ (兼職・司機) 設定</div>
                                            <div className="flex flex-wrap items-center gap-1.5 w-full lg:w-auto">
                                                <div className="flex items-center bg-white border border-gray-300 rounded overflow-hidden shadow-inner">
                                                    <span className="bg-gray-100 px-1.5 py-1 text-[10px] font-bold text-gray-600 border-r border-gray-300">入室</span>
                                                    <input type="text" className="w-10 text-center text-xs font-mono outline-none py-1" value={globalStaffIn} onChange={e=>setGlobalStaffIn(e.target.value)} placeholder="10:00" />
                                                </div>
                                                <div className="flex items-center bg-white border border-gray-300 rounded overflow-hidden shadow-inner">
                                                    <span className="bg-gray-100 px-1.5 py-1 text-[10px] font-bold text-gray-600 border-r border-gray-300">退室</span>
                                                    <input type="text" className="w-10 text-center text-xs font-mono outline-none py-1" value={globalStaffOut} onChange={e=>setGlobalStaffOut(e.target.value)} placeholder="18:00" />
                                                </div>
                                                <div className="flex items-center bg-white border border-blue-300 rounded overflow-hidden shadow-inner">
                                                    <span className="bg-blue-50 px-1.5 py-1 text-[10px] font-bold text-blue-800 border-r border-blue-200">IGKA</span>
                                                    <input type="text" className="w-8 text-center text-xs font-mono outline-none py-1 text-blue-700 font-bold" value={globalStaffIgka} onChange={e=>setGlobalStaffIgka(e.target.value)} placeholder="0.5" />
                                                </div>
                                                <button onClick={handleApplyStaff} className="bg-green-600 text-white text-xs font-bold px-3 py-1 rounded shadow hover:bg-green-700 transition flex items-center gap-1 ml-auto lg:ml-1">
                                                    <i className="fa-solid fa-check-double"></i> 適用
                                                </button>
                                            </div>
                                        </div>

                                        <div className="flex flex-col xl:flex-row p-2 gap-2 w-full min-w-0">
                                            {/* 六甲校表格 */}
                                            <div className="flex-1 min-w-0 overflow-x-auto custom-scrollbar border border-gray-200 rounded-lg">
                                                <table className="w-full text-left text-xs border-collapse">
                                                    <thead className="bg-gray-100 shadow-sm">
                                                        <tr>
                                                            <th className="p-1.5 border-b border-gray-200 text-blue-700 font-black pl-2 text-[10px] min-w-[120px]">■ 六甲校</th>
                                                            {['月','火','水','木','金'].map(d=><th key={d} className="p-1 border-b border-gray-200 text-center text-gray-600 font-bold w-6">{d}</th>)}
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {employees.filter(e => e.type !== 'full' && e.location === 'rokko').sort((a,b)=>a.num - b.num).map(emp => {
                                                            const conf = staffDays[emp.id] || {};
                                                            return (
                                                                <tr key={emp.id} className="border-b border-gray-100 hover:bg-blue-50/30 transition">
                                                                    <td className="p-1.5 pl-2 font-bold text-gray-700 truncate">{padNum(emp.num)}. {emp.name}</td>
                                                                    {[1,2,3,4,5].map(d => (
                                                                        <td key={d} className="p-1 text-center">
                                                                            <label className="inline-flex cursor-pointer relative">
                                                                                <input type="checkbox" className="peer sr-only day-checkbox" checked={!!conf[d]} onChange={()=>handleStaffDayToggle(emp.id, d)} />
                                                                                <span className="w-5 h-5 flex items-center justify-center rounded border border-gray-300 text-gray-400 bg-white hover:bg-gray-100 transition shadow-sm font-bold text-[9px]">
                                                                                    {['月','火','水','木','金'][d-1]}
                                                                                </span>
                                                                            </label>
                                                                        </td>
                                                                    ))}
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>

                                            {/* 名谷校表格 */}
                                            <div className="flex-1 min-w-0 overflow-x-auto custom-scrollbar border border-gray-200 rounded-lg">
                                                <table className="w-full text-left text-xs border-collapse">
                                                    <thead className="bg-gray-100 shadow-sm">
                                                        <tr>
                                                            <th className="p-1.5 border-b border-gray-200 text-green-700 font-black pl-2 text-[10px] min-w-[120px]">■ 名谷校</th>
                                                            {['月','火','水','木','金'].map(d=><th key={d} className="p-1 border-b border-gray-200 text-center text-gray-600 font-bold w-6">{d}</th>)}
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {employees.filter(e => e.type !== 'full' && e.location === 'myodani').sort((a,b)=>a.num - b.num).map(emp => {
                                                            const conf = staffDays[emp.id] || {};
                                                            return (
                                                                <tr key={emp.id} className="border-b border-gray-100 hover:bg-green-50/30 transition">
                                                                    <td className="p-1.5 pl-2 font-bold text-gray-700 truncate">{padNum(emp.num)}. {emp.name}</td>
                                                                    {[1,2,3,4,5].map(d => (
                                                                        <td key={d} className="p-1 text-center">
                                                                            <label className="inline-flex cursor-pointer relative">
                                                                                <input type="checkbox" className="peer sr-only day-checkbox" checked={!!conf[d]} onChange={()=>handleStaffDayToggle(emp.id, d)} />
                                                                                <span className="w-5 h-5 flex items-center justify-center rounded border border-gray-300 text-gray-400 bg-white hover:bg-gray-100 transition shadow-sm font-bold text-[9px]">
                                                                                    {['月','火','水','木','金'][d-1]}
                                                                                </span>
                                                                            </label>
                                                                        </td>
                                                                    ))}
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                    
                                </div>
                            </SettingPanel>
                        </div>
                    </div>
                </div>
            );

            const renderReportsScreen = () => (
                <div className="flex flex-col h-full w-full">
                    <div className="flex justify-between items-end mb-2 px-6 mt-4 shrink-0">
                        <div className="flex gap-2">
                            <button onClick={() => setActiveLocation('rokko')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'rokko' ? 'bg-white text-blue-600 border-t-4 border-blue-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)] z-10 relative' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>六甲校 (Rokko)</button>
                            <button onClick={() => setActiveLocation('myodani')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'myodani' ? 'bg-white text-green-600 border-t-4 border-green-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)] z-10 relative' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>名谷校 (Myodani)</button>
                        </div>
                        <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-gray-200 mb-0.5">
                            <span className="text-gray-600 font-bold text-xs"><i className="fa-regular fa-calendar-check text-blue-500 mr-1"></i> 支給月:</span>
                            <input type="month" value={payMonth} onChange={(e) => setPayMonth(e.target.value)} className="border rounded bg-gray-50 px-1 text-xs outline-none font-bold focus:border-blue-400 mr-3" />
                            <button onClick={handleResetMonthData} className="bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 px-3 py-1 rounded text-[10px] font-bold transition shadow-sm">
                                <i className="fa-solid fa-trash-arrow-up mr-1"></i>この月のデータをリセット
                            </button>
                        </div>
                    </div>
                    
                    <div className="flex flex-1 bg-white rounded-lg shadow-sm border border-gray-200 mx-6 mb-6 overflow-hidden min-h-[600px] relative -mt-[1px]">
                        <div className="w-[180px] bg-gray-50 border-r border-gray-200 flex flex-col shrink-0">
                            <div className="flex-1 overflow-y-auto pt-2 gap-1 flex flex-col custom-scrollbar pb-4 shadow-[inset_-2px_0_5px_rgba(0,0,0,0.02)]">
                                {employees.filter(e => e.location === activeLocation).sort((a,b) => a.num - b.num).map(emp => (
                                    <button key={emp.id} onClick={() => setActiveEmployeeId(emp.id)} className={`text-left px-3 py-2 mx-2 rounded-lg text-xs font-bold flex items-center gap-2 truncate transition ${activeEmployeeId === emp.id ? 'bg-white shadow text-blue-600 border border-gray-200' : 'text-gray-500 hover:bg-gray-200 border border-transparent'}`}>
                                        <span className="truncate font-mono">{padNum(emp.num)}.</span>
                                        <span className="truncate">{emp.name}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="flex-1 flex flex-col min-w-0 bg-gray-50/30 p-2 overflow-hidden h-full">
                            {employees.find(e => e.id === activeEmployeeId) ? 
                                <EmployeeReport 
                                    key={activeEmployeeId} 
                                    employee={employees.find(e => e.id === activeEmployeeId)} 
                                    data={attendanceData[activeEmployeeId] || {}} 
                                    payMonth={payMonth} 
                                    isLocked={isLocked}
                                    onInput={handleInputUpdate}
                                /> 
                            : <div className="h-full flex items-center justify-center text-gray-400 font-bold">左側のリストから社員を選択してください。</div>}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen w-full flex flex-col bg-[#eef2f6]">
                    <header className="bg-white shadow-sm border-b px-6 py-2 flex justify-between items-center shrink-0 h-[60px] z-20 sticky top-0">
                        <div className="flex items-center gap-6">
                            <h1 className="text-xl font-black text-gray-800 tracking-tight flex items-center gap-2"><i className="fa-solid fa-file-invoice-dollar text-blue-600"></i> IGK - Shift Parser</h1>
                            <nav className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setCurrentView('setup')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${currentView === 'setup' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}>1. データ取込 (設定)</button>
                                <button onClick={() => setCurrentView('reports')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${currentView === 'reports' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}>2. 個人別明細・交通費</button>
                            </nav>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={exportToExcel} className="bg-green-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-green-700 transition"><i className="fa-solid fa-file-excel mr-1"></i> 出力 (Excel)</button>
                            <button onClick={handleToggleLock} className={`px-4 py-1.5 rounded-lg text-xs font-bold shadow transition ${isLocked ? 'bg-red-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                                <i className={`fa-solid ${isLocked ? 'fa-lock' : 'fa-lock-open'} mr-1`}></i> {isLocked ? 'ロック中 (編集不可)' : '編集可能'}
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col">
                        {currentView === 'setup' && renderSetupScreen()}
                        {currentView === 'reports' && renderReportsScreen()}
                    </main>

                    {showEmpModal && (
                        <div className="fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-[500px] flex flex-col max-h-[85vh] overflow-hidden">
                                <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                    <h2 className="font-black text-gray-800 flex items-center gap-2"><i className="fa-solid fa-users-gear text-blue-600"></i> 社員・スタッフ名簿編集</h2>
                                    <button onClick={() => setShowEmpModal(false)} className="text-gray-400 hover:text-red-500 transition"><i className="fa-solid fa-xmark fa-xl"></i></button>
                                </div>
                                <div className="p-4 border-b border-gray-200 bg-blue-50/30">
                                    <div className="text-xs font-bold text-gray-600 mb-2">新規追加</div>
                                    <div className="flex gap-2 items-center">
                                        <input type="number" value={newEmpNum} onChange={e=>setNewEmpNum(e.target.value)} placeholder="No." className="w-16 border border-gray-300 p-1.5 rounded text-xs outline-none focus:border-blue-400 font-mono" />
                                        <input type="text" value={newEmpName} onChange={e=>setNewEmpName(e.target.value)} placeholder="氏名 (Name)" className="flex-1 border border-gray-300 p-1.5 rounded text-xs outline-none focus:border-blue-400" />
                                        <select value={newEmpType} onChange={e=>setNewEmpType(e.target.value)} className="border border-gray-300 p-1.5 rounded text-xs outline-none focus:border-blue-400">
                                            <option value="part">アルバイト</option>
                                            <option value="full">正社員</option>
                                            <option value="driver">運転手</option>
                                        </select>
                                        <select value={newEmpLoc} onChange={e=>setNewEmpLoc(e.target.value)} className="border border-gray-300 p-1.5 rounded text-xs outline-none focus:border-blue-400">
                                            <option value="rokko">六甲</option>
                                            <option value="myodani">名谷</option>
                                        </select>
                                        <button onClick={handleAddEmployee} className="bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-bold hover:bg-blue-700 transition shadow">追加</button>
                                    </div>
                                </div>
                                <div className="p-2 flex-1 overflow-y-auto custom-scrollbar bg-gray-50">
                                    <ul className="space-y-1">
                                        {employees.sort((a,b)=>a.num - b.num).map(emp => (
                                            <li key={emp.id} className="text-xs p-2.5 bg-white rounded-lg flex justify-between items-center text-gray-700 border border-gray-200 shadow-sm hover:border-blue-300 transition">
                                                <span className="font-semibold"><span className="text-gray-400 w-8 inline-block text-right mr-2 font-mono">{padNum(emp.num)}.</span>{emp.name}</span>
                                                <div className="flex items-center gap-4">
                                                    <span className="text-gray-500 font-bold text-[10px] bg-gray-100 px-2 py-1 rounded">
                                                        {emp.type==='full'?'正社員':emp.type==='driver'?'運転手':'バイト'} / {emp.location==='rokko'?'六甲':'名谷'}
                                                    </span>
                                                    <button onClick={() => handleDeleteEmployee(emp.id, emp.name)} className="text-red-400 hover:text-red-600 transition"><i className="fa-solid fa-trash-can fa-lg"></i></button>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
