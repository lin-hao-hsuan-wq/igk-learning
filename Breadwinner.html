        const JP_HOLIDAYS = [

        const timeToMins = (t) => {
            if (!t || typeof t !== 'string') return 0;
            const [h, m] = t.split(':').map(Number);
            return (h * 60) + (isNaN(m) ? 0 : m);
        };
        const minsToTime = (m) => {
            if (m === null || m === undefined || isNaN(m) || m < 0) return '';
            return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        };
        
        const formatTimeWithDec = (mins) => {
            if (!mins || mins === 0) return '-';
            const hm = minsToTime(mins);
            const dec = (mins / 60).toFixed(2).replace(/\.00$/, '');
            return <>{hm} <span className="text-xs font-bold opacity-60 print:text-[10px]">({dec} H)</span></>;
        };

        const loadSavedState = (key, defaultVal) => {
            try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : defaultVal; }
            catch(e) { return defaultVal; }
        };

        const getSafeText = (cell) => {
            if (!cell || cell.value === null || cell.value === undefined) return '';
            try {
                const v = cell.value;
                if (typeof v === 'string') return v;
                if (typeof v === 'number') return String(v);
                if (v.richText) return v.richText.map(rt => rt.text || '').join('');
                if (v.formula) {
                    if (v.result !== undefined && v.result !== null) {
                        if (v.result.error) return '';
                        if (v.result instanceof Date) return `${v.result.getFullYear()}/${v.result.getMonth() + 1}/${v.result.getDate()}`;
                        return String(v.result);
                    }
                    return '';
                }
                if (v instanceof Date) {
                    return `${v.getFullYear()}/${v.getMonth() + 1}/${v.getDate()}`;
                }
                if (typeof v === 'object') {
                    if (v.text) return String(v.text);
                    return '';
                }
                return String(v);
            } catch (e) {
                return '';
            }
        };

        function App() {
            const [activePage, setActivePage] = useState(() => loadSavedState('igk_pro_activePage_v25', 'import')); 
            const [activeLocation, setActiveLocation] = useState(() => loadSavedState('igk_pro_activeLocation_v25', 'rokko')); 
            const [employees, setEmployees] = useState(() => loadSavedState('igk_pro_employees_v25', INITIAL_EMPLOYEES.map(e => ({...e, isActive: e.isActive !== false}))));
            const [isEmpManagerOpen, setIsEmpManagerOpen] = useState(false);

            const [period, setPeriod] = useState(() => {
                const saved = loadSavedState('igk_pro_period_v25', null);
                if (saved) return saved;
                const today = new Date();
                let initM = today.getDate() >= 16 ? today.getMonth() + 2 : today.getMonth() + 1;
                let initY = today.getFullYear();
                if (initM > 12) { initM -= 12; initY += 1; }
                return `${initY}-${String(initM).padStart(2, '0')}`;
            });
            
            const [settings, setSettings] = useState(() => loadSavedState('igk_pro_settings_v25', { baseStart: '09:30', baseEnd: '18:30', myoStart: '09:15', myoEnd: '18:15', special: [] }));
            const [attendance, setAttendance] = useState(() => loadSavedState('igk_pro_attendance_v25', {})); 
            const [monthlyData, setMonthlyData] = useState(() => loadSavedState('igk_pro_monthlyData_v25', {})); 
            const [activeEmp, setActiveEmp] = useState(() => loadSavedState('igk_pro_activeEmp_v25', employees[0].id)); 

            const [empForm, setEmpForm] = useState({ id: '', name: '', aliases: '', type: 'part', location: 'rokko', isActive: true });

            useEffect(() => localStorage.setItem('igk_pro_activePage_v25', JSON.stringify(activePage)), [activePage]);
            useEffect(() => localStorage.setItem('igk_pro_activeLocation_v25', JSON.stringify(activeLocation)), [activeLocation]);
            useEffect(() => localStorage.setItem('igk_pro_activeEmp_v25', JSON.stringify(activeEmp)), [activeEmp]);
            useEffect(() => localStorage.setItem('igk_pro_period_v25', JSON.stringify(period)), [period]);
            useEffect(() => localStorage.setItem('igk_pro_attendance_v25', JSON.stringify(attendance)), [attendance]);
            useEffect(() => localStorage.setItem('igk_pro_monthlyData_v25', JSON.stringify(monthlyData)), [monthlyData]);
            useEffect(() => localStorage.setItem('igk_pro_settings_v25', JSON.stringify(settings)), [settings]);
            useEffect(() => localStorage.setItem('igk_pro_employees_v25', JSON.stringify(employees)), [employees]);

            const FULL_TIME_EMPS = employees.filter(e => e.type === 'full' && e.isActive);

            const [newSp, setNewSp] = useState({ 
                name: '', start: '', end: '', timeIn: '09:30', timeOut: '18:30',
                targetEmps: FULL_TIME_EMPS.map(e => e.id) 
            });

            const [pastedData, setPastedData] = useState('');

            const dates = useMemo(() => {
                if (!period || !period.includes('-')) return [];
                const [y, m] = period.split('-').map(Number);
                if (isNaN(y) || isNaN(m)) return [];
                const start = new Date(y, m - 2, 16);
                const end = new Date(y, m - 1, 15);
                let arr = [];
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    arr.push(new Date(d));
                }
                return arr;
            }, [period]);

            const dKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            
            const isHoliday = (d) => {
                const day = d.getDay();
                if (day === 0 || day === 6) return true;
                const key = dKey(d);
                return JP_HOLIDAYS.includes(key);
            };

            const formatDisplayDate = (d) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const key = dKey(d);
                const isHol = JP_HOLIDAYS.includes(key);
                let holMarker = isHol && d.getDay() !== 0 && d.getDay() !== 6 ? ' ㊗️' : '';
                return `${d.getMonth() + 1}/${d.getDate()} (${days[d.getDay()]})${holMarker}`;
            };

            const handleSaveEmployee = () => {
                if (!empForm.name.trim()) return alert("名前を入力してください！");
                const aliasArray = empForm.aliases.split(',').map(s => s.trim()).filter(Boolean);
                
                if (empForm.id) {
                    setEmployees(prev => prev.map(e => e.id === empForm.id ? { ...empForm, aliases: aliasArray } : e));
                    alert(`「${empForm.name}」の情報を更新しました。`);
                } else {
                    const newId = 'emp_' + Date.now();
                    setEmployees(prev => [...prev, { ...empForm, id: newId, aliases: aliasArray }]);
                    alert(`新しい従業員「${empForm.name}」を追加しました。`);
                }
                setEmpForm({ id: '', name: '', aliases: '', type: 'part', location: 'rokko', isActive: true });
            };

            const handleEditEmployee = (emp) => {
                setEmpForm({ ...emp, aliases: (emp.aliases || []).join(', ') });
                setIsEmpManagerOpen(true);
            };

            const removeSpecial = (idx) => {
                setSettings(s => ({
                    ...s,
                    special: (s.special || []).filter((_, i) => i !== idx)
                }));
            };

            const handlePaste = () => {
                if (!pastedData.trim()) return alert("打刻データを貼り付けてください。");
                let newData = JSON.parse(JSON.stringify(attendance)); 
                const text = pastedData.toLowerCase();
                const timeRegex = /(?:(?:20)?\d{2}[\/\-年])?[\s\r\n]*(\d{1,2})[\s\r\n]*[\/\-月][\s\r\n]*(\d{1,2})[\s\r\n]*日?[\s\r\n]*(\d{1,2})[\s\r\n]*[:：][\s\r\n]*(\d{2})/g;
                
                const matches = [...text.matchAll(timeRegex)];
                if (matches.length === 0) return alert("一致する名前や時間のフォーマットが見つかりませんでした。");

                let count = 0;
                let autoPeriod = null;
                let lastEmpLoc = null;
                let lastFoundEmpId = null;

                const getClosestDist = (str, char, pivot) => {
                    let left = str.lastIndexOf(char, pivot);
                    let right = str.indexOf(char, pivot);
                    let d1 = left !== -1 ? pivot - left : 9999;
                    let d2 = right !== -1 ? right - pivot : 9999;
                    return Math.min(d1, d2);
                };

                for (let i = 0; i < matches.length; i++) {
                    const match = matches[i];
                    const month = match[1], day = match[2], hr = match[3], min = match[4];
                    const timeStr = `${hr.padStart(2,'0')}:${min.padStart(2,'0')}`;
                    
                    const startIdx = i === 0 ? Math.max(0, match.index - 150) : matches[i-1].index + matches[i-1][0].length;
                    const endIdx = i === matches.length - 1 ? Math.min(text.length, match.index + 150) : matches[i+1].index;
                    const block = text.substring(startIdx, endIdx);
                    
                    let foundEmpId = null;
                    for (let emp of employees) { 
                        const names = [emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/[\s\r\n]+/g,''))];
                        if (names.some(n => block.replace(/[\s\r\n]+/g,'').includes(n))) {
                            foundEmpId = emp.id;
                            lastEmpLoc = emp.location !== 'both' ? emp.location : activeLocation; 
                            break;
                        }
                    }

                    if (foundEmpId) lastFoundEmpId = foundEmpId;
                    else foundEmpId = lastFoundEmpId; 

                    if (foundEmpId) {
                        const y = new Date().getFullYear(); 
                        const dateObj = new Date(y, parseInt(month)-1, parseInt(day));
                        const key = dKey(dateObj);
                        
                        if (!autoPeriod) {
                            let tmpy = dateObj.getFullYear();
                            let tmpm = dateObj.getDate() >= 16 ? dateObj.getMonth() + 2 : dateObj.getMonth() + 1;
                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                        }

                        let timeLocalIdx = match.index - startIdx;
                        let outDist = Math.min(getClosestDist(block, '退', timeLocalIdx), getClosestDist(block, 'out', timeLocalIdx));
                        let inDist = Math.min(getClosestDist(block, '入', timeLocalIdx), getClosestDist(block, 'in', timeLocalIdx));
                        
                        let depDist = Math.min(getClosestDist(block, '乗', timeLocalIdx), getClosestDist(block, '出', timeLocalIdx));
                        let arrDist = Math.min(getClosestDist(block, '降', timeLocalIdx), getClosestDist(block, '下', timeLocalIdx), getClosestDist(block, '到', timeLocalIdx), getClosestDist(block, '返', timeLocalIdx));

                        let type = 'inTime';
                        if (depDist < 8) {
                            type = 'driverDep';
                        } else if (arrDist < 8) {
                            type = 'driverArr';
                        } else if (outDist < inDist) {
                            type = 'outTime';
                        } else if (outDist === 9999 && inDist === 9999) {
                            if (newData[foundEmpId] && newData[foundEmpId][key] && newData[foundEmpId][key].inTime) type = 'outTime';
                        }

                        if (!newData[foundEmpId]) newData[foundEmpId] = {};
                        if (!newData[foundEmpId][key]) newData[foundEmpId][key] = {};
                        newData[foundEmpId][key][type] = timeStr;
                        count++;
                    }
                }
                
                if (count > 0) {
                    setAttendance(newData);
                    setPastedData('');
                    if (autoPeriod) setPeriod(autoPeriod);
                    if (lastEmpLoc) setActiveLocation(lastEmpLoc); 
                    setActivePage('preview');
                    alert(`${count} 件の打刻データを正常に取り込みました！`);
                } else {
                    alert("一致する名前や時間のフォーマットが見つかりませんでした。");
                }
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let newData = JSON.parse(JSON.stringify(attendance));
                        let count = 0;
                        let autoPeriod = null;

                        const extractTime = (cell) => {
                            if (!cell || cell.value === null || cell.value === undefined) return null;
                            let v = cell.value;
                            if (v && v.result !== undefined) v = v.result;

                            if (typeof v === 'number' && v > 0 && v < 1) {
                                let tm = Math.round(v * 24 * 60);
                                return `${String(Math.floor(tm/60)).padStart(2,'0')}:${String(tm%60).padStart(2,'0')}`;
                            }
                            if (v instanceof Date) {
                                return `${String(v.getUTCHours()).padStart(2,'0')}:${String(v.getUTCMinutes()).padStart(2,'0')}`;
                            }
                            
                            let str = getSafeText(cell).trim();
                            const m = str.match(/^(\d{1,2})[:：.](\d{2})(?:[:：.]\d{2})?$/);
                            if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
                            
                            return null;
                        };

                        wb.worksheets.forEach(ws => {
                            let layoutType = 'rokko';
                            let horizontalDates = 0;
                            
                            for (let c = 1; c <= 30; c++) {
                                for (let r = 1; r <= 8; r++) {
                                    let cell = ws.getCell(r, c);
                                    if (cell.isMerged) cell = ws.getCell(cell.master.address);
                                    
                                    let t = getSafeText(cell).replace(/\s+/g, '');
                                    if (t.match(/(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?/)) {
                                        horizontalDates++;
                                        break; 
                                    }
                                }
                            }
                            
                            if (horizontalDates >= 3) {
                                layoutType = 'myodani';
                            }

                            if (layoutType === 'rokko') {
                                let currentDates = {}; 
                                let currentColMap = {};
                                let allExtractedData = {};

                                for (let r = 1; r <= ws.rowCount; r++) {
                                    for (let c = 1; c <= 10; c++) {
                                        let t = getSafeText(ws.getCell(r, c)).replace(/\s+/g, '');
                                        const m = t.match(/(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?/);
                                        if (m) {
                                            let y = new Date().getFullYear();
                                            const yMatch = t.match(/(20\d{2})/); if (yMatch) y = parseInt(yMatch[1]);
                                            let dObj = new Date(y, parseInt(m[1])-1, parseInt(m[2]));
                                            currentDates[r] = { key: dKey(dObj), obj: dObj };
                                            break;
                                        }
                                    }

                                    let matches = 0;
                                    let tempMap = {};
                                    for (let c = 1; c <= 40; c++) {
                                        let v = getSafeText(ws.getCell(r, c)).toLowerCase().replace(/\s+/g, '');
                                        if (v.length >= 1) {
                                            for (const emp of employees) { 
                                                let s = [emp.name.toLowerCase().replace(/\s+/g, ''), ...emp.aliases.map(a => a.toLowerCase().replace(/\s+/g, ''))];
                                                if (s.includes(v) || s.some(name => v.includes(name) && name.length >= 2)) {
                                                    tempMap[c] = emp.id; matches++; break;
                                                }
                                            }
                                        }
                                    }

                                    let activeDateRow = Object.keys(currentDates).reverse().find(dr => r >= parseInt(dr));
                                    
                                    let rowTimeStr = null;
                                    for(let c=1; c<=3; c++) {
                                        rowTimeStr = extractTime(ws.getCell(r, c));
                                        if(rowTimeStr) break;
                                    }

                                    if (!rowTimeStr || matches >= 4) {
                                        if (matches >= 2) currentColMap = tempMap;
                                    }

                                    if (activeDateRow && Object.keys(currentColMap).length > 0 && rowTimeStr) {
                                        let dateInfo = currentDates[activeDateRow];
                                        let rowMins = timeToMins(rowTimeStr);
                                        
                                        if (!autoPeriod) {

                                            let tmpm = dateInfo.obj.getDate() >= 16 ? dateInfo.obj.getMonth() + 2 : dateInfo.obj.getMonth() + 1;

                                        Object.keys(currentColMap).forEach(c => {
                                            const empId = currentColMap[c];
                                            let actCell = ws.getCell(r, parseInt(c));

                                            if (actCell.isMerged) {

                                            let rawText = getSafeText(actCell).trim();
                                            let fill = actCell.fill || {};
                                            let hex = '';
                                            if (fill.type === 'pattern' && fill.pattern !== 'none') {
                                                hex = String(fill.fgColor?.argb || fill.bgColor?.argb || '').toUpperCase();

                                            }
                                            let theme = fill.fgColor?.theme ?? fill.bgColor?.theme ?? -1;

                                            let normalizedText = rawText.replace(/[Ａ-Ｚａ-ｚ０-９：．]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
                                            let hasContent = /[a-zA-Z0-9\u3040-\u30FF\u4E00-\u9FFF\-]/.test(normalizedText); 
                                            
                                            let hasColor = hex || (theme !== -1 && theme !== 1 && theme !== 0) || (indexed !== -1 && indexed !== 64);

                                                    let checkTheme = checkFill.fgColor?.theme ?? checkFill.bgColor?.theme ?? -1;
                                                    let checkIndexed = checkFill.fgColor?.indexed ?? fill.bgColor?.indexed ?? -1;

                                            let ed = allExtractedData[empId][dateInfo.key];

                                            if (normalizedText.includes('欠') || normalizedText.includes('休') || isGrey) {

                                            const exactMatches = [...normalizedText.matchAll(/([0-9]{1,2})[:：.]([0-9]{2})/g)];
                                            
                                            const yellowHexes = ['FFFF00', 'FFC000', 'FFD966', 'FFE699', 'FFF2CC', 'FFEB9C', 'D965', 'FFCC00', 'FFD700'];
                                            const magentaHexes = ['FF00FF', 'FF00CC', 'FF33CC', 'CC00CC', 'FF0099', 'E000E0', 'D500D5', 'FF1493', 'C71585', 'FF69B4'];

                                            const cyanHexes = ['00FFFF', 'CCFFFF', '00B0F0', '99CCFF', '33CCFF', '00CCFF', '66FFFF', '44CCFF', '99FFFF', 'B3D9FF', '00E5FF', '00CED1', '40E0D0', '9CC2E5']; 
                                            const jewelBlueHexes = ['0070C0', '002060', '3366FF', '0000FF', '0054A6', '0033CC', '0066FF', '0055FF', '0000CC', '000099', '0A3FFF']; 
                                            const lightBlueHexes = ['B4C6E7', 'D9E1F2', '8EA9DB', '2F75B5', '9BC2E6', 'DDEBF7', 'BDD7EE', 'CCECFF'];
                                            
                                            let isYellow = (hex && yellowHexes.some(y => hex.includes(y))) || theme === 7 || indexed === 34 || indexed === 51 || indexed === 13;
                                            let isMagenta = hex && magentaHexes.some(m => hex.includes(m));
                                            let isPink = hex && pinkHexes.some(p => hex.includes(p));

                                            let blockType = 'igkB';

                                                        const matchIndex = m.index;

                                                            ed.driverArrTimes.push(tMins);

                                        if (data.leave) newData[empId][dateKey].leave = data.leave;

                                                newData[empId][dateKey].shiftIn = '';
                                                newData[empId][dateKey].shiftOut = '';

                                        } else if (data.exactTimes.length > 0) {
                                            const minExact = Math.min(...data.exactTimes);
                                            const maxExact = Math.max(...data.exactTimes);
                                            if (startMins === 9999 || Math.abs(minExact - startMins) <= 120) startMins = minExact;
                                            if (endMins === -1 || Math.abs(maxExact - endMins) <= 120) endMins = maxExact;

                                        newData[empId][dateKey].igkA = data.igkAMins > 0 ? minsToTime(data.igkAMins) : '';
                                        
                                        let dep = data.driverDepTimes.length > 0 ? Math.min(...data.driverDepTimes) : null;
                                        let arr = data.driverArrTimes.length > 0 ? Math.max(...data.driverArrTimes) : null;

                                        if (data.driverOtherTimes.length > 0) {
                                            let minOther = Math.min(...data.driverOtherTimes);
                                            let maxOther = Math.max(...data.driverOtherTimes);
                                            if (dep === null && arr === null) {
                                                if (data.driverOtherTimes.length === 1) dep = minOther; 
                                                else { dep = minOther; arr = maxOther; }
                                            } else if (dep === null) {
                                                if (minOther < arr) dep = minOther;
                                            } else if (arr === null) {
                                                if (maxOther > dep) arr = maxOther;
                                            }
                                        }

                                        let allDriver = [...data.driverDepTimes, ...data.driverArrTimes, ...data.driverOtherTimes].sort((a,b)=>a-b);

                                            newData[empId][dateKey].driverArr = '';
                                            newData[empId][dateKey].driverMins = minsToTime(totalMins);

                                            let newRm = `🚗${pairStrs.join(', ')}`;
                                            if (!oldRm.includes(newRm)) newData[empId][dateKey].remark = oldRm ? `${oldRm} | ${newRm}` : newRm;
                                        } else {
                                            if (dep !== null || arr !== null) {
                                                newData[empId][dateKey].driverDep = dep !== null ? minsToTime(dep) : '';
                                                newData[empId][dateKey].driverArr = arr !== null ? minsToTime(arr) : '';
                                                newData[empId][dateKey].driverMins = ''; 
                                            } else {
                                                newData[empId][dateKey].driverDep = '';
                                                newData[empId][dateKey].driverArr = '';
                                                newData[empId][dateKey].driverMins = '';

                                        }
                                        count++;
                                    });

                            } else if (layoutType === 'myodani') {

                                        let t = getSafeText(cell).replace(/\s+/g, '');

                                            let y = new Date().getFullYear();

                                            const match = t.match(/(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?/);
                                            lastSeenDate = new Date(y, parseInt(match[1])-1, parseInt(match[2]));

                        if (sp.start && sp.end) {
                            const isTarget = sp.targetEmps ? sp.targetEmps.includes(emp.id) : true;
                            const [sy, sm, sd] = sp.start.split('-').map(Number);
                            const [ey, em, ed] = sp.end.split('-').map(Number);
                            const spStart = new Date(sy, sm - 1, sd, 0, 0, 0);
                            const spEnd = new Date(ey, em - 1, ed, 23, 59, 59);

                            if (isTarget && date >= spStart && date <= spEnd) {
                                defaultIn = sp.timeIn; 
                                defaultOut = sp.timeOut;
                            }
                        }
                    });
                    
                    shiftIn = shiftIn || defaultIn;
                    shiftOut = shiftOut || defaultOut;
                }

                let actualShiftIn = shiftIn;
                if (inTime && shiftIn) {
                    const inM = timeToMins(inTime);
                    const sInM = timeToMins(shiftIn);
                    if (inM > sInM && inM <= sInM + 4) actualShiftIn = minsToTime(sInM + 5);
                    else if (inM > sInM + 4) actualShiftIn = minsToTime(Math.ceil(inM / 5) * 5);
                }

                let earlyOtMins = 0, lateOtMins = 0;
                if (emp.type === 'full' && !leave) {
                    if (inTime && shiftIn) {
                        let diff = timeToMins(shiftIn) - timeToMins(inTime);
                        if (diff > 0) earlyOtMins = diff;
                    }
                    if (outTime && shiftOut) {
                        let diff = timeToMins(outTime) - timeToMins(shiftOut);
                        if (diff > 0) lateOtMins = diff;
                    }
                }

                let totalWorkMins = 0;
                if (inTime && outTime && !leave) {
                    let startMins = timeToMins(actualShiftIn || inTime);
                    let endMins = timeToMins(outTime);
                    totalWorkMins = Math.max(0, endMins - startMins - breakMins);
                } else if (shiftIn && shiftOut && emp.type === 'full' && !leave) {
                    totalWorkMins = Math.max(0, timeToMins(shiftOut) - timeToMins(shiftIn) - breakMins);
                }

                const igkAMins = timeToMins(igkA);
                const igkBMins = Math.max(0, totalWorkMins - igkAMins);
                
                let dDepMins = timeToMins(driverDep);
                let dArrMins = timeToMins(driverArr);
                let dCalcMins = (dArrMins > dDepMins) ? dArrMins - dDepMins : 0;
                
                const driverMins = row.driverMins ? timeToMins(row.driverMins) : dCalcMins;

                return { isWknd, actualShiftIn, shiftOut, earlyOtMins, lateOtMins, totalWorkMins, igkAMins, igkBMins, driverMins, breakTime };
            };

                        sumIgka += calc.igkAMins; sumIgkb += calc.igkBMins;

                        let rowData = [

                            );

                                                    <div className="bg-pink-50 p-3 rounded-xl border border-pink-100 text-center shadow-sm col-span-1 print:border-none print:bg-white">
                                                        <div className="text-[10px] font-bold text-pink-500 mb-1 print:text-[8px]">IGK A 合計</div>
                                                        <div className="text-lg font-black text-pink-600 font-mono print:text-base">{formatTimeWithDec(sumIgka)}</div>
                                                    </div>

                                                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center shadow-sm col-span-1 print:border-none print:bg-white">
                                                        <div className="text-[10px] font-bold text-blue-500 mb-1 print:text-[8px]">IGK B 合計</div>
                                                        <div className="text-lg font-black text-blue-600 font-mono print:text-base">{formatTimeWithDec(sumIgkb)}</div>
                                                    </div>

                                                    <div className={`bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center shadow-sm flex flex-col justify-center print:border-none print:bg-white ${['實熊功光', '上山貴行', '安藤佑也', 'Mikuma', 'Taka', 'Ando'].some(n => currentEmp.name.includes(n) || (currentEmp.aliases || []).includes(n)) ? 'col-span-1' : 'col-span-2'}`}>
                                                        <div className="text-[10px] font-bold text-indigo-600 mb-1 print:text-[8px]">A+B 総労働</div>
                                                        <div className="text-xl font-black text-indigo-700 font-mono print:text-lg">{formatTimeWithDec(sumIgka + sumIgkb)}</div>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
