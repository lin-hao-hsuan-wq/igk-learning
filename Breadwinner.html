    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // Icons
        const Clock = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const Settings = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const Calendar = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;

        const FileText = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
        const Upload = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const Printer = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>;

        const R_EMPLOYEES = [
            { id: 'r0', name: 'Toshi', aliases: ['トシ'], type: 'full', location: 'rokko' },
            { id: 'r1', name: 'Minori', aliases: ['葛野みのり', '葛野 みのり', 'みのり', '葛野', 'Minori'], type: 'full', location: 'rokko' },
            { id: 'r2', name: 'Yassmyn', aliases: ['ヤスミン', 'Ratu Yassmyn Khairussalima', 'Yassmyn Khairussalima', 'Yassmyn'], type: 'full', location: 'rokko' },
            { id: 'r3', name: 'Yoon', aliases: ['ユン', 'Yoon Honey Aung', 'Yoon'], type: 'full', location: 'rokko' },
            { id: 'r4', name: 'Koukei', aliases: ['林昊嬛', '林 昊嬛', '林', 'Koukei'], type: 'full', location: 'rokko' },
            { id: 'r5', name: 'Mikuma', aliases: ['実熊', 'みくま', '實熊功光', '實熊 功光', '実熊功光', 'Mikuma'], type: 'part', location: 'rokko' },
            { id: 'r6', name: 'Taka', aliases: ['上山', 'たか', '上山貴行', '上山 貴行', 'Taka'], type: 'part', location: 'rokko' },
            { id: 'r7', name: 'Fergus', aliases: ['ファーガス', 'Fergus'], type: 'part', location: 'rokko' },
            { id: 'r8', name: 'Sammy', aliases: ['サミー', 'Sammy Abukmeil', 'Sammy'], type: 'part', location: 'rokko' },
            // ★ 新增 Kim Nakyung 別名，確保能被抓到
            { id: 'r9', name: 'Kim', aliases: ['キム', 'Kim', 'Kim Nakyung', 'Nakyung'], type: 'part', location: 'rokko' },
            { id: 'r10', name: 'Nathan', aliases: ['ネイサン', 'Nathan Morrison', 'Nathan'], type: 'part', location: 'rokko' },
            { id: 'r11', name: 'Mariko', aliases: ['マリコ', 'まりこ', '沼田真里子', '沼田 真里子', '沼田', 'Mariko'], type: 'part', location: 'rokko' },
            { id: 'r12', name: 'Ando', aliases: ['安藤', 'あんどう', '安藤佑也', '安藤 佑也', 'Ando'], type: 'part', location: 'rokko' },
            { id: 'r13', name: 'Misato', aliases: ['ミサト', 'みさと', 'Misato'], type: 'part', location: 'rokko' },
            { id: 'r14', name: 'Nao', aliases: ['ナオ', 'なお', 'Nao'], type: 'part', location: 'rokko' },
            { id: 'r15', name: '金栄美', aliases: ['kim eimi', 'eimi', '金'], type: 'part', location: 'rokko' },
            { id: 'r16', name: '角田紀子', aliases: ['角田', 'つのだ'], type: 'part', location: 'rokko' }
        ];

        const M_EMPLOYEES = [
            { id: 'm1', name: '加藤友梨', aliases: ['加藤', 'かとう'], type: 'full', location: 'myodani' },
            { id: 'm2', name: 'Linh', aliases: ['リン'], type: 'full', location: 'myodani' },
            { id: 'm3', name: '大津真里', aliases: ['大津', 'おおつ'], type: 'part', location: 'myodani' },
            { id: 'm4', name: '馬場亜希', aliases: ['馬場', 'ばば'], type: 'part', location: 'myodani' },
            { id: 'm5', name: '篠崎', aliases: ['しのざき'], type: 'part', location: 'myodani' },
            { id: 'm6', name: '吉野', aliases: ['よしの'], type: 'part', location: 'myodani' },
            { id: 'm7', name: '森', aliases: ['もり'], type: 'part', location: 'myodani' },
            { id: 'm8', name: 'Ugiloy', aliases: ['ウギロイ'], type: 'part', location: 'myodani' },
            { id: 'm9', name: 'Hamna', aliases: ['ハムナ'], type: 'part', location: 'myodani' },
            { id: 'm10', name: 'タプリヒン', aliases: [], type: 'part', location: 'myodani' },
            { id: 'm11', name: 'Sadia', aliases: ['サディア'], type: 'part', location: 'myodani' },
            { id: 'm12', name: 'Monika', aliases: ['モニカ'], type: 'part', location: 'myodani' },
            { id: 'm13', name: '中嶋莉真', aliases: ['中嶋', 'なかじま'], type: 'part', location: 'myodani' },
            { id: 'm14', name: '顕谷ユタカ', aliases: ['顕谷', 'あきたに'], type: 'part', location: 'myodani' },
            { id: 'm15', name: 'Mozelle Bargamin', aliases: ['Mozelle', 'モゼル'], type: 'part', location: 'myodani' }
        ];

        const DEFAULT_EMPLOYEES = [...R_EMPLOYEES, ...M_EMPLOYEES];

        function IGKAttendanceSystem() {
            const [employees, setEmployees] = useState(DEFAULT_EMPLOYEES);
            const [selectedEmpId, setSelectedEmpId] = useState(DEFAULT_EMPLOYEES[0].id);
            const [activeTab, setActiveTab] = useState('import');
            
            const currentDate = new Date();
            const currentYear = currentDate.getFullYear();
            let initialMonth = currentDate.getDate() >= 16 ? currentDate.getMonth() + 2 : currentDate.getMonth() + 1;
            let initialYear = currentYear;
            if (initialMonth > 12) {
                initialMonth -= 12;
                initialYear += 1;
            }
            const defaultPeriod = `${initialYear}-${String(initialMonth).padStart(2, '0')}`;
            
            const [selectedPeriod, setSelectedPeriod] = useState(defaultPeriod);
            const [attendanceData, setAttendanceData] = useState({});
            const [pastedText, setPastedText] = useState('');
            const [notification, setNotification] = useState('');
            
            // ★ 新增：預設時薪給老闆娘計算用
            const [hourlyWage, setHourlyWage] = useState(1200);
            
            const [settings, setSettings] = useState(() => {
                const savedSettings = localStorage.getItem('igk_settings_v20');
                const defaultSettings = { baseTime: { start: '09:30', end: '18:30' }, specialPeriods: [] };
                if (savedSettings) {
                    try {
                        const parsed = JSON.parse(savedSettings);
                        return { ...defaultSettings, ...parsed, specialPeriods: parsed.specialPeriods || [] };
                    } catch(e) { return defaultSettings; }
                }
                return defaultSettings;
            });

            const [newSP, setNewSP] = useState({ name: '', startDate: '', endDate: '', start: '08:30', end: '17:30' });

            useEffect(() => {
                localStorage.setItem('igk_settings_v20', JSON.stringify(settings));
            }, [settings]);

            const timeToMinutes = (timeStr) => {
                if (!timeStr) return null;
                const [h, m] = timeStr.split(':').map(Number);
                if (isNaN(h) || isNaN(m)) return null;
                return h * 60 + m;
            };

            const minutesToTime = (mins) => {
                if (mins === null || isNaN(mins) || mins <= 0) return '';
                const h = Math.floor(mins / 60);
                const m = mins % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            };

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 7000);
            };

            const getDatesInPeriod = (periodStr) => {
                if (!periodStr) return [];
                const [year, month] = periodStr.split('-').map(Number);
                const startDate = new Date(year, month - 2, 16);
                const endDate = new Date(year, month - 1, 15);
                const dates = [];
                let curr = new Date(startDate);
                while (curr <= endDate) {
                    dates.push(new Date(curr));
                    curr.setDate(curr.getDate() + 1);
                }
                return dates;
            };

            const dates = useMemo(() => getDatesInPeriod(selectedPeriod), [selectedPeriod]);
            const formatDateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            const formatDisplayDate = (date) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                return `${date.getMonth() + 1}/${date.getDate()} (${days[date.getDay()]})`;
            };
            const isWeekend = (date) => date.getDay() === 0 || date.getDay() === 6;

            const processPastedData = () => {
                if (!pastedText.trim()) {
                    showNotification("テキストが入力されていません。");
                    return;
                }

                setAttendanceData(prevData => {
                    let newData = JSON.parse(JSON.stringify(prevData));
                    let matchedCount = 0;
                    let switchPeriod = null;
                    let switchEmpId = null;
                    
                    const cleanFullText = pastedText.replace(/\s+/g, '').toLowerCase();
                    const datePattern = /(?:(?:20)?\d{2}[\/\-年])?\d{1,2}[\/\-月]\d{1,2}日?(?:[\s\r\n]*\([日月火水木金土]\))?[\s\r\n]*\d{1,2}:\d{2}/g;
                    const matches = [...pastedText.matchAll(datePattern)];

                    if (matches.length === 0) {
                        setTimeout(() => showNotification("日付と時間が見つかりません。"), 0);
                        return prevData;
                    }

                    matches.forEach(match => {
                        const timeStr = match[0];
                        const index = match.index;
                        
                        const nums = timeStr.match(/\d+/g);
                        if (!nums || nums.length < 4) return;

                        let y, m, d, h, min;
                        if (nums.length >= 5) {
                            y = parseInt(nums[0]);
                            if (y < 100) y += 2000;
                            m = parseInt(nums[1]);
                            d = parseInt(nums[2]);
                            h = parseInt(nums[3]);
                            min = parseInt(nums[4]);
                        } else {
                            y = new Date().getFullYear();
                            m = parseInt(nums[0]);
                            d = parseInt(nums[1]);
                            h = parseInt(nums[2]);
                            min = parseInt(nums[3]);
                        }

                        const parsedDate = new Date(y, m - 1, d, h, min);
                        const dateKey = formatDateKey(parsedDate);
                        const timeVal = `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;

                        const targetYear = parsedDate.getFullYear();
                        let targetMonth = parsedDate.getDate() >= 16 ? parsedDate.getMonth() + 2 : parsedDate.getMonth() + 1;
                        let targetPeriodYear = targetYear;
                        if (targetMonth > 12) {
                            targetMonth -= 12;
                            targetPeriodYear += 1;
                        }
                        const autoPeriod = `${targetPeriodYear}-${String(targetMonth).padStart(2, '0')}`;
                        if (!switchPeriod && autoPeriod !== selectedPeriod) {
                            switchPeriod = autoPeriod;
                        }

                        // ★ 修改：為因應多行空白，尋找範圍擴大至 300 字元
                        const contextStart = Math.max(0, index - 300);
                        const contextStr = pastedText.substring(contextStart, index).replace(/\s+/g, '').toLowerCase();
                        
                        let targetEmpId = null;
                        for (const emp of employees) {
                            const searchNames = [emp.name, ...emp.aliases].map(n => n.replace(/\s+/g, '').toLowerCase());
                            if (searchNames.some(name => contextStr.includes(name))) {
                                targetEmpId = emp.id;
                                break;
                            }
                        }
                        if (!targetEmpId) {
                            for (const emp of employees) {
                                const searchNames = [emp.name, ...emp.aliases].map(n => n.replace(/\s+/g, '').toLowerCase());
                                if (searchNames.some(name => cleanFullText.includes(name))) {
                                    targetEmpId = emp.id;
                                    break;
                                }
                            }
                        }

                        if (!targetEmpId) return; 
                        switchEmpId = targetEmpId; 

                        let type = 'inTime';
                        if (contextStr.includes('退室') || contextStr.includes('退勤') || contextStr.includes('out') || contextStr.includes('退')) {
                            type = 'outTime';
                        } else if (newData[targetEmpId] && newData[targetEmpId][dateKey] && newData[targetEmpId][dateKey].inTime) {
                            type = 'outTime';
                        }

                        if (!newData[targetEmpId]) newData[targetEmpId] = {};
                        if (!newData[targetEmpId][dateKey]) newData[targetEmpId][dateKey] = { transportFee: 0 };
                        
                        newData[targetEmpId][dateKey][type] = timeVal;
                        matchedCount++;
                    });

                    if (matchedCount > 0) {
                        setTimeout(() => {
                            setPastedText('');
                            if (switchPeriod) setSelectedPeriod(switchPeriod);
                            if (switchEmpId) setSelectedEmpId(switchEmpId);
                            showNotification(`✅ ${matchedCount}件の打刻データを統合しました！(班表は保持されます)`);
                            setActiveTab('preview');
                        }, 10);
                        return newData; 
                    } else {
                        setTimeout(() => showNotification("⚠️ 日時は見つかりましたが、名前が一致しませんでした。"), 0);
                        return prevData;
                    }
                });
            };

            const handleShiftUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.name.endsWith('.xlsx')) {
                    showNotification("🔍 AI色覚スキャン開始！IGK A / IGK B / 車 を分析中...");
                    
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        const buffer = event.target.result;
                        try {
                            if (!window.ExcelJS) throw new Error("ExcelJS 未載入");
                            
                            const workbook = new ExcelJS.Workbook();
                            await workbook.xlsx.load(buffer);
                            
                            setAttendanceData(prevData => {
                                let newData = JSON.parse(JSON.stringify(prevData));
                                let totalCount = 0;
                                let switchTargetPeriod = null;

                                const getSafeText = (cell) => {
                                    if (!cell) return '';
                                    let v = cell.value;
                                    if (v && v.result !== undefined) v = v.result;
                                    if (v === null || v === undefined) return '';
                                    if (typeof v === 'string') return v.trim();
                                    if (v instanceof Date) return `${v.getFullYear()}/${v.getMonth()+1}/${v.getDate()}`;
                                    if (v.richText) return v.richText.map(rt => rt.text).join('').trim();
                                    return (cell.text || '').toString().trim();
                                };

                                const extractTimeFromCell = (cell) => {
                                    if (!cell) return null;
                                    let val = cell.value;
                                    if (val && val.result !== undefined) val = val.result;
                                    
                                    if (cell.text) {
                                        const match = cell.text.match(/(\d{1,2})[:：](\d{2})/);
                                        if (match) return `${match[1].padStart(2, '0')}:${match[2]}`;
                                    }
                                    if (typeof val === 'number' && val > 0 && val < 1) {
                                        let totalMins = Math.round(val * 24 * 60);
                                        return `${Math.floor(totalMins / 60).toString().padStart(2, '0')}:${String(totalMins % 60).padStart(2, '0')}`;
                                    }
                                    if (typeof val === 'string') {
                                        const match = val.match(/(\d{1,2})[:：](\d{2})/);
                                        if (match) return `${match[1].padStart(2, '0')}:${match[2]}`;
                                    }
                                    return null;
                                };

                                // ★ 判斷顏色是否為非白色系/透明
                                const checkColor = (color) => {
                                    if (!color) return false;
                                    if (color.argb) {
                                        const hex = color.argb.toUpperCase();
                                        return !(hex === 'FFFFFFFF' || hex === '00000000' || hex === 'FF000000' || hex === '00FFFFFF');
                                    }
                                    return color.theme !== 0 && color.theme !== 1;
                                };

                                let allExtractedData = {}; 

                                for (const ws of workbook.worksheets) {
                                    let currentDateKey = null;
                                    let currentColMap = {};
                                    let isReadingTimes = false;

                                    for (let r = 1; r <= ws.rowCount; r++) {
                                        let foundDateInRow = false;
                                        for (let c = 1; c <= 10; c++) {
                                            let cell = ws.getCell(r, c);
                                            let text = getSafeText(cell).replace(/\s+/g, '');
                                            const match = text.match(/(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?/);
                                            if (match) {
                                                let y = new Date().getFullYear();
                                                const yMatch = text.match(/(20\d{2})/);
                                                if (yMatch) y = parseInt(yMatch[1]);
                                                currentDateKey = formatDateKey(new Date(y, parseInt(match[1]) - 1, parseInt(match[2])));
                                                foundDateInRow = true;
                                                isReadingTimes = false; 
                                                break;
                                            }
                                        }

                                        let matches = 0;
                                        let tempMap = {};
                                        for (let c = 1; c <= 40; c++) {
                                            let cell = ws.getCell(r, c);
                                            let val = getSafeText(cell).toLowerCase().replace(/\s+/g, '');
                                            if (val && val.length > 1) {
                                                for (const emp of employees) {
                                                    let searchNames = [emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/\s+/g, ''))];
                                                    if (searchNames.includes(val)) {
                                                        tempMap[c] = emp.id;
                                                        matches++;
                                                        break;
                                                    }
                                                }
                                            }
                                        }
                                        
                                        if (matches >= 2) {
                                            currentColMap = tempMap;
                                            isReadingTimes = true; 
                                            continue; 
                                        }

                                        if (currentDateKey && isReadingTimes && Object.keys(currentColMap).length > 0) {
                                            let rowTimeStr = extractTimeFromCell(ws.getCell(r, 1)) || extractTimeFromCell(ws.getCell(r, 2)) || extractTimeFromCell(ws.getCell(r, 3));
                                            
                                            if (rowTimeStr) {
                                                const rowMins = timeToMinutes(rowTimeStr);

                                                Object.keys(currentColMap).forEach(c => {
                                                    const empId = currentColMap[c];
                                                    let cell = ws.getCell(r, parseInt(c));
                                                    
                                                    let actualCell = cell.isMerged ? ws.getCell(cell.master.address) : cell;
                                                    let cellText = getSafeText(actualCell);
                                                    let hasContent = cellText.trim().length > 0;
                                                    
                                                    // ★ 解析顏色分類
                                                    let actualFill = actualCell.fill || {};
                                                    let hex = (actualFill.fgColor?.argb || '').toUpperCase();
                                                    let isColored = (actualFill.type === 'pattern' && actualFill.pattern !== 'none') && (checkColor(actualFill.fgColor) || checkColor(actualFill.bgColor));
                                                    
                                                    let isYellow = hex === 'FFFFD965';
                                                    let isDefaultBlue = hex === 'FFD9E2F3' || hex === 'FFCFE2F3';
                                                    let blockType = null;
                                                    
                                                    if (isYellow) {
                                                        blockType = 'driver';
                                                    } else if (hasContent) {
                                                        if (isColored && !isDefaultBlue) {
                                                            if (cellText.toLowerCase().includes('private') || cellText.toLowerCase().includes('yoshitake')) {
                                                                blockType = 'yPrivate';
                                                            } else {
                                                                blockType = 'igkA';
                                                            }
                                                        } else if (isDefaultBlue) {
                                                            blockType = 'igkB';
                                                        }
                                                    }

                                                    if (hasContent || isColored) {
                                                        if (!allExtractedData[empId]) allExtractedData[empId] = {};
                                                        if (!allExtractedData[empId][currentDateKey]) {
                                                            allExtractedData[empId][currentDateKey] = { minTime: 9999, maxTime: -1, exactTimes: [], driverMins: 0, igkAMins: 0, igkBMins: 0, yPrivMins: 0 };
                                                        }
                                                        
                                                        let ed = allExtractedData[empId][currentDateKey];
                                                        
                                                        // 紀錄上下班邊界時間
                                                        if (rowMins < ed.minTime) ed.minTime = rowMins;
                                                        if (rowMins > ed.maxTime) ed.maxTime = rowMins;

                                                        // ★ 紀錄課堂/司機的分鐘數 (每格 30分)
                                                        if (blockType === 'driver') ed.driverMins += 30;
                                                        else if (blockType === 'igkA') ed.igkAMins += 30;
                                                        else if (blockType === 'igkB') ed.igkBMins += 30;
                                                        else if (blockType === 'yPrivate') ed.yPrivMins += 30;

                                                        const exactMatches = [...cellText.matchAll(/([0-9]{1,2})[:：]([0-9]{2})/g)];
                                                        exactMatches.forEach(m => {
                                                            ed.exactTimes.push(timeToMinutes(`${m[1].padStart(2, '0')}:${m[2]}`));
                                                        });
                                                    }
                                                });
                                            }
                                        }
                                    }
                                }

                                // 將結算結果疊加回主畫面
                                Object.keys(allExtractedData).forEach(empId => {
                                    Object.keys(allExtractedData[empId]).forEach(dateKey => {
                                        const data = allExtractedData[empId][dateKey];
                                        
                                        let startMins = data.minTime;
                                        let endMins = data.maxTime + 30; 

                                        if (data.exactTimes.length > 0) {
                                            const minExact = Math.min(...data.exactTimes);
                                            const maxExact = Math.max(...data.exactTimes);
                                            if (Math.abs(minExact - startMins) <= 90) startMins = minExact;
                                            if (Math.abs(maxExact - endMins) <= 90) endMins = maxExact;
                                        }

                                        if (startMins < 9999 && endMins > -1) {
                                            if (!newData[empId]) newData[empId] = {};
                                            if (!newData[empId][dateKey]) newData[empId][dateKey] = { transportFee: 0 };
                                            
                                            // 1. 班表總時間
                                            newData[empId][dateKey].plannedIn = minutesToTime(startMins);
                                            newData[empId][dateKey].plannedOut = minutesToTime(endMins);

                                            if (data.yPrivMins > 0) newData[empId][dateKey].yPrivate = minutesToTime(data.yPrivMins);

                                                switchTargetPeriod = `${targetYear}-${String(targetMonth).padStart(2, '0')}`;
                                            }
                                        }

                                                        ) : (
                                                            <>
                                                                <th className="py-2.5 px-3 font-bold text-center w-24 border-l border-slate-700 text-emerald-300 bg-emerald-900/40">班表予定</th>
                                                                
                                                                {['Mikuma', 'Taka', 'Ando'].includes(currentEmp.name) && (
                                                                    <>
                                                                        <th className="py-2.5 px-3 font-bold text-center w-20 border-l border-slate-700 text-yellow-300">D予定</th>
                                                                        <th className="py-2.5 px-3 font-bold text-center w-20 text-yellow-300">D精算</th>
                                                                    </>
                                                                )}
                                                                <th className="py-2.5 px-3 font-bold text-center w-20 border-l border-slate-700 text-pink-300">IGK A</th>
                                                                <th className="py-2.5 px-3 font-bold text-center w-20 text-blue-300">IGK B</th>
                                                                <th className="py-2.5 px-3 font-bold text-center w-20 text-purple-300">Y Private</th>
                                                                <th className="py-2.5 px-3 font-bold text-center w-24 border-l border-slate-700">交通費</th>
                                                                <th className="py-2.5 px-3 font-bold border-l border-slate-700 rounded-tr-lg">備考・特記事項</th>
                                                            </>
                                                        )}
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white">
                                                    {dates.map((date, index) => {
                                                        const dKey = formatDateKey(date);
                                                        const row = attendanceData[currentEmp.id]?.[dKey] || {};
                                                        const isWknd = isWeekend(date);

                                                        return (
                                                            <tr key={dKey} className={`border-b border-gray-200 hover:bg-slate-50 transition-colors ${isWknd ? 'bg-red-50/10' : ''} ${index === dates.length - 1 ? 'border-b-0' : ''}`}>
                                                                <td className={`py-1.5 px-3 text-center border-r border-gray-200 font-bold ${isWknd ? 'text-red-600' : 'text-slate-700'}`}>{formatDisplayDate(date)}</td>
                                                                
                                                                <td className="py-1.5 px-2 text-center bg-blue-50/30">
                                                                    <input type="time" value={row.inTime || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'inTime', e.target.value)} className="w-full bg-transparent border-0 text-center font-bold text-blue-900 focus:ring-2 focus:ring-blue-400 rounded p-0.5 outline-none" />
                                                                </td>
                                                                <td className="py-1.5 px-2 text-center bg-blue-50/30 border-r border-gray-200">
                                                                    <input type="time" value={row.outTime || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'outTime', e.target.value)} className="w-full bg-transparent border-0 text-center font-bold text-blue-900 focus:ring-2 focus:ring-blue-400 rounded p-0.5 outline-none" />
                                                                </td>

                                                                {currentEmp.type === 'full' ? (
                                                                    <>
                                                                        <td className="py-1.5 px-2 text-center bg-gray-50 border-r border-gray-100">
                                                                            <input type="time" value={row.plannedIn || getPlannedTime(date, 'start')} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'plannedIn', e.target.value)} className="w-full bg-transparent border-0 text-center text-xs text-gray-500 font-bold focus:ring-1 focus:ring-gray-300 rounded p-0 outline-none" />
                                                                        </td>
                                                                        <td className="py-1.5 px-2 text-center bg-gray-50 border-r border-gray-200">
                                                                            <input type="time" value={row.plannedOut || getPlannedTime(date, 'end')} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'plannedOut', e.target.value)} className="w-full bg-transparent border-0 text-center text-xs text-gray-500 font-bold focus:ring-1 focus:ring-gray-300 rounded p-0 outline-none" />
                                                                        </td>
                                                                        
                                                                        <td className="py-1.5 px-3 text-center border-r border-gray-200">
                                                                            <div className="flex items-center justify-end">
                                                                                <span className="text-gray-400 mr-1 text-xs font-bold">¥</span>
                                                                                <input type="number" value={row.transportFee === undefined ? 0 : row.transportFee} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'transportFee', e.target.value === '' ? 0 : parseInt(e.target.value))} className="w-16 bg-transparent border-b border-transparent focus:border-emerald-500 focus:ring-0 text-right p-0 font-bold text-emerald-800 outline-none" />
                                                                            </div>
                                                                        </td>
                                                                        
                                                                        <td className="py-1.5 px-2 text-center bg-orange-50/50 border-r border-orange-100 font-bold text-orange-700">
                                                                            {row.earlyMins > 0 ? minutesToTime(row.earlyMins) : '-'}
                                                                        </td>
                                                                        <td className="py-1.5 px-2 text-center bg-orange-50/50 border-r border-gray-200 font-bold text-orange-700">
                                                                            {row.lateMins > 0 ? minutesToTime(row.lateMins) : '-'}
                                                                        </td>
                                                                        
                                                                        <td className="py-1.5 px-2">
                                                                            <input type="text" value={row.remarks || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'remarks', e.target.value)} className="w-full bg-transparent border-0 text-sm font-bold text-gray-700 focus:ring-1 focus:ring-indigo-300 rounded px-2 outline-none" placeholder="備考..." />
                                                                        </td>
                                                                    </>
                                                                ) : (
                                                                    <>
                                                                        <td className="py-1.5 px-2 text-center bg-emerald-50/30 border-r border-emerald-100">
                                                                            <span className="text-xs text-emerald-700 font-black">
                                                                                {row.plannedIn && row.plannedOut ? `${row.plannedIn}-${row.plannedOut}` : '-'}
                                                                            </span>
                                                                        </td>

                                                                        {['Mikuma', 'Taka', 'Ando'].includes(currentEmp.name) && (
                                                                            <>
                                                                                <td className="py-1.5 px-2 text-center bg-yellow-50/50 border-r border-yellow-100">
                                                                                    <input type="text" value={row.driverPlanned || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'driverPlanned', e.target.value)} className="w-12 bg-transparent border-b border-dashed border-gray-400 text-center text-sm font-black text-yellow-900 focus:ring-0 p-0 outline-none" placeholder="-" />
                                                                                </td>
                                                                                <td className="py-1.5 px-2 text-center bg-yellow-50/50 border-r border-gray-200">
                                                                                    <input type="text" value={row.driverActual || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'driverActual', e.target.value)} className="w-12 bg-transparent border-b border-dashed border-gray-400 text-center text-sm font-black text-yellow-900 focus:ring-0 p-0 outline-none" placeholder="-" />
                                                                                </td>
                                                                            </>
                                                                        )}
                                                                        <td className="py-1.5 px-2 text-center bg-pink-50/50 border-r border-pink-100">
                                                                            <input type="text" value={row.igkA || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'igkA', e.target.value)} className="w-12 bg-transparent border-b border-dashed border-gray-400 text-center text-sm font-black text-pink-900 focus:ring-0 p-0 outline-none" placeholder="-" />
                                                                        </td>
                                                                        <td className="py-1.5 px-2 text-center bg-blue-50/50 border-r border-blue-100">
                                                                            <input type="text" value={row.igkB || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'igkB', e.target.value)} className="w-12 bg-transparent border-b border-dashed border-gray-400 text-center text-sm font-black text-blue-900 focus:ring-0 p-0 outline-none" placeholder="-" />
                                                                        </td>
                                                                        <td className="py-1.5 px-2 text-center bg-purple-50/50 border-r border-gray-200">
                                                                            <input type="text" value={row.yPrivate || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'yPrivate', e.target.value)} className="w-12 bg-transparent border-b border-dashed border-gray-400 text-center text-sm font-black text-purple-900 focus:ring-0 p-0 outline-none" placeholder="-" />
                                                                        </td>
                                                                        <td className="py-1.5 px-3 text-center border-r border-gray-200">
                                                                            <div className="flex items-center justify-end">
                                                                                <span className="text-gray-400 mr-1 text-xs font-bold">¥</span>
                                                                                <input type="number" value={row.transportFee === undefined ? 0 : row.transportFee} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'transportFee', e.target.value === '' ? 0 : parseInt(e.target.value))} className="w-16 bg-transparent border-b border-transparent focus:border-emerald-500 focus:ring-0 text-right p-0 font-bold text-emerald-800 outline-none" />
                                                                            </div>
                                                                        </td>
                                                                        <td className="py-1.5 px-2 text-sm">
                                                                            <input type="text" value={row.remarks || ''} onChange={(e) => handleCellChange(currentEmp.id, dKey, 'remarks', e.target.value)} className="w-full bg-transparent border-0 p-0 text-gray-700 font-bold focus:ring-1 focus:ring-indigo-300 rounded px-1 outline-none" placeholder="備考..." />
                                                                        </td>
                                                                    </>
                                                                )}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>

                                        {(() => {
                                            const rows = dates.map(d => attendanceData[currentEmp.id]?.[formatDateKey(d)] || {});
                                            const daysWorked = rows.filter(r => r.inTime || r.outTime).length;
                                            const transportTotal = rows.reduce((sum, r) => sum + (Number(r.transportFee) || 0), 0);
                                            
                                            // ★ 輔助函數：時間帶有小數點 (H)
                                            const formatTimeWithDec = (mins) => {
                                                if (!mins || mins === 0) return '-';
                                                const hm = minutesToTime(mins);
                                                const dec = (mins / 60).toFixed(2).replace(/\.00$/, '');
                                                return <>{hm} <span className="text-sm font-bold opacity-75">({dec} H)</span></>;
                                            };

                                            const totalIgkAMins = rows.reduce((sum, r) => sum + (timeToMinutes(r.igkA) || 0), 0);
                                            const totalIgkBMins = rows.reduce((sum, r) => sum + (timeToMinutes(r.igkB) || 0), 0);
                                            const totalDriverMins = rows.reduce((sum, r) => sum + (timeToMinutes(r.driverActual) || 0), 0);
                                            const totalYPrivMins = rows.reduce((sum, r) => sum + (timeToMinutes(r.yPrivate) || 0), 0);
                                            
                                            const totalPartTimeMins = totalIgkAMins + totalIgkBMins + totalDriverMins + totalYPrivMins;
                                            const totalPartTimeDec = (totalPartTimeMins / 60).toFixed(2);
                                            
                                            const totalOvertimeMins = currentEmp.type === 'full' 
                                                ? rows.reduce((sum, r) => sum + (r.earlyMins || 0) + (r.lateMins || 0), 0)
                                                : 0;

                                            return (
                                                <div className="mt-8 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 border-t-2 border-slate-800 pt-6">
                                                    <div className="bg-slate-100 p-4 rounded-xl border border-slate-200 shadow-sm">
                                                        <div className="text-xs text-slate-600 mb-1 font-bold">出勤日数</div>
                                                        <div className="text-2xl font-black text-slate-800">{daysWorked} <span className="text-sm font-bold text-slate-500">日</span></div>
                                                    </div>
                                    
                                                    {currentEmp.type === 'full' ? (
                                                        <>
                                                            <div className="bg-orange-50 p-4 rounded-xl border border-orange-200 shadow-sm">
                                                                <div className="text-xs text-orange-700 mb-1 font-bold">残業 (早+後) 累計</div>
                                                                <div className="text-2xl font-black text-orange-800">{totalOvertimeMins > 0 ? minutesToTime(totalOvertimeMins) : '00:00'}</div>
                                                            </div>
                                                        </>
                                                    ) : (
                                                        <>
                                                            {['Mikuma', 'Taka', 'Ando'].includes(currentEmp.name) && (
                                                                <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-200 shadow-sm">
                                                                    <div className="text-xs text-yellow-800 mb-1 font-bold">ドライバー 実績</div>
                                                                    <div className="text-2xl font-black text-yellow-900">{formatTimeWithDec(totalDriverMins)}</div>
                                                                </div>
                                                            )}
                                                            <div className="bg-pink-50 p-4 rounded-xl border border-pink-200 shadow-sm">
                                                                <div className="text-xs text-pink-700 mb-1 font-bold">IGK A 総時間</div>
                                                                <div className="text-2xl font-black text-pink-800">{formatTimeWithDec(totalIgkAMins)}</div>
                                                            </div>
                                                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 shadow-sm">
                                                                <div className="text-xs text-blue-700 mb-1 font-bold">IGK B 総時間</div>
                                                                <div className="text-2xl font-black text-blue-800">{formatTimeWithDec(totalIgkBMins)}</div>
                                                            </div>
                                                            <div className="bg-purple-50 p-4 rounded-xl border border-purple-200 shadow-sm">
                                                                <div className="text-xs text-purple-700 mb-1 font-bold">Y Private 総時間</div>
                                                                <div className="text-2xl font-black text-purple-800">{formatTimeWithDec(totalYPrivMins)}</div>
                                                            </div>

                                                            {/* ★ 給与シミュレーション (老闆娘專區) */}
                                                            <div className="bg-white p-4 rounded-xl border-2 border-indigo-200 shadow-sm col-span-2 md:col-span-4 lg:col-span-6 mt-2 print:border-slate-300">
                                                                <h3 className="text-indigo-900 font-black mb-3">💰 給与シミュレーション (老闆娘專用計算區)</h3>
                                                                <div className="flex flex-wrap items-center gap-4 font-bold text-sm text-slate-700">
                                                                    <div className="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border border-slate-200">
                                                                        <label>基本時給(円):</label>
                                                                        <input type="number" value={hourlyWage} onChange={e => setHourlyWage(Number(e.target.value))} className="w-20 px-2 py-1 border border-slate-300 rounded text-right outline-none focus:border-indigo-500 font-black text-indigo-700" />
                                                                    </div>
                                                                    <div className="text-slate-400">×</div>
                                                                    <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                                                                        総労働時間: <span className="text-indigo-700 text-lg">{totalPartTimeDec} H</span>
                                                                    </div>
                                                                    <div className="text-slate-400">＋</div>
                                                                    <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                                                                        交通費合計: <span className="text-emerald-700 text-lg">¥{transportTotal.toLocaleString()}</span>
                                                                    </div>
                                                                    <div className="text-slate-400">＝</div>
                                                                    <div className="bg-indigo-50 p-3 rounded-lg border border-indigo-200">
                                                                        推定給与: <span className="text-2xl font-black text-indigo-700">¥{(Math.floor(totalPartTimeDec * hourlyWage) + transportTotal).toLocaleString()}</span>
                                                                    </div>
                                                                </div>
                                                                <p className="text-xs text-slate-500 mt-2">※ 計算式: (IGKA + IGKB + Driver + Y Privateの合計時間) × 時給 ＋ 交通費</p>
                                                            </div>
                                                        </>
                                                    )}

                                                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 shadow-sm col-span-2 md:col-span-2">
                                                        <div className="text-xs text-emerald-800 mb-1 font-bold">交通費合計</div>
                                                        <div className="text-2xl font-black text-emerald-900 flex items-baseline">
                                                            <span className="text-base mr-1">¥</span>
                                                            {transportTotal.toLocaleString()}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IGKAttendanceSystem />);
    </script>
</body>
</html>
