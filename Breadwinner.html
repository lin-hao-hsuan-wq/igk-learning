            { num: 35, id: 'm9', name: 'Hamna', type: 'part', location: 'myodani', aliases: ['ハムナ'] },
            { num: 36, id: 'm10', name: 'Tafriheen Khanum', type: 'part', location: 'myodani', aliases: ['Nilima', 'ニリマ', 'Tafriheen'] },

            { num: 39, id: 'm13', name: '中嶋莉真', type: 'part', location: 'myodani', aliases: ['中嶋', 'なかじま'] },
            { num: 40, id: 'm14', name: '顕谷ユタカ', type: 'part', location: 'myodani', aliases: ['顕谷', 'あきたに'] },
            { num: 41, id: 'm15', name: 'Mozelle Bargamin', type: 'part', location: 'myodani', aliases: ['Mozelle', 'モゼル'] },
            { num: 43, id: 'm_bjoerg', name: 'Bjoerg Bendix', type: 'part', location: 'myodani', aliases: ['Bjoerg', 'ビョルグ'] },
        ];

        const calculateMinutes = (start, end) => {
            if (!start || !end) return 0;
            let s = dayjs(`2000-01-01 ${start}`);
            let e = dayjs(`2000-01-01 ${end}`);
            if (e.isBefore(s)) e = e.add(1, 'day');
            return e.diff(s, 'minute');
        };

        const formatHM = (mins) => `${Math.floor(mins / 60).toString().padStart(2, '0')}:${(mins % 60).toString().padStart(2, '0')}`;
        const timeToMins = (t) => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return (h * 60) + (isNaN(m) ? 0 : m); };
        const minsToTime = (m) => m > 0 ? `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}` : '';

        const roundTo5Mins = (t) => {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return t;
            const totalMins = h * 60 + m;
            const roundedMins = Math.round(totalMins / 5) * 5;
            return `${Math.floor(roundedMins / 60).toString().padStart(2, '0')}:${(roundedMins % 60).toString().padStart(2, '0')}`;
        };

        const ceilTo30Mins = (t) => {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return t;
            let totalMins = h * 60 + m;
            let rem = totalMins % 30;
            if (rem !== 0) totalMins += (30 - rem);
            return `${Math.floor(totalMins / 60).toString().padStart(2, '0')}:${(totalMins % 60).toString().padStart(2, '0')}`;
        };

        const minus5Mins = (t) => {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return t;
            let totalMins = h * 60 + m - 5;
            if (totalMins < 0) totalMins = 0;
            return `${Math.floor(totalMins / 60).toString().padStart(2, '0')}:${(totalMins % 60).toString().padStart(2, '0')}`;
        };

        const getSafeText = (val) => {
            if (val === null || val === undefined) return '';
            if (typeof val === 'string') return val;
            if (typeof val === 'number') return String(val);
            if (val instanceof Date) return dayjs(val).format('YYYY/MM/DD');
            if (val.richText) return val.richText.map(rt => rt.text).join('');
            if (val.result !== undefined && val.result !== null) {
                if (val.result instanceof Date) return dayjs(val.result).format('YYYY/MM/DD');
                return String(val.result);
            }
            try { return String(val); } catch(e) { return ''; }
        };

        const formatAplusB = (num) => {
            let n = parseFloat(num) || 0;
            let s = n.toFixed(2).replace(/\.?0+$/, '');
            return s === '' ? '0' : s;
        };

        const calculateDriveMinsFromRemark = (remark) => {
            if (!remark) return 0;
            const regex = /(\d{1,2}:\d{2})\s*[-~]\s*(\d{1,2}:\d{2})/g;
            let match;
            let total = 0;
            while ((match = regex.exec(remark)) !== null) {
                total += calculateMinutes(match[1], match[2]);
            }
            return total;
        };

        const SettingPanel = ({ title, children, className = '' }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-200 p-4 setting-panel-wrapper flex flex-col ${className}`}>
                <div className="mb-3 border-b pb-2 shrink-0">
                    <h2 className="text-[15px] font-bold text-gray-800">{title}</h2>
                </div>
                <div className="flex-1 overflow-hidden flex flex-col min-h-0">{children}</div>
            </div>
        );

        const EmployeeReport = ({ employee, data, payMonth, isLocked, onInput }) => {
            const [localEditable, setLocalEditable] = useState(false);
            const payDateObj = dayjs(`${payMonth}-01`);
            
            const periodStart = payDateObj.subtract(1, 'month').date(16);
            const periodEnd = payDateObj.date(15);

            const dates = [];
            let curr = periodStart;
            while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                dates.push(curr.format('YYYY/MM/DD'));
                curr = curr.add(1, 'day');
            }

            const handleInput = (date, field, val) => {
                if (isLocked || !localEditable) return;
                onInput(employee.id, date, field, val);
            };

            let workDays = 0, earlyTotal = 0, lateTotal = 0, totalTrans = 0;
            let totalIgkA = 0, totalIgkB = 0, totalDrive = 0, totalInOutGlobal = 0, totalWorkMinsGlobal = 0;
            let leave1 = 0, leaveHalf = 0, leave2H = 0, absent = 0, sick = 0;

            return (
                <div className="h-full flex flex-col bg-white rounded-lg overflow-hidden border border-gray-200 shadow-sm">
                    <div className="shrink-0 flex justify-between items-end mb-2 border-b border-gray-200 pb-2 px-3 pt-3">
                        <h2 className="text-xl font-bold flex items-center gap-2 text-gray-800">
                            <span className="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow">{employee.num}</span>
                            {employee.name}
                        </h2>
                        <div className="flex items-center gap-2">
                            <div className="text-[11px] font-bold text-gray-600 tracking-wide bg-gray-50 pl-3 pr-1 py-1 rounded shadow-sm flex items-center gap-3 border border-gray-200">
                                <span>対象月: {payMonth.replace('-', '')} | 雇用形態: {employee.type === 'full' ? '正社員' : employee.type === 'driver' ? '司機' : 'アルバイト'}</span>
                                <button 
                                    onClick={() => setLocalEditable(!localEditable)}
                                    disabled={isLocked}
                                    className={`px-3 py-1 rounded border shadow-sm transition-colors font-bold flex items-center gap-1.5 ${
                                        isLocked ? 'opacity-50 cursor-not-allowed bg-gray-200 text-gray-400 border-gray-300' 
                                        : localEditable ? 'bg-white text-blue-700 border-blue-400' 
                                        : 'bg-gray-400 text-white border-gray-500 hover:bg-gray-500'
                                    }`}
                                >
                                    <i className={`fa-solid ${localEditable ? 'fa-pen-to-square' : 'fa-lock'}`}></i>
                                    {localEditable ? '手動入力 ON' : '手動入力 OFF'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto custom-scrollbar mx-2">
                        <table className="w-full text-left border-collapse whitespace-nowrap text-[11px]">
                            <thead className="bg-gray-100 sticky top-0 shadow-sm z-10 text-gray-700">
                                <tr>
                                    <th className="border border-gray-200 p-1 min-w-[70px]">日付</th>
                                    <th className="border border-gray-200 p-1">入室</th>
                                    <th className="border border-gray-200 p-1">退室</th>
                                    <th className="border border-gray-200 p-1 text-blue-800">シフト</th>
                                    <th className="border border-gray-200 p-1">休憩</th>
                                    <th className="border border-gray-200 p-1 bg-green-50">勤務時間</th>
                                    {employee.type === 'full' && <><th className="border border-gray-200 p-1">早残業</th><th className="border border-gray-200 p-1">後残業</th></>}
                                    {employee.type === 'driver' && <><th className="border border-gray-200 p-1">運転時間(分)</th><th className="border border-gray-200 p-1">IGK A(H)</th><th className="border border-gray-200 p-1">IGK B(H)</th></>}
                                    {employee.type === 'part' && <><th className="border border-gray-200 p-1">IGK A(H)</th><th className="border border-gray-200 p-1">IGK B(H)</th></>}
                                    <th className="border border-gray-200 p-1 bg-yellow-50 text-yellow-800">交通費</th>
                                    <th className="border border-gray-200 p-1 min-w-[120px]">備考・出勤狀況</th>
                                </tr>
                            </thead>
                            <tbody>
                                {dates.map((date) => {
                                    const isH = isHoliday(date);
                                    const dayData = data[date] || {};
                                    const hasData = !!(dayData.in || dayData.out);
                                    
                                    let shiftStart = dayData.shiftStart || '';
                                    let shiftEnd = dayData.shiftEnd || '';
                                    if (employee.type === 'full' && !isH && !shiftStart && !shiftEnd && !dayData.leaveType) {
                                        shiftStart = employee.location === 'rokko' ? '09:30' : '09:15';
                                        shiftEnd = employee.location === 'rokko' ? '18:30' : '18:15';
                                    }
                                    
                                    if (hasData || (!isH && employee.type === 'full' && !dayData.leaveType) || shiftStart || dayData.igkAHours || dayData.transFee || dayData.driveMins) workDays++;

                                    if (dayData.leaveType === '有休(1日)') leave1++;
                                    if (dayData.leaveType === '有休(半日)') leaveHalf++;
                                    if (dayData.leaveType === '有休(2時間)') leave2H++;
                                    if (dayData.leaveType === '事欠') absent++;
                                    if (dayData.leaveType === '病欠') sick++;

                                    const inOutMins = calculateMinutes(dayData.in, dayData.out);
                                    totalInOutGlobal += inOutMins;

                                    let breakMins = hasData ? (employee.type === 'full' ? 60 : (dayData.break || 0)) : 0;
                                    const workMins = Math.max(0, inOutMins - breakMins);
                                    const workHours = workMins / 60;
                                    totalWorkMinsGlobal += workMins;
                                    
                                    let early = 0, late = 0;
                                    if (employee.type === 'full' && hasData && shiftStart && shiftEnd) {
                                        let sStart = dayjs(`2000-01-01 ${shiftStart}`);
                                        let sEnd = dayjs(`2000-01-01 ${shiftEnd}`);
                                        let aIn = dayData.in ? dayjs(`2000-01-01 ${dayData.in}`) : null;
                                        let aOut = dayData.out ? dayjs(`2000-01-01 ${dayData.out}`) : null;

                                        if (sEnd.isBefore(sStart)) sEnd = sEnd.add(1, 'day');
                                        if (aIn && aOut && aOut.isBefore(aIn)) aOut = aOut.add(1, 'day');

                                        if (aIn) early = Math.max(0, sStart.diff(aIn, 'minute'));
                                        if (aOut) late = Math.max(0, aOut.diff(sEnd, 'minute'));

                                        earlyTotal += early;
                                        lateTotal += late;
                                    }

                                    let drive = parseInt(dayData.driveMins) || 0;
                                    let igkA = parseFloat(dayData.igkAHours) || 0;
                                    let igkB = 0;

                                    if (employee.type === 'driver') {
                                        igkB = Math.max(0, workHours - igkA); 
                                        totalDrive += drive;
                                    } else if (employee.type === 'part') {
                                        igkB = Math.max(0, workHours - igkA);
                                    }
                                    totalIgkA += igkA;
                                    totalIgkB += igkB;
                                    
                                    const transFee = parseInt(dayData.transFee) || 0;
                                    totalTrans += transFee;

                                    let rowClass = "hover:bg-blue-50/30 border-b transition-colors ";
                                    if (isH) rowClass += "holiday-row holiday-text ";
                                    if (!hasData && !isH && employee.type === 'full') rowClass += "absent-row ";

                                    let displayRemark = [dayData.leaveType, dayData.remark].filter(Boolean).join(' / ');

                                    return (
                                        <tr key={date} className={rowClass}>
                                            <td className="border border-gray-200 p-0.5 text-center">{dayjs(date).format('MM/DD')}({['日','月','火','水','木','金','土'][dayjs(date).day()]})</td>
                                            
                                            <td className="border border-gray-200 p-0.5 text-center">
                                                <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 rounded" value={dayData.in || ''} placeholder="--:--" onChange={e => handleInput(date, 'in', e.target.value)} />
                                            </td>

                                            <td className="border border-gray-200 p-0.5 text-center">
                                                <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 rounded" value={dayData.out || ''} placeholder="--:--" onChange={e => handleInput(date, 'out', e.target.value)} />
                                            </td>
                                            
                                            <td className="border border-gray-200 p-0.5 text-center text-blue-600 font-bold bg-blue-50/20">
                                                <div className="flex justify-center items-center gap-0.5">
                                                    <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftStart} onChange={e=>handleInput(date,'shiftStart',e.target.value)} />
                                                    -
                                                    <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftEnd} onChange={e=>handleInput(date,'shiftEnd',e.target.value)} />
                                                </div>
                                            </td>
                                            
                                            <td className="border border-gray-200 p-0.5 text-center">
                                                <input disabled={isLocked || !localEditable} className="w-8 text-center bg-transparent outline-none" value={dayData.break || (hasData && employee.type==='full' ? '60' : '')} onChange={e=>handleInput(date,'break',e.target.value)} />
                                            </td>

                                            <td className="border border-gray-200 p-0.5 text-center font-bold text-green-700 bg-green-50">{workMins > 0 ? (workMins/60).toFixed(2) : ''}</td>
                                            
                                            {employee.type === 'full' && <>
                                                <td className="border border-gray-200 p-0.5 text-right text-orange-500">{early > 0 ? early : ''}</td>
                                                <td className="border border-gray-200 p-0.5 text-right text-orange-500">{late > 0 ? late : ''}</td>
                                            </>}
                                            {employee.type === 'driver' && <>
                                                <td className="border border-gray-200 p-0.5 text-center"><input disabled={isLocked || !localEditable} className="w-10 text-center border-none outline-none rounded bg-transparent text-purple-700 font-bold" value={dayData.driveMins || ''} onChange={e=>handleInput(date,'driveMins',e.target.value)} /></td>
                                                <td className="border border-gray-200 p-0.5 text-center"><input disabled={isLocked || !localEditable} className="w-10 text-center border-none outline-none rounded bg-transparent" value={dayData.igkAHours || ''} onChange={e=>handleInput(date,'igkAHours',e.target.value)} /></td>
                                                <td className="border border-gray-200 p-0.5 text-center font-bold text-blue-600">{igkB > 0 ? formatAplusB(igkB) : ''}</td>
                                            </>}
                                            {employee.type === 'part' && <>
                                                <td className="border border-gray-200 p-0.5 text-center"><input disabled={isLocked || !localEditable} className="w-10 text-center border-none outline-none rounded bg-transparent" value={dayData.igkAHours || ''} onChange={e=>handleInput(date,'igkAHours',e.target.value)} /></td>
                                                <td className="border border-gray-200 p-0.5 text-center font-bold text-blue-600">{igkB > 0 ? formatAplusB(igkB) : ''}</td>
                                            </>}
                                            <td className="border border-gray-200 p-0 bg-yellow-50"><input disabled={isLocked || !localEditable} className="w-full text-right border-none outline-none px-2 py-1 bg-transparent font-bold text-yellow-800" value={dayData.transFee || ''} onChange={e=>handleInput(date,'transFee',e.target.value)} /></td>
                                            <td className="border border-gray-200 p-0.5">
                                                <div className="flex gap-1 items-center px-1">
                                                    <input disabled={isLocked || !localEditable} type="text" className="border-none bg-transparent w-full focus:ring-0 outline-none" placeholder="備註..." value={displayRemark} onChange={e => handleInput(date, 'remark', e.target.value)} />
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    <div className="shrink-0 px-3 pb-3">
                        <div className="flex gap-2 flex-wrap items-stretch border-t border-gray-200 pt-2 mt-1">
                            <div className="bg-white rounded-lg p-2 flex gap-3 shadow-sm border border-gray-200 min-w-[120px] justify-center items-center">
                                <div className="text-center">
                                    <div className="text-[10px] text-gray-500 font-bold mb-1">出勤日数</div>
                                    <div className="text-xl font-black text-gray-800">{workDays} <span className="text-[10px] font-normal text-gray-500">日</span></div>
                                </div>
                            </div>

                            {employee.type === 'full' && (
                                <>
                                    <div className="bg-red-50 rounded-lg p-2 text-center shadow-sm border border-red-100 flex-[1] min-w-[110px]">
                                        <div className="text-[10px] text-red-700 font-bold mb-1">残業合計 (早+後)</div>
                                        <div className="text-lg font-black text-red-600">
                                            {earlyTotal+lateTotal} <span className="text-[9px] font-normal text-red-400 mr-1">分</span> 
                                        </div>
                                    </div>
                                </>
                            )}
                            
                            {employee.type === 'part' && (
                                <>
                                    <div className="bg-indigo-50 rounded-lg p-2 text-center shadow-sm border border-indigo-100 flex-[1.5] min-w-[160px]">
                                        <div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div>
                                        <div className="text-lg font-black text-indigo-700 whitespace-nowrap">
                                            {formatAplusB(totalIgkA)} + {formatAplusB(totalIgkB)} = {formatAplusB(totalIgkA+totalIgkB)} <span className="text-[9px] font-normal ml-1 text-indigo-400">時間</span>
                                        </div>
                                    </div>
                                </>
                            )}

                            {employee.type === 'driver' && (
                                <>
                                    <div className="bg-purple-50 rounded-lg p-2 text-center shadow-sm border border-purple-200 flex-[1] min-w-[110px]">
                                        <div className="text-[10px] text-purple-700 font-bold mb-1">運転実績</div>
                                        <div className="text-lg font-black text-purple-700">{formatHM(totalDrive)} <span className="text-[9px] font-normal ml-1 text-purple-500">({(totalDrive/60).toFixed(2)}H)</span></div>
                                    </div>
                                    <div className="bg-indigo-50 rounded-lg p-2 text-center shadow-sm border border-indigo-100 flex-[1.5] min-w-[160px]">
                                        <div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div>
                                        <div className="text-lg font-black text-indigo-700 whitespace-nowrap">
                                            {formatAplusB(totalIgkA)} + {formatAplusB(totalIgkB)} = {formatAplusB(totalIgkA+totalIgkB)} <span className="text-[9px] font-normal ml-1 text-indigo-400">時間</span>
                                        </div>
                                    </div>
                                </>
                            )}
                            
                            <div className="bg-green-100 rounded-lg p-2 text-center shadow-sm border border-green-200 flex-[1] min-w-[110px]">
                                <div className="text-[10px] text-green-700 font-bold mb-1">実働総時間 (休憩引)</div>
                                <div className="text-lg font-black text-green-800">{formatHM(totalWorkMinsGlobal)} <span className="text-[9px] font-normal ml-1 text-green-600">({(totalWorkMinsGlobal/60).toFixed(2)}H)</span></div>
                            </div>

                            <div className="bg-yellow-100/80 rounded-lg p-2 flex flex-col justify-center items-center shadow-sm border border-yellow-400 min-w-[140px] flex-[1]">
                                <div className="text-[11px] text-yellow-900 font-bold mb-1"><i className="fa-solid fa-coins mr-1"></i>交通費合計</div>
                                <div className="font-black text-xl text-gray-900">{totalTrans.toLocaleString()} <span className="text-[11px] font-bold text-gray-600">円</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const App = () => {
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const [isLocked, setIsLocked] = useState(false);
            const ADMIN_PASSWORD = "8888";

            const [currentView, setCurrentView] = useState('setup');
            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [logs, setLogs] = useState([]);
            const [attendanceData, setAttendanceData] = useState({});
            const [timecardText, setTimecardText] = useState('');
            const [payMonth, setPayMonth] = useState('2026-09');
            const [activeLocation, setActiveLocation] = useState('rokko');
            const [activeEmployeeId, setActiveEmployeeId] = useState('r1');
            const [processedFiles, setProcessedFiles] = useState([]);

            const [batchStart, setBatchStart] = useState('');
            const [batchEnd, setBatchEnd] = useState('');
            
            const [ftSelected, setFtSelected] = useState([]);
            const [ftShiftStart, setFtShiftStart] = useState('');
            const [ftShiftEnd, setFtShiftEnd] = useState('');
            const [ftReason, setFtReason] = useState('');

            const [globalStaffIn, setGlobalStaffIn] = useState('');
            const [globalStaffOut, setGlobalStaffOut] = useState('');
            const [globalStaffIgka, setGlobalStaffIgka] = useState('');
            const [staffDays, setStaffDays] = useState({});

            const [showEmpModal, setShowEmpModal] = useState(false);
            const [newEmpNum, setNewEmpNum] = useState('');
            const [newEmpName, setNewEmpName] = useState('');
            const [newEmpType, setNewEmpType] = useState('part');
            const [newEmpLoc, setNewEmpLoc] = useState('rokko');

            const addLog = (msg, type = 'info') => setLogs(prev => [`[${dayjs().format('HH:mm:ss')}] ${msg}`, ...prev]);

            useEffect(() => {
                docRef.get().then((doc) => {
                    if (doc.exists) {
                        const cloudData = doc.data();
                        if (cloudData.employees && cloudData.employees.length >= INITIAL_EMPLOYEES.length) {
                            setEmployees(cloudData.employees);
                        } else {
                            setEmployees(INITIAL_EMPLOYEES);
                        }
                        if (cloudData.attendanceData) setAttendanceData(cloudData.attendanceData);
                        if (cloudData.processedFiles) setProcessedFiles(cloudData.processedFiles);
                        if (cloudData.isLocked !== undefined) setIsLocked(cloudData.isLocked);
                    }
                    setIsCloudLoaded(true);
                }).catch(err => { console.error("Firestore 讀取失敗:", err); setIsCloudLoaded(true); });
            }, []);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const unsubscribe = docRef.onSnapshot((doc) => { if (doc.exists && doc.data().isLocked !== undefined) setIsLocked(doc.data().isLocked); });
                return () => unsubscribe();
            }, [isCloudLoaded]);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const timer = setTimeout(() => {
                    docRef.set({ employees, attendanceData, processedFiles, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                }, 1500);
                return () => clearTimeout(timer);
            }, [employees, attendanceData, processedFiles, isCloudLoaded]);

            useEffect(() => {
                const d = dayjs(`${payMonth}-01`);
                setBatchStart(d.subtract(1, 'month').date(16).format('YYYY-MM-DD'));
                setBatchEnd(d.date(15).format('YYYY-MM-DD'));
            }, [payMonth]);

            const handleToggleLock = () => {
                if (isLocked) {
                    const pwd = window.prompt("パスワードを入力:");
                    if (pwd === ADMIN_PASSWORD) { docRef.set({ isLocked: false }, { merge: true }); addLog('システムロックを解除しました。', 'success'); }
                    else if (pwd !== null) alert("パスワードが違います");
                } else {
                    if (window.confirm("全員の編集をロックしますか？")) { docRef.set({ isLocked: true }, { merge: true }); addLog('システムをロックしました。', 'info'); }
                }
            };

            const handleInputUpdate = (empId, date, field, val) => {
                setAttendanceData(prev => {
                    const newData = { ...prev };
                    if (!newData[empId]) newData[empId] = {};
                    if (!newData[empId][date]) newData[empId][date] = {};
                    newData[empId][date][field] = val;

                    if (field === 'remark') {
                        const emp = employees.find(e => e.id === empId);
                        if (emp && (emp.type === 'driver' || emp.type === 'part')) {
                            const driveMinsCalc = calculateDriveMinsFromRemark(val);
                            if (driveMinsCalc > 0) {
                                newData[empId][date].driveMins = driveMinsCalc;
                            }
                        }
                    }
                    return newData;
                });
            };

            const handleResetMonthData = () => {
                if(window.confirm(`【警告】${payMonth} のシフト・交通費データを全てリセットしますか？\n(手動入力したデータも消えます)`)) {
                    const payDateObj = dayjs(`${payMonth}-01`);
                    const periodStart = payDateObj.subtract(1, 'month').date(16);
                    const periodEnd = payDateObj.date(15);
                    
                    setAttendanceData(prev => {
                        const newData = { ...prev };
                        Object.keys(newData).forEach(empId => {
                            let curr = periodStart;
                            while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                                const dateStr = curr.format('YYYY/MM/DD');
                                if (newData[empId][dateStr]) {
                                    const { in: timeIn, out: timeOut } = newData[empId][dateStr];
                                    newData[empId][dateStr] = {};
                                    if (timeIn) newData[empId][dateStr].in = timeIn;
                                    if (timeOut) newData[empId][dateStr].out = timeOut;
                                }
                                curr = curr.add(1, 'day');
                            }
                        });
                        return newData;
                    });
                    setProcessedFiles([]);
                    addLog(`${payMonth} のデータをリセットしました。`, 'success');
                }
            };

            const exportToCSV = () => {
                let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
                csvContent += "対象月,社員No,氏名,日付,入室,退室,休憩(分),シフト,勤務時間(分),IGKA(H),運転時間(分),交通費,備考\n";
                
                employees.sort((a,b)=>a.num - b.num).forEach(emp => {
                    const empData = attendanceData[emp.id] || {};
                    const payDateObj = dayjs(`${payMonth}-01`);
                    const periodStart = payDateObj.subtract(1, 'month').date(16);
                    const periodEnd = payDateObj.date(15);
                    let curr = periodStart;
                    while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                        const dateStr = curr.format('YYYY/MM/DD');
                        const d = empData[dateStr] || {};
                        const shiftStr = d.shiftStart && d.shiftEnd ? `${d.shiftStart}-${d.shiftEnd}` : '';
                        const hasData = !!(d.in || d.out);
                        const inOutMins = calculateMinutes(d.in, d.out);
                        let breakMins = hasData ? (emp.type === 'full' ? 60 : (d.break || 0)) : 0;
                        const workMins = Math.max(0, inOutMins - breakMins);
                        
                        csvContent += `"${payMonth}","${emp.num}","${emp.name}","${dateStr}","${d.in||''}","${d.out||''}","${breakMins||''}","${shiftStr}","${workMins>0?workMins:''}","${d.igkAHours||''}","${d.driveMins||''}","${d.transFee||''}","${d.remark||d.leaveType||''}"\n`;
                        curr = curr.add(1, 'day');
                    }
                });
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `IGK_Attendance_${payMonth}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                addLog('CSVで出力しました。', 'success');
            };

            const handleParseTimecardText = () => {
                if (!timecardText.trim()) return;
                const cleanText = timecardText.replace(/[\u3000\u200B-\u200D\uFEFF]/g, ' '); 
                const lines = cleanText.split('\n').map(l => l.trim()).filter(l => l);
                
                let currentName = null, parsedCount = 0;
                const newData = { ...attendanceData };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (/^\d{8}$/.test(line)) { 
                        if (i + 1 < lines.length) currentName = lines[++i].replace(/\s+/g, ''); 
                    }
                    else if (line === '入室' || line === '退室') {
                        const action = line === '入室' ? 'in' : 'out';
                        if (i + 1 < lines.length) {
                            const timeMatch = lines[i+1].match(/(\d{4}\/\d{1,2}\/\d{1,2})\s+(\d{1,2}:\d{2})/);
                            if (timeMatch && currentName) {
                                const emp = employees.find(e => {
                                    let s = [e.name.replace(/\s+/g, ''), ...(e.aliases || []).map(a => a.replace(/\s+/g, ''))];
                                    return s.some(n => n.includes(currentName) || currentName.includes(n));
                                });
                                if (emp) {
                                    const dateKey = dayjs(timeMatch[1], 'YYYY/M/D').format('YYYY/MM/DD');
                                    if (!newData[emp.id]) newData[emp.id] = {};
                                    if (!newData[emp.id][dateKey]) newData[emp.id][dateKey] = { location: emp.location };
                                    newData[emp.id][dateKey][action] = timeMatch[2];
                                    parsedCount++;
                                }
                            }
                        }
                    } 
                }

                Object.keys(newData).forEach(empId => {
                    const emp = employees.find(e => e.id === empId);
                    if (emp && emp.type === 'part') {
                        Object.keys(newData[empId]).forEach(dateKey => {
                            const d = newData[empId][dateKey];
                            if (d.in) d.shiftStart = roundTo5Mins(d.in);
                            if (d.out) d.shiftEnd = roundTo5Mins(d.out);
                        });
                    } else if (emp && emp.type === 'driver') {
                        Object.keys(newData[empId]).forEach(dateKey => {
                            const d = newData[empId][dateKey];
                            if (d.in) d.shiftStart = ceilTo30Mins(d.in);
                            if (d.out) d.shiftEnd = minus5Mins(d.out);
                        });
                    }
                });

                setAttendanceData(newData);
                addLog(`打刻解析完了: ${parsedCount}件反映・シフト自動生成`, 'success');
                setTimecardText('');
            };

            const processTransportAndDriverData = (grid2D, localEmps, newData, resIdsSet = new Set()) => {
                let shiftCount = 0, transCount = 0;
                grid2D.forEach((row, rIdx) => {
                    if (rIdx === 0) return; 
                    let dateCell = '', nameCell = '', amountCell = '0';
                    let driveTimeStr = ''; 
                    let startMatch = null, endMatch = null;
                    
                    let r0 = getSafeText(row[0]);
                    if (row.length > 15 && r0.includes('利用料金')) {
                        let resId = getSafeText(row[20]);
                        if (resId) {
                            if (resIdsSet.has(resId)) return; 
                            resIdsSet.add(resId);
                        }
                        dateCell = getSafeText(row[3]); 
                        nameCell = getSafeText(row[7]);
                        startMatch = getSafeText(row[3]).match(/(\d{1,2}:\d{2})/);
                        endMatch = getSafeText(row[4]).match(/(\d{1,2}:\d{2})/);
                        if (startMatch && endMatch) driveTimeStr = `${startMatch[1]}-${endMatch[1]}`;
                    } else if (row.length <= 15 && r0.match(/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/)) {
                        dateCell = r0;
                        nameCell = getSafeText(row[1]);
                        amountCell = getSafeText(row[4]);
                    } else return;
                    
                    if (!dateCell || !nameCell) return;
                    nameCell = nameCell.trim().toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');
                    
                    let dateStr = '';
                    const dMatch = dateCell.match(/(\d{4})[年\/\-](\d{1,2})[月\/\-](\d{1,2})/);
                    if (dMatch) dateStr = dayjs(`${dMatch[1]}/${dMatch[2]}/${dMatch[3]}`).format('YYYY/MM/DD');
                    if (!dateStr) return;

                    const amount = parseInt(amountCell.replace(/,/g, '')) || 0;
                    const driveMinsCalc = (startMatch && endMatch) ? calculateMinutes(startMatch[1], endMatch[1]) : 0;

                    if (amount === 0 && driveMinsCalc === 0) return;

                    const emp = localEmps.find(e => {
                        let s = [e.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''), ...(e.aliases||[]).map(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''))];
                        return s.includes(nameCell) || s.some(n => nameCell.includes(n) && n.length >= 2) || s.some(n => n.includes(nameCell) && nameCell.length >= 2);
                    });

                    if (emp) {
                        if (!newData[emp.id]) newData[emp.id] = {};
                        if (!newData[emp.id][dateStr]) newData[emp.id][dateStr] = { location: emp.location };
                        
                        if (amount > 0) {
                            newData[emp.id][dateStr].transFee = (parseInt(newData[emp.id][dateStr].transFee) || 0) + amount;
                            transCount++;
                        }
                        if (driveMinsCalc > 0) {
                            newData[emp.id][dateStr].driveMins = (parseInt(newData[emp.id][dateStr].driveMins) || 0) + driveMinsCalc;
                            if (driveTimeStr) {
                                let existingRemark = newData[emp.id][dateStr].remark || '';
                                if (!existingRemark.includes(driveTimeStr)) {
                                    newData[emp.id][dateStr].remark = existingRemark ? `${existingRemark} / ${driveTimeStr}` : driveTimeStr;
                                }
                            }
                            shiftCount++;
                        }
                    }
                });
                return { newData, shiftCount, transCount, resIdsSet };
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (processedFiles.includes(file.name)) return alert(`エラー: ${file.name} は既に読込済です`);

                addLog(`[Excel] 解析中: ${file.name}...`);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let globalNewData = JSON.parse(JSON.stringify(attendanceData));
                        let totalShift = 0, totalTrans = 0;

                        wb.worksheets.forEach(ws => {
                            let grid2D = [];
                            ws.eachRow((row) => {
                                let rowData = [];
                                row.eachCell({ includeEmpty: true }, (cell, colNumber) => rowData[colNumber - 1] = cell.value);
                                grid2D.push(rowData);
                            });
                            const { newData, shiftCount, transCount } = processTransportAndDriverData(grid2D, employees, globalNewData);
                            globalNewData = newData;
                            totalShift += shiftCount;
                            totalTrans += transCount;
                        });

                        if (totalShift > 0 || totalTrans > 0) {
                            setAttendanceData(globalNewData);
                            setProcessedFiles(prev => [...prev, file.name]);
                            addLog(`[Excel] 完了: 運転 ${totalShift}件, 交通費 ${totalTrans}件`, 'success');
                        } else addLog(`[Excel] データなし`, 'info');
                    } catch (err) { addLog(`[Excel] エラー: ${err.message}`, 'error'); }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const [processedResIds, setProcessedResIds] = useState(new Set());
            const handleCsvUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (processedFiles.includes(file.name)) return alert(`エラー: ${file.name} は既に読込済です`);

                addLog(`[CSV] 解析中: ${file.name}...`);
                let encoding = file.name.includes("details") ? "Shift-JIS" : "UTF-8";

                Papa.parse(file, {
                    encoding: encoding,
                    complete: function(results) {
                        try {
                            const { newData, shiftCount, transCount, resIdsSet } = processTransportAndDriverData(results.data, employees, attendanceData, new Set(processedResIds));
                            if (shiftCount > 0 || transCount > 0) {
                                setAttendanceData(newData);
                                setProcessedResIds(resIdsSet);
                                setProcessedFiles(prev => [...prev, file.name]);
                                addLog(`[CSV] 完了: 運転 ${shiftCount}件, 交通費 ${transCount}件`, 'success');
                            } else addLog(`[CSV] データなし`, 'info');
                        } catch (err) { addLog(`[CSV] エラー: ${err.message}`, 'error'); }
                    }
                });
                e.target.value = null;
            };

            const handleApplyFullTimers = () => {
                if (ftSelected.length === 0) return alert('社員を選択してください');
                if (!batchStart || !batchEnd) return alert('期間を設定してください');
                
                setAttendanceData(prev => {
                    const next = { ...prev };
                    let curr = dayjs(batchStart);
                    const end = dayjs(batchEnd);
                    
                    while(curr.isBefore(end) || curr.isSame(end, 'day')) {
                        const dStr = curr.format('YYYY/MM/DD');
                        ftSelected.forEach(empId => {
                            if (!next[empId]) next[empId] = {};
                            if (!next[empId][dStr]) next[empId][dStr] = {};
                            
                            if (ftShiftStart) next[empId][dStr].shiftStart = ftShiftStart;
                            if (ftShiftEnd) next[empId][dStr].shiftEnd = ftShiftEnd;
                            if (ftReason) next[empId][dStr].leaveType = ftReason;
                        });
                        curr = curr.add(1, 'day');
                    }
                    return next;
                });
                addLog('正社員設定を一括適用しました。', 'success');
            };

            const handleStaffDayToggle = (empId, dayIdx) => {
                setStaffDays(prev => {
                    const current = prev[empId] || {};
                    return { ...prev, [empId]: { ...current, [dayIdx]: !current[dayIdx] } };
                });
            };

            const handleApplyStaff = () => {
                if (!batchStart || !batchEnd) return alert('期間を設定してください');
                if (!globalStaffIn && !globalStaffOut && !globalStaffIgka) return alert('入室、退室、またはIGKAを入力してください');
                
                let appliedCount = 0;
                setAttendanceData(prev => {
                    const next = { ...prev };
                    let curr = dayjs(batchStart);
                    const end = dayjs(batchEnd);
                    
                    while(curr.isBefore(end) || curr.isSame(end, 'day')) {
                        const dayOfWeek = curr.day(); 
                        
                        Object.keys(staffDays).forEach(empId => {
                            if (staffDays[empId][dayOfWeek]) {
                                const dStr = curr.format('YYYY/MM/DD');
                                if (!next[empId]) next[empId] = {};
                                if (!next[empId][dStr]) next[empId][dStr] = {};
                                
                                if (globalStaffIn) next[empId][dStr].shiftStart = globalStaffIn;
                                if (globalStaffOut) next[empId][dStr].shiftEnd = globalStaffOut;
                                if (globalStaffIgka) next[empId][dStr].igkAHours = parseFloat(globalStaffIgka);
                                appliedCount++;
                            }
                        });
                        curr = curr.add(1, 'day');
                    }
                    return next;
                });
                
                if (appliedCount > 0) {
                    addLog(`スタッフのシフトを適用しました。(${appliedCount}件)`, 'success');
                } else {
                    addLog(`適用対象がありません。曜日が選択されているか確認してください。`, 'error');
                }
            };

            const handleAddEmployee = () => {
                if(!newEmpNum || !newEmpName) return alert('番号と氏名を入力してください。');
                if(employees.some(e => e.num === parseInt(newEmpNum))) return alert('この番号は既に存在します。');
                const newId = newEmpLoc === 'rokko' ? `r_new_${Date.now()}` : `m_new_${Date.now()}`;
                const newEmp = { num: parseInt(newEmpNum), id: newId, name: newEmpName.trim(), type: newEmpType, location: newEmpLoc, aliases: [newEmpName.trim()] };
                setEmployees(prev => [...prev, newEmp]);
                setNewEmpNum(''); setNewEmpName('');
                addLog(`従業員 ${newEmp.name} を追加しました。`, 'success');
            };

            const handleDeleteEmployee = (id, name) => {
                if(window.confirm(`${name} を削除してもよろしいですか？`)) {
                    setEmployees(prev => prev.filter(e => e.id !== id));
                    addLog(`従業員 ${name} を削除しました。`, 'success');
                }
            };

            const renderSetupScreen = () => (
