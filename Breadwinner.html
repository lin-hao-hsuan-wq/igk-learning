        const TAB_COLORS = [

        const timeToMins = (t) => {
            if (!t || typeof t !== 'string') return 0;
            const [h, m] = t.split(':').map(Number);
            return (h * 60) + (isNaN(m) ? 0 : m);
        };
        const minsToTime = (m) => {
            if (m === null || m === undefined || isNaN(m) || m <= 0) return '';
            return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        };
        
        const formatTimeWithDec = (mins) => {
            if (!mins || mins === 0) return '-';
            const hm = minsToTime(mins);
            const dec = (mins / 60).toFixed(2).replace(/\.00$/, '');
            return <>{hm} <span className="text-xs font-bold opacity-60 print:text-[10px]">({dec} H)</span></>;
        };

        const loadUIState = (key, defaultVal) => {
            try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : defaultVal; }
            catch(e) { return defaultVal; }
        };

        const loadOldLocalData = (key, defaultVal) => {
            try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : defaultVal; }
            catch(e) { return defaultVal; }
        };

        const getSafeText = (cell) => {
            if (!cell) return '';
            try { if (cell.text !== undefined && cell.text !== null) return String(cell.text); } catch(e) {}
            if (cell.value === null || cell.value === undefined) return '';
            if (typeof cell.value === 'string') return cell.value;
            if (typeof cell.value === 'number') return String(cell.value);
            if (cell.value instanceof Date) return ''; 
            if (cell.value.richText) return cell.value.richText.map(rt => rt.text).join('');
            if (cell.value.result !== undefined && cell.value.result !== null) return String(cell.value.result);
            try { return String(cell.value); } catch(e) { return ''; }
        };

        function App() {
            const [isCloudLoaded, setIsCloudLoaded] = useState(false); 

            const [activePage, setActivePage] = useState(() => loadUIState('igk_pro_activePage', 'import')); 
            const [activeLocation, setActiveLocation] = useState(() => loadUIState('igk_pro_activeLocation', 'rokko')); 
            const [isEmpManagerOpen, setIsEmpManagerOpen] = useState(true);
            const [shiftFileName, setShiftFileName] = useState('');
            const [activeEmp, setActiveEmp] = useState(() => loadUIState('igk_pro_activeEmp', INITIAL_EMPLOYEES[0].id)); 

            const [period, setPeriod] = useState(() => {
                const saved = loadUIState('igk_pro_period', null);
                if (saved) return saved;
                const today = new Date();
                let initM = today.getDate() >= 16 ? today.getMonth() + 2 : today.getMonth() + 1;
                let initY = today.getFullYear();
                if (initM > 12) { initM -= 12; initY += 1; }
                return `${initY}-${String(initM).padStart(2, '0')}`;
            });

            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [settings, setSettings] = useState({ rokkoStart: '09:30', rokkoEnd: '18:30', myodaniStart: '09:15', myodaniEnd: '18:15', special: [] });
            const [attendance, setAttendance] = useState({}); 
            const [monthlyData, setMonthlyData] = useState({}); 
            const [empForm, setEmpForm] = useState({ id: '', name: '', aliases: '', type: 'part', location: 'rokko', isActive: true });

            // ★ 強制搬家與同步邏輯
            useEffect(() => {
                const oldAttendance = loadOldLocalData('igk_pro_attendance', {});
                const hasLocalData = Object.keys(oldAttendance).length > 0;

                docRef.get().then((doc) => {
                    const cloudData = doc.exists ? doc.data() : null;
                    const hasCloudData = cloudData && cloudData.attendance && Object.keys(cloudData.attendance).length > 0;

                    if (hasCloudData && !hasLocalData) {
                        // 情況 A：雲端有資料，且這臺電腦沒有舊資料 -> 採用雲端資料
                        if (cloudData.employees) setEmployees(cloudData.employees);
                        if (cloudData.settings) setSettings(cloudData.settings);
                        if (cloudData.attendance) setAttendance(cloudData.attendance);
                        if (cloudData.monthlyData) setMonthlyData(cloudData.monthlyData);
                    } else {
                        // 情況 B：這臺電腦有舊資料（或兩邊都有），優先把本機舊資料「強制覆蓋/同步」到雲端！
                        const oldEmployees = loadOldLocalData('igk_pro_employees_v10', INITIAL_EMPLOYEES);
                        const oldSettings = loadOldLocalData('igk_pro_settings_v3', { rokkoStart: '09:30', rokkoEnd: '18:30', myodaniStart: '09:15', myodaniEnd: '18:15', special: [] });
                        const oldMonthly = loadOldLocalData('igk_pro_monthlyData', {});

                        setEmployees(oldEmployees);
                        setSettings(oldSettings);
                        setAttendance(oldAttendance);
                        setMonthlyData(oldMonthly);

                        // 強制寫入雲端
                        docRef.set({
                            employees: oldEmployees,
                            settings: oldSettings,
                            attendance: oldAttendance,
                            monthlyData: oldMonthly,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    setIsCloudLoaded(true); 
                }).catch(err => {
                    console.error("Firestore 讀取失敗:", err);
                    // 網路或權限失敗時，至少保證本機資料讀得出來
                    setAttendance(loadOldLocalData('igk_pro_attendance', {}));
                    setIsCloudLoaded(true); 
                });
            }, []);

            // 儲存至雲端 (加入防呆延遲)
            useEffect(() => {
                if (!isCloudLoaded) return; 
                
                const timer = setTimeout(() => {
                    docRef.set({
                        employees,
                        settings,
                        attendance,
                        monthlyData,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(err => console.error("Firestore 寫入失敗:", err));
                }, 1500); 
                
                return () => clearTimeout(timer);
            }, [employees, settings, attendance, monthlyData, isCloudLoaded]);

            // 儲存 UI 狀態至本地
            useEffect(() => localStorage.setItem('igk_pro_activePage', JSON.stringify(activePage)), [activePage]);
            useEffect(() => localStorage.setItem('igk_pro_activeLocation', JSON.stringify(activeLocation)), [activeLocation]);
            useEffect(() => localStorage.setItem('igk_pro_activeEmp', JSON.stringify(activeEmp)), [activeEmp]);
            useEffect(() => localStorage.setItem('igk_pro_period', JSON.stringify(period)), [period]);

            const FULL_TIME_EMPS = employees.filter(e => e.type === 'full' && e.isActive);

            const [newSp, setNewSp] = useState({ 
                name: '', start: '', end: '', timeIn: '09:30', timeOut: '18:30',
                targetEmps: [] 
            });

            const [pastedData, setPastedData] = useState('');

            const dates = useMemo(() => {
                if (!period || !period.includes('-')) return [];
                const [y, m] = period.split('-').map(Number);
                if (isNaN(y) || isNaN(m)) return [];
                const start = new Date(y, m - 2, 16);
                const end = new Date(y, m - 1, 15);
                let arr = [];
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    arr.push(new Date(d));
                }
                return arr;
            }, [period]);

            const dKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const formatDisplayDate = (d) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                return `${d.getMonth() + 1}/${d.getDate()} (${days[d.getDay()]})`;
            };
            const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;

            const handleSaveEmployee = () => {
                if (!empForm.name.trim()) return alert("名前を入力してください！");
                const aliasArray = empForm.aliases.split(',').map(s => s.trim()).filter(Boolean);
                
                if (empForm.id) {
                    setEmployees(prev => prev.map(e => e.id === empForm.id ? { ...empForm, aliases: aliasArray } : e));
                    alert(`「${empForm.name}」の情報を更新しました。`);
                } else {
                    const newId = 'emp_' + Date.now();
                    setEmployees(prev => [...prev, { ...empForm, id: newId, aliases: aliasArray }]);
                    alert(`新しい従業員「${empForm.name}」を追加しました。`);
                }
                setEmpForm({ id: '', name: '', aliases: '', type: 'part', location: 'rokko', isActive: true });
            };

            const handleEditEmployee = (emp) => {
                setEmpForm({ ...emp, aliases: (emp.aliases || []).join(', ') });
                setIsEmpManagerOpen(true);
            };

            const handlePaste = () => {
                if (!pastedData.trim()) return alert("打刻データを貼り付けてください。");
                let newData = JSON.parse(JSON.stringify(attendance)); 
                const text = pastedData.toLowerCase();
                const timeRegex = /(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?[\s\n]*(\d{1,2})[:：](\d{2})/g;
                
                const matches = [...text.matchAll(timeRegex)];
                if (matches.length === 0) return alert("一致する名前や時間のフォーマットが見つかりませんでした。");

                let count = 0;
                let autoPeriod = null;
                let lastEmpLoc = null;

                const getClosestDist = (str, char, pivot) => {
                    let left = str.lastIndexOf(char, pivot);
                    let right = str.indexOf(char, pivot);
                    let d1 = left !== -1 ? pivot - left : 9999;
                    let d2 = right !== -1 ? right - pivot : 9999;
                    return Math.min(d1, d2);
                };

                for (let i = 0; i < matches.length; i++) {
                    const match = matches[i];
                    const month = match[1], day = match[2], hr = match[3], min = match[4];
                    const timeStr = `${hr.padStart(2,'0')}:${min.padStart(2,'0')}`;
                    
                    const startIdx = i === 0 ? Math.max(0, match.index - 150) : matches[i-1].index + matches[i-1][0].length;
                    const endIdx = i === matches.length - 1 ? Math.min(text.length, match.index + 150) : matches[i+1].index;
                    const block = text.substring(startIdx, endIdx);
                    
                    let foundEmpId = null;
                    for (let emp of employees) { 
                        const names = [emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/\s/g,''))];
                        if (names.some(n => block.replace(/\s/g,'').includes(n))) {
                            foundEmpId = emp.id;
                            lastEmpLoc = emp.location; 
                            break;
                        }
                    }

                    if (foundEmpId) {
                        const y = new Date().getFullYear(); 
                        const dateObj = new Date(y, parseInt(month)-1, parseInt(day));
                        const key = dKey(dateObj);
                        
                        if (!autoPeriod) {
                            let tmpy = dateObj.getFullYear();
                            let tmpm = dateObj.getDate() >= 16 ? dateObj.getMonth() + 2 : dateObj.getMonth() + 1;
                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                        }

                        let timeLocalIdx = match.index - startIdx;
                        let outDist = Math.min(getClosestDist(block, '退', timeLocalIdx), getClosestDist(block, 'out', timeLocalIdx));
                        let inDist = Math.min(getClosestDist(block, '入', timeLocalIdx), getClosestDist(block, 'in', timeLocalIdx));
                        
                        let type = 'inTime';
                        if (outDist < inDist) {
                            type = 'outTime';
                        } else if (outDist === 9999 && inDist === 9999) {
                            if (newData[foundEmpId] && newData[foundEmpId][key] && newData[foundEmpId][key].inTime) type = 'outTime';
                        }

                        if (!newData[foundEmpId]) newData[foundEmpId] = {};
                        if (!newData[foundEmpId][key]) newData[foundEmpId][key] = {};
                        newData[foundEmpId][key][type] = timeStr;
                        count++;
                    }
                }
                
                if (count > 0) {
                    setAttendance(newData);
                    setPastedData('');
                    if (autoPeriod) setPeriod(autoPeriod);
                    if (lastEmpLoc) setActiveLocation(lastEmpLoc); 
                    setActivePage('preview');
                    alert(`${count} 件の打刻データを正常に取り込みました！`);
                } else {
                    alert("一致する名前や時間のフォーマットが見つかりませんでした。");
                }
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setShiftFileName(file.name); 
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let newData = JSON.parse(JSON.stringify(attendance));
                        let localEmps = JSON.parse(JSON.stringify(employees));
                        let employeesChanged = false;
                        let count = 0;
                        let autoPeriod = null;
                        let sessionIgnores = new Set(); 

                        wb.worksheets.forEach(ws => {
                            let currentDates = {}; 
                            let currentColMap = {};

                            for (let r = 1; r <= ws.rowCount; r++) {
                                for (let c = 1; c <= 10; c++) {
                                    let textStr = getSafeText(ws.getCell(r, c));
                                    let valObj = ws.getCell(r, c).value;
                                    
                                    if (valObj instanceof Date && valObj.getFullYear() > 2000) {
                                        currentDates[r] = { key: dKey(valObj), obj: valObj };
                                        break;
                                    }
                                    
                                    let t = textStr.replace(/\s+/g, '');
                                    if (t.match(/\d{1,2}[:：\.]\d{2}/)) continue; 
                                    
                                    const m = t.match(/^(?:(?:20)?\d{2}[\/\-年])?(1[0-2]|0?[1-9])[\/\-月](3[01]|[12][0-9]|0?[1-9])日?(?:\([月火水木金土日]\))?$/);
                                    if (m) {
                                        let y = new Date().getFullYear();
                                        const yMatch = t.match(/(20\d{2})/); if (yMatch) y = parseInt(yMatch[1]);
                                        let dObj = new Date(y, parseInt(m[1])-1, parseInt(m[2]));
                                        currentDates[r] = { key: dKey(dObj), obj: dObj };
                                        break;
                                    }
                                }

                                let matches = 0;
                                let tempMap = {};
                                let tempUnknown = [];

                                for (let c = 1; c <= 40; c++) {
                                    let cellRaw = getSafeText(ws.getCell(r, c));
                                    let v = cellRaw.toLowerCase().replace(/\s+/g, '');
                                    if (v.length >= 1) {
                                        let matched = false;
                                        for (const emp of localEmps) { 
                                            let s = [emp.name.toLowerCase().replace(/\s+/g, ''), ...emp.aliases.map(a => a.toLowerCase().replace(/\s+/g, ''))];
                                            if (s.includes(v) || s.some(name => v.includes(name) && name.length >= 2)) {
                                                tempMap[c] = emp.id; matches++; matched = true; break;
                                            }
                                        }
                                        if (!matched && v.length >= 2 && v.length <= 20 && !v.match(/^[0-9:\.\-\/]+$/)) {
                                            if (!sessionIgnores.has(v)) {
                                                tempUnknown.push({col: c, name: cellRaw.trim(), key: v});
                                            }
                                        }
                                    }
                                }
                                
                                if (matches >= 2) { 
                                    if (tempUnknown.length > 0) {
                                        tempUnknown.forEach(unk => {
                                            if (sessionIgnores.has(unk.key)) return; 
                                            const mappedName = window.prompt(`未知の担当者/項目「${unk.name}」が見つかりました。\n既存の従業員に紐付ける場合は名前を入力（無視する場合は空白でOK）`);
                                            if (mappedName && mappedName.trim()) {
                                                const targetIdx = localEmps.findIndex(e => e.name.includes(mappedName.trim()) || e.aliases.some(a => a.includes(mappedName.trim())));
                                                if (targetIdx !== -1) {
                                                    localEmps[targetIdx].aliases.push(unk.name);
                                                    tempMap[unk.col] = localEmps[targetIdx].id;
                                                    employeesChanged = true;
                                                } else { sessionIgnores.add(unk.key); }
                                            } else { sessionIgnores.add(unk.key); }
                                        });
                                    }
                                    currentColMap = tempMap;
                                }

                                let activeDateRow = Object.keys(currentDates).reverse().find(dr => r >= parseInt(dr));
                                if (activeDateRow && Object.keys(currentColMap).length > 0) {
                                    let dateInfo = currentDates[activeDateRow];
                                    
                                    if (!autoPeriod) {
                                        let tmpy = dateInfo.obj.getFullYear();
                                        let tmpm = dateInfo.obj.getDate() >= 16 ? dateInfo.obj.getMonth() + 2 : dateInfo.obj.getMonth() + 1;
                                        if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                                        autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                                    }

                                    Object.keys(currentColMap).forEach(c => {
                                        const empId = currentColMap[c];
                                        let actCell = ws.getCell(r, parseInt(c));
                                        if (actCell.isMerged) actCell = ws.getCell(actCell.master.address);
                                        
                                        let cellText = getSafeText(actCell).trim();
                                        let hasContent = /[a-zA-Z0-9\u3040-\u30FF\u4E00-\u9FFF]/.test(cellText);
                                        const exactMatches = [...cellText.matchAll(/([0-9]{1,2})[:：\.\-]([0-9]{2})/g)];
                                        
                                        let fill = actCell.fill || {};
                                        let hex = '';
                                        if (fill.type === 'pattern' && fill.pattern !== 'none') {
                                            hex = (fill.fgColor?.argb || fill.bgColor?.argb || '').toUpperCase();
                                            if (hex && ['FFFFFFFF', '00000000', 'FF000000', '00FFFFFF'].includes(hex)) hex = '';
                                        }

                                        let theme = fill.fgColor?.theme ?? fill.bgColor?.theme ?? -1;
                                        let indexed = fill.fgColor?.indexed ?? fill.bgColor?.indexed ?? -1;

                                        const isRedOrPink = (hex && (hex.includes('FF00') || hex.includes('FF33') || hex.includes('FF66') || hex.includes('FF99') || hex.includes('FFCC') || hex.includes('FFFCE4') || hex.includes('FFF4B0') || hex.includes('FFFFE4') || hex.includes('FFD5A6'))) || theme === 6 || theme === 5 || indexed === 10 || indexed === 29 || indexed === 38;
                                        const isEnglish = /[a-zA-Z]/.test(cellText);
                                        
                                        const blueHexes = ['B4C6E7', 'D9E1F2', '8EA9DB', '2F75B5', '9BC2E6', 'DDEBF7', '0070C0', '002060', '00B0F0', 'AADC', 'E1F2', 'CCFF', '3366FF', '0000FF'];
                                        let isBlue = (hex && blueHexes.some(b => hex.includes(b))) || theme === 4 || theme === 8 || indexed === 4 || indexed === 12 || indexed === 20 || indexed === 37;
                                        
                                        let isGrey = (hex && (hex.includes('A6A6') || hex.includes('D9D9') || hex.includes('BFBF') || hex.includes('8080') || hex.includes('AEAAAA'))) || theme === 3 || indexed === 15 || indexed === 22 || indexed === 23;

                                        if (!newData[empId]) newData[empId] = {};
                                        if (!newData[empId][dateInfo.key]) newData[empId][dateInfo.key] = {};
                                        let dataRef = newData[empId][dateInfo.key];

                                        if (cellText.includes('欠') || cellText.includes('休') || isGrey) {
                                            if (cellText.includes('欠') || cellText.includes('休')) {
                                                dataRef.leave = cellText.substring(0, 10);
                                                count++;
                                            }
                                            return; 
                                        }

                                        let isDriverKeyword = cellText.includes('乗車') || cellText.includes('下車') || cellText.includes('降車') || cellText.includes('車') || cellText.includes('返却');
                                        
                                        if (isDriverKeyword && exactMatches.length > 0) {
                                            exactMatches.forEach(m => {
                                                let tMins = timeToMins(`${m[1].padStart(2, '0')}:${m[2]}`);
                                                if (!dataRef._tempDrivers) dataRef._tempDrivers = [];
                                                dataRef._tempDrivers.push(tMins);
                                            });
                                            count++;
                                        } else if ((isRedOrPink && isEnglish) || (isBlue && hasContent)) {
                                            let prevIgkA = timeToMins(dataRef.igkA || '');
                                            dataRef.igkA = minsToTime(prevIgkA + 30);
                                            count++;
                                        }
                                    });
                                }
                            }

                        Object.keys(newData).forEach(empId => {

                                    let times = dataRef._tempDrivers.sort((a,b) => a - b);
                                    let totalDriverMins = 0;
                                    let tripStrs = [];
                                    
                                    for (let i = 0; i < times.length - 1; i += 2) {
                                        totalDriverMins += (times[i+1] - times[i]);
                                        tripStrs.push(`${minsToTime(times[i])}-${minsToTime(times[i+1])}`);
                                    }
                                    if (times.length % 2 !== 0) {
                                        tripStrs.push(`${minsToTime(times[times.length - 1])}-?`);
                                    }

                                    let prevDriver = timeToMins(dataRef.driverMins || '');
                                    dataRef.driverMins = minsToTime(prevDriver + totalDriverMins);
                                    
                                    let existingRemark = dataRef.remark || '';
                                    let newRemark = tripStrs.join(', ');
                                    if (newRemark) {
                                        dataRef.remark = existingRemark ? (existingRemark + ' / ' + newRemark) : newRemark;
                                    }
                                    delete dataRef._tempDrivers;
                                }

                const isWknd = isWeekend(date);
                let inTime = row.inTime || '';
                let outTime = row.outTime || '';
                let leave = row.leave || '';
                let igkA = row.igkA || '';
                let breakTime = row.breakTime !== undefined ? row.breakTime : (emp.type === 'full' ? '01:00' : '');
                let breakMins = timeToMins(breakTime);

                let displayShiftIn = row.shiftIn !== undefined ? row.shiftIn : '';
                let displayShiftOut = row.shiftOut !== undefined ? row.shiftOut : '';

                if (!displayShiftIn && !displayShiftOut) {
                    if (emp.type === 'full') {
                        displayShiftIn = emp.location === 'rokko' ? settings.rokkoStart : settings.myodaniStart;
                        displayShiftOut = emp.location === 'rokko' ? settings.rokkoEnd : settings.myodaniEnd;
                        (settings.special || []).forEach(sp => {
                            const isTarget = sp.targetEmps ? sp.targetEmps.includes(emp.id) : true;
                            if (isTarget && new Date(date) >= new Date(sp.start) && new Date(date) <= new Date(sp.end)) {
                                displayShiftIn = sp.timeIn; displayShiftOut = sp.timeOut;
                            }
                        });
                    } else {
                        if (inTime) displayShiftIn = minsToTime(Math.ceil((timeToMins(inTime) - 5) / 30) * 30);
                        if (outTime) displayShiftOut = minsToTime(Math.floor(timeToMins(outTime) / 15) * 15);
                    }
                }

                let earlyOtMins = 0, lateOtMins = 0;
                if (emp.type === 'full' && !leave) {
                    if (inTime && displayShiftIn) {
                        let diff = timeToMins(displayShiftIn) - timeToMins(inTime);
                        if (diff > 0) earlyOtMins = diff;
                    }
                    if (outTime && displayShiftOut) {
                        let diff = timeToMins(outTime) - timeToMins(displayShiftOut);
                        if (diff > 0) lateOtMins = diff;
                    }
                }

                let totalWorkMins = 0;
                if (inTime && outTime && !leave) {
                    totalWorkMins = Math.max(0, timeToMins(displayShiftOut) - timeToMins(displayShiftIn) - breakMins);
                } else if (displayShiftIn && displayShiftOut && emp.type === 'full' && !leave) {

                const driverMins = row.driverMins ? timeToMins(row.driverMins) : 0;

                    igkBMins = Math.max(0, totalWorkMins - igkAMins - driverMins);
                } else {
                    igkBMins = Math.max(0, totalWorkMins - igkAMins);
                }

                return { isWknd, displayShiftIn, displayShiftOut, earlyOtMins, lateOtMins, totalWorkMins, igkAMins, igkBMins, driverMins, breakTime };

                                        <div className={`mt-6 pt-4 grid grid-cols-2 gap-3 print:break-inside-avoid print:gap-2 md:grid-cols-6`}>
                                            
                                            <div className="bg-slate-50 p-2 rounded-xl border border-slate-100 shadow-sm flex items-stretch col-span-2 print:border-none print:bg-white">
                                                <div className="flex-1 flex flex-col justify-center items-center border-r border-slate-200">
                                                    <div className="text-[10px] font-bold text-slate-400 mb-0.5 print:text-[8px]">出勤日数</div>
                                                    <div className="text-2xl font-black text-slate-700 leading-none print:text-lg">{sumDays} <span className="text-xs font-bold">日</span></div>
                                                </div>
                                                <div className="flex-1 flex flex-col justify-between pl-2 pr-1 text-[10px] font-bold">
                                                    <div className="flex justify-between items-center text-slate-600"><span className="text-slate-400">有休</span><span>{sumPaidLeave} 日</span></div>
                                                    <div className="flex justify-between items-center text-slate-600 border-y border-slate-200/60 py-0.5 my-0.5"><span className="text-slate-400">事欠</span><span>{sumUnpaidLeave} 日</span></div>
                                                    <div className="flex justify-between items-center text-slate-600"><span className="text-slate-400">病欠</span><span>{sumSickLeave} 日</span></div>
                                                </div>
                                            </div>
                                            
                                            {currentEmp.type === 'full' ? (
                                                <>
                                                    <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 text-center shadow-sm col-span-1 print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-orange-500 mb-1 print:text-[10px]">早残業</div>
                                                        <div className="text-2xl font-black text-orange-600 print:text-lg">{sumEarly} <span className="text-sm font-bold print:text-[10px]">分</span></div>
                                                    </div>
                                                    
                                                    <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 text-center shadow-sm col-span-1 print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-orange-500 mb-1 print:text-[10px]">後残業</div>
                                                        <div className="text-2xl font-black text-orange-600 print:text-lg">{sumLate} <span className="text-sm font-bold print:text-[10px]">分</span></div>
                                                    </div>
                                                    
                                                    <div className="bg-red-50 p-3 rounded-xl border border-red-100 text-center shadow-sm col-span-2 flex flex-col justify-center print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-red-500 mb-1 print:text-[10px]">残業合計 (早+後)</div>
                                                        <div className="text-3xl font-black text-red-600 print:text-xl">{sumEarly + sumLate} <span className="text-base font-bold mx-1 print:text-[10px]">分</span> <span className="text-base font-bold text-red-400 font-mono print:text-[10px]">({((sumEarly + sumLate) / 60).toFixed(2)} H)</span></div>
                                                    </div>
                                                </>
                                            ) : (
                                                <>
                                                    {['實熊功光', '上山貴行', '安藤佑也', 'Mikuma', 'Taka', 'Ando'].some(n => currentEmp.name.includes(n) || (currentEmp.aliases || []).includes(n)) && (
                                                        <div className="bg-yellow-50 p-3 rounded-xl border border-yellow-100 text-center shadow-sm col-span-1 print:border-none print:bg-white">
                                                            <div className="text-[10px] font-bold text-yellow-600 mb-1 print:text-[8px]">運転 実績</div>
                                                            <div className="text-lg font-black text-yellow-700 font-mono print:text-base">{formatTimeWithDec(sumDriver)}</div>
                                                        </div>
                                                    )}
                                                    
                                                    <div className="bg-pink-50 p-3 rounded-xl border border-pink-100 text-center shadow-sm col-span-1 print:border-none print:bg-white">
                                                        <div className="text-[10px] font-bold text-pink-500 mb-1 print:text-[8px]">IGK A 合計</div>
                                                        <div className="text-lg font-black text-pink-600 font-mono print:text-base">{formatTimeWithDec(sumIgka)}</div>
                                                    </div>

                                                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center shadow-sm col-span-1 print:border-none print:bg-white">
                                                        <div className="text-[10px] font-bold text-blue-500 mb-1 print:text-[8px]">IGK B 合計</div>
                                                        <div className="text-lg font-black text-blue-600 font-mono print:text-base">{formatTimeWithDec(sumIgkb)}</div>
                                                    </div>

                                                    <div className={`bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center shadow-sm flex flex-col justify-center print:border-none print:bg-white ${['實熊功光', '上山貴行', '安藤佑也', 'Mikuma', 'Taka', 'Ando'].some(n => currentEmp.name.includes(n) || (currentEmp.aliases || []).includes(n)) ? 'col-span-1' : 'col-span-2'}`}>
                                                        <div className="text-[10px] font-bold text-indigo-600 mb-1 print:text-[8px]">A+B 総労働</div>
                                                        <div className="text-xl font-black text-indigo-700 font-mono print:text-lg">{formatTimeWithDec(sumIgka + sumIgkb)}</div>
                                                    </div>
                                                </>
                                            )}
                                        </div>

                                        <div className="mt-6 p-4 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between print:bg-transparent print:border-none print:p-0 print:mt-4">
                                            <span className="font-bold text-slate-700 print:text-[10px]">交通費 (手動入力)</span>
                                            <div className="flex items-center gap-2">
                                                <input type="number"
                                                    value={monthlyData[currentEmp.id]?.[period]?.transportFee || ''}
                                                    onChange={(e) => updateMonthlyData(currentEmp.id, period, 'transportFee', e.target.value)}
                                                    className="border border-slate-300 rounded-lg p-2 w-32 text-right font-bold outline-none focus:border-indigo-500 print:border-none print:p-0 print:text-right"
                                                    placeholder="0"
                                                />
                                                <span className="font-bold text-slate-500 print:text-[10px]">円</span>
                                            </div>
                                        </div>

                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            @page { margin: 1cm; size: A4 portrait; }
            body { background: white !important; font-size: 11pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print\:hidden { display: none !important; }
            .print\:break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
            input, select { border: none !important; background: transparent !important; box-shadow: none !important; }
        }
    </style>
</body>
</html>
