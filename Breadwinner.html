<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGK</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Day.js -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ★ 1. 加入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f3f4f6; overflow: hidden; }
        .tab-color-1 { border-left: 4px solid #f87171; }
        .tab-color-2 { border-left: 4px solid #60a5fa; }
        .tab-color-3 { border-left: 4px solid #34d399; }
        .tab-color-4 { border-left: 4px solid #fbbf24; }
        .tab-color-5 { border-left: 4px solid #a78bfa; }
        .locked-overlay { position: relative; pointer-events: none; opacity: 0.8; user-select: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .holiday-row { background-color: #fef2f2 !important; }
        .holiday-text { color: #b91c1c !important; font-weight: bold; }
        .absent-row { background-color: #faf5ff !important; }
        /* 讓四個宮格在不同螢幕不超出邊界 */
        .grid-panel { height: calc((100vh - 80px) / 2 - 12px); min-height: 320px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ★ 2. Firebase 初始化設定
        const firebaseConfig = {
            apiKey: "AIzaSyC2CVG7H5-LYs7bvNFJSdEf8blFNZmJOxs",
            authDomain: "igk-breadwinner.firebaseapp.com",
            projectId: "igk-breadwinner",
            storageBucket: "igk-breadwinner.firebasestorage.app",
            messagingSenderId: "1017510582907",
            appId: "1:1017510582907:web:2059d68dd57816398020de",
            measurementId: "G-KJLMVFW3RH"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        // 使用 v2 避免與舊程式碼格式衝突
        const docRef = db.collection('igk_data').doc('v2'); 

        const { useState, useEffect } = React;

        const HOLIDAYS_2026 = [
            '2026/01/01', '2026/01/12', '2026/02/11', '2026/02/23', '2026/03/20', 
            '2026/04/29', '2026/05/03', '2026/05/04', '2026/05/05', '2026/05/06', 
            '2026/07/20', '2026/08/11', '2026/09/21', '2026/09/22', '2026/09/23', 
            '2026/10/12', '2026/11/03', '2026/11/23'
        ];

        const INITIAL_EMPLOYEES = [
            { num: 1, id: 'm2', name: 'Linh', type: 'full', location: 'myodani' },
            { num: 2, id: 'r1', name: '葛野みのり', type: 'full', location: 'rokko' },
            { num: 3, id: 'r2', name: 'Ratu Yassmyn Khairussalima', type: 'full', location: 'rokko' },
            { num: 4, id: 'm1', name: '加藤友梨', type: 'full', location: 'myodani' },
            { num: 5, id: 'r3', name: 'Yoon Honey Aung', type: 'full', location: 'rokko' },
            { num: 6, id: 'r4', name: '林昊嬛', type: 'full', location: 'rokko' },
            { num: 7, id: 'r15', name: '金栄美', type: 'part', location: 'rokko' },
            { num: 8, id: 'r11', name: '沼田真里子', type: 'part', location: 'rokko' },
            { num: 9, id: 'r16', name: '角田紀子', type: 'part', location: 'rokko' },
            { num: 10, id: 'r6', name: '上山貴行', type: 'driver', location: 'rokko' },
            { num: 11, id: 'r5', name: '實熊功光', type: 'driver', location: 'rokko' },
            { num: 12, id: 'r12', name: '安藤佑也', type: 'driver', location: 'rokko' },
            { num: 13, id: 'r7', name: 'Fergus', type: 'part', location: 'rokko' },
            { num: 14, id: 'r8', name: 'Sammy Abukmeil', type: 'part', location: 'rokko' },
            { num: 15, id: 'r9', name: 'Kim Nakyung', type: 'part', location: 'rokko' },
            { num: 16, id: 'r10', name: 'Nathan Morrison', type: 'part', location: 'rokko' },
            { num: 20, id: 'r14', name: 'Nao', type: 'part', location: 'rokko' },
            { num: 21, id: 'r13', name: 'Misato', type: 'part', location: 'rokko' },
            { num: 30, id: 'm3', name: '大津真里', type: 'part', location: 'myodani' },
            { num: 31, id: 'm4', name: '馬場亜希', type: 'part', location: 'myodani' },
            { num: 32, id: 'm5', name: '篠崎', type: 'part', location: 'myodani' },
            { num: 33, id: 'm6', name: '吉野 真緒', type: 'part', location: 'myodani' },
            { num: 34, id: 'm7', name: '森 佳織', type: 'part', location: 'myodani' },
            { num: 35, id: 'm9', name: 'Hamna', type: 'part', location: 'myodani' },
            { num: 37, id: 'm11', name: 'Sadia', type: 'part', location: 'myodani' },
            { num: 38, id: 'm12', name: 'Monika', type: 'part', location: 'myodani' },
            { num: 39, id: 'm13', name: '中嶋莉真', type: 'part', location: 'myodani' },
            { num: 40, id: 'm14', name: '顕谷ユタカ', type: 'part', location: 'myodani' },
            { num: 41, id: 'm15', name: 'Mozelle Bargamin', type: 'part', location: 'myodani' },
            { num: 43, id: 'm_bjoerg', name: 'Bjoerg Bendix', type: 'part', location: 'myodani' },
        ];

        const isHoliday = (dateStr) => {
            const day = dayjs(dateStr).day();
            return [0, 6].includes(day) || HOLIDAYS_2026.includes(dateStr);
        };

        const calculateMinutes = (start, end) => {
            if(!start || !end) return 0;
            const s = dayjs(`2000-01-01 ${start}`);
            const e = dayjs(`2000-01-01 ${end}`);
            return e.diff(s, 'minute');
        };

        const formatHM = (mins) => {
            const h = Math.floor(mins / 60).toString().padStart(2, '0');
            const m = (mins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        };

        const SettingPanel = ({ title, children, className = '', headerRight, isCollapsible, isOpen, onToggle }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col ${isCollapsible && !isOpen ? 'h-auto min-h-0' : 'grid-panel'} ${className}`}>
                <div 
                    className={`flex justify-between items-center shrink-0 ${isCollapsible && !isOpen ? '' : 'mb-3 border-b pb-2'} ${isCollapsible ? 'cursor-pointer select-none transition-colors hover:bg-gray-50 rounded -mx-2 px-2 py-1' : ''}`}
                    onClick={isCollapsible ? onToggle : undefined}
                >
                    <h2 className="text-[15px] font-bold text-gray-800 flex items-center gap-2">
                        {isCollapsible && <i className={`fa-solid fa-chevron-${isOpen ? 'up' : 'down'} text-blue-500`}></i>}
                        {title}
                    </h2>
                    <div onClick={e => e.stopPropagation()}>{headerRight}</div>
                </div>
                {(!isCollapsible || isOpen) && (
                    <div className="flex-1 overflow-hidden flex flex-col">
                        {children}
                    </div>
                )}
            </div>
        );

        const App = () => {
            // ★ 3. 雲端讀取狀態與解鎖密碼
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const ADMIN_PASSWORD = "8888"; // ← 請在這裡修改你的專屬密碼

            const [currentView, setCurrentView] = useState('setup');
            const [isLocked, setIsLocked] = useState(false);
            const [isFixedTimeOpen, setIsFixedTimeOpen] = useState(false);
            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [logs, setLogs] = useState([]);
            const [attendanceData, setAttendanceData] = useState({});
            
            // Setup Screen States
            const [timecardText, setTimecardText] = useState('');
            const [specialTime, setSpecialTime] = useState({ startDate: '', endDate: '', start: '', end: '', reason: '', location: 'rokko', target: 'all' });
            const [specialRecords, setSpecialRecords] = useState([]);

            // Reports Screen States
            const [payMonth, setPayMonth] = useState('2026-09');
            const [activeLocation, setActiveLocation] = useState('rokko');
            const [activeEmployeeId, setActiveEmployeeId] = useState('r1');

            const addLog = (msg, type = 'info') => {
                setLogs(prev => [`[${dayjs().format('HH:mm:ss')}] ${msg}`, ...prev]);
            };

            // ★ 4. Firebase 初始資料讀取
            useEffect(() => {
                docRef.get().then((doc) => {
                    if (doc.exists) {
                        const cloudData = doc.data();
                        if (cloudData.employees) setEmployees(cloudData.employees);
                        if (cloudData.attendanceData) setAttendanceData(cloudData.attendanceData);
                        if (cloudData.specialRecords) setSpecialRecords(cloudData.specialRecords);
                        if (cloudData.isLocked !== undefined) setIsLocked(cloudData.isLocked);
                    }
                    setIsCloudLoaded(true);
                }).catch(err => {
                    console.error("Firestore 讀取失敗:", err);
                    setIsCloudLoaded(true);
                });
            }, []);

            // ★ 5. 即時監聽「鎖定狀態」
            useEffect(() => {
                if (!isCloudLoaded) return;
                const unsubscribe = docRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.isLocked !== undefined) setIsLocked(data.isLocked);
                    }
                });
                return () => unsubscribe();
            }, [isCloudLoaded]);

            // ★ 6. 資料變更時自動儲存至雲端
            useEffect(() => {
                if (!isCloudLoaded) return;
                const timer = setTimeout(() => {
                    docRef.set({
                        employees,
                        attendanceData,
                        specialRecords,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(err => console.error("Firestore 寫入失敗:", err));
                }, 1500);
                return () => clearTimeout(timer);
            }, [employees, attendanceData, specialRecords, isCloudLoaded]);

            // ★ 7. 密碼鎖定/解鎖邏輯
            const handleToggleLock = () => {
                if (isLocked) {
                    const pwd = window.prompt("請輸入管理員密碼以開放編輯 (パスワードを入力):");
                    if (pwd === ADMIN_PASSWORD) {
                        docRef.set({ isLocked: false }, { merge: true });
                        addLog('システムロックを解除しました。', 'success');
                    } else if (pwd !== null) {
                        alert("密碼錯誤！(パスワードが違います)");
                    }
                } else {
                    const confirmLock = window.confirm("確定要鎖定所有人的編輯權限嗎？(全員の編集をロックしますか？)");
                    if (confirmLock) {
                        docRef.set({ isLocked: true }, { merge: true });
                        addLog('システムをロックしました。', 'info');
                    }
                }
            };

            // 1. 純文字解析 (解決 0 筆問題，放寬 Regex 條件)
            const handleParseTimecardText = () => {
                if (!timecardText.trim()) return;
                
                const lines = timecardText.split('\n').map(l => l.trim()).filter(l => l);
                let currentName = null;
                let currentAction = null;
                let parsedCount = 0;
                
                const newData = { ...attendanceData };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    
                    if (/^\d{8}$/.test(line)) { 
                        if (i + 1 < lines.length) {
                            currentName = lines[i+1].replace(/\s+/g, '');
                            i++; // skip name line
                        }
                    }
                    else if (line === '入室' || line === '退室') {
                        currentAction = line === '入室' ? 'in' : 'out';
                        if (i + 1 < lines.length) {
                            const dateStrLine = lines[i+1];
                            // 放寬日期擷取條件： 2026/08/17 或是 2026/8/17
                            const timeMatch = dateStrLine.match(/(\d{4}\/\d{1,2}\/\d{1,2})\s+(\d{1,2}:\d{2})/);
                            
                            if (timeMatch && currentName) {
                                const emp = employees.find(e => e.name.replace(/\s+/g, '').includes(currentName) || currentName.includes(e.name.replace(/\s+/g, '')));
                                
                                if (emp) {
                                    // 標準化日期為 YYYY/MM/DD
                                    const dateKey = dayjs(timeMatch[1], 'YYYY/M/D').format('YYYY/MM/DD');
                                    const timeVal = timeMatch[2];
                                    
                                    if (!newData[emp.id]) newData[emp.id] = {};
                                    if (!newData[emp.id][dateKey]) newData[emp.id][dateKey] = { location: emp.location };
                                    
                                    newData[emp.id][dateKey][currentAction] = timeVal;
                                    parsedCount++;
                                }
                            }
                        }
                    } 
                }

                setAttendanceData(newData);
                addLog(`テキストから ${parsedCount} 筆の打刻データを解析し、反映しました。`, 'success');
                setTimecardText('');
            };

            // 2. 模擬上傳檔案 (將資料寫入 8/10 確保落在 7/16~8/15)
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                addLog(`ファイル読み込み開始: ${file.name}...`);
                
                setTimeout(() => {
                    setAttendanceData(prev => {
                        const newData = { ...prev };
                        // 模擬 8/10, 8/11, 8/12 的資料
                        const mockDates = ['2026/08/10', '2026/08/11', '2026/08/12']; 
                        
                        const initData = (empId, date) => {
                            if (!newData[empId]) newData[empId] = {};
                            if (!newData[empId][date]) newData[empId][date] = { location: 'rokko' }; // basic init
                        };

                        if (file.name.includes('交通費')) {
                            ['m1', 'm2', 'r1', 'r4'].forEach(id => {
                                initData(id, '2026/08/10');
                                newData[id]['2026/08/10'].transFee = 1500;
                            });
                            addLog(`「${file.name}」を取り込みました。交通費を反映しました (模擬: 8/10)`, 'success');
                        } 
                        else if (file.name.includes('Summer')) {
                            ['r1', 'r2', 'r3', 'r4'].forEach(id => {
                                mockDates.forEach(d => {
                                    initData(id, d);
                                    newData[id][d].shiftStart = '09:30';
                                    newData[id][d].shiftEnd = '18:30';
                                    newData[id][d].location = 'rokko';
                                });
                            });
                            addLog(`六甲校シフトを解析しました。(模擬: 8/10~8/12 班表反映)`, 'success');
                        } 
                        else if (file.name.includes('名谷')) {
                            ['m1', 'm2'].forEach(id => {
                                mockDates.forEach(d => {
                                    initData(id, d);
                                    newData[id][d].shiftStart = '09:15';
                                    newData[id][d].shiftEnd = '18:15';
                                    newData[id][d].location = 'myodani';
                                });
                            });
                            addLog(`名谷校シフトを解析しました。(模擬: 8/10~8/12 班表反映)`, 'success');
                        }
                        return newData;
                    });
                }, 800);
            };

            // 3. 特別時間寫入 (包含防呆)
            const handleAddSpecialTime = () => {
                if (!specialTime.startDate || !specialTime.start || !specialTime.end) {
                    addLog('日付範囲の開始日と時間帯を入力してください。', 'error');
                    return;
                }
                
                // 防呆機制：開始時間必須小於結束時間 (防止 09:59 - 09:00)
                if (specialTime.start >= specialTime.end) {
                    addLog('時間設定有誤（開始時間必須早於結束時間）。', 'error');
                    return;
                }

                const sDate = dayjs(specialTime.startDate);
                const eDate = specialTime.endDate ? dayjs(specialTime.endDate) : sDate;

                let targets = [];
                if (specialTime.target === 'all') {
                    targets = employees.filter(e => e.type === 'full' && e.location === specialTime.location);
                } else {
                    const emp = employees.find(e => e.id === specialTime.target);
                    if (emp) targets.push(emp);
                }

                setAttendanceData(prev => {
                    const newData = { ...prev };
                    targets.forEach(emp => {
                        if (!newData[emp.id]) newData[emp.id] = {};
                        let curr = sDate;
                        while (curr.isBefore(eDate) || curr.isSame(eDate, 'day')) {
                            const dateStr = curr.format('YYYY/MM/DD');
                            if (!newData[emp.id][dateStr]) newData[emp.id][dateStr] = {};
                            
                            newData[emp.id][dateStr].shiftStart = specialTime.start;
                            newData[emp.id][dateStr].shiftEnd = specialTime.end;
                            newData[emp.id][dateStr].location = specialTime.location; 
                            if (specialTime.reason) {
                                newData[emp.id][dateStr].remark = specialTime.reason;
                            }
                            curr = curr.add(1, 'day');
                        }
                    });
                    return newData;
                });

                setSpecialRecords(prev => [...prev, specialTime]);
                addLog(`特別勤務時間を設定し、シフトに反映しました。 (${specialTime.reason})`, 'success');
                setSpecialTime({ startDate: '', endDate: '', start: '', end: '', reason: '', location: 'rokko', target: 'all' });
            };

            // --- 畫面渲染：1. 設定畫面 ---
            const renderSetupScreen = () => (
                <div className={`grid grid-cols-1 lg:grid-cols-2 gap-4 p-4 h-[calc(100vh-60px)] overflow-y-auto ${isLocked ? 'locked-overlay' : ''}`}>
                    
                    {/* 左上：正社員固定時間與名單 */}
                    <SettingPanel 
                        title="正社員の固定勤務時間 / 社員管理" 
                        isCollapsible={true}
                        isOpen={isFixedTimeOpen}
                        onToggle={() => setIsFixedTimeOpen(!isFixedTimeOpen)}
                        headerRight={
                            <button className="text-[11px] bg-blue-100 text-blue-700 font-bold py-1 px-3 rounded shadow-sm hover:bg-blue-200 transition">
                                <i className="fa-brands fa-google-drive mr-1"></i> 労務管理から取込
                            </button>
                        }
                    >
                        <div className="flex flex-col h-full gap-3">
                            <div className="flex gap-3 h-[60%] min-h-[140px]">
                                {/* 六甲校 */}
                                <div className="bg-gray-50 rounded-lg border flex-1 flex flex-col overflow-hidden">
                                    <div className="p-2 border-b bg-white flex justify-between items-center shrink-0">
                                        <h3 className="font-bold text-blue-800 text-xs"><i className="fa-solid fa-school"></i> 六甲校</h3>
                                        <span className="text-[10px] font-mono bg-blue-50 px-1.5 py-0.5 rounded border text-blue-700">09:30 - 18:30</span>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-1.5 space-y-1">
                                        {employees.filter(e => e.type === 'full' && e.location === 'rokko').sort((a,b)=>a.num-b.num).map(emp => (
                                            <div key={emp.id} className="text-[11px] p-1.5 bg-white border rounded shadow-sm text-gray-700 font-medium">
                                                {emp.num}. {emp.name}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                {/* 名谷校 */}
                                <div className="bg-gray-50 rounded-lg border flex-1 flex flex-col overflow-hidden">
                                    <div className="p-2 border-b bg-white flex justify-between items-center shrink-0">
                                        <h3 className="font-bold text-green-800 text-xs"><i className="fa-solid fa-school"></i> 名谷校</h3>
                                        <span className="text-[10px] font-mono bg-green-50 px-1.5 py-0.5 rounded border text-green-700">09:15 - 18:15</span>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-1.5 space-y-1">
                                        {employees.filter(e => e.type === 'full' && e.location === 'myodani').sort((a,b)=>a.num-b.num).map(emp => (
                                            <div key={emp.id} className="text-[11px] p-1.5 bg-white border rounded shadow-sm text-gray-700 font-medium">
                                                {emp.num}. {emp.name}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            
                            {/* 社員與打工管理 (固定於下方) */}
                            <div className="border rounded-lg bg-gray-50 p-2 flex flex-col flex-1 shrink-0">
                                <div className="font-bold text-gray-700 text-xs mb-2 px-1">社員とアルバイト管理</div>
                                <div className="flex gap-2 items-center mb-2 px-1 shrink-0 flex-wrap">
                                    <input type="text" placeholder="No." className="w-12 border p-1 rounded text-xs outline-none bg-white shadow-inner flex-none" />
                                    <input type="text" placeholder="氏名" className="flex-1 border p-1 rounded text-xs outline-none bg-white shadow-inner min-w-[80px]" />
                                    <select className="border p-1 rounded text-xs outline-none bg-white shadow-sm flex-none"><option>アルバイト</option><option>正社員</option></select>
                                    <select className="border p-1 rounded text-xs outline-none bg-white shadow-sm flex-none"><option>六甲</option><option>名谷</option></select>
                                    <button className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold shadow hover:bg-blue-700 flex-none transition">追加</button>
                                    <button className="bg-red-500 text-white px-3 py-1 rounded text-xs font-bold shadow hover:bg-red-600 flex-none transition">削除</button>
                                </div>
                                <div className="flex-1 overflow-y-auto bg-white border rounded p-1 shadow-inner min-h-[60px]">
                                    <ul className="space-y-1">
                                        {employees.map(emp => (
                                            <li key={emp.id} className="text-[10px] p-1 bg-gray-50 rounded flex justify-between text-gray-600 hover:bg-gray-100">
                                                <span className="font-bold">{emp.num}. {emp.name}</span>
                                                <span>{emp.type==='full'?'正社員':emp.type==='driver'?'司機':'バイト'} / {emp.location==='rokko'?'六甲':'名谷'}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </SettingPanel>

                    {/* 右上：上傳與文字貼上 */}
                    <SettingPanel title="ファイルアップロード / テキスト貼付">
                        <div className="flex flex-col h-full gap-3">
                            <div className="border-2 border-dashed border-gray-300 rounded-lg py-3 text-center bg-gray-50 hover:bg-gray-100 relative cursor-pointer transition shrink-0">
                                <i className="fa-solid fa-cloud-arrow-up text-xl text-gray-400 mb-1"></i>
                                <p className="text-[11px] text-gray-600 font-bold">シフト(Excel) / 交通費 / 打刻記録アップロード</p>
                                <input type="file" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                            </div>
                            <div className="flex-1 flex flex-col min-h-[120px]">
                                <div className="flex justify-between items-center mb-1 shrink-0">
                                    <label className="text-xs font-bold text-gray-600">打刻記録テキスト貼付</label>
                                    <button onClick={handleParseTimecardText} className="bg-blue-600 text-white text-[11px] px-3 py-1 rounded shadow-sm font-bold hover:bg-blue-700 transition">
                                        <i className="fa-solid fa-wand-magic-sparkles mr-1"></i>テキスト解析
                                    </button>
                                </div>
                                <textarea 
                                    className="w-full flex-1 border border-gray-300 rounded p-2 text-xs font-mono resize-none outline-none focus:border-blue-500 shadow-inner bg-gray-50"
                                    placeholder="例：&#10;00000646&#10;林 昊嬛&#10;&#10;入室&#10;2026/08/17 08:44..."
                                    value={timecardText}
                                    onChange={(e) => setTimecardText(e.target.value)}
                                ></textarea>
                            </div>
                        </div>
                    </SettingPanel>

                    {/* 左下：特別勤務時間 */}
                    <SettingPanel title="正社員の特別勤務時間設定">
                        <div className="flex gap-4 h-full">
                            <div className="w-1/2 flex flex-col gap-2 border-r pr-4 overflow-y-auto">
                                <div>
                                    <label className="text-[11px] text-gray-500 font-bold block mb-1">日付範囲</label>
                                    <div className="flex gap-1">
                                        <input type="date" value={specialTime.startDate} onChange={e=>setSpecialTime({...specialTime, startDate: e.target.value})} className="border p-1 text-[11px] rounded w-full bg-gray-50 outline-none" />
                                        <span className="self-center">-</span>
                                        <input type="date" value={specialTime.endDate} onChange={e=>setSpecialTime({...specialTime, endDate: e.target.value})} className="border p-1 text-[11px] rounded w-full bg-gray-50 outline-none" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[11px] text-gray-500 font-bold block mb-1">時間帯</label>
                                    <div className="flex gap-1">
                                        <input type="time" value={specialTime.start} onChange={e=>setSpecialTime({...specialTime, start: e.target.value})} className="border p-1 text-[11px] rounded w-full bg-gray-50 outline-none" />
                                        <span className="self-center">-</span>
                                        <input type="time" value={specialTime.end} onChange={e=>setSpecialTime({...specialTime, end: e.target.value})} className="border p-1 text-[11px] rounded w-full bg-gray-50 outline-none" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[11px] text-gray-500 font-bold block mb-1">理由 (例: season school)</label>
                                    <input type="text" value={specialTime.reason} onChange={e=>setSpecialTime({...specialTime, reason: e.target.value})} className="border p-1 text-[11px] rounded w-full bg-gray-50 outline-none" />
                                </div>
                                <div>
                                    <label className="text-[11px] text-gray-500 font-bold block mb-1">対象校舎・社員</label>
                                    <div className="flex gap-1">
                                        <select value={specialTime.location} onChange={e=>setSpecialTime({...specialTime, location: e.target.value, target: 'all'})} className="border p-1 text-[11px] rounded bg-gray-50 flex-none w-[70px] outline-none">
                                            <option value="rokko">六甲校</option>
                                            <option value="myodani">名谷校</option>
                                        </select>
                                        <select value={specialTime.target} onChange={e=>setSpecialTime({...specialTime, target: e.target.value})} className="border p-1 text-[11px] rounded bg-gray-50 flex-1 min-w-0 outline-none">
                                            <option value="all">【すべて】</option>
                                            {employees.filter(e => e.type === 'full' && e.location === specialTime.location).map(emp => (
                                                <option key={emp.id} value={emp.id}>{emp.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                                {/* 修復：固定在底部的按鈕 */}
                                <button onClick={handleAddSpecialTime} className="mt-3 bg-gray-800 text-white text-xs py-2 rounded hover:bg-gray-700 transition font-bold shadow-sm w-full shrink-0">
                                    追加してシフトに反映
                                </button>
                            </div>
                            <div className="w-1/2 flex flex-col">
                                <h3 className="font-bold text-gray-700 mb-2 text-xs shrink-0">設定記録</h3>
                                <div className="flex-1 overflow-y-auto">
                                    {specialRecords.length === 0 ? <p className="text-[10px] text-gray-400 italic text-center mt-4">記録なし</p> : 
                                        <ul className="space-y-2">
                                            {specialRecords.map((rec, i) => (
                                                <li key={i} className="text-[10px] p-2 bg-yellow-50 border border-yellow-200 rounded relative shadow-sm">
                                                    <div className="font-bold text-yellow-800">{rec.startDate} ~ {rec.endDate || rec.startDate}</div>
                                                    <div className="text-gray-700">{rec.start} - {rec.end}</div>
                                                    <div className="text-gray-500 truncate pr-10">{rec.reason}</div>
                                                    <span className="absolute top-1 right-1 bg-white px-1 py-0.5 rounded shadow text-[9px] font-bold">
                                                        {rec.location === 'rokko' ? '六甲' : '名谷'} : {rec.target==='all' ? '全体' : '個人'}
                                                    </span>
                                                </li>
                                            ))}
                                        </ul>
                                    }
                                </div>
                            </div>
                        </div>
                    </SettingPanel>

                    {/* 右下：Log */}
                    <SettingPanel title="システムログ">
                        <div className="bg-gray-900 font-mono text-[11px] p-3 rounded h-full overflow-y-auto shadow-inner leading-relaxed">
                            {logs.length === 0 ? <span className="text-gray-500">待命中...</span> : 
                                logs.map((log, i) => (
                                    <div key={i} className={`mb-1 ${log.includes('失敗') || log.includes('error') ? 'text-red-400' : (log.includes('成功') || log.includes('反映しました') ? 'text-green-300' : 'text-gray-300')}`}>
                                        {log}
                                    </div>
                                ))
                            }
                        </div>
                    </SettingPanel>
                </div>
            );

            // --- 畫面渲染：2. 個人報表畫面 ---
            const EmployeeReport = ({ employee, data, payMonth, periodStart, periodEnd }) => {
                // 新增：個人頁面專用的手動修改開關 (預設為 false 關閉)
                const [localEditable, setLocalEditable] = useState(false);

                const dates = [];
                let curr = periodStart;
                while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                    dates.push(curr.format('YYYY/MM/DD'));
                    curr = curr.add(1, 'day');
                }

                let workDays = 0, earlyTotal = 0, lateTotal = 0, totalTrans = 0;
                let leave1 = 0, leaveHalf = 0, leave2H = 0, absent = 0, sick = 0;
                let totalIgkA = 0, totalIgkB = 0, totalDrive = 0, totalInOutGlobal = 0;

                const handleInput = (date, field, val) => {
                    // 修改：如果系統整體鎖定，或是個人頁面手動修改未開啟，則阻擋輸入
                    if (isLocked || !localEditable) return;
                    setAttendanceData(prev => {
                        const newData = { ...prev };
                        if (!newData[employee.id]) newData[employee.id] = {};
                        if (!newData[employee.id][date]) newData[employee.id][date] = {};
                        newData[employee.id][date][field] = val;
                        return newData;
                    });
                };

                return (
                    <div className="h-full flex flex-col">
                        <div className="flex justify-between items-end mb-2 border-b border-gray-300 pb-2 shrink-0">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <span className="bg-gray-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow">{employee.num}</span>
                                {employee.name}
                            </h2>
                            <div className="flex items-center gap-2">
                                <div className="text-xs font-bold text-gray-600 tracking-wide bg-gray-100 pl-3 pr-1 py-1 rounded shadow-sm flex items-center gap-3">
                                    <span>対象月: {payMonth.replace('-', '')} | 雇用形態: {employee.type === 'full' ? '正社員' : employee.type === 'driver' ? '司機' : 'アルバイト'}</span>
                                    
                                    {/* 手動修改切換按鈕 */}
                                    <button 
                                        onClick={() => setLocalEditable(!localEditable)}
                                        disabled={isLocked}
                                        className={`px-3 py-1 rounded border shadow-sm transition-colors font-bold flex items-center gap-1.5 ${
                                            isLocked ? 'opacity-50 cursor-not-allowed bg-gray-200 text-gray-400 border-gray-300' 
                                            : localEditable ? 'bg-white text-blue-700 border-blue-400' 
                                            : 'bg-gray-400 text-white border-gray-500 hover:bg-gray-500'
                                        }`}
                                    >
                                        <i className={`fa-solid ${localEditable ? 'fa-pen-to-square' : 'fa-lock'}`}></i>
                                        {localEditable ? '手動入力 ON' : '手動入力 OFF'}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* 報表主表格 */}
                        <div className="flex-1 overflow-auto bg-white rounded shadow-sm border text-[11px]">
                            <table className="w-full text-left border-collapse whitespace-nowrap">
                                <thead className="bg-gray-100 sticky top-0 shadow-sm z-10 text-gray-700">
                                    <tr>
                                        <th className="border p-1.5 min-w-[80px]">日付</th>
                                        <th className="border p-1.5">校舎</th>
                                        <th className="border p-1.5">入室</th>
                                        <th className="border p-1.5">退室</th>
                                        <th className="border p-1.5 text-blue-800">シフト</th>
                                        <th className="border p-1.5 bg-blue-50">入退室総時間</th>
                                        <th className="border p-1.5">休憩</th>
                                        <th className="border p-1.5 bg-green-50">勤務時間</th>
                                        {employee.type === 'full' && <><th className="border p-1.5">早残業</th><th className="border p-1.5">後残業</th><th className="border p-1.5">出張費</th></>}
                                        {employee.type === 'driver' && <><th className="border p-1.5">運転時間</th><th className="border p-1.5">IGK A</th><th className="border p-1.5">IGK B</th></>}
                                        {employee.type === 'part' && <><th className="border p-1.5">IGK A</th><th className="border p-1.5">IGK B</th></>}
                                        <th className="border p-1.5 bg-yellow-50">交通費</th>
                                        <th className="border p-1.5 min-w-[120px]">備考・出勤狀況</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dates.map((date) => {
                                        const isH = isHoliday(date);
                                        const dayData = data[date] || {};
                                        // 只要有打卡 或 有設定シフト，就算該日有紀錄要顯示
                                        const hasData = !!(dayData.in || dayData.out);
                                        
                                        if (hasData) workDays++;
                                        if (dayData.leaveType === '有休(1日)') leave1++;
                                        if (dayData.leaveType === '有休(半日)') leaveHalf++;
                                        if (dayData.leaveType === '有休(2時間)') leave2H++;
                                        if (dayData.leaveType === '事欠') absent++;
                                        if (dayData.leaveType === '病欠') sick++;

                                        const inOutMins = calculateMinutes(dayData.in, dayData.out);
                                        totalInOutGlobal += inOutMins;

                                        let breakMins = hasData ? (employee.type === 'full' ? 60 : (dayData.break || 0)) : 0;
                                        const workMins = Math.max(0, inOutMins - breakMins);
                                        
                                        let early = 0, late = 0;
                                        if (employee.type === 'full' && hasData && dayData.shiftStart && dayData.shiftEnd) {
                                            early = Math.max(0, calculateMinutes(dayData.in, dayData.shiftStart));
                                            late = Math.max(0, calculateMinutes(dayData.shiftEnd, dayData.out));
                                            earlyTotal += early;
                                            lateTotal += late;
                                        }

                                        let drive = 0, igkA = parseInt(dayData.igkA || 0), igkB = 0;
                                        if (employee.type === 'driver' && hasData) {
                                            drive = parseInt(dayData.driveMins || 0);
                                            igkB = Math.max(0, workMins - drive);
                                            totalDrive += drive;
                                        } else if (employee.type === 'part' && hasData) {
                                            igkB = Math.max(0, workMins - igkA);
                                        }
                                        totalIgkA += igkA;
                                        totalIgkB += igkB;
                                        
                                        const transFee = parseInt(dayData.transFee) || 0;
                                        totalTrans += transFee;

                                        let rowClass = "hover:bg-gray-50 border-b transition-colors ";
                                        if (isH) rowClass += "holiday-row holiday-text ";
                                        if (!hasData && !isH && employee.type === 'full') rowClass += "absent-row ";

                                        return (
                                            <tr key={date} className={rowClass}>
                                                <td className="border p-1.5">{dayjs(date).format('MM/DD')}({['日','月','火','水','木','金','土'][dayjs(date).day()]})</td>
                                                <td className="border p-1.5 text-center">
                                                    <select disabled={isLocked || !localEditable} className="bg-transparent text-[10px] outline-none" value={dayData.location || employee.location} onChange={e=>handleInput(date,'location',e.target.value)}>
                                                        <option value="rokko">六甲</option><option value="myodani">名谷</option>
                                                    </select>
                                                </td>
                                                <td className="border p-1.5 text-center">{dayData.in}</td>
                                                <td className="border p-1.5 text-center">{dayData.out}</td>
                                                
                                                <td className="border p-1.5 text-center text-blue-600 font-bold bg-blue-50/20">{dayData.shiftStart ? `${dayData.shiftStart}-${dayData.shiftEnd}` : ''}</td>
                                                
                                                <td className="border p-1.5 text-center font-bold text-gray-700 bg-blue-50">{inOutMins > 0 ? (inOutMins/60).toFixed(2) : ''}</td>
                                                <td className="border p-1.5 text-center">{hasData ? breakMins : ''}</td>
                                                <td className="border p-1.5 text-center font-bold text-green-700 bg-green-50">{workMins > 0 ? (workMins/60).toFixed(2) : ''}</td>
                                                
                                                {employee.type === 'full' && <>
                                                    <td className="border p-1.5 text-right text-orange-500">{early > 0 ? early : ''}</td>
                                                    <td className="border p-1.5 text-right text-orange-500">{late > 0 ? late : ''}</td>
                                                    <td className="border p-1.5 text-center"></td>
                                                </>}
                                                {employee.type === 'driver' && <>
                                                    <td className="border p-1.5 text-center"><input disabled={isLocked || !localEditable} className="w-10 text-center border outline-none rounded" value={dayData.driveMins || ''} onChange={e=>handleInput(date,'driveMins',e.target.value)} /></td>
                                                    <td className="border p-1.5 text-center">{igkA > 0 ? igkA : ''}</td>
                                                    <td className="border p-1.5 text-center font-bold text-blue-600">{igkB > 0 ? igkB : ''}</td>
                                                </>}
                                                {employee.type === 'part' && <>
                                                    <td className="border p-1.5 text-center"><input disabled={isLocked || !localEditable} className="w-10 text-center border outline-none rounded" value={dayData.igkA || ''} onChange={e=>handleInput(date,'igkA',e.target.value)} /></td>
                                                    <td className="border p-1.5 text-center font-bold text-blue-600">{igkB > 0 ? igkB : ''}</td>
                                                </>}
                                                <td className="border p-1 bg-yellow-50"><input disabled={isLocked || !localEditable} className="w-full text-right border outline-none px-1 bg-transparent" value={dayData.transFee || ''} onChange={e=>handleInput(date,'transFee',e.target.value)} /></td>
                                                <td className="border p-1">
                                                    <div className="flex gap-1 items-center">
                                                        {employee.type === 'full' && !hasData && !isH && (
                                                            <select disabled={isLocked || !localEditable} className="text-[10px] border p-0.5 outline-none rounded bg-white shadow-sm text-purple-700" value={dayData.leaveType||''} onChange={e=>handleInput(date,'leaveType',e.target.value)}>
                                                                <option value="">-</option><option value="有休(1日)">有休(1日)</option><option value="有休(半日)">有休(半日)</option><option value="有休(2時間)">有休(2h)</option><option value="事欠">事欠</option><option value="病欠">病欠</option>
                                                            </select>
                                                        )}
                                                        <input disabled={isLocked || !localEditable} type="text" className="border-none bg-transparent w-full text-[10px] focus:ring-0 outline-none" placeholder="備註..." value={dayData.remark || ''} onChange={e => handleInput(date, 'remark', e.target.value)} />
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        {/* 底層統計圖表 */}
                        <div className="mt-3 border-t pt-3 shrink-0">
                            <div className="flex gap-3 flex-wrap items-stretch mb-2">
                                <div className="bg-white rounded-lg p-3 flex gap-4 shadow-sm border border-gray-200 min-w-[180px]">
                                    <div className="text-center border-r pr-4">
                                        <div className="text-[10px] text-gray-500 font-bold mb-1">出勤日数</div>
                                        <div className="text-2xl font-black text-gray-800">{workDays} <span className="text-xs font-normal text-gray-500">日</span></div>
                                    </div>
                                    <div className="flex flex-col gap-1 text-[11px] text-gray-600 font-medium justify-center">
                                        <div className="flex justify-between w-24"><span>有休</span><span>{(leave1 + leaveHalf*0.5 + leave2H*0.25).toFixed(1)} 日</span></div>
                                        <div className="flex justify-between border-t pt-1"><span>事欠</span><span>{absent} 日</span></div>
                                        <div className="flex justify-between border-t pt-1"><span>病欠</span><span>{sick} 日</span></div>
                                    </div>
                                </div>

                                {employee.type === 'full' && (
                                    <>
                                        <div className="bg-orange-50 rounded-lg p-3 text-center shadow-sm border border-orange-100 flex-1 min-w-[80px]">
                                            <div className="text-[10px] text-orange-700 font-bold mb-1">早残業</div>
                                            <div className="text-xl font-black text-orange-600">{earlyTotal} <span className="text-[10px] font-normal text-orange-400">分</span></div>
                                        </div>
                                        <div className="bg-orange-50 rounded-lg p-3 text-center shadow-sm border border-orange-100 flex-1 min-w-[80px]">
                                            <div className="text-[10px] text-orange-700 font-bold mb-1">後残業</div>
                                            <div className="text-xl font-black text-orange-600">{lateTotal} <span className="text-[10px] font-normal text-orange-400">分</span></div>
                                        </div>
                                        <div className="bg-red-50 rounded-lg p-3 text-center shadow-sm border border-red-100 flex-[1.5] min-w-[130px]">
                                            <div className="text-[10px] text-red-700 font-bold mb-1">残業合計 (早+後)</div>
                                            <div className="text-xl font-black text-red-600">
                                                {earlyTotal+lateTotal} <span className="text-[10px] font-normal text-red-400 mr-1">分</span> 
                                                <span className="text-[11px] font-normal text-red-400">({((earlyTotal+lateTotal)/60).toFixed(2)} H)</span>
                                            </div>
                                        </div>
                                    </>
                                )}
                                
                                {employee.type === 'part' && (
                                    <>
                                        <div className="bg-pink-50 rounded-lg p-3 text-center shadow-sm border border-pink-100 flex-1 min-w-[100px]"><div className="text-[10px] text-pink-600 font-bold mb-1">IGK A 合計</div><div className="text-xl font-black text-pink-600">{formatHM(totalIgkA)} <span className="text-[10px] font-normal ml-1 text-pink-400">({(totalIgkA/60).toFixed(2)} H)</span></div></div>
                                        <div className="bg-blue-50 rounded-lg p-3 text-center shadow-sm border border-blue-100 flex-1 min-w-[100px]"><div className="text-[10px] text-blue-600 font-bold mb-1">IGK B 合計</div><div className="text-xl font-black text-blue-600">{formatHM(totalIgkB)} <span className="text-[10px] font-normal ml-1 text-blue-400">({(totalIgkB/60).toFixed(2)} H)</span></div></div>
                                        <div className="bg-indigo-50 rounded-lg p-3 text-center shadow-sm border border-indigo-100 flex-[1.2] min-w-[120px]"><div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div><div className="text-xl font-black text-indigo-700">{formatHM(totalIgkA+totalIgkB)} <span className="text-[10px] font-normal ml-1 text-indigo-400">({((totalIgkA+totalIgkB)/60).toFixed(2)} H)</span></div></div>
                                    </>
                                )}

                                {employee.type === 'driver' && (
                                    <>
                                        <div className="bg-yellow-50 rounded-lg p-3 text-center shadow-sm border border-yellow-100 flex-1 min-w-[100px]"><div className="text-[10px] text-yellow-700 font-bold mb-1">運転実績</div><div className="text-xl font-black text-yellow-700">{formatHM(totalDrive)} <span className="text-[10px] font-normal ml-1 text-yellow-500">({(totalDrive/60).toFixed(2)} H)</span></div></div>
                                        <div className="bg-pink-50 rounded-lg p-3 text-center shadow-sm border border-pink-100 flex-1 min-w-[80px]"><div className="text-[10px] text-pink-600 font-bold mb-1">IGK A 合計</div><div className="text-xl font-black text-pink-600">{formatHM(totalIgkA)}</div></div>
                                        <div className="bg-blue-50 rounded-lg p-3 text-center shadow-sm border border-blue-100 flex-1 min-w-[80px]"><div className="text-[10px] text-blue-600 font-bold mb-1">IGK B 合計</div><div className="text-xl font-black text-blue-600">{formatHM(totalIgkB)}</div></div>
                                        <div className="bg-indigo-50 rounded-lg p-3 text-center shadow-sm border border-indigo-100 flex-[1.2] min-w-[120px]"><div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div><div className="text-xl font-black text-indigo-700">{formatHM(totalDrive+totalIgkA+totalIgkB)} <span className="text-[10px] font-normal ml-1 text-indigo-400">({((totalDrive+totalIgkA+totalIgkB)/60).toFixed(2)} H)</span></div></div>
                                    </>
                                )}
                                
                                <div className="bg-gray-100 rounded-lg p-3 text-center shadow-sm border border-gray-200 flex-none min-w-[120px]">
                                    <div className="text-[10px] text-gray-600 font-bold mb-1">入退室総時間</div>
                                    <div className="text-xl font-black text-gray-700">{formatHM(totalInOutGlobal)} <span className="text-[10px] font-normal ml-1 text-gray-400">({(totalInOutGlobal/60).toFixed(2)}H)</span></div>
                                </div>
                            </div>

                            {employee.type === 'full' && (
                                <div className="bg-blue-50/50 rounded-lg p-2 px-4 flex justify-between items-center shadow-sm border border-blue-100">
                                    <span className="text-blue-800 font-bold text-xs"><i className="fa-solid fa-train-subway mr-2"></i>交通費 (手動入力合計)</span>
                                    <div className="font-black text-xl text-gray-800">{totalTrans.toLocaleString()} <span className="text-xs font-bold text-gray-500">円</span></div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const renderReportsScreen = () => {
                const payDateObj = dayjs(`${payMonth}-01`);
                const periodStart = payDateObj.subtract(2, 'month').date(16);
                const periodEnd = payDateObj.subtract(1, 'month').date(15);
                
                const locEmployees = employees.filter(e => e.location === activeLocation).sort((a,b) => a.num - b.num);
                const activeEmployee = employees.find(e => e.id === activeEmployeeId);

                const switchLocation = (loc) => {
                    setActiveLocation(loc);
                    const firstEmp = employees.filter(e => e.location === loc).sort((a,b)=>a.num - b.num)[0];
                    if(firstEmp) setActiveEmployeeId(firstEmp.id);
                }

                return (
                    <div className="flex flex-col h-[calc(100vh-60px)]">
                        <div className="flex justify-between items-end mb-2 px-4 mt-2 shrink-0">
                            <div className="flex gap-2">
                                <button onClick={() => switchLocation('rokko')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'rokko' ? 'bg-white text-blue-600 border-t-4 border-blue-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)]' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>六甲校 (Rokko)</button>
                                <button onClick={() => switchLocation('myodani')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'myodani' ? 'bg-white text-green-600 border-t-4 border-green-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)]' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>名谷校 (Myodani)</button>
                            </div>
                            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-gray-200 mb-0.5">
                                <span className="text-gray-600 font-bold text-xs"><i className="fa-regular fa-calendar-check text-blue-500 mr-1"></i> 給与支給月:</span>
                                <input type="month" value={payMonth} onChange={(e) => setPayMonth(e.target.value)} className="border rounded bg-gray-50 px-1 text-xs outline-none font-bold focus:border-blue-400" />
                                <span className="text-[10px] text-gray-400 font-medium">(対象: {periodStart.format('MM/DD')}-{periodEnd.format('MM/DD')})</span>
                            </div>
                        </div>
                        <div className="flex flex-1 bg-white rounded-lg shadow-sm border mx-4 mb-4 overflow-hidden">
                            <div className="w-[140px] bg-gray-50 border-r overflow-y-auto pt-2 gap-1 flex flex-col shrink-0 pb-6">
                                {locEmployees.map(emp => (
                                    <button key={emp.id} onClick={() => setActiveEmployeeId(emp.id)} className={`text-left px-2 py-2 mx-2 rounded-lg text-xs font-bold flex items-center gap-2 truncate transition ${activeEmployeeId === emp.id ? 'bg-white shadow transform scale-[1.02] z-10 tab-color-' + ((emp.num%5)+1) : 'text-gray-500 hover:bg-gray-200'}`}>
                                        <span className={`w-5 h-5 flex items-center justify-center rounded-full text-[9px] text-white flex-none shadow-sm ${emp.type === 'full' ? 'bg-blue-500' : emp.type === 'driver' ? 'bg-purple-500' : 'bg-gray-400'}`}>{emp.num}</span>
                                        <span className="truncate">{emp.name}</span>
                                    </button>
                                ))}
                            </div>
                            <div className={`flex-1 p-4 overflow-hidden ${isLocked ? 'locked-overlay' : ''}`}>
                                {/* 加入 key 屬性，確保切換員工時強制重置手動修改按鈕的狀態 */}
                                {activeEmployee ? <EmployeeReport key={activeEmployee.id} employee={activeEmployee} data={attendanceData[activeEmployee.id] || {}} payMonth={payMonth} periodStart={periodStart} periodEnd={periodEnd} /> : null}
                            </div>
                        </div>
                    </div>
                );
            };

            // 讀取中的畫面防護
            if (!isCloudLoaded) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-[#f3f4f6] font-sans">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
                        <h2 className="text-xl font-black text-gray-700">☁️ クラウドデータを読み込み中...</h2>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col overflow-hidden bg-[#eef2f6]">
                    <header className="bg-white shadow-sm border-b px-6 py-2 flex justify-between items-center shrink-0 z-20 h-[60px]">
                        <div className="flex items-center gap-6">
                            <h1 className="text-xl font-black text-gray-800 tracking-tight flex items-center gap-2">
                                <i className="fa-solid fa-file-invoice-dollar text-blue-600"></i> IGK
                            </h1>
                            <nav className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setCurrentView('setup')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${currentView === 'setup' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}>システム設定と取込</button>
                                <button onClick={() => setCurrentView('reports')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${currentView === 'reports' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}>個人別明細</button>
                            </nav>
                        </div>
                        <div className="flex items-center gap-3">
                            <button className="bg-green-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-green-700 transition"><i className="fa-solid fa-file-excel mr-1"></i> 出力</button>
                            
                            {/* ★ 8. 上鎖/解鎖按鈕綁定 */}
                            <button onClick={handleToggleLock} className={`px-4 py-1.5 rounded-lg text-xs font-bold shadow transition ${isLocked ? 'bg-red-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                                <i className={`fa-solid ${isLocked ? 'fa-lock' : 'fa-lock-open'} mr-1`}></i> {isLocked ? 'ロック中 (編集不可)' : '編集可能'}
                            </button>
                        </div>
                    </header>
                    <main className="flex-1 overflow-hidden">{currentView === 'setup' ? renderSetupScreen() : renderReportsScreen()}</main>
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
