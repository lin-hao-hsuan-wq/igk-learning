<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGK Attendance System - 雙校區切換版 (含交通費)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body className="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- 核心資料：人員名單與別名 ---
        const EMPLOYEES = [
            // 六甲校 - 正社員
            { id: 'r1', name: 'Minori', aliases: ['葛野みのり', '葛野 みのり', 'みのり', 'Minori'], type: 'full', location: 'rokko' },
            { id: 'r2', name: 'Yassmyn', aliases: ['ヤスミン', 'Ratu Yassmyn Khairussalima', 'Yassmyn'], type: 'full', location: 'rokko' },
            { id: 'r3', name: 'Yoon', aliases: ['ユン', 'Yoon Honey Aung', 'Yoon'], type: 'full', location: 'rokko' },
            { id: 'r4', name: 'Koukei', aliases: ['林昊嬛', '林 昊嬛', '林'], type: 'full', location: 'rokko' },
            // 六甲校 - アルバイト
            { id: 'r5', name: 'Mikuma', aliases: ['実熊', 'みくま', '實熊功光', '實熊 功光', '実熊功光'], type: 'part', location: 'rokko' },
            { id: 'r6', name: 'Taka', aliases: ['上山', 'たか', '上山貴行', '上山 貴行'], type: 'part', location: 'rokko' },
            { id: 'r7', name: 'Fergus', aliases: ['ファーガス'], type: 'part', location: 'rokko' },
            { id: 'r8', name: 'Sammy', aliases: ['サミー', 'Sammy Abukmeil'], type: 'part', location: 'rokko' },
            { id: 'r9', name: 'Kim Nakyung', aliases: ['キム', 'Kim', 'Nakyung'], type: 'part', location: 'rokko' },
            { id: 'r10', name: 'Nathan', aliases: ['ネイサン', 'Nathan Morrison'], type: 'part', location: 'rokko' },
            { id: 'r11', name: 'Mariko', aliases: ['マリコ', 'まりこ', '沼田真里子', '沼田 真里子'], type: 'part', location: 'rokko' },
            { id: 'r12', name: 'Ando', aliases: ['安藤', 'あんどう', '安藤佑也', '安藤 佑也'], type: 'part', location: 'rokko' },
            { id: 'r13', name: 'Misato', aliases: ['ミサト', 'みさと'], type: 'part', location: 'rokko' },
            { id: 'r14', name: 'Nao', aliases: ['ナオ', 'なお'], type: 'part', location: 'rokko' },
            { id: 'r15', name: '金栄美', aliases: ['kim eimi', 'eimi', '金'], type: 'part', location: 'rokko' },
            { id: 'r16', name: '角田紀子', aliases: ['角田', 'つのだ'], type: 'part', location: 'rokko' },
            
            // 名谷校 - 正社員
            { id: 'm1', name: '加藤友梨', aliases: ['加藤', 'かとう'], type: 'full', location: 'myodani' },
            { id: 'm2', name: 'Linh', aliases: ['リン'], type: 'full', location: 'myodani' },
            // 名谷校 - アルバイト
            { id: 'm3', name: '大津真里', aliases: ['大津', 'おおつ'], type: 'part', location: 'myodani' },
            { id: 'm4', name: '馬場亜希', aliases: ['馬場', 'ばば'], type: 'part', location: 'myodani' },
            { id: 'm5', name: '篠崎', aliases: ['しのざき'], type: 'part', location: 'myodani' },
            { id: 'm6', name: '吉野', aliases: ['よしの'], type: 'part', location: 'myodani' },
            { id: 'm7', name: '森', aliases: ['もり'], type: 'part', location: 'myodani' },
            { id: 'm8', name: 'Ugiloy', aliases: ['ウギロイ'], type: 'part', location: 'myodani' },
            { id: 'm9', name: 'Hamna', aliases: ['ハムナ'], type: 'part', location: 'myodani' },
            { id: 'm10', name: 'タプリヒン', aliases: [], type: 'part', location: 'myodani' },
            { id: 'm11', name: 'Sadia', aliases: ['サディア'], type: 'part', location: 'myodani' },
            { id: 'm12', name: 'Monika', aliases: ['モニカ'], type: 'part', location: 'myodani' },
            { id: 'm13', name: '中嶋莉真', aliases: ['中嶋', 'なかじま'], type: 'part', location: 'myodani' },
            { id: 'm14', name: '顕谷ユタカ', aliases: ['顕谷', 'あきたに'], type: 'part', location: 'myodani' },
            { id: 'm15', name: 'Mozelle', aliases: ['Mozelle Bargamin', 'モゼル'], type: 'part', location: 'myodani' }
        ];

        const TAB_COLORS = [
            'bg-pink-100 text-pink-700 border-pink-200', 'bg-blue-100 text-blue-700 border-blue-200',
            'bg-emerald-100 text-emerald-700 border-emerald-200', 'bg-purple-100 text-purple-700 border-purple-200',
            'bg-orange-100 text-orange-700 border-orange-200', 'bg-teal-100 text-teal-700 border-teal-200',
        ];

        const timeToMins = (t) => {
            if (!t || typeof t !== 'string') return 0;
            const [h, m] = t.split(':').map(Number);
            return (h * 60) + (isNaN(m) ? 0 : m);
        };
        const minsToTime = (m) => {
            if (m === null || m === undefined || isNaN(m) || m <= 0) return '';
            return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        };

        function App() {
            const [activePage, setActivePage] = useState('import'); 
            const [activeLocation, setActiveLocation] = useState('rokko'); 
            
            const today = new Date();
            let initM = today.getDate() >= 16 ? today.getMonth() + 2 : today.getMonth() + 1;
            let initY = today.getFullYear();
            if (initM > 12) { initM -= 12; initY += 1; }
            const [period, setPeriod] = useState(`${initY}-${String(initM).padStart(2, '0')}`);
            
            const [settings, setSettings] = useState({ baseStart: '09:30', baseEnd: '18:30', special: [] });
            const [newSp, setNewSp] = useState({ name: '', start: '', end: '', timeIn: '09:30', timeOut: '18:30' });

            const [pastedData, setPastedData] = useState('');
            const [attendance, setAttendance] = useState({}); 
            
            // ★ 新增：儲存每個員工每個月的手動交通費
            const [monthlyData, setMonthlyData] = useState({}); 

            const [activeEmp, setActiveEmp] = useState('r1'); 

            const dates = useMemo(() => {
                if (!period || !period.includes('-')) return [];
                const [y, m] = period.split('-').map(Number);
                if (isNaN(y) || isNaN(m)) return [];
                const start = new Date(y, m - 2, 16);
                const end = new Date(y, m - 1, 15);
                let arr = [];
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    arr.push(new Date(d));
                }
                return arr;
            }, [period]);

            const dKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const formatDisplayDate = (d) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                return `${d.getMonth() + 1}/${d.getDate()} (${days[d.getDay()]})`;
            };
            const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;

            const handlePaste = () => {
                if (!pastedData.trim()) return alert("打刻資料");
                let newData = JSON.parse(JSON.stringify(attendance)); 
                const text = pastedData.toLowerCase();
                const timeRegex = /(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?[\s\n]*(\d{1,2})[:：](\d{2})/g;
                let match;
                let count = 0;
                let autoPeriod = null;
                let lastEmpLoc = null;

                while ((match = timeRegex.exec(text)) !== null) {
                    const month = match[1], day = match[2], hr = match[3], min = match[4];
                    const timeStr = `${hr.padStart(2,'0')}:${min.padStart(2,'0')}`;
                    const idx = match.index;
                    const context = text.substring(Math.max(0, idx - 150), idx + 50);
                    
                    let foundEmpId = null;
                    for (let emp of EMPLOYEES) {
                        const names = [emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/\s/g,''))];
                        if (names.some(n => context.replace(/\s/g,'').includes(n))) {
                            foundEmpId = emp.id;
                            lastEmpLoc = emp.location; 
                            break;
                        }
                    }

                    if (foundEmpId) {
                        const y = new Date().getFullYear(); 
                        const dateObj = new Date(y, parseInt(month)-1, parseInt(day));
                        const key = dKey(dateObj);
                        
                        if (!autoPeriod) {
                            let tmpy = dateObj.getFullYear();
                            let tmpm = dateObj.getDate() >= 16 ? dateObj.getMonth() + 2 : dateObj.getMonth() + 1;
                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                        }

                        let type = (context.includes('退') || context.includes('out')) ? 'outTime' : 'inTime';
                        if (!newData[foundEmpId]) newData[foundEmpId] = {};
                        if (!newData[foundEmpId][key]) newData[foundEmpId][key] = {};
                        newData[foundEmpId][key][type] = timeStr;
                        count++;
                    }
                }
                
                if (count > 0) {
                    setAttendance(newData);
                    setPastedData('');
                    if (autoPeriod) setPeriod(autoPeriod);
                    if (lastEmpLoc) setActiveLocation(lastEmpLoc); 
                    setActivePage('preview');
                    alert(` ${count} 打刻データアップデートできた`);
                } else {
                    alert("お疲れ様です。もう一度確認お願いします。");
                }
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let newData = JSON.parse(JSON.stringify(attendance));
                        let count = 0;
                        let autoPeriod = null;

                        const extractTime = (val) => {
                            if (!val) return null;
                            if (val.text) {
                                const m = val.text.match(/(\d{1,2})[:：](\d{2})/);
                                if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
                            }
                            let v = val.value;
                            if (v && v.result !== undefined) v = v.result;
                            if (v instanceof Date) return `${String(v.getUTCHours()).padStart(2,'0')}:${String(v.getUTCMinutes()).padStart(2,'0')}`;
                            if (typeof v === 'number' && v >= 0 && v < 1) {
                                let tm = Math.round(v * 24 * 60);
                                return `${String(Math.floor(tm/60)).padStart(2,'0')}:${String(tm%60).padStart(2,'0')}`;
                            }
                            if (typeof v === 'string') {
                                const m = v.match(/(\d{1,2})[:：](\d{2})/);
                                if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
                            }
                            return null;
                        };

                        wb.worksheets.forEach(ws => {
                            let currentDates = {}; 
                            let currentColMap = {};

                            for (let r = 1; r <= ws.rowCount; r++) {
                                for (let c = 1; c <= 10; c++) {
                                    let t = (ws.getCell(r, c).text || '').replace(/\s+/g, '');
                                    const m = t.match(/(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?/);
                                    if (m) {
                                        let y = new Date().getFullYear();
                                        const yMatch = t.match(/(20\d{2})/); if (yMatch) y = parseInt(yMatch[1]);
                                        let dObj = new Date(y, parseInt(m[1])-1, parseInt(m[2]));
                                        currentDates[r] = { key: dKey(dObj), obj: dObj };
                                        break;
                                    }
                                }

                                let matches = 0;
                                let tempMap = {};
                                for (let c = 1; c <= 40; c++) {
                                    let v = (ws.getCell(r, c).text || '').toLowerCase().replace(/\s+/g, '');
                                    if (v.length >= 1) {
                                        for (const emp of EMPLOYEES) {
                                            let s = [emp.name.toLowerCase().replace(/\s+/g, ''), ...emp.aliases.map(a => a.toLowerCase().replace(/\s+/g, ''))];
                                            if (s.includes(v) || s.some(name => v.includes(name) && name.length >= 2)) {
                                                tempMap[c] = emp.id; matches++; break;
                                            }
                                        }
                                    }
                                }
                                if (matches >= 2) currentColMap = tempMap;

                                let activeDateRow = Object.keys(currentDates).reverse().find(dr => r >= parseInt(dr));
                                if (activeDateRow && Object.keys(currentColMap).length > 0) {
                                    let dateInfo = currentDates[activeDateRow];
                                    let rowTimeStr = extractTime(ws.getCell(r, 1)) || extractTime(ws.getCell(r, 2));
                                    
                                    if (rowTimeStr) {
                                        let rowMins = timeToMins(rowTimeStr);
                                        if (!autoPeriod) {
                                            let tmpy = dateInfo.obj.getFullYear();
                                            let tmpm = dateInfo.obj.getDate() >= 16 ? dateInfo.obj.getMonth() + 2 : dateInfo.obj.getMonth() + 1;
                                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                                        }

                                        Object.keys(currentColMap).forEach(c => {
                                            const empId = currentColMap[c];
                                            let actCell = ws.getCell(r, parseInt(c));
                                            if (actCell.isMerged) actCell = ws.getCell(actCell.master.address);
                                            
                                            let hasContent = (actCell.text || '').trim().length > 0;
                                            let isColored = false;
                                            if (actCell.fill && actCell.fill.type === 'pattern' && actCell.fill.pattern !== 'none') {
                                                let hex = (actCell.fill.fgColor?.argb || actCell.fill.bgColor?.argb || '').toUpperCase();
                                                if (hex && !['FFFFFFFF', '00000000', 'FF000000', '00FFFFFF'].includes(hex)) isColored = true;
                                            }

                                            if (hasContent || isColored) {
                                                if (!newData[empId]) newData[empId] = {};
                                                if (!newData[empId][dateInfo.key]) newData[empId][dateInfo.key] = {};
                                                
                                                let curIn = timeToMins(newData[empId][dateInfo.key].shiftIn || '23:59');
                                                let curOut = timeToMins(newData[empId][dateInfo.key].shiftOut || '00:00');
                                                
                                                if (rowMins < curIn) newData[empId][dateInfo.key].shiftIn = minsToTime(rowMins);
                                                if (rowMins + 30 > curOut) newData[empId][dateInfo.key].shiftOut = minsToTime(rowMins + 30);
                                                count++;
                                            }
                                        });
                                    }
                                }
                            }
                        });

                        if (count > 0) {
                            setAttendance(newData);
                            if (autoPeriod) setPeriod(autoPeriod);
                            setActivePage('preview');
                            alert(`読み込みました ${count} 個時段區塊！已切換至對應月份。`);
                        } else {
                            alert("読み込みましたが、みつけません。");
                        }
                    } catch (err) {
                        alert(`❌ Excel エラー: ${err.message}`);
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const updateCell = (id, d, field, val) => {
                setAttendance(prev => ({
                    ...prev, [id]: { ...prev[id], [d]: { ...prev[id]?.[d], [field]: val } }
                }));
            };

            const updateMonthlyData = (id, p, field, val) => {
                const key = `${id}_${p}`;
                setMonthlyData(prev => ({
                    ...prev, [key]: { ...prev[key], [field]: val }
                }));
            };

            const calculateRow = (date, row, emp) => {
                const isWknd = isWeekend(date);
                let inTime = row.inTime || '';
                let outTime = row.outTime || '';
                let shiftIn = row.shiftIn || '';
                let shiftOut = row.shiftOut || '';
                let leave = row.leave || '';
                let igka = row.igka || '';

                if (emp.type === 'full') {
                    shiftIn = shiftIn || settings.baseStart;
                    shiftOut = shiftOut || settings.baseEnd;
                    settings.special.forEach(sp => {
                        if (new Date(date) >= new Date(sp.start) && new Date(date) <= new Date(sp.end)) {
                            shiftIn = sp.timeIn; shiftOut = sp.timeOut;
                        }
                    });
                }

                let actualShiftIn = shiftIn;
                if (inTime && shiftIn) {
                    const inM = timeToMins(inTime);
                    const sInM = timeToMins(shiftIn);
                    if (inM > sInM && inM <= sInM + 4) actualShiftIn = minsToTime(sInM + 5);
                    else if (inM > sInM + 4) actualShiftIn = minsToTime(Math.ceil(inM / 5) * 5);
                }

                let earlyOtMins = 0, lateOtMins = 0;
                if (emp.type === 'full' && !leave) {
                    if (inTime && shiftIn) {
                        let diff = timeToMins(shiftIn) - timeToMins(inTime);
                        if (diff > 0) earlyOtMins = diff;
                    }
                    if (outTime && shiftOut) {
                        let diff = timeToMins(outTime) - timeToMins(shiftOut);
                        if (diff > 0) lateOtMins = diff;
                    }
                }

                let totalWorkMins = 0;
                if (inTime && outTime) {
                    totalWorkMins = timeToMins(outTime) - timeToMins(actualShiftIn);
                    if (totalWorkMins < 0) totalWorkMins = 0;
                } else if (shiftIn && shiftOut && emp.type === 'full' && !leave) {
                    totalWorkMins = timeToMins(shiftOut) - timeToMins(shiftIn);
                }

                const igkaMins = timeToMins(igka);
                const igkbMins = Math.max(0, totalWorkMins - igkaMins);

                return { isWknd, actualShiftIn, shiftOut, earlyOtMins, lateOtMins, totalWorkMins, igkaMins, igkbMins };
            };

            const switchLocation = (loc) => {
                setActiveLocation(loc);
                const firstEmp = EMPLOYEES.find(e => e.location === loc);
                if (firstEmp) setActiveEmp(firstEmp.id);
            };

            const currentEmployees = EMPLOYEES.filter(e => e.location === activeLocation);
            const currentEmp = currentEmployees.find(e => e.id === activeEmp) || currentEmployees[0];

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <div className="bg-slate-800 text-white p-4 flex gap-4 print:hidden shadow-md items-center">
                        <h1 className="text-xl font-bold mr-4 tracking-wider">IGK 勤怠</h1>
                        <button onClick={() => setActivePage('import')} className={`px-4 py-1.5 rounded-lg font-bold transition-colors ${activePage === 'import' ? 'bg-indigo-500 text-white shadow' : 'text-gray-300 hover:bg-slate-700'}`}>① 資料指揮中心</button>
                        <button onClick={() => setActivePage('preview')} className={`px-4 py-1.5 rounded-lg font-bold transition-colors ${activePage === 'preview' ? 'bg-emerald-500 text-white shadow' : 'text-gray-300 hover:bg-slate-700'}`}>② 個人勤務表</button>
                    </div>

                    {activePage === 'import' && (
                        <div className="p-6 max-w-5xl mx-auto space-y-6 w-full animate-fadeIn">
                            <div className="bg-white p-6 rounded-xl shadow border-t-4 border-indigo-500">
                                <h2 className="text-lg font-bold text-indigo-900 mb-4">正社員勤務＆特別期間設定</h2>
                                <div className="flex gap-4 mb-4">
                                    <div><label className="block text-xs font-bold text-gray-500 mb-1">預設入室</label><input type="time" value={settings.baseStart} onChange={e=>setSettings({...settings, baseStart: e.target.value})} className="border border-gray-300 rounded-lg p-2 font-bold outline-none focus:border-indigo-500"/></div>
                                    <div><label className="block text-xs font-bold text-gray-500 mb-1">預設退室</label><input type="time" value={settings.baseEnd} onChange={e=>setSettings({...settings, baseEnd: e.target.value})} className="border border-gray-300 rounded-lg p-2 font-bold outline-none focus:border-indigo-500"/></div>
                                </div>
                                <div className="bg-indigo-50 p-4 rounded-xl flex flex-wrap gap-3 items-end border border-indigo-100">
                                    <input type="text" placeholder="原因 (如 Summer school)" value={newSp.name} onChange={e=>setNewSp({...newSp, name: e.target.value})} className="border border-gray-300 rounded-lg p-2 flex-1 min-w-[200px] outline-none"/>
                                    <input type="date" value={newSp.start} onChange={e=>setNewSp({...newSp, start: e.target.value})} className="border border-gray-300 rounded-lg p-2 outline-none"/>
                                    <span className="text-indigo-300 font-bold mb-2">~</span>
                                    <input type="date" value={newSp.end} onChange={e=>setNewSp({...newSp, end: e.target.value})} className="border border-gray-300 rounded-lg p-2 outline-none"/>
                                    <input type="time" value={newSp.timeIn} onChange={e=>setNewSp({...newSp, timeIn: e.target.value})} className="border border-gray-300 rounded-lg p-2 w-28 outline-none"/>
                                    <input type="time" value={newSp.timeOut} onChange={e=>setNewSp({...newSp, timeOut: e.target.value})} className="border border-gray-300 rounded-lg p-2 w-28 outline-none"/>
                                    <button onClick={() => { if(newSp.name){ setSettings(s => ({...s, special: [...(s.special||[]), newSp]})); setNewSp({name:'',start:'',end:'',timeIn:'09:30',timeOut:'18:30'}); } }} className="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-indigo-700 shadow-md">新增</button>
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border-t-4 border-emerald-500">
                                <h2 className="text-lg font-bold text-emerald-900 mb-2">打刻データコピペ</h2>
                                <p className="text-xs text-gray-500 mb-3">コピペで自動判別。</p>
                                <textarea value={pastedData} onChange={e=>setPastedData(e.target.value)} className="w-full h-40 border border-gray-300 rounded-xl p-4 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all shadow-inner" placeholder="貼上打卡紀錄..."></textarea>
                                <button onClick={handlePaste} className="mt-3 bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold w-full hover:bg-emerald-700 transition-colors shadow-md">解析並匯入打卡資料</button>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
                                <h2 className="text-lg font-bold text-blue-900 mb-2">シフトをアップデート</h2>
                                <p className="text-xs text-gray-500 mb-3"> Excel (.xlsx) シフト，AI 自動表示される。</p>
                                <label className="block w-full cursor-pointer border-2 border-dashed border-blue-300 p-8 rounded-2xl bg-blue-50/50 hover:bg-blue-100 transition-colors text-center">
                                    <input type="file" accept=".xlsx" onChange={handleExcelUpload} className="hidden" />
                                    <div className="text-blue-700 font-bold text-lg mb-1">put.xlsx to here</div>
                                    <div className="text-blue-500 text-sm">自動計算色塊，累積不覆蓋</div>
                                </label>
                            </div>
                        </div>
                    )}

                    {activePage === 'preview' && (
                        <div className="p-4 sm:p-6 w-full max-w-[1400px] mx-auto overflow-hidden flex flex-col animate-fadeIn">
                            
                            <div className="flex flex-wrap gap-4 mb-4 items-center justify-between print:hidden">
                                <div className="flex items-center gap-4">
                                    <input type="month" value={period} onChange={e=>setPeriod(e.target.value)} className="border-2 border-slate-300 rounded-xl p-2 font-bold text-lg outline-none focus:border-indigo-500 shadow-sm"/>
                                    
                                    <div className="flex bg-gray-200 p-1 rounded-xl shadow-inner">
                                        <button onClick={() => switchLocation('rokko')} className={`px-6 py-2 rounded-lg font-bold transition-all ${activeLocation === 'rokko' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>六甲校</button>
                                        <button onClick={() => switchLocation('myodani')} className={`px-6 py-2 rounded-lg font-bold transition-all ${activeLocation === 'myodani' ? 'bg-white text-emerald-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>名谷校</button>
                                    </div>
                                </div>
                                <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2 rounded-xl font-bold shadow-md transition-colors flex items-center gap-2">列印 / PDF</button>
                            </div>

                            <div className="flex overflow-x-auto gap-1 pb-0 border-b-4 border-slate-300 print:hidden scrollbar-hide pt-2 px-2">
                                {currentEmployees.map((emp, i) => {
                                    const colorClass = TAB_COLORS[i % TAB_COLORS.length];
                                    const isActive = activeEmp === emp.id;
                                    return (
                                        <button key={emp.id} onClick={() => setActiveEmp(emp.id)} 
                                            className={`whitespace-nowrap px-6 py-2.5 font-bold text-sm rounded-t-2xl border-t-2 border-x-2 transition-all ${isActive ? `${colorClass} shadow-inner -mb-1 pb-3 text-base` : 'bg-gray-200 text-gray-500 border-transparent hover:bg-gray-300 mt-1'}`}>
                                            {emp.name}
                                        </button>
                                    );
                                })}
                            </div>

                            {currentEmp && (() => {
                                let sumDays = 0, sumIgka = 0, sumIgkb = 0, sumTotal = 0, sumEarly = 0, sumLate = 0;

                                return (
                                    <div className="bg-white p-6 sm:p-8 border-x-2 border-b-2 border-slate-300 rounded-b-2xl shadow-xl print:border-none print:shadow-none print:p-0">
                                        <div className="flex items-end justify-between mb-6 border-b-2 border-slate-200 pb-4">
                                            <h2 className="text-3xl font-black text-slate-800">{currentEmp.name} <span className="text-base font-bold text-gray-400 ml-3 bg-gray-100 px-3 py-1 rounded-full">{currentEmp.type === 'full' ? '正社員' : 'アルバイト'}</span></h2>
                                        </div>
                                        
                                        <div className="overflow-x-auto rounded-xl border border-slate-200">
                                            <table className="w-full text-sm border-collapse">
                                                <thead>
                                                    <tr className="bg-slate-100 text-slate-700">
                                                        <th className="border-b border-r border-slate-200 p-3 min-w-[100px]">日付</th>
                                                        <th className="border-b border-r border-slate-200 p-3 w-24">入室</th>
                                                        <th className="border-b border-r border-slate-200 p-3 w-24">退室</th>
                                                        <th className="border-b border-r border-slate-200 p-3 w-32">シフト</th>
                                                        <th className="border-b border-r border-slate-200 p-3 w-24 text-pink-700">IGKA</th>
                                                        <th className="border-b border-r border-slate-200 p-3 w-24 text-blue-700">IGKB</th>
                                                        <th className="border-b border-slate-200 p-3 min-w-[150px]">備考欄</th>
                                                        {currentEmp.type === 'full' && <><th className="border-b border-l border-slate-200 p-3 w-20 text-orange-600">早残業</th><th className="border-b border-slate-200 p-3 w-20 text-orange-600">後残業</th></>}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {dates.map(d => {
                                                        const key = dKey(d);
                                                        const row = attendance[currentEmp.id]?.[key] || {};
                                                        const calc = calculateRow(d, row, currentEmp);
                                                        
                                                        if (row.inTime || row.outTime || row.leave) sumDays++;
                                                        sumIgka += calc.igkaMins; sumIgkb += calc.igkbMins;
                                                        sumTotal += calc.totalWorkMins;
                                                        sumEarly += calc.earlyOtMins; sumLate += calc.lateOtMins;

                                                        let rowBg = calc.isWknd ? 'bg-pink-50/50' : 'hover:bg-slate-50 transition-colors';
                                                        let textClass = calc.isWknd ? 'text-red-600 font-bold' : 'text-slate-700';
                                                        if (row.leave) { rowBg = 'bg-blue-50'; textClass = 'text-blue-600 font-bold'; }

                                                        return (
                                                            <tr key={key} className={`${rowBg} ${textClass}`}>
                                                                <td className="border-b border-r border-slate-200 p-2.5 text-center font-bold tracking-wider">{formatDisplayDate(d)}</td>
                                                                
                                                                <td className="border-b border-r border-slate-200 p-1.5 text-center">
                                                                    {!row.inTime && !row.outTime && currentEmp.type === 'full' ? (
                                                                        <select value={row.leave || ''} onChange={e => updateCell(currentEmp.id, key, 'leave', e.target.value)} className="w-full bg-transparent text-center text-sm font-bold outline-none cursor-pointer text-slate-500">
                                                                            <option value="">-</option><option value="有休">有休</option><option value="事欠">事欠</option><option value="病欠">病欠</option>
                                                                        </select>
                                                                    ) : (
                                                                        <input type="time" value={row.inTime || ''} onChange={e => updateCell(currentEmp.id, key, 'inTime', e.target.value)} className="w-full bg-transparent text-center outline-none font-mono font-bold text-slate-800"/>
                                                                    )}
                                                                </td>
                                                                
                                                                <td className="border-b border-r border-slate-200 p-1.5 text-center">
                                                                    {row.leave ? '-' : <input type="time" value={row.outTime || ''} onChange={e => updateCell(currentEmp.id, key, 'outTime', e.target.value)} className="w-full bg-transparent text-center outline-none font-mono font-bold text-slate-800"/>}
                                                                </td>
                                                                
                                                                <td className="border-b border-r border-slate-200 p-2.5 text-center font-mono text-sm font-bold text-slate-500">
                                                                    {calc.actualShiftIn && calc.shiftOut && !row.leave ? `${calc.actualShiftIn}-${calc.shiftOut}` : '-'}
                                                                </td>
                                                                
                                                                <td className="border-b border-r border-slate-200 p-1.5 text-center">
                                                                    <input type="time" value={row.igka || ''} onChange={e => updateCell(currentEmp.id, key, 'igka', e.target.value)} className="w-full bg-transparent text-center outline-none text-pink-700 font-bold font-mono"/>
                                                                </td>
                                                                
                                                                <td className="border-b border-r border-slate-200 p-2.5 text-center font-bold text-blue-700 font-mono text-sm">{minsToTime(calc.igkbMins) || '-'}</td>
                                                                
                                                                <td className="border-b border-slate-200 p-1.5">
                                                                    <input type="text" value={row.remark || (row.leave ? row.leave : '')} onChange={e => updateCell(currentEmp.id, key, 'remark', e.target.value)} className="w-full bg-transparent outline-none px-3 py-1 rounded text-sm text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-200 transition-all" placeholder="備考..."/>
                                                                </td>

                                                                {currentEmp.type === 'full' && (
                                                                    <>
                                                                        <td className="border-b border-l border-slate-200 p-2.5 text-center font-bold text-orange-600 bg-orange-50/30">{calc.earlyOtMins > 0 ? `${calc.earlyOtMins}分` : '-'}</td>
                                                                        <td className="border-b border-slate-200 p-2.5 text-center font-bold text-orange-600 bg-orange-50/30">{calc.lateOtMins > 0 ? `${calc.lateOtMins}分` : '-'}</td>
                                                                    </>
                                                                )}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className={`mt-8 pt-6 grid grid-cols-2 gap-6 ${currentEmp.type === 'full' ? 'lg:grid-cols-6' : 'md:grid-cols-6'}`}>
                                            <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-center shadow-sm">
                                                <div className="text-sm font-bold text-slate-500 mb-2">出勤總日數</div>
                                                <div className="text-4xl font-black text-slate-800">{sumDays} <span className="text-xl font-bold">日</span></div>
                                            </div>
                                            
                                            <div className="bg-pink-50 p-5 rounded-2xl border border-pink-200 text-center shadow-sm">
                                                <div className="text-sm font-bold text-pink-700 mb-2">IGKA 總時間</div>
                                                <div className="text-4xl font-black text-pink-800 font-mono">{minsToTime(sumIgka) || '00:00'}</div>
                                            </div>

                                            <div className="bg-blue-50 p-5 rounded-2xl border border-blue-200 text-center shadow-sm">
                                                <div className="text-sm font-bold text-blue-700 mb-2">IGKB 總時間</div>
                                                <div className="text-4xl font-black text-blue-800 font-mono">{minsToTime(sumIgkb) || '00:00'}</div>
                                            </div>

                                            {currentEmp.type === 'full' ? (
                                                <>
                                                    <div className="bg-gradient-to-br from-purple-50 to-indigo-50 p-5 rounded-2xl border border-purple-200 text-center shadow-md md:col-span-3 flex flex-col justify-center transform hover:scale-105 transition-transform duration-300">
                                                        <div className="text-sm font-bold text-purple-700 mb-2">A + B 總時間 (總上班)</div>
                                                        <div className="text-5xl font-black text-purple-900 font-mono">{minsToTime(sumIgka + sumIgkb) || '00:00'}</div>
                                                    </div>

                                                    <div className="bg-orange-50 p-5 rounded-2xl border border-orange-200 text-center shadow-sm">
                                                        <div className="text-sm font-bold text-orange-700 mb-2">早残業</div>
                                                        <div className="text-4xl font-black text-orange-800">{sumEarly} <span className="text-xl font-bold">分</span></div>
                                                    </div>
                                                    
                                                    <div className="bg-orange-50 p-5 rounded-2xl border border-orange-200 text-center shadow-sm">
                                                        <div className="text-sm font-bold text-orange-700 mb-2">後残業</div>
                                                        <div className="text-4xl font-black text-orange-800">{sumLate} <span className="text-xl font-bold">分</span></div>
                                                    </div>
                                                    
                                                    <div className="bg-gradient-to-br from-red-50 to-orange-50 p-5 rounded-2xl border border-red-200 text-center shadow-md md:col-span-2 flex flex-col justify-center transform hover:scale-105 transition-transform duration-300">
                                                        <div className="text-sm font-bold text-red-700 mb-2">残業總計 (早+後)</div>
                                                        <div className="text-5xl font-black text-red-900">{sumEarly + sumLate} <span className="text-2xl font-bold text-red-700 mx-2">分</span> <span className="text-2xl font-bold text-red-500 font-mono">({minsToTime(sumEarly+sumLate)})</span></div>
                                                    </div>

                                                    {/* ★ 交通費 (正社員: 残業總計的右邊) */}
                                                    <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-200 text-center shadow-sm md:col-span-2 flex flex-col justify-center">
                                                        <div className="text-sm font-bold text-emerald-700 mb-2">交通費 (月額・手動輸入)</div>
                                                        <div className="flex items-center justify-center gap-1">
                                                            <span className="text-2xl font-bold text-emerald-800">¥</span>
                                                            <input
                                                                type="number"
                                                                value={monthlyData[`${currentEmp.id}_${period}`]?.transportFee || ''}
                                                                onChange={(e) => updateMonthlyData(currentEmp.id, period, 'transportFee', e.target.value)}
                                                                className="w-32 bg-transparent border-b-2 border-emerald-300 text-4xl font-black text-emerald-900 text-center focus:outline-none focus:border-emerald-500 transition-colors placeholder-emerald-300/50"
                                                                placeholder="0"
                                                            />
                                                        </div>
                                                    </div>
                                                </>
                                            ) : (
                                                <>
                                                    <div className="bg-gradient-to-br from-purple-50 to-indigo-50 p-5 rounded-2xl border border-purple-200 text-center shadow-md md:col-span-2 flex flex-col justify-center transform hover:scale-105 transition-transform duration-300">
                                                        <div className="text-sm font-bold text-purple-700 mb-2">A + B 總時間 (總上班)</div>
                                                        <div className="text-5xl font-black text-purple-900 font-mono">{minsToTime(sumIgka + sumIgkb) || '00:00'}</div>
                                                    </div>

                                                    {/* ★ 交通費 (打工者: A+B的右邊) */}
                                                    <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-200 text-center shadow-sm flex flex-col justify-center">
                                                        <div className="text-sm font-bold text-emerald-700 mb-2">交通費 (手動輸入)</div>
                                                        <div className="flex items-center justify-center gap-1">
                                                            <span className="text-xl font-bold text-emerald-800">¥</span>
                                                            <input
                                                                type="number"
                                                                value={monthlyData[`${currentEmp.id}_${period}`]?.transportFee || ''}
                                                                onChange={(e) => updateMonthlyData(currentEmp.id, period, 'transportFee', e.target.value)}
                                                                className="w-24 bg-transparent border-b-2 border-emerald-300 text-3xl font-black text-emerald-900 text-center focus:outline-none focus:border-emerald-500 transition-colors placeholder-emerald-300/50"
                                                                placeholder="0"
                                                            />
                                                        </div>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</body>
</html>
