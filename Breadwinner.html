    <!-- ★ 核心解析套件：ExcelJS, PapaParse(CSV), PDF.js(PDF) -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f3f4f6; overflow: hidden; }

        .collapsed-panel { flex-grow: 0 !important; flex-shrink: 0; min-height: fit-content; }

</head>
<body>

    <script type="text/babel">
        // ★ Firebase 初始化設定
        const firebaseConfig = {
            apiKey: "AIzaSyC2CVG7H5-LYs7bvNFJSdEf8blFNZmJOxs",

            projectId: "igk-breadwinner",

            measurementId: "G-KJLMVFW3RH"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const docRef = db.collection('igk_data').doc('v2'); 

        const { useState, useEffect } = React;

        const HOLIDAYS_2026 = ['2026/01/01', '2026/01/12', '2026/02/11', '2026/02/23', '2026/03/20', '2026/04/29', '2026/05/03', '2026/05/04', '2026/05/05', '2026/05/06', '2026/07/20', '2026/08/11', '2026/09/21', '2026/09/22', '2026/09/23', '2026/10/12', '2026/11/03', '2026/11/23'];

        const INITIAL_EMPLOYEES = [
            { num: 1, id: 'm2', name: 'Linh', type: 'full', location: 'myodani', aliases: ['リン'] },
            { num: 2, id: 'r1', name: '葛野みのり', type: 'full', location: 'rokko', aliases: ['Minori', '葛野 みのり', 'みのり'] },
            { num: 3, id: 'r2', name: 'Ratu Yassmyn Khairussalima', type: 'full', location: 'rokko', aliases: ['Yassmyn', 'ヤスミン'] },
            { num: 4, id: 'm1', name: '加藤友梨', type: 'full', location: 'myodani', aliases: ['加藤', 'かとう'] },
            { num: 5, id: 'r3', name: 'Yoon Honey Aung', type: 'full', location: 'rokko', aliases: ['Yoon', 'ユン'] },
            { num: 6, id: 'r4', name: '林昊嬛', type: 'full', location: 'rokko', aliases: ['Koukei', '林 昊嬛', '林'] },
            { num: 7, id: 'r15', name: '金栄美', type: 'part', location: 'rokko', aliases: ['kim eimi', 'eimi', '金'] },
            { num: 8, id: 'r11', name: '沼田真里子', type: 'part', location: 'rokko', aliases: ['Mariko', 'マリコ', 'まりこ'] },
            { num: 9, id: 'r16', name: '角田紀子', type: 'part', location: 'rokko', aliases: ['角田', 'つのだ'] },
            { num: 10, id: 'r6', name: '上山貴行', type: 'driver', location: 'rokko', aliases: ['Taka', '上山', 'たか'] },
            { num: 11, id: 'r5', name: '實熊功光', type: 'driver', location: 'rokko', aliases: ['Mikuma', '実熊', 'みくま'] },
            { num: 12, id: 'r12', name: '安藤佑也', type: 'driver', location: 'rokko', aliases: ['Ando', '安藤'] },
            { num: 13, id: 'r7', name: 'Fergus', type: 'part', location: 'rokko', aliases: ['ファーガス'] },
            { num: 14, id: 'r8', name: 'Sammy Abukmeil', type: 'part', location: 'rokko', aliases: ['Sammy', 'サミー'] },
            { num: 15, id: 'r9', name: 'Kim Nakyung', type: 'part', location: 'rokko', aliases: ['キム', 'Kim', 'Nakyung'] },
            { num: 16, id: 'r10', name: 'Nathan Morrison', type: 'part', location: 'rokko', aliases: ['Nathan', 'ネイサン'] },
            { num: 30, id: 'm3', name: '大津真里', type: 'part', location: 'myodani', aliases: ['大津', 'おおつ'] },
            { num: 41, id: 'm15', name: 'Mozelle Bargamin', type: 'part', location: 'myodani', aliases: ['Mozelle', 'モゼル'] }
        ];

        const isHoliday = (dateStr) => [0, 6].includes(dayjs(dateStr).day()) || HOLIDAYS_2026.includes(dateStr);
        const calculateMinutes = (start, end) => start && end ? dayjs(`2000-01-01 ${end}`).diff(dayjs(`2000-01-01 ${start}`), 'minute') : 0;
        const formatHM = (mins) => `${Math.floor(mins / 60).toString().padStart(2, '0')}:${(mins % 60).toString().padStart(2, '0')}`;
        const timeToMins = (t) => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return (h * 60) + (isNaN(m) ? 0 : m); };
        const minsToTime = (m) => m > 0 ? `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}` : '';

        const roundTo5Mins = (t) => {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return t;
            const totalMins = h * 60 + m;
            const roundedMins = Math.round(totalMins / 5) * 5;
            return `${Math.floor(roundedMins / 60).toString().padStart(2, '0')}:${(roundedMins % 60).toString().padStart(2, '0')}`;
        };

        const getSafeText = (val) => {
            if (val === null || val === undefined) return '';
            if (typeof val === 'string') return val;
            if (typeof val === 'number') return String(val);
            if (val instanceof Date) return dayjs(val).format('YYYY/MM/DD');
            if (val.richText) return val.richText.map(rt => rt.text).join('');
            if (val.result !== undefined && val.result !== null) {
                if (val.result instanceof Date) return dayjs(val.result).format('YYYY/MM/DD');
                return String(val.result);
            }
            try { return String(val); } catch(e) { return ''; }
        };

        const SettingPanel = ({ title, children, className = '' }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-200 p-4 setting-panel-wrapper flex-1 ${className}`}>
                <div className="mb-3 border-b pb-2 flex justify-between items-center shrink-0">
                    <h2 className="text-[15px] font-bold text-gray-800 flex items-center gap-2">{title}</h2>
                </div>
                <div className="flex-1 overflow-hidden flex flex-col min-h-0">{children}</div>
            </div>
        );

        const App = () => {
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const [isLocked, setIsLocked] = useState(false);
            const ADMIN_PASSWORD = "8888";

            const [currentView, setCurrentView] = useState('setup');
            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [logs, setLogs] = useState([]);
            const [attendanceData, setAttendanceData] = useState({});
            const [timecardText, setTimecardText] = useState('');
            const [payMonth, setPayMonth] = useState('2026-09');
            const [activeLocation, setActiveLocation] = useState('rokko');
            const [activeEmployeeId, setActiveEmployeeId] = useState('r1');

            const addLog = (msg, type = 'info') => setLogs(prev => [`[${dayjs().format('HH:mm:ss')}] ${msg}`, ...prev]);

            useEffect(() => {
                docRef.get().then((doc) => {
                    if (doc.exists) {
                        const cloudData = doc.data();
                        if (cloudData.employees) setEmployees(cloudData.employees);
                        if (cloudData.attendanceData) setAttendanceData(cloudData.attendanceData);
                        if (cloudData.isLocked !== undefined) setIsLocked(cloudData.isLocked);
                    }
                    setIsCloudLoaded(true);
                }).catch(err => { console.error("Firestore 讀取失敗:", err); setIsCloudLoaded(true); });
            }, []);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const unsubscribe = docRef.onSnapshot((doc) => { if (doc.exists && doc.data().isLocked !== undefined) setIsLocked(doc.data().isLocked); });
                return () => unsubscribe();
            }, [isCloudLoaded]);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const timer = setTimeout(() => {
                    docRef.set({ employees, attendanceData, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                }, 1500);
                return () => clearTimeout(timer);
            }, [employees, attendanceData, isCloudLoaded]);

            const handleToggleLock = () => {
                if (isLocked) {
                    const pwd = window.prompt("パスワードを入力:");
                    if (pwd === ADMIN_PASSWORD) { docRef.set({ isLocked: false }, { merge: true }); addLog('システムロックを解除しました。', 'success'); }
                    else if (pwd !== null) alert("パスワードが違います");
                } else {
                    if (window.confirm("全員の編集をロックしますか？")) { docRef.set({ isLocked: true }, { merge: true }); addLog('システムをロックしました。', 'info'); }
                }
            };

            const handleParseTimecardText = () => {
                if (!timecardText.trim()) return;
                const cleanText = timecardText.replace(/[\u3000\u200B-\u200D\uFEFF]/g, ' '); 
                const lines = cleanText.split('\n').map(l => l.trim()).filter(l => l);
                
                let currentName = null, parsedCount = 0;
                const newData = { ...attendanceData };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (/^\d{8}$/.test(line)) { 
                        if (i + 1 < lines.length) currentName = lines[++i].replace(/\s+/g, ''); 
                    }
                    else if (line === '入室' || line === '退室') {
                        const action = line === '入室' ? 'in' : 'out';
                        if (i + 1 < lines.length) {
                            const timeMatch = lines[i+1].match(/(\d{4}\/\d{1,2}\/\d{1,2})\s+(\d{1,2}:\d{2})/);
                            if (timeMatch && currentName) {
                                const emp = employees.find(e => [e.name.replace(/\s+/g, ''), ...(e.aliases || []).map(a => a.replace(/\s+/g, ''))].some(n => n.includes(currentName) || currentName.includes(n)));
                                if (emp) {
                                    const dateKey = dayjs(timeMatch[1], 'YYYY/M/D').format('YYYY/MM/DD');
                                    if (!newData[emp.id]) newData[emp.id] = {};
                                    if (!newData[emp.id][dateKey]) newData[emp.id][dateKey] = { location: emp.location };
                                    newData[emp.id][dateKey][action] = timeMatch[2];
                                    parsedCount++;
                                }
                            }
                        }
                    } 
                }

                Object.keys(newData).forEach(empId => {
                    const emp = employees.find(e => e.id === empId);
                    if (emp && emp.type === 'part') {
                        Object.keys(newData[empId]).forEach(dateKey => {
                            const d = newData[empId][dateKey];
                            if (d.in && !d.shiftStart) d.shiftStart = roundTo5Mins(d.in);
                            if (d.out && !d.shiftEnd) d.shiftEnd = roundTo5Mins(d.out);
                        });
                    }
                });

                setAttendanceData(newData);
                addLog(`打刻テキスト解析完了: ${parsedCount} 筆のデータを反映しました。`, 'success');
                setTimecardText('');
            };

            // ==========================================
            // ★ 萬用十字交叉解析引擎 (自動識別 X軸 與 Y軸)
            // ==========================================
            const processGridData = (grid2D, fileYear, isTransport, localEmps, newData) => {
                let shiftCount = 0, transCount = 0;

                if (isTransport) {
                    grid2D.forEach((row, rIdx) => {
                        if (rIdx === 0) return; 
                        const dateCell = getSafeText(row[0]);
                        const nameCell = getSafeText(row[1]).trim().toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');
                        const amountCell = getSafeText(row[4]); 
                        
                        if (!dateCell || !nameCell) return;
                        
                        let dateStr = '';
                        const dMatch = dateCell.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
                        if (dMatch) dateStr = dayjs(`${dMatch[1]}/${dMatch[2]}/${dMatch[3]}`).format('YYYY/MM/DD');
                        if (!dateStr) return;

                        const amount = parseInt(amountCell) || 0;
                        if (amount === 0) return;

                        const emp = localEmps.find(e => {
                            let s = [e.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''), ...(e.aliases||[]).map(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''))];
                            return s.includes(nameCell) || s.some(n => nameCell.includes(n) && n.length >= 2);
                        });

                        if (emp) {
                            if (!newData[emp.id]) newData[emp.id] = {};
                            if (!newData[emp.id][dateStr]) newData[emp.id][dateStr] = { location: emp.location };
                            newData[emp.id][dateStr].transFee = (parseInt(newData[emp.id][dateStr].transFee) || 0) + amount;
                            transCount++;
                        }
                    });
                    return { newData, shiftCount, transCount };
                }

                // --- 班表解析 ---
                let dateCols = {}; // c -> date
                let dateRows = {}; // r -> date
                let nameCols = {}; // c -> empId
                let nameRows = {}; // r -> empId

                // 1. 全域掃描：找出所有的日期與人名座標
                grid2D.forEach((row, r) => {
                    row.forEach((cell, c) => {
                        let textStr = getSafeText(cell);
                        if (!textStr) return;

                        // 檢查是否為原生 Date
                        if (cell instanceof Date && cell.getFullYear() > 2000) {
                            let dKey = dayjs(cell).format('YYYY/MM/DD');
                            dateCols[c] = dKey; dateRows[r] = dKey; return;
                        }

                        // 檢查是否為文字日期 (暴力清除干擾)
                        let t = textStr.replace(/[\s\u3000\u200B-\u200D\uFEFF\n()（）]/g, '');
                        if (t && !t.match(/^\d{1,2}[:：\.]\d{2}([:：\.]\d{2})?$/)) {
                            const m = t.match(/(?:(?:20)?\d{2}[\/\-年])?([1-9]|1[0-2])[\/\-月]([1-9]|[12]\d|3[01])日?/);
                            if (m && !t.toLowerCase().includes('everyday')) {
                                let y = fileYear;
                                const yMatch = t.match(/(20\d{2})/); if (yMatch) y = parseInt(yMatch[1]);
                                let dObj = new Date(y, parseInt(m[1])-1, parseInt(m[2]));
                                let dKey = dayjs(dObj).format('YYYY/MM/DD');
                                dateCols[c] = dKey; dateRows[r] = dKey; return;
                            }
                        }

                        // 檢查是否為人名
                        let vName = textStr.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');
                        if (vName.length >= 2) {
                            for (const emp of localEmps) { 
                                let s = [emp.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''), ...(emp.aliases||[]).map(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''))];
                                if (s.includes(vName) || s.some(name => vName.includes(name) && name.length >= 2)) {
                                    nameCols[c] = emp.id; nameRows[r] = emp.id; break;
                                }
                            }
                        }
                    });
                });

                // 自動判斷 X 軸與 Y 軸
                let isDateRowHeader = Object.keys(dateCols).length > Object.keys(dateRows).length;
                let isNameColHeader = Object.keys(nameRows).length > Object.keys(nameCols).length;

                // 2. 擷取十字交叉點的班表內容
                grid2D.forEach((row, r) => {
                    row.forEach((cell, c) => {
                        let dateKey = isDateRowHeader ? dateCols[c] : dateRows[r];
                        let empId = isNameColHeader ? nameRows[r] : nameCols[c];

                        if (dateKey && empId) {
                            let cellText = getSafeText(cell).trim();
                            if (!cellText) return;

                            // 排除標題列本身
                            let vClean = cellText.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');
                            let isHeader = localEmps.some(e => e.id === empId && ([e.name.toLowerCase().replace(/\s+/g,''), ...(e.aliases||[]).map(a=>a.toLowerCase().replace(/\s+/g,''))].includes(vClean)));
                            if (isHeader) return;
                            if ((cellText.includes('/') || cellText.includes('月')) && cellText.length < 15) return;

                            if (!newData[empId]) newData[empId] = {};
                            if (!newData[empId][dateKey]) newData[empId][dateKey] = { location: localEmps.find(e=>e.id===empId)?.location };
                            let target = newData[empId][dateKey];

                            const exactMatches = [...cellText.matchAll(/([0-9]{1,2})[:：\.\-]([0-9]{2})/g)];
                            let isDriverKeyword = ['乗車', '下車', '降車', '車', '返却'].some(k => cellText.includes(k));

                            if (cellText.includes('欠') || cellText.includes('休')) {
                                target.leaveType = cellText.substring(0, 10);
                                shiftCount++;
                            } else if (exactMatches.length === 2 && !isDriverKeyword) {
                                target.shiftStart = `${exactMatches[0][1].padStart(2, '0')}:${exactMatches[0][2]}`;
                                target.shiftEnd = `${exactMatches[1][1].padStart(2, '0')}:${exactMatches[1][2]}`;
                                shiftCount++;
                            } else if (isDriverKeyword && exactMatches.length > 0) {
                                if (!target._tempDrivers) target._tempDrivers = [];
                                exactMatches.forEach(m => target._tempDrivers.push(timeToMins(`${m[1].padStart(2, '0')}:${m[2]}`)));
                            }
                        }
                    });
                });

                // 3. 司機時段總結
                Object.keys(newData).forEach(empId => {
                    Object.keys(newData[empId]).forEach(dateKey => {
                        let target = newData[empId][dateKey];
                        if (target._tempDrivers && target._tempDrivers.length > 0) {
                            let times = target._tempDrivers.sort((a,b) => a - b);
                            let totalDriverMins = 0;
                            for (let i = 0; i < times.length - 1; i += 2) totalDriverMins += (times[i+1] - times[i]);
                            if (times.length % 2 !== 0) totalDriverMins += 30; // 單數防呆
                            target.driveMins = (parseInt(target.driveMins) || 0) + totalDriverMins;
                            delete target._tempDrivers;
                            shiftCount++;
                        }
                    });
                });

                return { newData, shiftCount, transCount };
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                addLog(`[Excel] 解析中: ${file.name}...`);
                let fileYear = parseInt(payMonth.split('-')[0]) || new Date().getFullYear();
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let globalNewData = JSON.parse(JSON.stringify(attendanceData));
                        let localEmps = JSON.parse(JSON.stringify(employees));
                        let totalShift = 0, totalTrans = 0;

                        wb.worksheets.forEach(ws => {
                            const isTransSheet = ws.name.includes('交通費');
                            let grid2D = [];
                            ws.eachRow((row, rowNumber) => {
                                let rowData = [];
                                row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                                    rowData[colNumber - 1] = cell.value;
                                });
                                grid2D.push(rowData);
                            });

                            const { newData, shiftCount, transCount } = processGridData(grid2D, fileYear, isTransSheet, localEmps, globalNewData);
                            globalNewData = newData;
                            totalShift += shiftCount;
                            totalTrans += transCount;
                        });

                        if (totalShift > 0 || totalTrans > 0) {
                            setAttendanceData(globalNewData);
                            addLog(`[Excel] 解析完了: シフト ${totalShift} 件, 交通費 ${totalTrans} 件を反映しました。`, 'success');
                        } else {
                            addLog(`[Excel] 抽出可能なデータがありませんでした。`, 'info');
                        }
                    } catch (err) { addLog(`[Excel] エラー: ${err.message}`, 'error'); }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const handleCsvUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                addLog(`[CSV] 解析中: ${file.name}...`);
                let fileYear = parseInt(payMonth.split('-')[0]) || new Date().getFullYear();

                Papa.parse(file, {
                    complete: function(results) {
                        try {
                            const isTransSheet = file.name.includes('交通費');
                            const { newData, shiftCount, transCount } = processGridData(results.data, fileYear, isTransSheet, employees, attendanceData);
                            
                            if (shiftCount > 0 || transCount > 0) {
                                setAttendanceData(newData);
                                addLog(`[CSV] 解析完了: シフト ${shiftCount} 件, 交通費 ${transCount} 件を反映しました。`, 'success');
                            } else {
                                addLog(`[CSV] 抽出可能なデータがありませんでした。`, 'info');
                            }
                        } catch (err) { addLog(`[CSV] エラー: ${err.message}`, 'error'); }
                    },
                    error: function(err) { addLog(`[CSV] エラー: ${err.message}`, 'error'); }
                });
                e.target.value = null;
            };

            const handlePdfUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                addLog(`[PDF] 解析中: ${file.name}... (※PDF解析は文字のみ対象です)`, 'info');

                const reader = new FileReader();
                reader.onload = async function(evt) {
                    try {
                        const typedarray = new Uint8Array(evt.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let fullText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                        }
                        addLog(`[PDF] テキスト抽出完了。PDFの構造上、手動入力をお勧めします。`, 'error');
                    } catch (err) {
                        addLog(`[PDF] エラー: ${err.message}`, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const renderSetupScreen = () => (
                <div className={`flex flex-col gap-4 p-4 h-[calc(100vh-60px)] overflow-y-auto ${isLocked ? 'locked-overlay' : ''}`}>
                    <div className="flex gap-4">
                        <div className="w-1/3 flex flex-col gap-3">
                            <SettingPanel title="1. Excel (.xlsx) 解析エリア">
                                <div className="border-2 border-dashed border-green-300 rounded-lg py-5 text-center bg-green-50 hover:bg-green-100 relative cursor-pointer shadow-sm">
                                    <i className="fa-solid fa-file-excel text-3xl text-green-500 mb-2"></i>
                                    <p className="text-xs text-green-800 font-bold px-2">Excelシフト・交通費</p>
                                    <input type="file" accept=".xlsx" onChange={handleExcelUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                </div>
                            </SettingPanel>
                        </div>
                        <div className="w-1/3 flex flex-col gap-3">
                            <SettingPanel title="2. CSV (.csv) 解析エリア">
                                <div className="border-2 border-dashed border-blue-300 rounded-lg py-5 text-center bg-blue-50 hover:bg-blue-100 relative cursor-pointer shadow-sm">
                                    <i className="fa-solid fa-file-csv text-3xl text-blue-500 mb-2"></i>
                                    <p className="text-xs text-blue-800 font-bold px-2">CSVシフト・交通費</p>
                                    <input type="file" accept=".csv" onChange={handleCsvUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                </div>
                            </SettingPanel>
                        </div>
                        <div className="w-1/3 flex flex-col gap-3">
                            <SettingPanel title="3. PDF (.pdf) 解析エリア">
                                <div className="border-2 border-dashed border-red-300 rounded-lg py-5 text-center bg-red-50 hover:bg-red-100 relative cursor-pointer shadow-sm">
                                    <i className="fa-solid fa-file-pdf text-3xl text-red-500 mb-2"></i>
                                    <p className="text-xs text-red-800 font-bold px-2">PDFアップロード</p>
                                    <input type="file" accept=".pdf" onChange={handlePdfUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                </div>
                            </SettingPanel>
                        </div>
                    </div>

                    <div className="flex gap-4 min-h-[250px]">
                        <SettingPanel title="打刻記録テキスト貼付 (Wagaco等)" className="w-1/2">
                            <div className="flex flex-col h-full">
                                <textarea 
                                    className="w-full flex-1 border border-gray-300 rounded p-2 text-xs font-mono resize-none outline-none focus:border-blue-500 shadow-inner bg-gray-50 mb-2"
                                    placeholder="Wagacoなどの打刻履歴をここに貼り付けてください。"
                                    value={timecardText}
                                    onChange={(e) => setTimecardText(e.target.value)}
                                ></textarea>
                                <button onClick={handleParseTimecardText} className="bg-blue-600 text-white text-[12px] px-4 py-2 rounded shadow font-bold hover:bg-blue-700 transition">
                                    <i className="fa-solid fa-wand-magic-sparkles mr-1"></i>テキストを自動解析する
                                </button>
                            </div>
                        </SettingPanel>

                        <SettingPanel title="システムログ" className="w-1/2">
                            <div className="bg-gray-900 font-mono text-[11px] p-3 rounded h-full overflow-y-auto shadow-inner custom-scrollbar">
                                {logs.length === 0 ? <span className="text-gray-500">待命中...</span> : 
                                    logs.map((log, i) => (
                                        <div key={i} className={`mb-1 ${log.includes('エラー') || log.includes('非推奨') ? 'text-red-400' : (log.includes('完了') ? 'text-green-300' : 'text-gray-300')}`}>{log}</div>
                                    ))
                                }
                            </div>
                        </SettingPanel>
                    </div>
                </div>
            );

            const EmployeeReport = ({ employee, data, payMonth }) => {
                const [localEditable, setLocalEditable] = useState(false);
                const payDateObj = dayjs(`${payMonth}-01`);
                
                const periodStart = payDateObj.subtract(1, 'month').date(16);
                const periodEnd = payDateObj.date(15);

                const dates = [];
                let curr = periodStart;
                while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                    dates.push(curr.format('YYYY/MM/DD'));
                    curr = curr.add(1, 'day');
                }

                const handleInput = (date, field, val) => {
                    if (isLocked || !localEditable) return;
                    setAttendanceData(prev => {
                        const newData = { ...prev };
                        if (!newData[employee.id]) newData[employee.id] = {};
                        if (!newData[employee.id][date]) newData[employee.id][date] = {};
                        newData[employee.id][date][field] = val;
                        return newData;
                    });
                };

                let workDays = 0, earlyTotal = 0, lateTotal = 0, totalTrans = 0;
                let totalIgkA = 0, totalIgkB = 0, totalDrive = 0, totalInOutGlobal = 0, totalWorkMinsGlobal = 0;

                return (
                    <div className="h-full flex flex-col">
                        <div className="flex justify-between items-end mb-2 border-b border-gray-300 pb-2 shrink-0">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <span className="bg-gray-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow">{employee.num}</span>
                                {employee.name}
                            </h2>
                            <div className="flex items-center gap-2">
                                <div className="text-[11px] font-bold text-gray-600 tracking-wide bg-gray-100 pl-3 pr-1 py-1 rounded shadow-sm flex items-center gap-3">
                                    <span>対象月: {payMonth.replace('-', '')} | 雇用形態: {employee.type === 'full' ? '正社員' : employee.type === 'driver' ? '司機' : 'アルバイト'}</span>
                                    <button 
                                        onClick={() => setLocalEditable(!localEditable)}
                                        disabled={isLocked}
                                        className={`px-3 py-1 rounded border shadow-sm transition-colors font-bold flex items-center gap-1.5 ${
                                            isLocked ? 'opacity-50 cursor-not-allowed bg-gray-200 text-gray-400 border-gray-300' 
                                            : localEditable ? 'bg-white text-blue-700 border-blue-400' 
                                            : 'bg-gray-400 text-white border-gray-500 hover:bg-gray-500'
                                        }`}
                                    >
                                        <i className={`fa-solid ${localEditable ? 'fa-pen-to-square' : 'fa-lock'}`}></i>
                                        {localEditable ? '手動入力 ON' : '手動入力 OFF'}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 overflow-auto bg-white rounded shadow-sm border text-[11px] custom-scrollbar">
                            <table className="w-full text-left border-collapse whitespace-nowrap">
                                <thead className="bg-gray-100 sticky top-0 shadow-sm z-10 text-gray-700">
                                    <tr>
                                        <th className="border p-1 min-w-[70px]">日付</th>
                                        <th className="border p-1">入室</th>
                                        <th className="border p-1">退室</th>
                                        <th className="border p-1 text-blue-800">シフト</th>
                                        <th className="border p-1 bg-green-50">勤務時間</th>
                                        {employee.type === 'full' && <><th className="border p-1">早残業</th><th className="border p-1">後残業</th></>}
                                        {employee.type === 'driver' && <><th className="border p-1">運転時間</th><th className="border p-1">IGK A</th><th className="border p-1">IGK B</th></>}
                                        {employee.type === 'part' && <><th className="border p-1">IGK A</th><th className="border p-1">IGK B</th></>}
                                        <th className="border p-1 bg-yellow-50 text-yellow-800">交通費</th>
                                        <th className="border p-1 min-w-[120px]">備考・出勤狀況</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dates.map((date) => {
                                        const isH = isHoliday(date);
                                        const dayData = data[date] || {};
                                        const hasData = !!(dayData.in || dayData.out);
                                        
                                        let shiftStart = dayData.shiftStart || '';
                                        let shiftEnd = dayData.shiftEnd || '';
                                        if (employee.type === 'full' && !isH && !shiftStart && !shiftEnd) {
                                            shiftStart = employee.location === 'rokko' ? '09:30' : '09:15';
                                            shiftEnd = employee.location === 'rokko' ? '18:30' : '18:15';
                                        }
                                        
                                        if (hasData || (!isH && employee.type === 'full' && !dayData.leaveType)) workDays++;

                                        const inOutMins = calculateMinutes(dayData.in, dayData.out);
                                        totalInOutGlobal += inOutMins;

                                        let breakMins = hasData ? (employee.type === 'full' ? 60 : (dayData.break || 0)) : 0;
                                        const workMins = Math.max(0, inOutMins - breakMins);
                                        totalWorkMinsGlobal += workMins;
                                        
                                        let early = 0, late = 0;
                                        if (employee.type === 'full' && hasData && shiftStart && shiftEnd) {
                                            early = Math.max(0, calculateMinutes(dayData.in, shiftStart));
                                            late = Math.max(0, calculateMinutes(shiftEnd, dayData.out));
                                            earlyTotal += early;
                                            lateTotal += late;
                                        }

                                        let drive = 0, igkA = parseInt(dayData.igkA || 0), igkB = 0;
                                        if (employee.type === 'driver' && hasData) {
                                            drive = parseInt(dayData.driveMins || 0);
                                            igkB = Math.max(0, workMins - drive);
                                            totalDrive += drive;
                                        } else if (employee.type === 'part' && hasData) {
                                            igkB = Math.max(0, workMins - igkA);
                                        }
                                        totalIgkA += igkA;
                                        totalIgkB += igkB;
                                        
                                        const transFee = parseInt(dayData.transFee) || 0;
                                        totalTrans += transFee;

                                        let rowClass = "hover:bg-gray-50 border-b transition-colors ";
                                        if (isH) rowClass += "holiday-row holiday-text ";
                                        if (!hasData && !isH && employee.type === 'full') rowClass += "absent-row ";

                                        return (
                                            <tr key={date} className={rowClass}>
                                                <td className="border p-0.5 text-center">{dayjs(date).format('MM/DD')}({['日','月','火','水','木','金','土'][dayjs(date).day()]})</td>
                                                <td className="border p-0.5 text-center">{dayData.in}</td>
                                                <td className="border p-0.5 text-center">{dayData.out}</td>
                                                
                                                <td className="border p-0.5 text-center text-blue-600 font-bold bg-blue-50/20">
                                                    <div className="flex justify-center items-center gap-0.5">
                                                        <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftStart} onChange={e=>handleInput(date,'shiftStart',e.target.value)} />
                                                        -
                                                        <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftEnd} onChange={e=>handleInput(date,'shiftEnd',e.target.value)} />
                                                    </div>
                                                </td>
                                                
                                                <td className="border p-0.5 text-center font-bold text-green-700 bg-green-50">{workMins > 0 ? (workMins/60).toFixed(2) : ''}</td>
                                                
                                                {employee.type === 'full' && <>
                                                    <td className="border p-0.5 text-right text-orange-500">{early > 0 ? early : ''}</td>
                                                    <td className="border p-0.5 text-right text-orange-500">{late > 0 ? late : ''}</td>
                                                </>}
                                                {employee.type === 'driver' && <>
                                                    <td className="border p-0.5 text-center"><input disabled={isLocked || !localEditable} className="w-10 text-center border outline-none rounded bg-transparent" value={dayData.driveMins || ''} onChange={e=>handleInput(date,'driveMins',e.target.value)} /></td>
                                                    <td className="border p-0.5 text-center">{igkA > 0 ? igkA : ''}</td>
                                                    <td className="border p-0.5 text-center font-bold text-blue-600">{igkB > 0 ? igkB : ''}</td>
                                                </>}
                                                {employee.type === 'part' && <>
                                                    <td className="border p-0.5 text-center"><input disabled={isLocked || !localEditable} className="w-10 text-center border outline-none rounded bg-transparent" value={dayData.igkA || ''} onChange={e=>handleInput(date,'igkA',e.target.value)} /></td>
                                                    <td className="border p-0.5 text-center font-bold text-blue-600">{igkB > 0 ? igkB : ''}</td>
                                                </>}
                                                <td className="border p-0 bg-yellow-50"><input disabled={isLocked || !localEditable} className="w-full text-right border-none outline-none px-2 py-1 bg-transparent font-bold text-yellow-800" value={dayData.transFee || ''} onChange={e=>handleInput(date,'transFee',e.target.value)} /></td>
                                                <td className="border p-0.5">
                                                    <div className="flex gap-1 items-center px-1">
                                                        <input disabled={isLocked || !localEditable} type="text" className="border-none bg-transparent w-full focus:ring-0 outline-none" placeholder="備註..." value={dayData.leaveType || dayData.remark || ''} onChange={e => handleInput(date, 'remark', e.target.value)} />
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        <div className="mt-2 border-t pt-2 shrink-0">
                            <div className="flex gap-2 flex-wrap items-stretch">
                                <div className="bg-white rounded-lg p-2 flex gap-3 shadow-sm border border-gray-200 min-w-[120px] justify-center items-center">
                                    <div className="text-center">
                                        <div className="text-[10px] text-gray-500 font-bold mb-1">出勤日数</div>
                                        <div className="text-xl font-black text-gray-800">{workDays} <span className="text-[10px] font-normal text-gray-500">日</span></div>
                                    </div>
                                </div>

                                {employee.type === 'full' && (
                                    <>
                                        <div className="bg-red-50 rounded-lg p-2 text-center shadow-sm border border-red-100 flex-[1] min-w-[110px]">
                                            <div className="text-[10px] text-red-700 font-bold mb-1">残業合計 (早+後)</div>
                                            <div className="text-lg font-black text-red-600">
                                                {earlyTotal+lateTotal} <span className="text-[9px] font-normal text-red-400 mr-1">分</span> 
                                            </div>
                                        </div>
                                    </>
                                )}
                                
                                {employee.type === 'part' && (
                                    <>
                                        <div className="bg-indigo-50 rounded-lg p-2 text-center shadow-sm border border-indigo-100 flex-[1] min-w-[110px]">
                                            <div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div>
                                            <div className="text-lg font-black text-indigo-700">{formatHM(totalIgkA+totalIgkB)} <span className="text-[9px] font-normal ml-1 text-indigo-400">({((totalIgkA+totalIgkB)/60).toFixed(2)}H)</span></div>
                                        </div>
                                    </>
                                )}

                                {employee.type === 'driver' && (
                                    <>
                                        <div className="bg-yellow-50 rounded-lg p-2 text-center shadow-sm border border-yellow-100 flex-[1] min-w-[110px]">
                                            <div className="text-[10px] text-yellow-700 font-bold mb-1">運転実績</div>
                                            <div className="text-lg font-black text-yellow-700">{formatHM(totalDrive)} <span className="text-[9px] font-normal ml-1 text-yellow-500">({(totalDrive/60).toFixed(2)}H)</span></div>
                                        </div>
                                    </>
                                )}
                                
                                <div className="bg-green-100 rounded-lg p-2 text-center shadow-sm border border-green-200 flex-[1] min-w-[110px]">
                                    <div className="text-[10px] text-green-700 font-bold mb-1">実働総時間 (休憩引)</div>
                                    <div className="text-lg font-black text-green-800">{formatHM(totalWorkMinsGlobal)} <span className="text-[9px] font-normal ml-1 text-green-600">({(totalWorkMinsGlobal/60).toFixed(2)}H)</span></div>
                                </div>

                                <div className="bg-yellow-100/80 rounded-lg p-2 flex flex-col justify-center items-center shadow-sm border border-yellow-400 min-w-[140px] flex-[1]">
                                    <div className="text-[11px] text-yellow-900 font-bold mb-1"><i className="fa-solid fa-coins mr-1"></i>交通費合計</div>
                                    <div className="font-black text-xl text-gray-900">{totalTrans.toLocaleString()} <span className="text-[11px] font-bold text-gray-600">円</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const renderReportsScreen = () => {
                const locEmployees = employees.filter(e => e.location === activeLocation).sort((a,b) => a.num - b.num);
                const activeEmployee = employees.find(e => e.id === activeEmployeeId);

                const switchLocation = (loc) => {
                    setActiveLocation(loc);
                    const firstEmp = employees.filter(e => e.location === loc).sort((a,b)=>a.num - b.num)[0];
                    if(firstEmp) setActiveEmployeeId(firstEmp.id);
                }

                return (
                    <div className="flex flex-col h-[calc(100vh-60px)] min-h-0">
                        <div className="flex justify-between items-end mb-2 px-4 mt-2 shrink-0">
                            <div className="flex gap-2">
                                <button onClick={() => switchLocation('rokko')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'rokko' ? 'bg-white text-blue-600 border-t-4 border-blue-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)]' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>六甲校 (Rokko)</button>
                                <button onClick={() => switchLocation('myodani')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'myodani' ? 'bg-white text-green-600 border-t-4 border-green-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)]' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>名谷校 (Myodani)</button>
                            </div>
                            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-gray-200 mb-0.5">
                                <span className="text-gray-600 font-bold text-xs"><i className="fa-regular fa-calendar-check text-blue-500 mr-1"></i> 支給月:</span>
                                <input type="month" value={payMonth} onChange={(e) => setPayMonth(e.target.value)} className="border rounded bg-gray-50 px-1 text-xs outline-none font-bold focus:border-blue-400" />
                            </div>
                        </div>
                        <div className="flex flex-1 bg-white rounded-lg shadow-sm border mx-4 mb-3 overflow-hidden min-h-0">
                            <div className="w-[140px] bg-gray-50 border-r overflow-y-auto pt-2 gap-1 flex flex-col shrink-0 custom-scrollbar pb-4">
                                {locEmployees.map(emp => (
                                    <button key={emp.id} onClick={() => setActiveEmployeeId(emp.id)} className={`text-left px-2 py-2 mx-2 rounded-lg text-xs font-bold flex items-center gap-2 truncate transition ${activeEmployeeId === emp.id ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:bg-gray-200'}`}>
                                        <span className="truncate">{emp.num}. {emp.name}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 p-3 overflow-hidden">
                                {activeEmployee ? <EmployeeReport key={activeEmployee.id} employee={activeEmployee} data={attendanceData[activeEmployee.id] || {}} payMonth={payMonth} /> : null}
                            </div>
                        </div>
                    </div>
                );
            };

            if (!isCloudLoaded) return <div className="min-h-screen flex items-center justify-center bg-[#f3f4f6]"><div className="animate-spin h-10 w-10 border-b-2 border-blue-600"></div></div>;

            return (
                <div className="min-h-screen flex flex-col overflow-hidden bg-[#eef2f6]">
                    <header className="bg-white shadow-sm border-b px-6 py-2 flex justify-between items-center shrink-0 h-[60px]">
                        <div className="flex items-center gap-6">
                            <h1 className="text-xl font-black text-gray-800 tracking-tight flex items-center gap-2"><i className="fa-solid fa-file-invoice-dollar text-blue-600"></i> IGK - Shift Parser</h1>
                            <nav className="flex bg-gray-100 p-1 rounded-lg">
                                <button onClick={() => setCurrentView('setup')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${currentView === 'setup' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}>1. データ取込 (Excel/CSV/PDF)</button>
                                <button onClick={() => setCurrentView('reports')} className={`px-4 py-1.5 rounded-md text-xs font-bold transition ${currentView === 'reports' ? 'bg-white shadow text-blue-700' : 'text-gray-500 hover:text-gray-700'}`}>2. 個人別明細・交通費</button>
                            </nav>
                        </div>
                    </header>
                    <main className="flex-1 overflow-hidden min-h-0">{currentView === 'setup' ? renderSetupScreen() : renderReportsScreen()}</main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
