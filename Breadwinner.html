    <style>
        /* 防止整個網頁左右捲動，允許上下捲動 */
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f3f4f6; overflow-x: hidden; overflow-y: auto; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .leave-row { background-color: #eff6ff !important; }
        .holiday-row { background-color: #fef2f2 !important; }
        .worked-row { background-color: #faf5ff !important; }

        /* ★ 修正: ロック中は設定画面を操作不可にする (以前はこのクラスが未定義だった) */
        .locked-overlay { pointer-events: none; opacity: 0.55; user-select: none; }

<body>
    <div id="root"></div>

    <script>
/* IGK 名谷シフトPDF 自動取込モジュール (pdf.js 6.x 用 / ブラウザ・Node 両対応) */
(function (root) {
  const IGKA_OK = new Set(['Monika', 'Mozelle', 'Gio', 'Sadia', 'Kim', 'Bjoerg', 'Nilima']);
  const BOTH_CAMPUS = new Set(['Gio', 'Kim']);
  const RETIRED = new Set(['yoon']); // 退職した人: シフト表に名前が残っていても取り込まない (小文字で比較)
  const SKIP_RE = /Halloween|Party|Sports|Rehearsal|Fasion|Break|Parade|Show|show&tell|Demo|Open school|Cooking/;
  const MAGENTA = '#ff00ff';
  const tmin = (s) => { const [h, m] = s.split(':'); return +h * 60 + +m; };
  const hm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const toHex = (a) => typeof a[0] === 'string' ? a[0].toLowerCase()
    : '#' + a.slice(0, 3).map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');

  async function extract(pdfjs, page) {
    const H = page.view[3];
    const ol = await page.getOperatorList();
    const O = pdfjs.OPS, paint = new Set([O.fill, O.eoFill, O.fillStroke, O.eoFillStroke, O.closeFillStroke, O.closeEOFillStroke]);
    const mul = (m, n) => [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
    let ctm = [1, 0, 0, 1, 0, 0], fill = '#000000'; const stack = [], rects = [], vlines = [];
    const strokeOps = new Set([O.stroke, O.closeStroke]);
    ol.fnArray.forEach((fn, i) => {
      const a = ol.argsArray[i];
      if (fn === O.save) stack.push([ctm, fill]);
      else if (fn === O.restore) { [ctm, fill] = stack.pop() || [[1, 0, 0, 1, 0, 0], fill]; }
      else if (fn === O.transform) ctm = mul(ctm, a);
      else if (fn === O.setFillRGBColor) fill = toHex(a);
      else if (fn === O.constructPath && strokeOps.has(a[0])) {
        // ★ 追加: 線で引かれた縦の罫線 (名谷では日と日の境界の太線) を拾う。命令ごとの長さ: 移動/線=3, 曲線=7, 2次曲線=5, 閉じる=1
        const d = Array.from(a[1] && a[1][0] ? a[1][0] : []); let pts = [];
        const flush = () => { if (pts.length >= 2) { const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
          if (Math.max(...xs) - Math.min(...xs) < 0.5 && Math.max(...ys) - Math.min(...ys) > 20) vlines.push({ x: (Math.max(...xs) + Math.min(...xs)) / 2, top: Math.min(...ys), bottom: Math.max(...ys) }); } pts = []; };
        for (let k = 0; k < d.length;) { const op = d[k]; if (op === 0) flush();
          if (op === 0 || op === 1) pts.push([ctm[0]*d[k+1] + ctm[2]*d[k+2] + ctm[4], H - (ctm[1]*d[k+1] + ctm[3]*d[k+2] + ctm[5])]);
          k += op === 4 ? 1 : op === 2 ? 7 : op === 3 ? 5 : 3; }
        flush();
      }
      else if (fn === O.constructPath && paint.has(a[0])) {
        const d = Array.from(a[1] && a[1][0] ? a[1][0] : []);
        const xs = [], ys = [];
        for (let k = 0; k + 2 < d.length; k += 3) if (d[k] === 0 || d[k] === 1) {
          xs.push(ctm[0]*d[k+1] + ctm[2]*d[k+2] + ctm[4]); ys.push(H - (ctm[1]*d[k+1] + ctm[3]*d[k+2] + ctm[5]));
        }
        if (xs.length < 4) return;
        const r = { x0: Math.min(...xs), x1: Math.max(...xs), top: Math.min(...ys), bottom: Math.max(...ys), color: fill };
        // ★ 修正: 横に並んだ同じ色のセルは1つの長い四角形で描かれる (例: 10/20 15:00 は Taka〜Kim の4人分で幅244)。
        // 以前は幅200以上を捨てていたため、その時間が抜けていた。名谷の解析は自分で幅40未満に絞っているので影響なし。
        if (r.x1 - r.x0 > 3 && r.bottom - r.top > 3) rects.push(r);
      }
    });
    const tc = await page.getTextContent();
    const words = tc.items.filter((t) => t.str && t.str.trim()).map((t) => {
      let bold = false;
      try { bold = /bold/i.test(page.commonObjs.get(t.fontName).name || ''); } catch (e) {}
      const top = H - t.transform[5] - t.height;
      return { text: t.str.normalize('NFKC').trim(), x0: t.transform[4], x1: t.transform[4] + t.width, top, bottom: top + t.height, bold, size: t.height };
    });
    return { rects, words, H, vlines };
  }

  // 1ページ=1か月分(5週×5日)の名谷シフト表を解析
  async function parseMyodani(pdfjs, data, opts = {}) {
    const doc = await pdfjs.getDocument({ data, verbosity: 0 }).promise;
    const ex = await extract(pdfjs, await doc.getPage(1));
    const { words, H } = ex; const rects = ex.rects.filter((r) => r.x1 - r.x0 < 40);
    const dates = words.filter((w) => /^\d{1,2}\/\d{1,2}$/.test(w.text) && w.bold && w.top < H - 20);
    const tops = [...new Set(dates.map((w) => Math.round(w.top)))].sort((a, b) => a - b);
    const blockH = tops.length > 1 ? tops[1] - tops[0] : 160;
    const bands = tops.map((t, i) => [t - 2, i + 1 < tops.length ? tops[i + 1] - 2 : t + blockH - 2]);
    const out = {}; const cx = (w) => (w.x0 + w.x1) / 2;
    for (const [y0, y1] of bands) {
      const row = dates.filter((w) => w.top >= y0 && w.top < y1).sort((a, b) => a.x0 - b.x0);
      const cs = row.map(cx);
      const edges = [cs[0] - (cs[1] - cs[0]) / 2, ...cs.slice(0, -1).map((c, i) => (c + cs[i + 1]) / 2), cs[cs.length - 1] + (cs[cs.length - 1] - cs[cs.length - 2]) / 2];
      const labs = words.filter((w) => w.top >= y0 && w.top < y1 && /^\d{1,2}:\d{2}$/.test(w.text) && w.x1 < edges[0] + 5).sort((a, b) => a.top - b.top);
      const rows = labs.map((l, i) => ({ yc: (l.top + l.bottom) / 2, t: tmin(l.text), d: i + 1 < labs.length ? tmin(labs[i + 1].text) - tmin(l.text) : 30 }));
      const covered = (r) => rows.filter((x) => x.yc >= r.top - 0.5 && x.yc <= r.bottom + 0.5);
      // ★ 修正: 日の境界は、日と日の間の太い縦線から取る。名谷の表は日ごとに人数が違って幅も違うため、
      // 日付と日付の中間で切ると境界が最大で1人分ずれていた (例: 10/9 の左端の 加藤 Yuri が抜けていた)。
      // 線が見つからない日だけ、これまでの中間で切る方法を使う。月曜の左側は時刻の列を含めない。
      const ym = row[0].top + 1;
      const bx = [...new Set((ex.vlines || []).filter((v) => v.top <= ym && v.bottom >= ym).map((v) => Math.round(v.x * 10) / 10))].sort((a, b) => a - b);
      const axisR = labs.length ? Math.max(...labs.map((l) => l.x1)) + 0.5 : -Infinity;
      const labelCx = (w) => { const wd = words.find((v) => Math.abs(v.top - w.top) < 1 && v.x0 >= w.x1 - 1 && v.x0 <= w.x1 + 2 && /^[(（]/.test(v.text)); return wd ? (w.x0 + wd.x1) / 2 : cx(w); };
      const cellOf = (di) => { const c = labelCx(row[di]); const L = bx.filter((x) => x < c).pop(), R = bx.find((x) => x > c);
        return (L == null || R == null) ? [edges[di], edges[di + 1]] : [Math.max(L, axisR), R]; };
      row.forEach((dw, di) => {
        const [xa, xb] = cellOf(di);
        const inb = words.filter((w) => w.x0 >= xa && w.x0 < xb && w.top >= y0 && w.top < y1 && w.top > labs[0].top - 3);
        const bold = inb.filter((w) => w.bold && w.size < 5.5 && !/^[\d/（）()]/.test(w.text)).sort((a, b) => a.top - b.top);
        let people = [];
        for (const w of bold) {
          const p = people.find((q) => Math.abs(cx(q) - cx(w)) < 7 && w.top - q.last > 0 && w.top - q.last < 9);
          if (p) { p.words.push(w.text); p.last = w.top; p.bottom = w.bottom; } else people.push({ x0: w.x0, x1: w.x1, top: w.top, last: w.top, bottom: w.bottom, words: [w.text] });
        }
        people = people.filter((p) => !p.words.some((x) => SKIP_RE.test(x)));
        const info = {};
        for (const p of people) {
          p.name = p.words[p.words.length - 1];
          const jp = inb.filter((w) => !w.bold && /[\u3000-\u9fff]/.test(w.text) && Math.abs(cx(w) - cx(p)) < 9 && w.top >= p.top - 9 && w.top < p.top).sort((a, b) => a.x0 - b.x0).map((w) => w.text).join('');
          if (jp) p.words.unshift(jp);
          const o = info[p.name] = { names: p.words, shift: null, shiftFrom: null, off: false, igkA: 0, remark: [] };
          const near = (w, a, b) => !w.bold && Math.abs(cx(w) - cx(p)) < 9 && w.top >= a && w.top < b;
          const txt = inb.filter((w) => near(w, p.bottom - 1, p.bottom + 22)).sort((a, b) => a.top - b.top).map((w) => w.text).join('').replace(/\s/g, '');
          const m = txt.match(/(\d{1,2}(?::\d{2})?)-(\d{1,2}(?::\d{2})?)/);
          if (m) { o.shift = [m[1], m[2]]; o.shiftFrom = 'text'; }
          else if (/(\d{1,2}:\d{2})-/.test(txt)) { o.shift = [txt.match(/(\d{1,2}:\d{2})-/)[1], null]; o.shiftFrom = 'text'; o.remark.push('終了時刻なし(要確認)'); }
          if (/OFF\?/.test(txt)) o.remark.push('OFF?(要確認)'); else if (/Off/.test(txt)) o.off = true;
          if (/AMoff/i.test(txt)) o.remark.push('AM off(午前休)');
          // ★ 追加: 「確認中」は時間が決まっていない印。黄色いセルを時間と読まないようにする (例: 11/25 Bjoerg)
          if (!o.shift && /確認中/.test(txt)) { o.remark.push('確認中(要確認)'); o.tbd = true; }
          if (!o.shift && !o.off) {
            const above = inb.filter((w) => near(w, p.top - 24, p.top - 3)).sort((a, b) => a.top - b.top).map((w) => w.text).join('').replace(/\s/g, '');
            const m3 = above.match(/(\d{1,2}(?::\d{2})?)-(\d{1,2}(?::\d{2})?)/);
            if (m3) { o.shift = [m3[1], m3[2]]; o.shiftFrom = 'above'; }
          }
          // ★ 修正: 名前のすぐ下が「AM off」などで、時間がもっと下に書いてある場合 (例: 10/13 Linh「14:15-18:15」)。
          // 同じ列で、次の人の名前の手前まで探す (時刻の「:」があるものだけ。部屋番号などを拾わないため)
          if (!o.shift && !o.off) {
            const nextTop = Math.min(y1, ...people.filter((q) => q !== p && Math.abs(cx(q) - cx(p)) < 7 && q.top > p.top).map((q) => q.top));
            const below = inb.filter((w) => near(w, p.bottom + 22, nextTop)).sort((a, b) => a.top - b.top).map((w) => w.text).join('').replace(/\s/g, '');
            const m4 = below.match(/(\d{1,2}:\d{2})-(\d{1,2}(?::\d{2})?)/);
            if (m4) { o.shift = [m4[1], m4[2]]; o.shiftFrom = 'text'; }
          }
        }
        for (const w of inb) if (w.text === '早退') {
          const c = people.filter((p) => Math.abs(cx(w) - cx(p)) < 9 && p.top <= w.top);
          if (c.length) info[c.reduce((a, b) => (b.top > a.top ? b : a)).name].remark.push('早退');
        }
        // 時間の記載がない人: 名前の下の色付きセルの範囲を左の時間軸と照合
        for (const p of people) {
          const o = info[p.name]; if (o.shift || o.off || o.tbd) continue;
          const nextTop = Math.min(9e9, ...people.filter((q) => q !== p && Math.abs(cx(q) - cx(p)) < 7 && q.top > p.top).map((q) => q.top));
          // ★ 修正: グレーのセルは勤務ではない (休みの印) ので数えない (例: 11/20 Linh の列が全部グレー)
          const col = rects.filter((r) => r.x0 - 0.5 <= cx(p) && cx(p) <= r.x1 + 0.5 && r.top >= y0 && r.top < y1 && r.bottom >= p.top - 6 && r.top < nextTop && r.color !== '#ffffff' && !isGrey(r.color));
          const rs = col.flatMap(covered);
          if (rs.length) { o.shift = [hm(Math.min(...rs.map((x) => x.t))), hm(Math.max(...rs.map((x) => x.t + x.d)))]; o.shiftFrom = 'color'; }
          // ★ 追加: 時間がどこからも読めなかった人は、プレビューで黄色にして確認してもらう
          else if (!o.tbd && !o.remark.some((r) => r.includes('要確認'))) o.remark.push('時間の記載なし(要確認)');
        }
        // 洋紅セル = IGKA (対象者のみ)
        // ★ 修正: 横に並んだ洋紅セルは1つの四角形で描かれる。以前は幅 11.5 ごとに人数を割っていたが、PDFの縮尺で列の幅が変わり
        // (11月の表は1列 約14.7)、同じ人を2回数えることがあった (例: 11/4 Gio 2時間 → 3時間)。名前の列ごとに1回だけ数える
        const mags = rects.filter((r) => r.color === MAGENTA && r.x0 >= xa && r.x0 < xb && r.top >= y0 && r.top < y1);
        for (const r of mags) {
          const cols = []; // 列ごとに、その洋紅セルより上で一番下にいる人
          for (const p of people.filter((q) => cx(q) >= r.x0 - 1 && cx(q) <= r.x1 + 1 && q.top <= r.bottom - 1)) {
            const g = cols.findIndex((q) => Math.abs(cx(q) - cx(p)) < 7);
            if (g < 0) cols.push(p); else if (p.top > cols[g].top) cols[g] = p;
          }
          const mins = covered(r).reduce((s, x) => s + x.d, 0);
          for (const p of cols) if (IGKA_OK.has(p.name)) info[p.name].igkA += mins / 60;
        }
        for (const [n, o] of Object.entries(info)) { if (BOTH_CAMPUS.has(n)) o.campus = opts.campus || '名谷'; if (o.remark.includes('早退') === false && false) o.remark = o.remark; }
        out[dw.text] = info;
      });
    }
    return out; // { '9/28': { Yuri: {names, shift:[s,e], shiftFrom, off, igkA, remark[], campus?} } }
  }

  const norm = (s) => { if (s == null) return ''; return s.includes(':') ? hm(tmin(s)) : hm(+s * 60); };
  const key = (s) => s.toLowerCase().replace(/\s+/g, '');
  // ★ 追加: シフト表の呼び名 → 名簿の名前。クラウドの名簿に呼び名 (別名) が入っていない人用。
  // 指定した対応なので校舎を問わず名簿全体から探す (大文字小文字・空白の違いは無視)
  const NAME_MAP = { linh: 'Tran ThiNhat Linh', hamna: 'Ashfaq Hamna', monika: 'MonikaChowdhury', sadia: 'Islam Sadia' };
  // 名前の照合: 日本語の姓 > 別名の完全一致。校舎(campus)が合う人を優先 (Mariko が六甲/名谷で別人のため)
  const matchEmp = (employees, words, campus, both) => {
    const pools = both ? [employees] : [employees.filter((e) => e.location === campus)];
    for (const pool of pools) {
      const jp = words.filter((w) => /[^\x00-\x7F]/.test(w));
      const hit = pool.find((e) => jp.some((w) => key(e.name).startsWith(key(w)) || (e.aliases || []).some((a) => key(a) === key(w))))
        || pool.find((e) => words.some((w) => [e.name, ...(e.aliases || [])].some((n) => key(n) === key(w))));
      if (hit) return hit;
    }
    for (const w of words) {
      const full = NAME_MAP[key(w)]; if (!full) continue;
      const hit = employees.find((e) => [e.name, ...(e.aliases || [])].some((n) => key(n) === key(full)));
      if (hit) return hit;
    }
    return null;
  };
  
  // ★ 修正: pickYear の時區問題修正
  const pickYear = (mo, da, start, end) => {
    const [sy, sm, sd] = start.split('-').map(Number);
    const [ey, em, ed] = end.split('-').map(Number);
    const s = new Date(sy, sm - 1, sd), e = new Date(ey, em - 1, ed); 
    let best = null;
    for (const y of [sy - 1, sy, sy + 1, ey]) {
      const d = new Date(y, mo - 1, da); 
      if (d >= s && d <= e) best = y;
    }
    return best;
  };

  // opts: { start:'YYYY-MM-DD', end:'YYYY-MM-DD', campus:'myodani'|'rokko' } — 範囲(給与期間 16日〜翌15日)外の日は除外
  function toEntries(parsed, employees, opts) {
    const entries = [], unmatched = []; let outOfRange = 0;
    for (const [md, info] of Object.entries(parsed)) {
      const [mo, da] = md.split('/').map(Number);
      const y = pickYear(mo, da, opts.start, opts.end);
      if (y == null) { outOfRange++; continue; }
      const date = `${y}/${String(mo).padStart(2, '0')}/${String(da).padStart(2, '0')}`;
      for (const o of Object.values(info)) {
        if (o.names.some((n) => RETIRED.has(String(n).toLowerCase()))) continue;
        const both = !!o.campus || BOTH_CAMPUS.has(o.names[o.names.length - 1]);
        const emp = matchEmp(employees, o.names, opts.campus, both);
        if (!emp) { unmatched.push({ date, name: o.names.join(' ') }); continue; }
        if (o.otherCampus) continue; // 別校舎の表に載っている日は、その校舎のPDFを優先
        const remark = [...o.remark]; if (o.off) remark.unshift('Off(休み)');
        if (o.campus) remark.unshift(`${o.campus}校勤務`);
        if (o.drive && o.drive.length) remark.push(o.drive.join(' / '));
        entries.push({ empId: emp.id, empName: emp.name, date, shiftStart: o.shift ? norm(o.shift[0]) : '', shiftEnd: o.shift && o.shift[1] ? norm(o.shift[1]) : '',
          igkAHours: emp.type === 'full' ? null : o.igkA, driveMins: o.driveMins || 0, remark: remark.join(' / '), off: o.off, src: opts.campus,
          estimated: o.shiftFrom === 'color' }); // 備考には書かず、プレビューの黄色表示だけに使う
      }
    }
    return { entries, unmatched, outOfRange };
  }

                            <h2 className="text-xl font-bold flex items-center gap-2 text-gray-800">
                                <span className="bg-blue-600 text-white px-2 py-0.5 rounded-md shadow text-sm font-mono">{padNum(employee.num)}</span>
                                {employee.name}
                            </h2>
                            {/* ★ PDF 提示區域 */}
                            {pdfAttachments && pdfAttachments.length > 0 && (
                                <div className="mt-1 flex flex-wrap gap-1">
                                    {pdfAttachments.map((pdf, idx) => (
                                        <span key={idx} className="bg-green-100 text-green-700 text-[10px] px-1.5 py-0.5 rounded border border-green-200 flex items-center shadow-sm">
                                            <i className="fa-solid fa-paperclip mr-1"></i> {pdf.name}
                                        </span>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="text-[11px] font-bold text-gray-600 tracking-wide bg-gray-50 pl-3 pr-1 py-1 rounded shadow-sm flex items-center gap-3 border border-gray-200">
                                <span>対象月: {payMonth.replace('-', '')} | 雇用形態: {employee.type === 'full' ? '正社員' : employee.type === 'driver' ? '司機' : 'アルバイト'}</span>
                                <button
                                    onClick={() => setLocalEditable(!localEditable)}
                                    disabled={isLocked}
                                    className={`px-3 py-1 rounded border shadow-sm transition-colors font-bold flex items-center gap-1.5 ${
                                        isLocked ? 'opacity-50 cursor-not-allowed bg-gray-200 text-gray-400 border-gray-300'
                                        : localEditable ? 'bg-white text-blue-700 border-blue-400'
                                        : 'bg-gray-400 text-white border-gray-500 hover:bg-gray-500'
                                    }`}
                                >
                                    <i className={`fa-solid ${localEditable ? 'fa-pen-to-square' : 'fa-lock'}`}></i>
                                    {localEditable ? '手動入力 ON' : '手動入力 OFF'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto custom-scrollbar mx-2 pb-2 min-w-0">
                        <table className="w-full text-left border-collapse whitespace-nowrap text-[11px]">
                            <thead className="bg-gray-100 sticky top-0 shadow-sm z-10 text-gray-700">
                                <tr>
                                    <th className="border border-gray-200 p-1 min-w-[70px]">日付</th>
                                    <th className="border border-gray-200 p-1 text-center bg-blue-50/50">入室1<br/>退室1</th>
                                    <th className="border border-gray-200 p-1 text-center bg-blue-50/50">入室2<br/>退室2</th>
                                    <th className="border border-gray-200 p-1 text-blue-800 text-center">シフト</th>
                                    <th className="border border-gray-200 p-1 text-center">休憩(分)</th>
                                    <th className="border border-gray-200 p-1 bg-green-50 text-center">勤務時間</th>
                                    {employee.type === 'full' && <><th className="border border-gray-200 p-1 text-center">早残業</th><th className="border border-gray-200 p-1 text-center">後残業</th></>}
                                    {employee.type === 'driver' && <><th className="border border-gray-200 p-1 text-center">運転時間(分)</th><th className="border border-gray-200 p-1 text-center">IGK A(H)</th><th className="border border-gray-200 p-1 text-center">IGK B(H)</th></>}
                                    {employee.type === 'part' && <><th className="border border-gray-200 p-1 text-center">IGK A(H)</th><th className="border border-gray-200 p-1 text-center">IGK B(H)</th></>}
                                    <th className="border border-gray-200 p-1 bg-yellow-50 text-yellow-800 text-center w-[70px]">{feeLabel}</th>
                                    <th className="border border-gray-200 p-1 min-w-[120px]">備考・出勤狀況</th>
                                </tr>
                            </thead>
                            <tbody>
                                {dates.map((date) => {
                                    const isH = isHoliday(date);
                                    const dayData = data[date] || {};
                                    const hasData = !!(dayData.in?.trim() || dayData.out?.trim() || dayData.in2?.trim() || dayData.out2?.trim());

                                    let shiftStart = dayData.shiftStart || '';
                                    let shiftEnd = dayData.shiftEnd || '';

                                    if (employee.type === 'full' && !isH && !shiftStart && !shiftEnd) {
                                        shiftStart = employee.location === 'rokko' ? '09:30' : '09:15';
                                        shiftEnd = employee.location === 'rokko' ? '18:30' : '18:15';
                                    }

                                    // ★ 修正: IGKA が予定として入っているだけ (打刻なし) の日は出勤日に数えない
                                    if (hasData || parseInt(dayData.driveMins) > 0) {
                                        workDays++;
                                    }
                                    const igkaWithoutPunch = !hasData && parseFloat(dayData.igkAHours) > 0;

                                    // ★ 修正: 檢查雙假別
                                    const isLeave = (dayData.leaveType && (dayData.leaveType.includes('休') || dayData.leaveType.includes('欠'))) ||
                                                    (dayData.leaveType2 && (dayData.leaveType2.includes('休') || dayData.leaveType2.includes('欠')));

                                    const processLeave = (lt) => {
                                        if (!lt) return;
                                        if (lt === '有休(2時間)') leave.h2++;
                                        if (lt === '有休(4時間)') leave.h4++;
                                        if (lt === '有休(6時間)') leave.h6++;
                                        if (lt === '有休(8時間)') leave.h8++;
                                        if (lt === '病欠(2時間)') sick.h2++;
                                        if (lt === '病欠(4時間)') sick.h4++;
                                        if (lt === '病欠(6時間)') sick.h6++;
                                        if (lt === '病欠(8時間)') sick.h8++;
                                        if (lt === '欠勤(2時間)') absent.h2++;
                                        if (lt === '欠勤(4時間)') absent.h4++;
                                        if (lt === '欠勤(6時間)') absent.h6++;
                                        if (lt === '欠勤(8時間)') absent.h8++;
                                    };
                                    processLeave(dayData.leaveType);
                                    processLeave(dayData.leaveType2);

                                    const mins1 = calculateMinutes(dayData.in, dayData.out);
                                    const mins2 = calculateMinutes(dayData.in2, dayData.out2);
                                    const inOutMins = mins1 + mins2;
                                    totalInOutGlobal += inOutMins;

                                    const getLeaveHours = (lt) => {
                                        const m = lt ? lt.match(/\((\d)時間\)/) : null;
                                        return m ? parseInt(m[1]) : 0;
                                    };
                                    const leaveHrs = getLeaveHours(dayData.leaveType) + getLeaveHours(dayData.leaveType2);

                                    // ★ 修正: 依據欄位輸入計算扣休，若未填則根據正社員預設規則
                                    let parsedBreak = parseInt(dayData.break);
                                    let defaultBreak = (employee.type === 'full' ? (leaveHrs >= 4 ? 0 : 60) : 0);
                                    let breakMins = hasData ? (!isNaN(parsedBreak) ? parsedBreak : defaultBreak) : 0;

                                    const workMins = Math.max(0, inOutMins - breakMins);
                                    const workHours = workMins / 60;
                                    totalWorkMinsGlobal += workMins;

                                    let early = 0, late = 0;
                                    if (employee.type === 'full' && hasData && shiftStart && shiftEnd) {
                                        let sStart = dayjs(`2000-01-01 ${shiftStart}`);
                                        let sEnd = dayjs(`2000-01-01 ${shiftEnd}`);

                                        let aIn = dayData.in ? dayjs(`2000-01-01 ${dayData.in}`) : null;
                                        let latestOutTime = dayData.out2 || dayData.out;
                                        let aOut = latestOutTime ? dayjs(`2000-01-01 ${latestOutTime}`) : null;

                                        if (sEnd.isBefore(sStart)) sEnd = sEnd.add(1, 'day');
                                        if (aIn && aOut && aOut.isBefore(aIn)) aOut = aOut.add(1, 'day');

                                        let adjustedSStart = sStart.clone();
                                        let adjustedSEnd = sEnd.clone();

                                        if (leaveHrs > 0) {
                                            let minsToAdjust = 0;
                                            if (leaveHrs === 2) minsToAdjust = 120;
                                            else if (leaveHrs >= 4) minsToAdjust = (leaveHrs + 1) * 60;

                                            let delayIn = aIn ? Math.max(0, aIn.diff(sStart, 'minute')) : 0;
                                            let earlyOut = aOut ? Math.max(0, sEnd.diff(aOut, 'minute')) : 0;

                                            if (earlyOut > delayIn) {
                                                adjustedSEnd = adjustedSEnd.subtract(minsToAdjust, 'minute');
                                            } else {
                                                adjustedSStart = adjustedSStart.add(minsToAdjust, 'minute');
                                            }
                                        }

                                        if (aIn) early = Math.max(0, adjustedSStart.diff(aIn, 'minute'));
                                        if (aOut) late = Math.max(0, aOut.diff(adjustedSEnd, 'minute'));

                                        earlyTotal += early;
                                        lateTotal += late;
                                    }

                                    let drive = parseInt(dayData.driveMins) || 0;
                                    // ★ 修正: 打刻がない日 (休み・欠勤) の IGKA は集計しない
                                    let igkA = hasData ? (parseFloat(dayData.igkAHours) || 0) : 0;
                                    let igkB = 0;

                                    if (employee.type === 'driver') {
                                        igkB = Math.max(0, workHours - (drive / 60));
                                        totalDrive += drive;
                                    } else if (employee.type === 'part') {
                                        igkB = Math.max(0, workHours - igkA);
                                    }
                                    totalIgkA += igkA;
                                    totalIgkB += igkB;

                                    const transFee = parseInt(dayData.transFee) || 0;
                                    totalTrans += transFee;

                                    let rowClass = "hover:bg-gray-200 border-b transition-colors ";
                                    if (isLeave) rowClass += "leave-row ";
                                    else if (isH) rowClass += "holiday-row holiday-text ";
                                    else if (hasData) rowClass += "worked-row ";

                                    return (
                                        <tr key={date} className={rowClass}>
                                            <td className="border border-gray-200 p-1 text-center align-middle font-mono">{dayjs(date).format('MM/DD')}({['日','月','火','水','木','金','土'][dayjs(date).day()]})</td>

                                            <td className="border border-gray-200 p-0.5 align-middle">
                                                <div className="flex flex-col gap-1 items-center">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5" value={dayData.in || ''} placeholder="--:--" onChange={e => handleInput(date, 'in', e.target.value)} />
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5" value={dayData.out || ''} placeholder="--:--" onChange={e => handleInput(date, 'out', e.target.value)} />
                                                </div>
                                            </td>

                                            <td className="border border-gray-200 p-0.5 align-middle">
                                                <div className="flex flex-col gap-1 items-center">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5 text-gray-500" value={dayData.in2 || ''} placeholder="--:--" onChange={e => handleInput(date, 'in2', e.target.value)} />
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5 text-gray-500" value={dayData.out2 || ''} placeholder="--:--" onChange={e => handleInput(date, 'out2', e.target.value)} />
                                                </div>
                                            </td>

                                            <td className="border border-gray-200 p-0.5 text-center text-blue-600 font-bold bg-blue-50/20 align-middle">
                                                <div className="flex justify-center items-center gap-0.5">
                                                    <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftStart} onChange={e=>handleInput(date,'shiftStart',e.target.value)} />
                                                    -
                                                    <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftEnd} onChange={e=>handleInput(date,'shiftEnd',e.target.value)} />
                                                </div>
                                            </td>

                                            <td className="border border-gray-200 p-0.5 text-center align-middle">
                                                {/* ★ 修正: 依據輸入值直接顯示，不再強制顯示未保存的60 */}
                                                <input disabled={isLocked || !localEditable} className="w-10 text-center bg-transparent outline-none border border-gray-200 rounded py-0.5 mx-auto block" value={dayData.break !== undefined ? dayData.break : (hasData && employee.type==='full' ? (leaveHrs >= 4 ? '0' : '60') : '')} onChange={e=>handleInput(date,'break',e.target.value)} />
                                            </td>

                                            <td className="border border-gray-200 p-1 text-center font-bold text-green-800 bg-green-50 align-middle whitespace-normal">
                                                {workMins > 0 ? formatVerboseMins(workMins) : ''}
                                            </td>

                                            {employee.type === 'full' && <>
                                                <td className="border border-gray-200 p-1 text-center text-orange-600 align-middle">{early > 0 ? formatVerboseMins(early) : ''}</td>
                                                <td className="border border-gray-200 p-1 text-center text-orange-600 align-middle">{late > 0 ? formatVerboseMins(late) : ''}</td>
                                            </>}
                                            {employee.type === 'driver' && <>
                                                <td className="border border-gray-200 p-0.5 text-center align-middle">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center border border-gray-200 outline-none rounded bg-transparent font-bold text-purple-700 py-0.5" value={dayData.driveMins || ''} onChange={e=>handleInput(date,'driveMins',e.target.value)} />
                                                    {dayData.driveMins > 0 && <div className="text-[9px] text-purple-600 mt-0.5">{formatVerboseMins(dayData.driveMins)}</div>}
                                                </td>
                                                <td className="border border-gray-200 p-0.5 text-center align-middle">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center border border-gray-200 outline-none rounded bg-transparent py-0.5 text-blue-700" value={dayData.igkAHours || ''} onChange={e=>handleInput(date,'igkAHours',e.target.value)} />
                                                    {dayData.igkAHours > 0 && <div className="text-[9px] text-blue-600 mt-0.5">{formatVerboseHours(dayData.igkAHours)}</div>}
                                                    {igkaWithoutPunch && <div className="text-[9px] text-red-500 font-bold">打刻なし・未計上</div>}
                                                </td>
                                                <td className="border border-gray-200 p-1 text-center font-bold text-blue-800 align-middle whitespace-normal">{igkB > 0 ? formatVerboseHours(igkB) : ''}</td>
                                            </>}
                                            {employee.type === 'part' && <>
                                                <td className="border border-gray-200 p-0.5 text-center align-middle">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center border border-gray-200 outline-none rounded bg-transparent py-0.5 text-blue-700" value={dayData.igkAHours || ''} onChange={e=>handleInput(date,'igkAHours',e.target.value)} />
                                                    {dayData.igkAHours > 0 && <div className="text-[9px] text-blue-600 mt-0.5">{formatVerboseHours(dayData.igkAHours)}</div>}
                                                    {igkaWithoutPunch && <div className="text-[9px] text-red-500 font-bold">打刻なし・未計上</div>}
                                                </td>
                                                <td className="border border-gray-200 p-1 text-center font-bold text-blue-800 align-middle whitespace-normal">{igkB > 0 ? formatVerboseHours(igkB) : ''}</td>
                                            </>}
                                            <td className="border border-gray-200 p-0 bg-yellow-50 align-middle w-[70px]">
                                                <input disabled={isLocked || !localEditable} className="w-full text-right border-none outline-none px-1 py-1 bg-transparent font-bold text-yellow-800" value={dayData.transFee || ''} onChange={e=>handleInput(date,'transFee',e.target.value)} />
                                            </td>

                                            <td className="border border-gray-200 p-1 align-middle">
                                                <div className="flex flex-col gap-1 px-1">
                                                    {employee.type === 'full' && !isH && (
                                                        <>
                                                            <select
                                                                disabled={isLocked || !localEditable}
                                                                className="w-full max-w-[120px] text-[10px] bg-white border border-gray-300 rounded outline-none text-gray-700 cursor-pointer py-0.5"
                                                                value={dayData.leaveType || ''}
                                                                onChange={e => handleInput(date, 'leaveType', e.target.value)}
                                                            >
                                                                <option value="">- 休暇選択 1 -</option>
                                                                <option value="有休(2時間)">有休2H</option>
                                                                <option value="有休(4時間)">有休4H</option>
                                                                <option value="有休(6時間)">有休6H</option>
                                                                <option value="有休(8時間)">有休8H</option>
                                                                <option value="病欠(2時間)">病欠2H</option>
                                                                <option value="病欠(4時間)">病欠4H</option>
                                                                <option value="病欠(6時間)">病欠6H</option>
                                                                <option value="病欠(8時間)">病欠8H</option>
                                                                <option value="欠勤(2時間)">欠勤2H</option>
                                                                <option value="欠勤(4時間)">欠勤4H</option>
                                                                <option value="欠勤(6時間)">欠勤6H</option>
                                                                <option value="欠勤(8時間)">欠勤8H</option>
                                                            </select>
                                                            {/* ★ 修正: 加入第二個請假選單以應對半天有休+半天欠勤的狀況 */}
                                                            <select
                                                                disabled={isLocked || !localEditable}
                                                                className="w-full max-w-[120px] text-[10px] bg-white border border-gray-300 rounded outline-none text-gray-700 cursor-pointer py-0.5"
                                                                value={dayData.leaveType2 || ''}
                                                                onChange={e => handleInput(date, 'leaveType2', e.target.value)}
                                                            >
                                                                <option value="">- 休暇選択 2 -</option>
                                                                <option value="有休(2時間)">有休2H</option>
                                                                <option value="有休(4時間)">有休4H</option>
                                                                <option value="有休(6時間)">有休6H</option>
                                                                <option value="有休(8時間)">有休8H</option>
                                                                <option value="病欠(2時間)">病欠2H</option>
                                                                <option value="病欠(4時間)">病欠4H</option>
                                                                <option value="病欠(6時間)">病欠6H</option>
                                                                <option value="病欠(8時間)">病欠8H</option>
                                                                <option value="欠勤(2時間)">欠勤2H</option>
                                                                <option value="欠勤(4時間)">欠勤4H</option>
                                                                <option value="欠勤(6時間)">欠勤6H</option>
                                                                <option value="欠勤(8時間)">欠勤8H</option>
                                                            </select>
                                                        </>
                                                    )}
                                                    <input disabled={isLocked || !localEditable} type="text" className="border-none bg-transparent w-full focus:ring-0 outline-none text-xs" placeholder="備註..." value={dayData.remark || ''} onChange={e => handleInput(date, 'remark', e.target.value)} />
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    <div className="shrink-0 px-3 pb-3">
                        <div className="flex gap-2 flex-wrap items-stretch border-t border-gray-200 pt-2 mt-1">

                            <div className="bg-white rounded-lg p-2 flex flex-col shadow-sm border border-gray-200 min-w-[150px] flex-[1.5]">
                                <div className="text-[10px] text-gray-500 font-bold mb-1 text-center border-b border-gray-100 pb-1">出勤・休暇状況</div>
                                <div className="flex justify-between items-end px-1 mt-0.5">
                                    <span className="text-[10px] text-gray-600 font-bold">実出勤:</span>
                                    <span className="text-sm font-black text-gray-800">{workDays} <span className="text-[9px] font-normal text-gray-500">日</span></span>
                                </div>
                                {employee.type === 'full' && (
                                    <>
                                        {[
                                            buildLeaveStr(leave, '有休'),
                                            buildLeaveStr(sick, '病欠'),
                                            buildLeaveStr(absent, '欠勤')
                                        ].filter(Boolean).map((item, idx) => (
                                            <div key={idx} className="flex flex-col px-1 mt-1 border-t border-gray-50 pt-0.5">
                                                <span className={`text-[9px] font-bold ${item.label === '有休' ? 'text-blue-600' : 'text-red-500'}`}>{item.label}:</span>
                                                <span className={`text-[9px] font-bold text-right leading-tight ${item.label === '有休' ? 'text-blue-700' : 'text-red-600'}`}>
                                                    {item.str}
                                                </span>
                                            </div>
                                        ))}
                                    </>
                                )}
                            </div>

                            {employee.type === 'full' && (
                                <>
                                    <div className="bg-red-50 rounded-lg p-2 text-center shadow-sm border border-red-100 flex-[1] min-w-[140px] flex items-center flex-col justify-center">
                                        <div className="text-[10px] text-red-700 font-bold mb-1">残業合計 (早+後)</div>
                                        <div className="text-sm font-black text-red-600">
                                            {formatVerboseMins(earlyTotal+lateTotal) || '0分 (0.00H)'}
                                        </div>
                                    </div>
                                </>
                            )}

                            {employee.type === 'part' && (
                                <>
                                    <div className="bg-indigo-50 rounded-lg p-2 text-center shadow-sm border border-indigo-100 flex-[1.5] min-w-[180px] flex items-center flex-col justify-center">
                                        <div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div>
                                        <div className="text-xs font-black text-indigo-800 flex flex-col items-center leading-tight">
                                            <span>{formatVerboseHours(totalIgkA) || '0分 (0.00H)'} <span className="text-indigo-400">+</span> {formatVerboseHours(totalIgkB) || '0分 (0.00H)'}</span>
                                            <span className="text-[13px] mt-0.5"><span className="text-indigo-400">=</span> {formatVerboseHours(totalIgkA+totalIgkB) || '0分 (0.00H)'}</span>
                                        </div>
                                    </div>
                                </>
                            )}

                            {employee.type === 'driver' && (
                                <>
                                    <div className="bg-purple-50 rounded-lg p-2 text-center shadow-sm border border-purple-200 flex-[1] min-w-[110px] flex items-center flex-col justify-center">
                                        <div className="text-[10px] text-purple-700 font-bold mb-1">運転実績</div>
                                        <div className="text-sm font-black text-purple-800">{formatVerboseMins(totalDrive) || '0分 (0.00H)'}</div>
                                    </div>
                                    <div className="bg-indigo-50 rounded-lg p-2 text-center shadow-sm border border-indigo-100 flex-[1.5] min-w-[180px] flex items-center flex-col justify-center">
                                        <div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div>
                                        <div className="text-xs font-black text-indigo-800 flex flex-col items-center leading-tight">
                                            <span>{formatVerboseHours(totalIgkA) || '0分 (0.00H)'} <span className="text-indigo-400">+</span> {formatVerboseHours(totalIgkB) || '0分 (0.00H)'}</span>
                                            <span className="text-[13px] mt-0.5"><span className="text-indigo-400">=</span> {formatVerboseHours(totalIgkA+totalIgkB) || '0分 (0.00H)'}</span>
                                        </div>
                                    </div>
                                </>
                            )}

// 名谷・六甲のシフトPDFを「複数まとめて」選択できます。毎回アップロードして使う運用向けです。
// 集計期間は画面上の「期間設定」(支給月から自動: 前月16日〜当月15日) を使い、期間外の日は取り込みません。
const handleShiftPdf = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setShiftBusy(true);
    try {
        // PDFの色・座標を読むため、このときだけ pdf.js 6.x を読み込む (既存の 3.11 は有休PDFにそのまま使用)
        const pdfjs = await window.__dynImport('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.min.mjs');
        pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.min.mjs';
        const merged = new Map(), unmatched = [], used = [], failed = [];
        let outOfRange = 0;
        for (const file of files) {
            try {
                const data = new Uint8Array(await file.arrayBuffer());
                const r = await window.ShiftPdfImport.parseAny(pdfjs, data, { campus: '名谷' });
                const t = window.ShiftPdfImport.toEntries(r.parsed, employees, { start: batchStart, end: batchEnd, campus: r.campus });
                t.entries.forEach(en => merged.set(`${en.empId}_${en.date}`, en)); // 同じ人・同じ日が重複したら後のファイルを採用
                unmatched.push(...t.unmatched);
                outOfRange += t.outOfRange;
                used.push(`${file.name} (${r.type === 'rokko' ? '六甲' : '名谷'}・${t.entries.length}件)`);
            } catch (err) {
                addLog(`[シフトPDF] ${file.name} の解析に失敗: ${err.message}`, 'error');
                failed.push({ name: file.name, msg: err.message });
            }
        }
        const entries = [...merged.values()].sort((a, b) => a.date.localeCompare(b.date) || a.empName.localeCompare(b.empName));
        // ★ 追加: 読めなかったファイルはプレビューに赤字で出す (同じ理由はまとめて1行)
        const errors = [...new Set(failed.map(f => f.msg))].map(msg => `✕ ${failed.filter(f => f.msg === msg).map(f => f.name).join('、')}：${msg}`);
        setShiftPreview({ entries, unmatched, outOfRange, files: used, errors, start: batchStart, end: batchEnd });
        addLog(`[シフトPDF] ${files.length}ファイル / ${entries.length}件を解析しました。プレビューで確認してください。`, 'info');
    } catch (err) {
        addLog(`[シフトPDF] エラー: ${err.message}`, 'error');
    }
    setShiftBusy(false);
    e.target.value = null; // 同じファイルを再度選べるようにする
};

const pdfCol = db.collection('igk_pdfs');

const savePdfToCloud = async (pdf, empId) => {
    try {
        let url = pdf.dataUrl;
        // Firestore の1ドキュメントは約1MBまで。大きい場合は画質を下げて保存する
        if (url.length > 900000) {
            const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
            const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
            c.getContext('2d').drawImage(img, 0, 0);
            url = c.toDataURL('image/jpeg', 0.55);
        }
        if (url.length > 1000000) throw new Error('画像が大きすぎて保存できません');
        await pdfCol.doc(pdf.id).set({ empId, name: pdf.name, dataUrl: url, width: pdf.width, height: pdf.height, payMonth, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    } catch (err) { addLog(`[PDF] クラウド保存エラー (${pdf.name}): ${err.message}`, 'error'); }
};

                            // ★ 修正: 檢查雙假別並累加計算
                            const isLeave = (d.leaveType && (d.leaveType.includes('休') || d.leaveType.includes('欠'))) ||
                                            (d.leaveType2 && (d.leaveType2.includes('休') || d.leaveType2.includes('欠')));

                            const processLeave = (lt) => {
                                if (!lt) return;
                                if (lt === '有休(2時間)') leave.h2++;
                                if (lt === '有休(4時間)') leave.h4++;
                                if (lt === '有休(6時間)') leave.h6++;
                                if (lt === '有休(8時間)') leave.h8++;
                                if (lt === '病欠(2時間)') sick.h2++;
                                if (lt === '病欠(4時間)') sick.h4++;
                                if (lt === '病欠(6時間)') sick.h6++;
                                if (lt === '病欠(8時間)') sick.h8++;
                                if (lt === '欠勤(2時間)') absent.h2++;
                                if (lt === '欠勤(4時間)') absent.h4++;
                                if (lt === '欠勤(6時間)') absent.h6++;
                                if (lt === '欠勤(8時間)') absent.h8++;
                            };
                            processLeave(d.leaveType);
                            processLeave(d.leaveType2);

                            const mins1 = calculateMinutes(d.in, d.out);
                            const mins2 = calculateMinutes(d.in2, d.out2);
                            const inOutMins = mins1 + mins2;

                            const getLeaveHours = (lt) => {
                                const m = lt ? lt.match(/\((\d)時間\)/) : null;
                                return m ? parseInt(m[1]) : 0;
                            };
                            const leaveHrs = getLeaveHours(d.leaveType) + getLeaveHours(d.leaveType2);

                            // ★ 修正: Excel匯出也同步使用欄位設定的休息時間
                            let parsedBreak = parseInt(d.break);
                            let defaultBreak = (emp.type === 'full' ? (leaveHrs >= 4 ? 0 : 60) : 0);
                            let breakMins = hasData ? (!isNaN(parsedBreak) ? parsedBreak : defaultBreak) : 0;

                            const workMins = Math.max(0, inOutMins - breakMins);
                            const workHours = workMins / 60;
                            totalWorkMinsGlobal += workMins;

                            let early = 0, late = 0;
                            if (emp.type === 'full' && hasData && shiftStart && shiftEnd) {
                                let sStart = dayjs(`2000-01-01 ${shiftStart}`);
                                let sEnd = dayjs(`2000-01-01 ${shiftEnd}`);
                                let aIn = d.in ? dayjs(`2000-01-01 ${d.in}`) : null;
                                let latestOutTime = d.out2 || d.out;
                                let aOut = latestOutTime ? dayjs(`2000-01-01 ${latestOutTime}`) : null;

                                if (sEnd.isBefore(sStart)) sEnd = sEnd.add(1, 'day');
                                if (aIn && aOut && aOut.isBefore(aIn)) aOut = aOut.add(1, 'day');

                                let adjustedSStart = sStart.clone();
                                let adjustedSEnd = sEnd.clone();

                                if (leaveHrs > 0) {
                                    let minsToAdjust = 0;
                                    if (leaveHrs === 2) minsToAdjust = 120;
                                    else if (leaveHrs >= 4) minsToAdjust = (leaveHrs + 1) * 60;

                                    let delayIn = aIn ? Math.max(0, aIn.diff(sStart, 'minute')) : 0;
                                    let earlyOut = aOut ? Math.max(0, sEnd.diff(aOut, 'minute')) : 0;

                                    if (earlyOut > delayIn) {
                                        adjustedSEnd = adjustedSEnd.subtract(minsToAdjust, 'minute');
                                    } else {
                                        adjustedSStart = adjustedSStart.add(minsToAdjust, 'minute');
                                    }
                                }

                                if (aIn) early = Math.max(0, adjustedSStart.diff(aIn, 'minute'));
                                if (aOut) late = Math.max(0, aOut.diff(adjustedSEnd, 'minute'));

                                earlyTotal += early;
                                lateTotal += late;
                            }

                            let drive = parseInt(d.driveMins) || 0;
                            // ★ 修正: 打刻がない日の IGKA は集計しない
                            let igkA = hasData ? (parseFloat(d.igkAHours) || 0) : 0;
                            let igkB = 0;

                            if (emp.type === 'driver') {
                                igkB = Math.max(0, workHours - (drive / 60));
                                totalDrive += drive;
                            } else if (emp.type === 'part') {
                                igkB = Math.max(0, workHours - igkA);
                            }
                            totalIgkA += igkA;
                            totalIgkB += igkB;

                            const transFee = parseInt(d.transFee) || 0;
                            totalTrans += transFee;

                            const shiftStr = shiftStart && shiftEnd ? `${shiftStart}-${shiftEnd}` : '';
                            // ★ 修正: 將兩個假別都顯示在 Excel 的備註中
                            const displayRemark = [d.leaveType, d.leaveType2, d.remark].filter(Boolean).join(' / ');

                            const row = ws.addRow([
                                payMonth,
                                padNum(emp.num),
                                emp.name,
                                `${dayjs(dateStr).format('MM/DD')}(${['日','月','火','水','木','金','土'][dayjs(dateStr).day()]})`,
                                d.in || '',
                                d.out || '',
                                d.in2 || '',
                                d.out2 || '',
                                breakMins || '',
                                shiftStr,
                                workMins > 0 ? formatVerboseMins(workMins) : '',
                                early > 0 ? formatVerboseMins(early) : '',
                                late > 0 ? formatVerboseMins(late) : '',
                                igkA > 0 ? formatVerboseHours(igkA) : '',
                                igkB > 0 ? formatVerboseHours(igkB) : '',
                                d.driveMins ? formatVerboseMins(d.driveMins) : '',
                                transFee || '',
                                displayRemark
                            ]);

                            if (isLeave) {
                                row.eachCell({ includeEmpty: true }, (cell) => {
                                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFF6FF' } };
                                });
                            } else if (isH) {
                                row.eachCell({ includeEmpty: true }, (cell) => {
                                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF2F2' } };
                                    cell.font = { color: { argb: 'FFB91C1C' }, bold: true };
                                });
                            } else if (hasData) {
                                row.eachCell({ includeEmpty: true }, (cell) => {
                                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAF5FF' } };
                                });
                            }

                            curr = curr.add(1, 'day');
                        }

                        ws.addRow([]);
                        const sumTitleRow = ws.addRow([]);
                        sumTitleRow.getCell(16).value = '【月間集計】';
                        sumTitleRow.getCell(16).font = { bold: true, size: 12 };

                        const addSum = (label, value) => {
                            const r = ws.addRow([]);
                            r.getCell(16).value = label;
                            r.getCell(17).value = value;
                            r.getCell(16).font = { bold: true };
                            r.getCell(16).alignment = { horizontal: 'right' };
                            r.getCell(17).font = { bold: true };
                        };

                        addSum('実出勤日数:', `${workDays} 日`);

                        if (emp.type === 'full') {
                            const yqObj = buildLeaveStr(leave, '有休');
                            if(yqObj) addSum('有休:', yqObj.str);

                            const sickObj = buildLeaveStr(sick, '病欠');
                            if(sickObj) addSum('病欠:', sickObj.str);

                            const absentObj = buildLeaveStr(absent, '欠勤');
                            if(absentObj) addSum('欠勤:', absentObj.str);

                            addSum('残業合計(早+後):', formatVerboseMins(earlyTotal + lateTotal) || '0分 (0.00H)');
                        }

                        if (emp.type === 'part' || emp.type === 'driver') {
                            const strA = formatVerboseHours(totalIgkA) || '0分 (0.00H)';
                            const strB = formatVerboseHours(totalIgkB) || '0分 (0.00H)';
                            const strTotal = formatVerboseHours(totalIgkA+totalIgkB) || '0分 (0.00H)';
                            addSum('A+B 総労働:', `${strA} + ${strB} = ${strTotal}`);
                        }
                        if (emp.type === 'driver') {
                            addSum('運転実績:', formatVerboseMins(totalDrive) || '0分 (0.00H)');
                        }

                        addSum('実働総時間:', formatVerboseMins(totalWorkMinsGlobal) || '0分 (0.00H)');
                        if (matchedPdfs[emp.id] && matchedPdfs[emp.id].length) addSum('有休申請書 添付:', matchedPdfs[emp.id].map(p => p.name).join(', '));

                        const feeRow = ws.addRow([]);
                        feeRow.getCell(16).value = emp.type === 'full' ? '出張費合計:' : '交通費合計:';
                        feeRow.getCell(17).value = `${totalTrans.toLocaleString()} 円`;
                        feeRow.getCell(16).font = { bold: true, color: { argb: 'FF92400E' } };
                        feeRow.getCell(16).alignment = { horizontal: 'right' };
                        feeRow.getCell(17).font = { bold: true, color: { argb: 'FF92400E' } };
                        feeRow.getCell(16).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF3C7' } };
                        feeRow.getCell(17).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF3C7' } };

                        // ★ 寫入 PDF 圖片到 Excel 右側 (T欄 / 第 19 欄)
                        if (matchedPdfs[emp.id] && matchedPdfs[emp.id].length > 0) {
                            let currentImageRowOffset = 1; // 從第 2 列開始擺放
                            matchedPdfs[emp.id].forEach(imgObj => {

                                // 🚀 修正核心：切除 data:image/jpeg;base64, 前綴，只保留後面的純編碼
                                const pureBase64 = imgObj.dataUrl.split(',')[1];

                                const imageId = wb.addImage({
                                    base64: pureBase64,
                                    extension: 'jpeg',
                                });
                                // 預設寬度縮放至 500px，高度依比例縮放
                                const targetWidth = 500;
                                const ratio = targetWidth / imgObj.width;
                                const targetHeight = imgObj.height * ratio;

                                ws.addImage(imageId, {
                                    tl: { col: 19, row: currentImageRowOffset }, // T欄
                                    ext: { width: Math.round(targetWidth), height: Math.round(targetHeight) }
                                });

                                // 計算這個圖片佔用了幾個 Excel 欄高 (約20px為一列)，並留下2列空白給下一張圖
                                const rowsTaken = Math.ceil(targetHeight / 20);
                                currentImageRowOffset += rowsTaken + 2;
                            });
                        }
                    });

                    const buffer = await wb.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const url = window.URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = `IGK_Attendance_${payMonth}.xlsx`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);

                    addLog('Excelで出力しました。（集計データと色付き）', 'success');
                } catch (error) {
                    console.error("Excel出力エラー:", error);
                    addLog('Excel出力中にエラーが発生しました。', 'error');
                }
            };

            const handleParseTimecardText = () => {
                if (!timecardText.trim()) return;
                const cleanText = timecardText.replace(/[\u3000\u200B-\u200D\uFEFF]/g, ' ');
                const lines = cleanText.split('\n').map(l => l.trim()).filter(l => l);

                let currentName = null, parsedCount = 0, dupCount = 0;
                // ★ 修正: 深いコピーを作る (以前は既存の state を直接書き換えていた)
                const newData = JSON.parse(JSON.stringify(attendanceData));
                const normTime = (t) => { const [h, m] = t.split(':'); return `${h.padStart(2, '0')}:${m}`; };
                // ★ 修正: 名前の照合を厳しくする — 完全一致を優先し、部分一致は 2 文字以上の別名のみ
                const findEmp = (name) => {
                    const keysOf = (e) => [e.name, ...(e.aliases || [])].map(a => a.replace(/\s+/g, ''));
                    return employees.find(e => keysOf(e).includes(name))
                        || employees.find(e => keysOf(e).some(n => n.length >= 2 && name.length >= 2 && (n.includes(name) || name.includes(n))));
                };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (/^\d{8}$/.test(line)) {
                        if (i + 1 < lines.length) currentName = lines[++i].replace(/\s+/g, '');
                    }
                    else if (line === '入室' || line === '退室') {
                        const action = line === '入室' ? 'in' : 'out';
                        if (i + 1 < lines.length) {
                            const timeMatch = lines[i+1].match(/(\d{4}\/\d{1,2}\/\d{1,2})\s+(\d{1,2}:\d{2})/);
                            if (timeMatch && currentName) {
                                const emp = findEmp(currentName);
                                if (emp) {
                                    const dateKey = dayjs(timeMatch[1].replace(/\//g, '-')).format('YYYY/MM/DD');
                                    const t = normTime(timeMatch[2]);
                                    if (!newData[emp.id]) newData[emp.id] = {};
                                    if (!newData[emp.id][dateKey]) newData[emp.id][dateKey] = { location: emp.location };
                                    const day = newData[emp.id][dateKey];

                                    // ★ 修正: 同じ打刻がすでに入っていればスキップ (同じテキストを2回貼っても工時が倍にならない)
                                    if ((day[action] && normTime(day[action]) === t) || (day[action + '2'] && normTime(day[action + '2']) === t)) {
                                        dupCount++;
                                    } else if (!day[action]) {
                                        day[action] = t;
                                        parsedCount++;
                                    } else if (!day[action + '2']) {
                                        day[action + '2'] = t;
                                        parsedCount++;
                                    }
                                }
                            }
                        }
                    }
                }

                setAttendanceData(newData);
                addLog(`打刻解析完了: ${parsedCount}件反映${dupCount ? ` / 重複 ${dupCount}件スキップ` : ''} (複数回打刻対応)`, 'success');
                setTimecardText('');
            };

            const processTransportAndDriverData = (grid2D, localEmps, newData, resIdsSet = new Set(), sessionTracker = { trans: new Set(), drive: new Set() }) => {
                let shiftCount = 0, transCount = 0;
                grid2D.forEach((row, rIdx) => {
                    if (rIdx === 0) return;
                    let dateCell = '', nameCell = '', amountCell = '0';
                    let driveTimeStr = '';
                    let startMatch = null, endMatch = null;

                    let r0 = getSafeText(row[0]);
                    if (row.length > 15 && r0.includes('利用料金')) {
                        let resId = getSafeText(row[20]);
                        if (resId) {
                            if (resIdsSet.has(resId)) return;
                            resIdsSet.add(resId);
                        }
                        dateCell = getSafeText(row[3]);
                        nameCell = getSafeText(row[7]);
                        startMatch = getSafeText(row[3]).match(/(\d{1,2}:\d{2})/);
                        endMatch = getSafeText(row[4]).match(/(\d{1,2}:\d{2})/);
                        if (startMatch && endMatch) driveTimeStr = `${startMatch[1]}-${endMatch[1]}`;
                    } else if (row.length <= 15 && r0.match(/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/)) {
                        dateCell = r0;
                        nameCell = getSafeText(row[1]);
                        amountCell = getSafeText(row[4]);
                    } else return;

                    if (!dateCell || !nameCell) return;
                    nameCell = nameCell.trim().toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');

                    let dateStr = '';
                    const dMatch = dateCell.match(/(\d{4})[年\/\-](\d{1,2})[月\/\-](\d{1,2})/);
                    if (dMatch) dateStr = dayjs(`${dMatch[1]}/${dMatch[2]}/${dMatch[3]}`).format('YYYY/MM/DD');
                    if (!dateStr) return;

                    const amount = parseInt(amountCell.replace(/,/g, '')) || 0;
                    const driveMinsCalc = (startMatch && endMatch) ? calculateMinutes(startMatch[1], endMatch[1]) : 0;

                    if (amount === 0 && driveMinsCalc === 0) return;

                    const emp = localEmps.find(e => {
                        let s = [e.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''), ...(e.aliases||[]).map(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''))];
                        return s.includes(nameCell) || s.some(n => nameCell.includes(n) && n.length >= 2) || s.some(n => n.includes(nameCell) && nameCell.length >= 2);
                    });

                    if (emp) {
                        if (!newData[emp.id]) newData[emp.id] = {};
                        if (!newData[emp.id][dateStr]) newData[emp.id][dateStr] = { location: emp.location };

                        let sessionKey = `${emp.id}_${dateStr}`;

                        if (amount > 0) {
                            if (!sessionTracker.trans.has(sessionKey)) {
                                newData[emp.id][dateStr].transFee = 0;
                                sessionTracker.trans.add(sessionKey);
                            }
                            newData[emp.id][dateStr].transFee = (parseInt(newData[emp.id][dateStr].transFee) || 0) + amount;
                            transCount++;
                        }
                        if (driveMinsCalc > 0) {
                            if (!sessionTracker.drive.has(sessionKey)) {
                                newData[emp.id][dateStr].driveMins = 0;
                                sessionTracker.drive.add(sessionKey);
                            }
                            newData[emp.id][dateStr].driveMins = (parseInt(newData[emp.id][dateStr].driveMins) || 0) + driveMinsCalc;
                            if (driveTimeStr) {
                                let existingRemark = newData[emp.id][dateStr].remark || '';
                                if (!existingRemark.includes(driveTimeStr)) {
                                    newData[emp.id][dateStr].remark = existingRemark ? `${existingRemark} / ${driveTimeStr}` : driveTimeStr;
                                }
                            }
                            shiftCount++;
                        }
                    }
                });
                return { newData, shiftCount, transCount, resIdsSet };
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (processedFiles.includes(file.name)) return alert(`エラー: ${file.name} は既に読込済です`);

                addLog(`[Excel] 解析中: ${file.name}...`);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let globalNewData = JSON.parse(JSON.stringify(attendanceData));
                        let totalShift = 0, totalTrans = 0;

                        let sessionTracker = { trans: new Set(), drive: new Set() };

                        wb.worksheets.forEach(ws => {
                            let grid2D = [];
                            ws.eachRow((row) => {
                                let rowData = [];
                                row.eachCell({ includeEmpty: true }, (cell, colNumber) => rowData[colNumber - 1] = cell.value);
                                grid2D.push(rowData);
                            });
                            const { newData, shiftCount, transCount } = processTransportAndDriverData(grid2D, employees, globalNewData, new Set(), sessionTracker);
                            globalNewData = newData;
                            totalShift += shiftCount;
                            totalTrans += transCount;
                        });

                        if (totalShift > 0 || totalTrans > 0) {
                            setAttendanceData(globalNewData);
                            setProcessedFiles(prev => [...prev, file.name]);
                            addLog(`[Excel] 完了: 運転 ${totalShift}件, 交通費 ${totalTrans}件`, 'success');
                        } else addLog(`[Excel] データなし`, 'info');
                    } catch (err) { addLog(`[Excel] エラー: ${err.message}`, 'error'); }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const [processedResIds, setProcessedResIds] = useState(new Set());
            const handleCsvUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (processedFiles.includes(file.name)) return alert(`エラー: ${file.name} は既に読込済です`);

                addLog(`[CSV] 解析中: ${file.name}...`);
                let encoding = file.name.includes("details") ? "Shift-JIS" : "UTF-8";

                Papa.parse(file, {
                    encoding: encoding,
                    complete: function(results) {
                        try {
                            let globalNewData = JSON.parse(JSON.stringify(attendanceData));
                            let sessionTracker = { trans: new Set(), drive: new Set() };

                            const { newData, shiftCount, transCount, resIdsSet } = processTransportAndDriverData(results.data, employees, globalNewData, new Set(processedResIds), sessionTracker);

                            if (shiftCount > 0 || transCount > 0) {
                                setAttendanceData(newData);
                                setProcessedResIds(resIdsSet);
                                setProcessedFiles(prev => [...prev, file.name]);
                                addLog(`[CSV] 完了: 運転 ${shiftCount}件, 交通費 ${transCount}件`, 'success');
                            } else addLog(`[CSV] データなし`, 'info');
                        } catch (err) { addLog(`[CSV] エラー: ${err.message}`, 'error'); }
                    }
                });
                e.target.value = null;
            };

            const handleApplyFullTimers = () => {
                if (ftSelected.length === 0) return alert('社員を選択してください');
                if (!batchStart || !batchEnd) return alert('期間を設定してください');

                setAttendanceData(prev => {
                    const next = { ...prev };
                    let curr = dayjs(batchStart);
                    const end = dayjs(batchEnd);

                    while(curr.isBefore(end) || curr.isSame(end, 'day')) {
                        const dStr = curr.format('YYYY/MM/DD');

                        if (isHoliday(dStr)) {
                            curr = curr.add(1, 'day');
                            continue;
                        }

                        ftSelected.forEach(empId => {
                            if (!next[empId]) next[empId] = {};
                            if (!next[empId][dStr]) next[empId][dStr] = {};

                            if (ftShiftStart) next[empId][dStr].shiftStart = ftShiftStart;
                            if (ftShiftEnd) next[empId][dStr].shiftEnd = ftShiftEnd;

                            if (ftReason) next[empId][dStr].remark = ftReason;
                        });
                        curr = curr.add(1, 'day');
                    }
                    return next;
                });
                addLog('正社員設定を一括適用しました（休日はスキップしました）。', 'success');
            };

            const handleClearFullTimers = () => {
                if (ftSelected.length === 0) return alert('社員を選択してください');
                if (!batchStart || !batchEnd) return alert('期間を設定してください');
                if (!window.confirm(`選択した社員・期間（${batchStart} 〜 ${batchEnd}）のシフト・備考をクリアしますか？`)) return;

                setAttendanceData(prev => {
                    const next = { ...prev };
                    let curr = dayjs(batchStart);
                    const end = dayjs(batchEnd);

                    while(curr.isBefore(end) || curr.isSame(end, 'day')) {
                        const dStr = curr.format('YYYY/MM/DD');
                        ftSelected.forEach(empId => {
                            if (next[empId] && next[empId][dStr]) {
                                next[empId][dStr].shiftStart = '';
                                next[empId][dStr].shiftEnd = '';
                                next[empId][dStr].remark = '';
                                next[empId][dStr].leaveType = '';
                                next[empId][dStr].leaveType2 = ''; // ★ 修正: 同步清空假別2
                            }
                        });
                        curr = curr.add(1, 'day');
                    }
                    return next;
                });
                addLog('指定した期間の設定をクリアしました。', 'success');
            };

            const handleStaffDayToggle = (empId, dayIdx) => {
                setStaffDays(prev => {
                    const current = prev[empId] || {};
                    return { ...prev, [empId]: { ...current, [dayIdx]: !current[dayIdx] } };
                });
            };

            const handleApplyStaff = () => {
                if (!batchStart || !batchEnd) return alert('期間を設定してください');
                if (!globalStaffIn && !globalStaffOut && !globalStaffIgka) return alert('シフト開始・終了、またはIGKAを入力してください');

                const igkaVal = globalStaffIgka !== '' ? parseFloat(globalStaffIgka) : null;
                if (globalStaffIgka !== '' && (isNaN(igkaVal) || igkaVal < 0)) return alert('IGKA は数字で入力してください (例: 2, 0.5)');

                // ★ 修正: 対象日を先に計算する (setState の中で数えると件数が 0 のままになることがある)
                // ★ 修正: 土日・祝日はスキップ (正社員設定と同じ動き)
                const targets = [];
                let skippedHolidays = 0;
                let curr = dayjs(batchStart);
                const end = dayjs(batchEnd);
                while (curr.isBefore(end) || curr.isSame(end, 'day')) {
                    const dStr = curr.format('YYYY/MM/DD');
                    const dayOfWeek = curr.day();
                    Object.keys(staffDays).forEach(empId => {
                        if (staffDays[empId][dayOfWeek]) {
                            if (isHoliday(dStr)) skippedHolidays++;
                            else targets.push([empId, dStr]);
                        }
                    });
                    curr = curr.add(1, 'day');
                }

                if (targets.length === 0) {
                    addLog(`適用対象がありません。曜日が選択されているか確認してください。`, 'error');
                    return;
                }

                setAttendanceData(prev => {
                    const next = { ...prev };
                    targets.forEach(([empId, dStr]) => {
                        next[empId] = { ...(next[empId] || {}) };
                        next[empId][dStr] = { ...(next[empId][dStr] || {}) };
                        if (globalStaffIn) next[empId][dStr].shiftStart = globalStaffIn;
                        if (globalStaffOut) next[empId][dStr].shiftEnd = globalStaffOut;
                        if (igkaVal !== null) next[empId][dStr].igkAHours = igkaVal;
                    });
                    return next;
                });

                // ★ 修正: 適用後は曜日のチェックをすべて外す (次のグループに前の人が混ざらないように)
                setStaffDays({});
                addLog(`スタッフのシフトを適用しました。(${targets.length}件${skippedHolidays ? ` / 祝日・休日 ${skippedHolidays}件スキップ` : ''}) チェックはリセットしました。`, 'success');
