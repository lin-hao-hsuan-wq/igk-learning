        const isHoliday = (dateStr) => [0, 6].includes(dayjs(dateStr).day()) || HOLIDAYS_2026.includes(dateStr);
        const calculateMinutes = (start, end) => start && end ? dayjs(`2000-01-01 ${end}`).diff(dayjs(`2000-01-01 ${start}`), 'minute') : 0;
        const formatHM = (mins) => `${Math.floor(mins / 60).toString().padStart(2, '0')}:${(mins % 60).toString().padStart(2, '0')}`;
        const timeToMins = (t) => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return (h * 60) + (isNaN(m) ? 0 : m); };
        const minsToTime = (m) => m > 0 ? `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}` : '';

        const roundTo5Mins = (t) => {
            if (!t) return '';
            const [h, m] = t.split(':').map(Number);
            if (isNaN(h) || isNaN(m)) return t;
            const totalMins = h * 60 + m;
            const roundedMins = Math.round(totalMins / 5) * 5;
            return `${Math.floor(roundedMins / 60).toString().padStart(2, '0')}:${(roundedMins % 60).toString().padStart(2, '0')}`;
        };

        const getSafeText = (cell) => {
            if (!cell) return '';
            try { if (cell.text !== undefined && cell.text !== null) return String(cell.text); } catch(e) {}
            if (cell.value === null || cell.value === undefined) return '';
            if (typeof cell.value === 'string') return cell.value;
            if (typeof cell.value === 'number') return String(cell.value);
            if (cell.value instanceof Date) return dayjs(cell.value).format('YYYY/MM/DD'); 
            if (cell.value.richText) return cell.value.richText.map(rt => rt.text).join('');
            if (cell.value.result !== undefined && cell.value.result !== null) {
                if (cell.value.result instanceof Date) return dayjs(cell.value.result).format('YYYY/MM/DD');
                return String(cell.value.result);
            }
            try { return String(cell.value); } catch(e) { return ''; }
        };

        const SettingPanel = ({ title, children, className = '', headerRight, isCollapsible, isOpen, onToggle }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-200 p-4 setting-panel-wrapper transition-all duration-300 ${isCollapsible && !isOpen ? 'collapsed-panel' : 'flex-1'} ${className}`}>
                <div className={`flex justify-between items-center shrink-0 ${isCollapsible && !isOpen ? '' : 'mb-3 border-b pb-2'} ${isCollapsible ? 'cursor-pointer select-none transition-colors hover:bg-gray-50 rounded -mx-2 px-2 py-1' : ''}`} onClick={isCollapsible ? onToggle : undefined}>
                    <h2 className="text-[15px] font-bold text-gray-800 flex items-center gap-2">{isCollapsible && <i className={`fa-solid fa-chevron-${isOpen ? 'up' : 'down'} text-blue-500`}></i>}{title}</h2>
                    <div onClick={e => e.stopPropagation()}>{headerRight}</div>
                </div>
                {(!isCollapsible || isOpen) && <div className="flex-1 overflow-hidden flex flex-col min-h-0">{children}</div>}
            </div>
        );

        const App = () => {
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const ADMIN_PASSWORD = "8888";

            const [currentView, setCurrentView] = useState('setup');
            const [isLocked, setIsLocked] = useState(false);
            const [isFixedTimeOpen, setIsFixedTimeOpen] = useState(false); 
            const [employees, setEmployees] = useState(INITIAL_EMPLOYEES);
            const [logs, setLogs] = useState([]);
            const [attendanceData, setAttendanceData] = useState({});
            const [timecardText, setTimecardText] = useState('');
            const [specialTime, setSpecialTime] = useState({ startDate: '', endDate: '', start: '', end: '', reason: '', location: 'rokko', target: 'all' });
            const [specialRecords, setSpecialRecords] = useState([]);

            const [payMonth, setPayMonth] = useState('2026-09');
            const [activeLocation, setActiveLocation] = useState('rokko');
            const [activeEmployeeId, setActiveEmployeeId] = useState('r1');

            const addLog = (msg, type = 'info') => setLogs(prev => [`[${dayjs().format('HH:mm:ss')}] ${msg}`, ...prev]);

            useEffect(() => {
                docRef.get().then((doc) => {
                    if (doc.exists) {
                        const cloudData = doc.data();
                        if (cloudData.employees) setEmployees(cloudData.employees);
                        if (cloudData.attendanceData) setAttendanceData(cloudData.attendanceData);
                        if (cloudData.specialRecords) setSpecialRecords(cloudData.specialRecords);
                        if (cloudData.isLocked !== undefined) setIsLocked(cloudData.isLocked);
                    }
                    setIsCloudLoaded(true);
                }).catch(err => { console.error("Firestore 讀取失敗:", err); setIsCloudLoaded(true); });
            }, []);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const unsubscribe = docRef.onSnapshot((doc) => { if (doc.exists && doc.data().isLocked !== undefined) setIsLocked(doc.data().isLocked); });
                return () => unsubscribe();
            }, [isCloudLoaded]);

            useEffect(() => {
                if (!isCloudLoaded) return;
                const timer = setTimeout(() => {
                    docRef.set({ employees, attendanceData, specialRecords, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                }, 1500);
                return () => clearTimeout(timer);
            }, [employees, attendanceData, specialRecords, isCloudLoaded]);

            const handleToggleLock = () => {
                if (isLocked) {
                    const pwd = window.prompt("パスワードを入力:");
                    if (pwd === ADMIN_PASSWORD) { docRef.set({ isLocked: false }, { merge: true }); addLog('システムロックを解除しました。', 'success'); }
                    else if (pwd !== null) alert("パスワードが違います");
                } else {
                    if (window.confirm("全員の編集をロックしますか？")) { docRef.set({ isLocked: true }, { merge: true }); addLog('システムをロックしました。', 'info'); }
                }
            };

            const handleParseTimecardText = () => {
                if (!timecardText.trim()) return;
                const lines = timecardText.split('\n').map(l => l.trim()).filter(l => l);
                let currentName = null, currentAction = null, parsedCount = 0;
                const newData = { ...attendanceData };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (/^\d{8}$/.test(line)) { if (i + 1 < lines.length) currentName = lines[++i].replace(/\s+/g, ''); }
                    else if (line === '入室' || line === '退室') {
                        currentAction = line === '入室' ? 'in' : 'out';
                        if (i + 1 < lines.length) {
                            const timeMatch = lines[i+1].match(/(\d{4}\/\d{1,2}\/\d{1,2})\s+(\d{1,2}:\d{2})/);
                            if (timeMatch && currentName) {
                                const emp = employees.find(e => [e.name.replace(/\s+/g, ''), ...(e.aliases || []).map(a => a.replace(/\s+/g, ''))].some(n => n.includes(currentName) || currentName.includes(n)));
                                if (emp) {
                                    const dateKey = dayjs(timeMatch[1], 'YYYY/M/D').format('YYYY/MM/DD');
                                    if (!newData[emp.id]) newData[emp.id] = {};
                                    if (!newData[emp.id][dateKey]) newData[emp.id][dateKey] = { location: emp.location };
                                    newData[emp.id][dateKey][currentAction] = timeMatch[2];
                                    parsedCount++;
                                }
                            }
                        }
                    } 
                }

                Object.keys(newData).forEach(empId => {
                    const emp = employees.find(e => e.id === empId);
                    if (emp && emp.type === 'part') {
                        Object.keys(newData[empId]).forEach(dateKey => {
                            const d = newData[empId][dateKey];
                            if (d.in && !d.shiftStart) d.shiftStart = roundTo5Mins(d.in);
                            if (d.out && !d.shiftEnd) d.shiftEnd = roundTo5Mins(d.out);
                        });
                    }
                });

                setAttendanceData(newData);
                addLog(`テキストから ${parsedCount} 筆の打刻データを解析しました。`, 'success');
                setTimecardText('');
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.name.endsWith('.xlsx')) return addLog('Excel(.xlsx)ファイルを選択してください。', 'error');

                addLog(`Excelファイル解析中: ${file.name}...`);
                let fileYear = new Date().getFullYear();
                let fyMatch = file.name.match(/20\d{2}/);
                if (fyMatch) fileYear = parseInt(fyMatch[0]);

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let newData = JSON.parse(JSON.stringify(attendanceData));
                        let localEmps = JSON.parse(JSON.stringify(employees));
                        let shiftCount = 0, transCount = 0;

                        wb.worksheets.forEach(ws => {
                            const isTransSheet = ws.name.includes('交通費');

                            if (isTransSheet) {
                                for (let r = 2; r <= ws.rowCount; r++) { 
                                    const dateCell = ws.getCell(r, 1).value; 
                                    const nameCell = getSafeText(ws.getCell(r, 2)).trim().toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');
                                    const amountCell = ws.getCell(r, 5).value; 
                                    if (!dateCell || !nameCell) continue; 
                                    
                                    let dateStr = '';
                                    if (dateCell instanceof Date) dateStr = dayjs(dateCell).format('YYYY/MM/DD');
                                    else if (typeof dateCell === 'string') {
                                        const dMatch = dateCell.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
                                        if (dMatch) dateStr = dayjs(`${dMatch[1]}/${dMatch[2]}/${dMatch[3]}`).format('YYYY/MM/DD');
                                    }
                                    if (!dateStr || !parseInt(amountCell)) continue; 

                                    const emp = localEmps.find(e => {
                                        let s = [e.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''), ...(e.aliases||[]).map(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''))];
                                        return s.includes(nameCell) || s.some(n => nameCell.includes(n) && n.length >= 2);
                                    });

                                    if (emp) {
                                        if (!newData[emp.id]) newData[emp.id] = {};
                                        if (!newData[emp.id][dateStr]) newData[emp.id][dateStr] = { location: emp.location };
                                        newData[emp.id][dateStr].transFee = (parseInt(newData[emp.id][dateStr].transFee) || 0) + parseInt(amountCell);
                                        transCount++;
                                    }
                                }
                            } else {
                                let currentDates = {}; 
                                let currentColMap = {};

                                for (let r = 1; r <= ws.rowCount; r++) {
                                    // 1. 強力搜尋日期 (完全無視括號與空白)
                                    for (let c = 1; c <= 10; c++) {
                                        let valObj = ws.getCell(r, c).value;
                                        if (valObj instanceof Date && valObj.getFullYear() > 2000) {
                                            currentDates[r] = { key: dayjs(valObj).format('YYYY/MM/DD'), obj: valObj };
                                            break;
                                        }
                                        
                                        let t = getSafeText(ws.getCell(r, c)).replace(/[\s\u3000\u200B-\u200D\uFEFF\n()（）]/g, '');
                                        if (!t || t.match(/^\d{1,2}[:：\.]\d{2}$/)) continue; 
                                        
                                        const m = t.match(/(?:(?:20)?\d{2}[\/\-年])?(1[0-2]|0?[1-9])[\/\-月](3[01]|[12][0-9]|0?[1-9])日?/);
                                        if (m && !t.toLowerCase().includes('everyday')) {
                                            let y = fileYear;
                                            const yMatch = t.match(/(20\d{2})/); if (yMatch) y = parseInt(yMatch[1]);
                                            let dObj = new Date(y, parseInt(m[1])-1, parseInt(m[2]));
                                            currentDates[r] = { key: dayjs(dObj).format('YYYY/MM/DD'), obj: dObj };
                                            break;
                                        }
                                    }

                                    // 2. 搜尋人名 (暴力清除全形空白與換行)
                                    let matches = 0, tempMap = {};
                                    for (let c = 1; c <= 40; c++) {
                                        let v = getSafeText(ws.getCell(r, c)).toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '');
                                        if (v.length >= 2) {
                                            for (const emp of localEmps) { 
                                                let s = [emp.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''), ...(emp.aliases||[]).map(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, ''))];
                                                if (s.includes(v) || s.some(name => v.includes(name) && name.length >= 2)) {
                                                    tempMap[c] = emp.id; matches++; break;
                                                }
                                            }
                                        }
                                    }
                                    if (matches >= 2) currentColMap = tempMap;

                                    // 3. 處理班表時間
                                    let activeDateRow = Object.keys(currentDates).map(Number).sort((a,b)=>b-a).find(dr => r >= dr);
                                    if (activeDateRow && Object.keys(currentColMap).length > 0) {
                                        let dateInfo = currentDates[activeDateRow];
                                        let timeValA = ws.getCell(r, 1).value;
                                        if (timeValA && timeValA.result !== undefined) timeValA = timeValA.result;

                                        let rowTimeStr = null;
                                        if (timeValA instanceof Date) rowTimeStr = `${String(timeValA.getHours()).padStart(2, '0')}:${String(timeValA.getMinutes()).padStart(2, '0')}`;
                                        else if (typeof timeValA === 'number') {
                                            let totalMins = Math.round(timeValA * 24 * 60);
                                            rowTimeStr = `${String(Math.floor(totalMins / 60) % 24).padStart(2, '0')}:${String(totalMins % 60).padStart(2, '0')}`;
                                        } else {
                                            let tm = getSafeText(ws.getCell(r, 1)).trim().match(/(\d{1,2})[:：\.](\d{2})/);
                                            if (tm) rowTimeStr = `${tm[1].padStart(2, '0')}:${tm[2]}`;
                                        }

                                        Object.keys(currentColMap).forEach(c => {
                                            const empId = currentColMap[c];
                                            const emp = localEmps.find(e => e.id === empId);

                                            let actCell = ws.getCell(r, parseInt(c));
                                            if (actCell.isMerged) actCell = ws.getCell(actCell.master.address);
                                            
                                            let cellText = getSafeText(actCell).trim();
                                            let fill = actCell.fill || (actCell.style && actCell.style.fill);
                                            let hasColor = fill && fill.type === 'pattern' && fill.pattern !== 'none' && !['FFFFFFFF', '00000000', 'FF000000', '00FFFFFF'].includes((fill.fgColor?.argb || fill.bgColor?.argb || '').toUpperCase());

                                            if (!cellText && !hasColor) return; 

                                            const exactMatches = [...cellText.matchAll(/([0-9]{1,2})[:：\.\-]([0-9]{2})/g)];
                                            let isDriverKeyword = ['乗車', '下車', '降車', '車', '返却'].some(k => cellText.includes(k));
                                            let isHeader = localEmps.some(e => e.name.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '') === cellText.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '') || (e.aliases||[]).some(a => a.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '') === cellText.toLowerCase().replace(/[\s\u3000\u200B-\u200D\uFEFF\n]/g, '')));
                                            let isShiftBlock = hasColor || (/[a-zA-Z\u3040-\u9FAF]/.test(cellText) && !isHeader && !cellText.includes('月') && !cellText.includes('日') && !cellText.toLowerCase().includes('everyday'));
                                            
                                            if (!newData[empId]) newData[empId] = {};
                                            if (!newData[empId][dateInfo.key]) newData[empId][dateInfo.key] = { location: emp ? emp.location : 'rokko' };
                                            let dataRef = newData[empId][dateInfo.key];

                                            if (cellText.includes('欠') || cellText.includes('休')) {
                                                dataRef.leaveType = cellText.substring(0, 10);
                                                shiftCount++;
                                            } else if (exactMatches.length === 2 && !isDriverKeyword) {
                                                dataRef.shiftStart = `${exactMatches[0][1].padStart(2, '0')}:${exactMatches[0][2]}`;
                                                dataRef.shiftEnd = `${exactMatches[1][1].padStart(2, '0')}:${exactMatches[1][2]}`;
                                                shiftCount++;
                                            } else if (isDriverKeyword && exactMatches.length > 0) {
                                                if (!dataRef._tempDrivers) dataRef._tempDrivers = [];
                                                exactMatches.forEach(m => dataRef._tempDrivers.push(timeToMins(`${m[1].padStart(2, '0')}:${m[2]}`)));
                                            } else if (isShiftBlock && rowTimeStr) {
                                                if (!dataRef._tempBlocks) dataRef._tempBlocks = [];
                                                dataRef._tempBlocks.push(timeToMins(rowTimeStr));
                                            }
                                        });
                                    }
                                }
                            }
                        });
                        
                        Object.keys(newData).forEach(empId => {
                            Object.keys(newData[empId]).forEach(dateKey => {
                                let dataRef = newData[empId][dateKey];
                                let emp = localEmps.find(e => e.id === empId);

                                if (dataRef._tempDrivers && dataRef._tempDrivers.length > 0) {
                                    let times = dataRef._tempDrivers.sort((a,b) => a - b);
                                    let totalDriverMins = 0;
                                    for (let i = 0; i < times.length - 1; i += 2) totalDriverMins += (times[i+1] - times[i]);
                                    dataRef.driveMins = (parseInt(dataRef.driveMins) || 0) + totalDriverMins;
                                    delete dataRef._tempDrivers;
                                    shiftCount++;
                                }

                                if (dataRef._tempBlocks && dataRef._tempBlocks.length > 0) {
                                    let times = dataRef._tempBlocks.sort((a,b) => a - b);
                                    if (emp && emp.type === 'driver') {
                                        dataRef.driveMins = (parseInt(dataRef.driveMins) || 0) + (times.length * 30);
                                    } else if (emp && emp.type === 'full') {
                                        if (!dataRef.shiftStart) dataRef.shiftStart = minsToTime(times[0]);
                                        if (!dataRef.shiftEnd) dataRef.shiftEnd = minsToTime(times[times.length - 1] + 30);
                                    } else {
                                        dataRef.igkA = (parseInt(dataRef.igkA) || 0) + (times.length * 30);
                                    }
                                    shiftCount++;
                                    delete dataRef._tempBlocks;
                                }
                            });
                        });

                        if (shiftCount > 0 || transCount > 0) {
                            setAttendanceData(newData);
                            addLog(`解析完了: シフト ${shiftCount} 件, 交通費 ${transCount} 件のデータを反映しました。`, 'success');
                        } else {
                            addLog(`Excelファイルは読み込まれましたが、抽出可能なデータがありませんでした。`, 'info');
                        }
                    } catch (err) {
                        addLog(`解析エラー: ${err.message}`, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const handleAddSpecialTime = () => {
                if (!specialTime.startDate || !specialTime.start || !specialTime.end) return addLog('日付範囲と時間帯を入力してください。', 'error');
                if (specialTime.start >= specialTime.end) return addLog('時間設定有誤。', 'error');

                const sDate = dayjs(specialTime.startDate);
                const eDate = specialTime.endDate ? dayjs(specialTime.endDate) : sDate;

                let targets = specialTime.target === 'all' ? employees.filter(e => e.type === 'full' && e.location === specialTime.location) : employees.filter(e => e.id === specialTime.target);

                setAttendanceData(prev => {
                    const newData = { ...prev };
                    targets.forEach(emp => {
                        if (!newData[emp.id]) newData[emp.id] = {};
                        let curr = sDate;
                        while (curr.isBefore(eDate) || curr.isSame(eDate, 'day')) {
                            const dateStr = curr.format('YYYY/MM/DD');
                            if (!newData[emp.id][dateStr]) newData[emp.id][dateStr] = {};
                            newData[emp.id][dateStr].shiftStart = specialTime.start;
                            newData[emp.id][dateStr].shiftEnd = specialTime.end;
                            newData[emp.id][dateStr].location = specialTime.location; 
                            if (specialTime.reason) newData[emp.id][dateStr].remark = specialTime.reason;
                            curr = curr.add(1, 'day');
                        }
                    });
                    return newData;
                });

                setSpecialRecords(prev => [...prev, specialTime]);
                addLog(`特別勤務時間を設定しました。`, 'success');
            };

            const renderSetupScreen = () => (
                <div className={`flex flex-col lg:flex-row gap-4 p-4 h-[calc(100vh-60px)] overflow-y-auto ${isLocked ? 'locked-overlay' : ''}`}>
                    <div className="flex flex-col gap-4 w-full lg:w-1/2 min-h-0">
                        <SettingPanel title="正社員の固定勤務時間 / 社員管理" isCollapsible={true} isOpen={isFixedTimeOpen} onToggle={() => setIsFixedTimeOpen(!isFixedTimeOpen)}>
                            <div className="flex flex-col h-full gap-3 min-h-0">
                                <div className="flex gap-3 h-[40%] min-h-[100px] shrink-0">
                                    <div className="bg-gray-50 rounded-lg border flex-1 flex flex-col overflow-hidden">
                                        <div className="p-1.5 border-b bg-white flex justify-between items-center shrink-0">
                                            <h3 className="font-bold text-blue-800 text-xs"><i className="fa-solid fa-school"></i> 六甲校</h3>
                                        </div>
                                        <div className="flex-1 overflow-y-auto p-1.5 space-y-1">
                                            {employees.filter(e => e.type === 'full' && e.location === 'rokko').sort((a,b)=>a.num-b.num).map(emp => (
                                                <div key={emp.id} className="text-[11px] p-1.5 bg-white border rounded shadow-sm">{emp.num}. {emp.name}</div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-gray-50 rounded-lg border flex-1 flex flex-col overflow-hidden">
                                        <div className="p-1.5 border-b bg-white flex justify-between items-center shrink-0">
                                            <h3 className="font-bold text-green-800 text-xs"><i className="fa-solid fa-school"></i> 名谷校</h3>
                                        </div>
                                        <div className="flex-1 overflow-y-auto p-1.5 space-y-1">
                                            {employees.filter(e => e.type === 'full' && e.location === 'myodani').sort((a,b)=>a.num-b.num).map(emp => (
                                                <div key={emp.id} className="text-[11px] p-1.5 bg-white border rounded shadow-sm">{emp.num}. {emp.name}</div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </SettingPanel>
                    </div>

                    <div className="flex flex-col gap-4 w-full lg:w-1/2 min-h-0">
                        <SettingPanel title="ファイルアップロード">
                            <div className="border-2 border-dashed border-gray-300 rounded-lg py-5 text-center bg-gray-50 hover:bg-gray-100 relative cursor-pointer">
                                <i className="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                                <p className="text-sm text-gray-600 font-bold">シフト(Excel) / 交通費 アップロード</p>
                                <input type="file" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                            </div>
                        </SettingPanel>

                        <SettingPanel title="システムログ">
                            <div className="bg-gray-900 font-mono text-[11px] p-3 rounded h-full overflow-y-auto shadow-inner custom-scrollbar">
                                {logs.length === 0 ? <span className="text-gray-500">待命中...</span> : 
                                    logs.map((log, i) => (
                                        <div key={i} className={`mb-1 ${log.includes('エラー') ? 'text-red-400' : (log.includes('反映しました') ? 'text-green-300' : 'text-gray-300')}`}>{log}</div>
                                    ))
                                }
                            </div>
                        </SettingPanel>
                    </div>
                </div>
            );

            const EmployeeReport = ({ employee, data, payMonth }) => {
                const [localEditable, setLocalEditable] = useState(false);
                const payDateObj = dayjs(`${payMonth}-01`);
                
                // ★ 終極畫面解鎖：強制顯示前後各2個月，保證你丟進去的任何資料絕對能被看見！
                const periodStart = payDateObj.subtract(2, 'month').date(1);
                const periodEnd = payDateObj.add(1, 'month').endOf('month');

                const dates = [];
                let curr = periodStart;
                while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                    dates.push(curr.format('YYYY/MM/DD'));
                    curr = curr.add(1, 'day');
                }

                const handleInput = (date, field, val) => {
                    if (isLocked || !localEditable) return;
                    setAttendanceData(prev => {
                        const newData = { ...prev };
                        if (!newData[employee.id]) newData[employee.id] = {};
                        if (!newData[employee.id][date]) newData[employee.id][date] = {};
                        newData[employee.id][date][field] = val;
                        return newData;
                    });
                };

                let workDays = 0;

                return (
                    <div className="h-full flex flex-col">
                        <div className="flex justify-between items-end mb-2 border-b border-gray-300 pb-2 shrink-0">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <span className="bg-gray-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow">{employee.num}</span>
                                {employee.name}
                            </h2>
                            <button onClick={() => setLocalEditable(!localEditable)} className="px-3 py-1 rounded border shadow-sm font-bold text-xs bg-white text-blue-700 border-blue-400">
                                <i className="fa-solid fa-pen-to-square mr-1"></i>手動入力
                            </button>
                        </div>

                        <div className="flex-1 overflow-auto bg-white rounded shadow-sm border text-[11px] custom-scrollbar">
                            <table className="w-full text-left border-collapse whitespace-nowrap">
                                <thead className="bg-gray-100 sticky top-0 shadow-sm z-10 text-gray-700">
                                    <tr>
                                        <th className="border p-1">日付</th>
                                        <th className="border p-1 text-blue-800">シフト</th>
                                        <th className="border p-1 bg-green-50">IGK A / Driver</th>
                                        <th className="border p-1 bg-blue-50">IGK B</th>
                                        <th className="border p-1">交通費</th>
                                        <th className="border p-1">備考</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dates.map((date) => {
                                        const dayData = data[date] || {};
                                        // 只過濾出有資料的日子，方便你檢查！
                                        if (!dayData.shiftStart && !dayData.igkA && !dayData.transFee && !dayData.driveMins && !dayData.leaveType) return null;
                                        
                                        workDays++;
                                        return (
                                            <tr key={date} className="hover:bg-gray-50 border-b">
                                                <td className="border p-1 text-center font-bold text-gray-600">{dayjs(date).format('MM/DD')}</td>
                                                <td className="border p-1 text-center text-blue-600 font-bold bg-blue-50/20">
                                                    <div className="flex justify-center items-center gap-0.5">
                                                        <input disabled={!localEditable} className="w-11 text-center bg-transparent outline-none" value={dayData.shiftStart || ''} onChange={e=>handleInput(date,'shiftStart',e.target.value)} />
                                                        -
                                                        <input disabled={!localEditable} className="w-11 text-center bg-transparent outline-none" value={dayData.shiftEnd || ''} onChange={e=>handleInput(date,'shiftEnd',e.target.value)} />
                                                    </div>
                                                </td>
                                                <td className="border p-1 text-center"><input disabled={!localEditable} className="w-10 text-center bg-transparent" value={dayData.igkA || dayData.driveMins || ''} onChange={e=>handleInput(date,'igkA',e.target.value)} /></td>
                                                <td className="border p-1 text-center"><input disabled={!localEditable} className="w-10 text-center bg-transparent" value={dayData.igkB || ''} onChange={e=>handleInput(date,'igkB',e.target.value)} /></td>
                                                <td className="border p-1"><input disabled={!localEditable} className="w-full text-right bg-transparent" value={dayData.transFee || ''} onChange={e=>handleInput(date,'transFee',e.target.value)} /></td>
                                                <td className="border p-1"><input disabled={!localEditable} className="w-full bg-transparent" value={dayData.leaveType || dayData.remark || ''} onChange={e=>handleInput(date,'remark',e.target.value)} /></td>
                                            </tr>
                                        );
                                    })}
                                    {workDays === 0 && <tr><td colSpan="6" className="text-center py-4 text-gray-400">データなし</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            const renderReportsScreen = () => {
                const locEmployees = employees.filter(e => e.location === activeLocation).sort((a,b) => a.num - b.num);
                const activeEmployee = employees.find(e => e.id === activeEmployeeId);

                const switchLocation = (loc) => {
                    setActiveLocation(loc);
                    const firstEmp = employees.filter(e => e.location === loc).sort((a,b)=>a.num - b.num)[0];
                    if(firstEmp) setActiveEmployeeId(firstEmp.id);
                }

                return (
                    <div className="flex flex-col h-[calc(100vh-60px)] min-h-0">
                        <div className="flex justify-between items-end mb-2 px-4 mt-2 shrink-0">
                            <div className="flex gap-2">
                                <button onClick={() => switchLocation('rokko')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'rokko' ? 'bg-white text-blue-600 border-t-4 border-blue-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)]' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>六甲校</button>
                                <button onClick={() => switchLocation('myodani')} className={`px-6 py-2 rounded-t-lg font-black text-sm transition ${activeLocation === 'myodani' ? 'bg-white text-green-600 border-t-4 border-green-600 shadow-[0_-2px_5px_rgba(0,0,0,0.05)]' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}>名谷校</button>
                            </div>
                            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-gray-200 mb-0.5">
                                <span className="text-gray-600 font-bold text-xs">支給月:</span>
                                <input type="month" value={payMonth} onChange={(e) => setPayMonth(e.target.value)} className="border rounded bg-gray-50 px-1 text-xs outline-none font-bold focus:border-blue-400" />
                            </div>
                        </div>
                        <div className="flex flex-1 bg-white rounded-lg shadow-sm border mx-4 mb-3 overflow-hidden min-h-0">
                            <div className="w-[140px] bg-gray-50 border-r overflow-y-auto pt-2 gap-1 flex flex-col shrink-0 custom-scrollbar pb-4">
                                {locEmployees.map(emp => (
                                    <button key={emp.id} onClick={() => setActiveEmployeeId(emp.id)} className={`text-left px-2 py-2 mx-2 rounded-lg text-xs font-bold flex items-center gap-2 truncate transition ${activeEmployeeId === emp.id ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:bg-gray-200'}`}>
                                        <span className="truncate">{emp.num}. {emp.name}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="flex-1 p-3 overflow-hidden">
                                {activeEmployee ? <EmployeeReport key={activeEmployee.id} employee={activeEmployee} data={attendanceData[activeEmployee.id] || {}} payMonth={payMonth} /> : null}
                            </div>
                        </div>
                    </div>
                );
            };

            if (!isCloudLoaded) return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin h-10 w-10 border-b-2 border-blue-600"></div></div>;

            return (
                <div className="min-h-screen flex flex-col overflow-hidden bg-[#eef2f6]">
                    <header className="bg-white shadow-sm border-b px-6 py-2 flex justify-between items-center shrink-0 h-[60px]">
                        <nav className="flex gap-4">
                            <button onClick={() => setCurrentView('setup')} className={`font-bold ${currentView === 'setup' ? 'text-blue-600' : 'text-gray-500'}`}>設定と取込</button>
                            <button onClick={() => setCurrentView('reports')} className={`font-bold ${currentView === 'reports' ? 'text-blue-600' : 'text-gray-500'}`}>個人別明細</button>
                        </nav>
                    </header>
                    <main className="flex-1 overflow-hidden">{currentView === 'setup' ? renderSetupScreen() : renderReportsScreen()}</main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
