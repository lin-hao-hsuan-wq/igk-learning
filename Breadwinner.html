<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGK Attendance System - 完美打卡解析版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body className="bg-[#f8f9fa] text-slate-700 font-sans print:bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const EMPLOYEES = [
            { id: 'r1', name: 'Minori', aliases: ['葛野みのり', '葛野 みのり', 'みのり', 'Minori'], type: 'full', location: 'rokko' },
            { id: 'r2', name: 'Yassmyn', aliases: ['ヤスミン', 'Ratu Yassmyn Khairussalima', 'Yassmyn'], type: 'full', location: 'rokko' },
            { id: 'r3', name: 'Yoon', aliases: ['ユン', 'Yoon Honey Aung', 'Yoon'], type: 'full', location: 'rokko' },
            { id: 'r4', name: 'Koukei', aliases: ['林昊嬛', '林 昊嬛', '林'], type: 'full', location: 'rokko' },
            { id: 'r5', name: 'Mikuma', aliases: ['実熊', 'みくま', '實熊功光', '實熊 功光', '実熊功光'], type: 'part', location: 'rokko' },
            { id: 'r6', name: 'Taka', aliases: ['上山', 'たか', '上山貴行', '上山 貴行'], type: 'part', location: 'rokko' },
            { id: 'r7', name: 'Fergus', aliases: ['ファーガス'], type: 'part', location: 'rokko' },
            { id: 'r8', name: 'Sammy', aliases: ['サミー', 'Sammy Abukmeil'], type: 'part', location: 'rokko' },
            { id: 'r9', name: 'Kim Nakyung', aliases: ['キム', 'Kim', 'Nakyung'], type: 'part', location: 'rokko' },
            { id: 'r10', name: 'Nathan', aliases: ['ネイサン', 'Nathan Morrison'], type: 'part', location: 'rokko' },
            { id: 'r11', name: 'Mariko', aliases: ['マリコ', 'まりこ', '沼田真里子', '沼田 真里子'], type: 'part', location: 'rokko' },
            { id: 'r12', name: 'Ando', aliases: ['安藤', 'あんどう', '安藤佑也', '安藤 佑也'], type: 'part', location: 'rokko' },
            { id: 'r13', name: 'Misato', aliases: ['ミサト', 'みさと'], type: 'part', location: 'rokko' },
            { id: 'r14', name: 'Nao', aliases: ['ナオ', 'なお'], type: 'part', location: 'rokko' },
            { id: 'r15', name: '金栄美', aliases: ['kim eimi', 'eimi', '金'], type: 'part', location: 'rokko' },
            { id: 'r16', name: '角田紀子', aliases: ['角田', 'つのだ'], type: 'part', location: 'rokko' },
            { id: 'm1', name: '加藤友梨', aliases: ['加藤', 'かとう'], type: 'full', location: 'myodani' },
            { id: 'm2', name: 'Linh', aliases: ['リン'], type: 'full', location: 'myodani' },
            { id: 'm3', name: '大津真里', aliases: ['大津', 'おおつ'], type: 'part', location: 'myodani' },
            { id: 'm4', name: '馬場亜希', aliases: ['馬場', 'ばば'], type: 'part', location: 'myodani' },
            { id: 'm5', name: '篠崎', aliases: ['しのざき'], type: 'part', location: 'myodani' },
            { id: 'm6', name: '吉野', aliases: ['よしの'], type: 'part', location: 'myodani' },
            { id: 'm7', name: '森', aliases: ['もり'], type: 'part', location: 'myodani' },
            { id: 'm8', name: 'Ugiloy', aliases: ['ウギロイ'], type: 'part', location: 'myodani' },
            { id: 'm9', name: 'Hamna', aliases: ['ハムナ'], type: 'part', location: 'myodani' },
            { id: 'm10', name: 'タプリヒン', aliases: [], type: 'part', location: 'myodani' },
            { id: 'm11', name: 'Sadia', aliases: ['サディア'], type: 'part', location: 'myodani' },
            { id: 'm12', name: 'Monika', aliases: ['モニカ'], type: 'part', location: 'myodani' },
            { id: 'm13', name: '中嶋莉真', aliases: ['中嶋', 'なかじま'], type: 'part', location: 'myodani' },
            { id: 'm14', name: '顕谷ユタカ', aliases: ['顕谷', 'あきたに'], type: 'part', location: 'myodani' },
            { id: 'm15', name: 'Mozelle', aliases: ['Mozelle Bargamin', 'モゼル'], type: 'part', location: 'myodani' }
        ];

        const TAB_COLORS = [
            'bg-pink-50 border-t-4 border-pink-400 text-pink-700 shadow-sm print:border-none',
            'bg-blue-50 border-t-4 border-blue-400 text-blue-700 shadow-sm print:border-none',
            'bg-emerald-50 border-t-4 border-emerald-400 text-emerald-700 shadow-sm print:border-none',
            'bg-purple-50 border-t-4 border-purple-400 text-purple-700 shadow-sm print:border-none',
            'bg-orange-50 border-t-4 border-orange-400 text-orange-700 shadow-sm print:border-none',
            'bg-teal-50 border-t-4 border-teal-400 text-teal-700 shadow-sm print:border-none',
        ];

        const timeToMins = (t) => {
            if (!t || typeof t !== 'string') return 0;
            const [h, m] = t.split(':').map(Number);
            return (h * 60) + (isNaN(m) ? 0 : m);
        };
        const minsToTime = (m) => {
            if (m === null || m === undefined || isNaN(m) || m <= 0) return '';
            return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        };
        
        const formatTimeWithDec = (mins) => {
            if (!mins || mins === 0) return '-';
            const hm = minsToTime(mins);
            const dec = (mins / 60).toFixed(2).replace(/\.00$/, '');
            return <>{hm} <span className="text-xs font-bold opacity-60 print:text-[10px]">({dec} H)</span></>;
        };

        function App() {
            const [activePage, setActivePage] = useState('import'); 
            const [activeLocation, setActiveLocation] = useState('rokko'); 
            
            const today = new Date();
            let initM = today.getDate() >= 16 ? today.getMonth() + 2 : today.getMonth() + 1;
            let initY = today.getFullYear();
            if (initM > 12) { initM -= 12; initY += 1; }
            const [period, setPeriod] = useState(`${initY}-${String(initM).padStart(2, '0')}`);
            
            const [settings, setSettings] = useState({ baseStart: '09:30', baseEnd: '18:30', special: [] });
            const [newSp, setNewSp] = useState({ name: '', start: '', end: '', timeIn: '09:30', timeOut: '18:30' });

            const [pastedData, setPastedData] = useState('');
            const [attendance, setAttendance] = useState({}); 
            const [monthlyData, setMonthlyData] = useState({}); 
            const [hourlyWage, setHourlyWage] = useState(1200); 

            const [activeEmp, setActiveEmp] = useState('r1'); 

            const dates = useMemo(() => {
                if (!period || !period.includes('-')) return [];
                const [y, m] = period.split('-').map(Number);
                if (isNaN(y) || isNaN(m)) return [];
                const start = new Date(y, m - 2, 16);
                const end = new Date(y, m - 1, 15);
                let arr = [];
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    arr.push(new Date(d));
                }
                return arr;
            }, [period]);

            const dKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const formatDisplayDate = (d) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                return `${d.getMonth() + 1}/${d.getDate()} (${days[d.getDay()]})`;
            };
            const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;

            // ★ 全新升級：絕對屏障打卡解析引擎 ★
            const handlePaste = () => {
                if (!pastedData.trim()) return alert("打刻データを貼り付けてください。");
                let newData = JSON.parse(JSON.stringify(attendance)); 
                const text = pastedData.toLowerCase();
                const timeRegex = /(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?[\s\n]*(\d{1,2})[:：](\d{2})/g;
                
                const matches = [...text.matchAll(timeRegex)];
                if (matches.length === 0) return alert("一致する名前や時間のフォーマットが見つかりませんでした。");

                let count = 0;
                let autoPeriod = null;
                let lastEmpLoc = null;
                let lastFoundEmpId = null;

                // 尋找最近字元的輔助函數
                const getClosestDist = (str, char, pivot) => {
                    let left = str.lastIndexOf(char, pivot);
                    let right = str.indexOf(char, pivot);
                    let d1 = left !== -1 ? pivot - left : 9999;
                    let d2 = right !== -1 ? right - pivot : 9999;
                    return Math.min(d1, d2);
                };

                for (let i = 0; i < matches.length; i++) {
                    const match = matches[i];
                    const month = match[1], day = match[2], hr = match[3], min = match[4];
                    const timeStr = `${hr.padStart(2,'0')}:${min.padStart(2,'0')}`;
                    
                    // 建立獨立切塊 (只抓取這個時間點前後到下一個時間點的範圍，不干擾)
                    const startIdx = i === 0 ? Math.max(0, match.index - 150) : matches[i-1].index + matches[i-1][0].length;
                    const endIdx = i === matches.length - 1 ? Math.min(text.length, match.index + 150) : matches[i+1].index;
                    const block = text.substring(startIdx, endIdx);
                    
                    let foundEmpId = null;
                    for (let emp of EMPLOYEES) {
                        const names = [emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/\s/g,''))];
                        if (names.some(n => block.replace(/\s/g,'').includes(n))) {
                            foundEmpId = emp.id;
                            lastEmpLoc = emp.location; 
                            break;
                        }
                    }

                    // 如果這一塊沒名字，沿用上一個名字 (解決垂直換行格式)
                    if (foundEmpId) {
                        lastFoundEmpId = foundEmpId;
                    } else {
                        foundEmpId = lastFoundEmpId; 
                    }

                    if (foundEmpId) {
                        const y = new Date().getFullYear(); 
                        const dateObj = new Date(y, parseInt(month)-1, parseInt(day));
                        const key = dKey(dateObj);
                        
                        if (!autoPeriod) {
                            let tmpy = dateObj.getFullYear();
                            let tmpm = dateObj.getDate() >= 16 ? dateObj.getMonth() + 2 : dateObj.getMonth() + 1;
                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                        }

                        // 判斷是入室還是退室
                        let timeLocalIdx = match.index - startIdx;
                        let outDist = Math.min(getClosestDist(block, '退', timeLocalIdx), getClosestDist(block, 'out', timeLocalIdx));
                        let inDist = Math.min(getClosestDist(block, '入', timeLocalIdx), getClosestDist(block, 'in', timeLocalIdx));
                        
                        let type = 'inTime';
                        if (outDist < inDist) {
                            type = 'outTime';
                        } else if (outDist === 9999 && inDist === 9999) {
                            // 防呆：如果完全沒寫入室或退室，自動判斷：已有入室則視為退室
                            if (newData[foundEmpId] && newData[foundEmpId][key] && newData[foundEmpId][key].inTime) {
                                type = 'outTime';
                            }
                        }

                        if (!newData[foundEmpId]) newData[foundEmpId] = {};
                        if (!newData[foundEmpId][key]) newData[foundEmpId][key] = {};
                        newData[foundEmpId][key][type] = timeStr;
                        count++;
                    }
                }
                
                if (count > 0) {
                    setAttendance(newData);
                    setPastedData('');
                    if (autoPeriod) setPeriod(autoPeriod);
                    if (lastEmpLoc) setActiveLocation(lastEmpLoc); 
                    setActivePage('preview');
                    alert(`${count} 件の打刻データを正常に取り込みました！`);
                } else {
                    alert("一致する名前や時間のフォーマットが見つかりませんでした。");
                }
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let newData = JSON.parse(JSON.stringify(attendance));
                        let count = 0;
                        let autoPeriod = null;

                        const extractTime = (val) => {
                            if (!val) return null;
                            let v = val.value !== undefined ? val.value : val;
                            if (v && v.result !== undefined) v = v.result;

                            if (typeof v === 'number' && v > 0 && v < 1) {
                                let tm = Math.round(v * 24 * 60);
                                return `${String(Math.floor(tm/60)).padStart(2,'0')}:${String(tm%60).padStart(2,'0')}`;
                            }

                            let str = (val.text || (typeof v === 'string' ? v : '')).trim();
                            const m = str.match(/^(\d{1,2})[:：](\d{2})$/);
                            if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;

                            if (v instanceof Date) {
                                return `${String(v.getUTCHours()).padStart(2,'0')}:${String(v.getUTCMinutes()).padStart(2,'0')}`;
                            }
                            return null;
                        };

                        wb.worksheets.forEach(ws => {
                            let currentDates = {}; 
                            let currentColMap = {};

                            for (let r = 1; r <= ws.rowCount; r++) {
                                for (let c = 1; c <= 10; c++) {
                                    let t = (ws.getCell(r, c).text || '').replace(/\s+/g, '');
                                    const m = t.match(/(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?/);
                                    if (m) {
                                        let y = new Date().getFullYear();
                                        const yMatch = t.match(/(20\d{2})/); if (yMatch) y = parseInt(yMatch[1]);
                                        let dObj = new Date(y, parseInt(m[1])-1, parseInt(m[2]));
                                        currentDates[r] = { key: dKey(dObj), obj: dObj };
                                        break;
                                    }
                                }

                                let matches = 0;
                                let tempMap = {};
                                for (let c = 1; c <= 40; c++) {
                                    let v = (ws.getCell(r, c).text || '').toLowerCase().replace(/\s+/g, '');
                                    if (v.length >= 1) {
                                        for (const emp of EMPLOYEES) {
                                            let s = [emp.name.toLowerCase().replace(/\s+/g, ''), ...emp.aliases.map(a => a.toLowerCase().replace(/\s+/g, ''))];
                                            if (s.includes(v) || s.some(name => v.includes(name) && name.length >= 2)) {
                                                tempMap[c] = emp.id; matches++; break;
                                            }
                                        }
                                    }
                                }
                                if (matches >= 2) currentColMap = tempMap;

                                let activeDateRow = Object.keys(currentDates).reverse().find(dr => r >= parseInt(dr));
                                if (activeDateRow && Object.keys(currentColMap).length > 0) {
                                    let dateInfo = currentDates[activeDateRow];
                                    
                                    let rowTimeStr = null;
                                    for(let c=1; c<=3; c++) {
                                        rowTimeStr = extractTime(ws.getCell(r, c));
                                        if(rowTimeStr) break;
                                    }
                                    
                                    if (rowTimeStr) {
                                        let rowMins = timeToMins(rowTimeStr);
                                        if (!autoPeriod) {
                                            let tmpy = dateInfo.obj.getFullYear();
                                            let tmpm = dateInfo.obj.getDate() >= 16 ? dateInfo.obj.getMonth() + 2 : dateInfo.obj.getMonth() + 1;
                                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                                        }

                                        let allExtractedData = {};

                                        Object.keys(currentColMap).forEach(c => {
                                            const empId = currentColMap[c];
                                            let actCell = ws.getCell(r, parseInt(c));
                                            if (actCell.isMerged) actCell = ws.getCell(actCell.master.address);
                                            
                                            let cellText = (actCell.text || '').trim();
                                            let hasContent = cellText.length > 0;
                                            
                                            let fill = actCell.fill || {};
                                            let isColored = false;
                                            let hex = '';
                                            
                                            if (fill.type === 'pattern' && fill.pattern !== 'none') {
                                                hex = (fill.fgColor?.argb || fill.bgColor?.argb || '').toUpperCase();
                                                if (hex && !['FFFFFFFF', '00000000', 'FF000000', '00FFFFFF'].includes(hex)) {
                                                    isColored = true;
                                                } else if (!hex && (fill.fgColor?.theme !== undefined || fill.bgColor?.theme !== undefined)) {
                                                    let theme = fill.fgColor?.theme !== undefined ? fill.fgColor.theme : fill.bgColor.theme;
                                                    if (theme !== 0 && theme !== 1) isColored = true;
                                                }
                                            }

                                            if (hasContent || isColored) {
                                                let isYellow = hex && (hex.includes('D965') || hex.includes('FF00') || hex.includes('C000'));
                                                let isGray = hex && (hex.includes('A6A6') || hex.includes('D9D9') || hex.includes('BFBF') || hex.includes('8080'));
                                                let isPink = hex && (hex.includes('C0CB') || hex.includes('99CC') || hex.includes('00FF'));
                                                let blockType = 'igkB'; 

                                                if (cellText.includes('欠') || cellText.includes('休') || isGray) {
                                                    if (cellText.includes('欠') || cellText.includes('休')) {
                                                        if (!newData[empId]) newData[empId] = {};
                                                        if (!newData[empId][dateInfo.key]) newData[empId][dateInfo.key] = {};
                                                        newData[empId][dateInfo.key].leave = cellText.substring(0, 10);
                                                    }
                                                    return; 
                                                }

                                                if (cellText.includes('乗車') || cellText.includes('下車') || cellText.includes('車') || cellText.includes('返却') || isYellow) {
                                                    blockType = 'driver';
                                                } else if (cellText.toLowerCase().includes('private') || cellText.toLowerCase().includes('yoshitake')) {
                                                    blockType = 'yPrivate';
                                                } else if (isPink || (hasContent && /[a-zA-Z]/.test(cellText) && !cellText.includes('車'))) {
                                                    blockType = 'igkA';
                                                }

                                                if (!allExtractedData[empId]) allExtractedData[empId] = {};
                                                if (!allExtractedData[empId][dateInfo.key]) {
                                                    allExtractedData[empId][dateInfo.key] = { minTime: 9999, maxTime: -1, exactTimes: [], driverMins: 0, igkAMins: 0, igkBMins: 0, yPrivMins: 0 };
                                                }
                                                
                                                let ed = allExtractedData[empId][dateInfo.key];
                                                
                                                if (rowMins < ed.minTime) ed.minTime = rowMins;
                                                if (rowMins > ed.maxTime) ed.maxTime = rowMins;

                                                if (blockType === 'driver') ed.driverMins += 30;
                                                else if (blockType === 'igkA') ed.igkAMins += 30;
                                                else if (blockType === 'igkB') ed.igkBMins += 30;
                                                else if (blockType === 'yPrivate') ed.yPrivMins += 30;

                                                const exactMatches = [...cellText.matchAll(/([0-9]{1,2})[:：]([0-9]{2})/g)];
                                                exactMatches.forEach(m => {
                                                    ed.exactTimes.push(timeToMins(`${m[1].padStart(2, '0')}:${m[2]}`));
                                                });
                                            }
                                        });

                                        Object.keys(allExtractedData).forEach(empId => {
                                            Object.keys(allExtractedData[empId]).forEach(dateKey => {
                                                const data = allExtractedData[empId][dateKey];
                                                let startMins = data.minTime;
                                                let endMins = data.maxTime + 30; 

                                                if (data.exactTimes.length > 0) {
                                                    const minExact = Math.min(...data.exactTimes);
                                                    const maxExact = Math.max(...data.exactTimes);
                                                    if (Math.abs(minExact - startMins) <= 120) startMins = minExact;
                                                    if (Math.abs(maxExact - endMins) <= 120) endMins = maxExact;
                                                }

                                                if (startMins < 9999 && endMins > -1) {
                                                    if (!newData[empId]) newData[empId] = {};
                                                    if (!newData[empId][dateKey]) newData[empId][dateKey] = {};
                                                    
                                                    let curIn = timeToMins(newData[empId][dateKey].shiftIn || '23:59');
                                                    let curOut = timeToMins(newData[empId][dateKey].shiftOut || '00:00');
                                                    
                                                    if (startMins < curIn) newData[empId][dateKey].shiftIn = minsToTime(startMins);
                                                    if (endMins > curOut) newData[empId][dateKey].shiftOut = minsToTime(endMins);
                                                    
                                                    if (data.igkAMins > 0) newData[empId][dateKey].igkA = minsToTime(data.igkAMins);
                                                    if (data.igkBMins > 0) newData[empId][dateKey].igkB = minsToTime(data.igkBMins);
                                                    
                                                    if (data.driverMins > 0) {
                                                        newData[empId][dateKey].driverPlanned = minsToTime(data.driverMins);
                                                        newData[empId][dateKey].driverActual = minsToTime(data.driverMins);
                                                    }
                                                    if (data.yPrivMins > 0) newData[empId][dateKey].yPrivate = minsToTime(data.yPrivMins);

                                                    count++;
                                                }
                                            });
                                        });
                                    }
                                }
                            }
                        });

                        if (count > 0) {
                            setAttendance(newData);
                            if (autoPeriod) setPeriod(autoPeriod);
                            setActivePage('preview');
                            alert(`シフト表から色ブロックと時間を自動解析しました！（反映セクション数: ${count}）`);
                        } else {
                            alert("読み込みに成功しましたが、色ブロックや時間が検出されませんでした。");
                        }
                    } catch (err) {
                        alert(`❌ Excel 解析エラー: ${err.message}`);
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const updateCell = (id, d, field, val) => {
                setAttendance(prev => ({
                    ...prev, [id]: { ...prev[id], [d]: { ...prev[id]?.[d], [field]: val } }
                }));
            };

            const updateMonthlyData = (id, p, field, val) => {
                const key = `${id}_${p}`;
                setMonthlyData(prev => ({
                    ...prev, [key]: { ...prev[key], [field]: val }
                }));
            };

            const calculateRow = (date, row, emp) => {
                const isWknd = isWeekend(date);
                let inTime = row.inTime || '';
                let outTime = row.outTime || '';
                let shiftIn = row.shiftIn || '';
                let shiftOut = row.shiftOut || '';
                let leave = row.leave || '';
                
                let igkA = row.igkA || '';
                let igkB = row.igkB || '';
                let driverActual = row.driverActual || '';
                let yPrivate = row.yPrivate || '';

                let breakTime = row.breakTime !== undefined ? row.breakTime : (emp.type === 'full' ? '01:00' : '00:00');
                let breakMins = timeToMins(breakTime);

                if (emp.type === 'full') {
                    shiftIn = shiftIn || settings.baseStart;
                    shiftOut = shiftOut || settings.baseEnd;
                    settings.special.forEach(sp => {
                        if (new Date(date) >= new Date(sp.start) && new Date(date) <= new Date(sp.end)) {
                            shiftIn = sp.timeIn; shiftOut = sp.timeOut;
                        }
                    });
                }

                let actualShiftIn = shiftIn;
                if (inTime && shiftIn) {
                    const inM = timeToMins(inTime);
                    const sInM = timeToMins(shiftIn);
                    if (inM > sInM && inM <= sInM + 4) actualShiftIn = minsToTime(sInM + 5);
                    else if (inM > sInM + 4) actualShiftIn = minsToTime(Math.ceil(inM / 5) * 5);
                }

                let earlyOtMins = 0, lateOtMins = 0;
                if (emp.type === 'full' && !leave) {
                    if (inTime && shiftIn) {
                        let diff = timeToMins(shiftIn) - timeToMins(inTime);
                        if (diff > 0) earlyOtMins = diff;
                    }
                    if (outTime && shiftOut) {
                        let diff = timeToMins(outTime) - timeToMins(shiftOut);
                        if (diff > 0) lateOtMins = diff;
                    }
                }

                let totalWorkMins = 0;
                if (inTime && outTime) {
                    totalWorkMins = Math.max(0, timeToMins(outTime) - timeToMins(actualShiftIn) - breakMins);
                } else if (shiftIn && shiftOut && emp.type === 'full' && !leave) {
                    totalWorkMins = Math.max(0, timeToMins(shiftOut) - timeToMins(shiftIn) - breakMins);
                }

                const igkAMins = timeToMins(igkA);
                let igkBMins = timeToMins(igkB);

                } else {

                    }
                }
                
                const driverMins = timeToMins(driverActual);
                const yPrivMins = timeToMins(yPrivate);

                return { isWknd, actualShiftIn, shiftOut, earlyOtMins, lateOtMins, totalWorkMins, igkAMins, igkBMins, driverMins, yPrivMins, breakTime };

                                                        <div className="text-xs font-bold text-blue-500 mb-1 print:text-[10px]">IGK B 合計</div>
                                                        <div className="text-xl font-black text-blue-600 font-mono print:text-base">{formatTimeWithDec(sumIgkb)}</div>
                                                    </div>
                                                    <div className="bg-purple-50 p-3 rounded-xl border border-purple-100 text-center shadow-sm md:col-span-3 flex flex-col justify-center print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-purple-600 mb-1 print:text-[10px]">A + B 合計時間 (総労働)</div>
                                                        <div className="text-2xl font-black text-purple-700 font-mono print:text-xl">{formatTimeWithDec(sumIgka + sumIgkb)}</div>
                                                    </div>

                                                    <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 text-center shadow-sm print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-orange-500 mb-1 print:text-[10px]">早残業</div>
                                                        <div className="text-xl font-black text-orange-600 print:text-base">{sumEarly} <span className="text-sm font-bold print:text-[10px]">分</span></div>
                                                    </div>
                                                    
                                                    <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 text-center shadow-sm print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-orange-500 mb-1 print:text-[10px]">後残業</div>
                                                        <div className="text-xl font-black text-orange-600 print:text-base">{sumLate} <span className="text-sm font-bold print:text-[10px]">分</span></div>
                                                    </div>
                                                    
                                                    <div className="bg-red-50 p-3 rounded-xl border border-red-100 text-center shadow-sm md:col-span-2 flex flex-col justify-center print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-red-500 mb-1 print:text-[10px]">残業合計 (早+後)</div>
                                                        <div className="text-2xl font-black text-red-600 print:text-xl">{sumEarly + sumLate} <span className="text-sm font-bold mx-1 print:text-[10px]">分</span> <span className="text-sm font-bold text-red-400 font-mono print:text-[10px]">({minsToTime(sumEarly+sumLate)})</span></div>
                                                    </div>

                                                    <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100 text-center shadow-sm md:col-span-2 flex flex-col justify-center print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-emerald-600 mb-1 print:text-[10px]">交通費 (月額)</div>
                                                        <div className="flex items-center justify-center gap-1">
                                                            <span className="text-lg font-bold text-emerald-700">¥</span>
                                                            <input type="number" value={monthlyData[`${currentEmp.id}_${period}`]?.transportFee || ''} onChange={(e) => updateMonthlyData(currentEmp.id, period, 'transportFee', e.target.value)} className="w-20 bg-transparent border-b-2 border-emerald-200 text-xl font-black text-emerald-700 text-center focus:outline-none focus:border-emerald-400 print:border-none print:text-base" placeholder="0" />
                                                        </div>
                                                    </div>
                                                </>
                                            ) : (
                                                <>
                                                    {['Mikuma', 'Taka', 'Ando'].includes(currentEmp.name) && (
                                                        <div className="bg-yellow-50 p-3 rounded-xl border border-yellow-100 text-center shadow-sm print:border-none print:bg-white">
                                                            <div className="text-xs font-bold text-yellow-600 mb-1 print:text-[10px]">ドライバー 実績</div>
                                                            <div className="text-xl font-black text-yellow-700 font-mono print:text-base">{formatTimeWithDec(sumDriver)}</div>
                                                        </div>
                                                    )}
                                                    
                                                    <div className="bg-pink-50 p-3 rounded-xl border border-pink-100 text-center shadow-sm print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-pink-500 mb-1 print:text-[10px]">IGK A 合計</div>
                                                        <div className="text-xl font-black text-pink-600 font-mono print:text-base">{formatTimeWithDec(sumIgka)}</div>
                                                    </div>

                                                    <div className="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center shadow-sm print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-blue-500 mb-1 print:text-[10px]">IGK B 合計</div>
                                                        <div className="text-xl font-black text-blue-600 font-mono print:text-base">{formatTimeWithDec(sumIgkb)}</div>
                                                    </div>

                                                    <div className="bg-purple-50 p-3 rounded-xl border border-purple-100 text-center shadow-sm print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-purple-500 mb-1 print:text-[10px]">Y Private</div>
                                                        <div className="text-xl font-black text-purple-600 font-mono print:text-base">{formatTimeWithDec(sumYPriv)}</div>
                                                    </div>

                                                    <div className="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center shadow-sm md:col-span-3 flex flex-col justify-center print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-indigo-600 mb-1 print:text-[10px]">A + B 合計時間 (総労働)</div>
                                                        <div className="text-2xl font-black text-indigo-700 font-mono print:text-xl">{formatTimeWithDec(sumIgka + sumIgkb)}</div>
                                                    </div>

                                                    <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100 text-center shadow-sm md:col-span-3 flex flex-col justify-center print:border-none print:bg-white">
                                                        <div className="text-xs font-bold text-emerald-600 mb-1 print:text-[10px]">交通費 (月額)</div>
                                                        <div className="flex items-center justify-center gap-1">
                                                            <span className="text-lg font-bold text-emerald-700">¥</span>
                                                            <input type="number" value={monthlyData[`${currentEmp.id}_${period}`]?.transportFee || ''} onChange={(e) => updateMonthlyData(currentEmp.id, period, 'transportFee', e.target.value)} className="w-20 bg-transparent border-b-2 border-emerald-200 text-xl font-black text-emerald-700 text-center focus:outline-none focus:border-emerald-400 print:border-none print:text-base" placeholder="0" />
                                                        </div>
                                                    </div>

                                                    {(() => {
                                                        const totalPartTimeMins = sumIgka + sumIgkb + sumDriver + sumYPriv;
                                                        const totalPartTimeDec = (totalPartTimeMins / 60).toFixed(2);
                                                        const transportTotal = Number(monthlyData[`${currentEmp.id}_${period}`]?.transportFee || 0);
                                                        return (
                                                            <div className="bg-white p-3 rounded-xl border-2 border-indigo-100 shadow-sm col-span-2 md:col-span-6 mt-1 print:border-slate-200 print:shadow-none">
                                                                <h3 className="text-indigo-800 font-black mb-2 flex items-center gap-2 text-sm print:text-xs">💰 給与シミュレーション <span className="text-[10px] font-bold text-indigo-400 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100 print:border-none">管理者専用</span></h3>
                                                                <div className="flex flex-wrap items-center gap-3 font-bold text-sm text-slate-600 print:text-[10px]">
                                                                    <div className="flex items-center gap-1 bg-slate-50 p-1.5 rounded-lg border border-slate-200 print:border-none print:bg-transparent">
                                                                        <label className="text-xs">時給(円):</label>
                                                                        <input type="number" value={hourlyWage} onChange={e => setHourlyWage(Number(e.target.value))} className="w-16 px-1 py-0.5 border border-slate-200 rounded text-right outline-none focus:border-indigo-400 font-black text-indigo-600 bg-white print:border-none" />
                                                                    </div>
                                                                    <div className="text-slate-300 font-black">×</div>
                                                                    <div className="bg-slate-50 p-1.5 rounded-lg border border-slate-200 text-xs flex items-center print:border-none print:bg-transparent">
                                                                        総労働: <span className="text-indigo-600 text-base ml-1 print:text-sm">{totalPartTimeDec} <span className="text-[10px]">H</span></span>
                                                                    </div>
                                                                    <div className="text-slate-300 font-black">＋</div>
                                                                    <div className="bg-emerald-50 p-1.5 rounded-lg border border-emerald-100 text-emerald-700 text-xs flex items-center print:border-none print:bg-transparent">
                                                                        交通費: <span className="text-base ml-1 print:text-sm">¥{transportTotal.toLocaleString()}</span>
                                                                    </div>
                                                                    <div className="text-slate-300 font-black">＝</div>
                                                                    <div className="bg-indigo-50 p-2 rounded-lg border border-indigo-200 shadow-inner flex items-baseline print:border-none print:bg-transparent print:shadow-none">
                                                                        <span className="text-indigo-800 mr-1 font-bold text-[10px]">推定給与:</span>
                                                                        <span className="text-xl font-black text-indigo-600 print:text-base">¥{(Math.floor(totalPartTimeDec * hourlyWage) + transportTotal).toLocaleString()}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })()}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- 列印專用 CSS --- */
        @media print {
            @page { margin: 1cm; size: A4 portrait; }
            body { background: white !important; font-size: 11pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print\:hidden { display: none !important; }
            .print\:break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
            input, select { border: none !important; background: transparent !important; box-shadow: none !important; }
        }
    </style>
</body>
</html>
