<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ★ 核心解析套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <style>
        /* 防止整個網頁左右捲動，允許上下捲動 */
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f3f4f6; overflow-x: hidden; overflow-y: auto; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .leave-row { background-color: #eff6ff !important; }
        .holiday-row { background-color: #fef2f2 !important; }
        .worked-row { background-color: #faf5ff !important; }
        
        .holiday-text { color: #b91c1c !important; font-weight: bold; }
        .absent-row { background-color: #ffffff !important; }
        
        .setting-panel-wrapper { display: flex; flex-direction: column; min-width: 0; }
        .day-checkbox:checked + span { background-color: #3b82f6; color: white; border-color: #2563eb; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyC2CVG7H5-LYs7bvNFJSdEf8blFNZmJOxs",
            authDomain: "igk-breadwinner.firebaseapp.com",
            projectId: "igk-breadwinner",
            storageBucket: "igk-breadwinner.firebasestorage.app",
            messagingSenderId: "1017510582907",
            appId: "1:1017510582907:web:2059d68dd57816398020de"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const docRef = db.collection('igk_data').doc('v2'); 

        const { useState, useEffect } = React;

        const HOLIDAYS_2026 = ['2026/01/01', '2026/01/12', '2026/02/11', '2026/02/23', '2026/03/20', '2026/04/29', '2026/05/03', '2026/05/04', '2026/05/05', '2026/05/06', '2026/07/20', '2026/08/11', '2026/09/21', '2026/09/22', '2026/09/23', '2026/10/12', '2026/11/03', '2026/11/23'];

        const INITIAL_EMPLOYEES = [
            { num: 6, id: 'm2', name: 'Tran ThiNhat Linh', type: 'full', location: 'myodani', aliases: ['Linh', 'リン'] },
            { num: 8, id: 'r1', name: '葛野みのり', type: 'full', location: 'rokko', aliases: ['Minori', '葛野 みのり', 'みのり'] },
            { num: 9, id: 'r2', name: 'Ratu Yassmyn', type: 'full', location: 'rokko', aliases: ['Yassmyn', 'ヤスミン', 'YassmynKhairussal', 'Khairussalima'] },
            { num: 11, id: 'm1', name: '加藤友梨', type: 'full', location: 'myodani', aliases: ['加藤', 'かとう'] },
            { num: 12, id: 'r3', name: 'YoonHoneyAung', type: 'full', location: 'rokko', aliases: ['Yoon', 'ユン'] },
            { num: 13, id: 'r4', name: '林昊嬛', type: 'full', location: 'rokko', aliases: ['Koukei', '林 昊嬛', '林'] },
            { num: 20, id: 'r15', name: '金栄美', type: 'part', location: 'rokko', aliases: ['kim eimi', 'eimi', '金'] },
            { num: 21, id: 'r11', name: '沼田真里子', type: 'part', location: 'rokko', aliases: ['Mariko', 'マリコ', 'まりこ'] },
            { num: 22, id: 'r16', name: '角田紀子', type: 'part', location: 'rokko', aliases: ['角田', 'つのだ'] },
            { num: 25, id: 'r6', name: '上山貴行', type: 'driver', location: 'rokko', aliases: ['Taka', '上山', 'たか'] },
            { num: 26, id: 'r5', name: '實熊功光', type: 'driver', location: 'rokko', aliases: ['Mikuma', '実熊', 'みくま'] },
            { num: 38, id: 'r9', name: 'Nakyung Kim', type: 'part', location: 'rokko', aliases: ['キム', 'Kim', 'Nakyung'] },
            { num: 39, id: 'r10', name: 'Nathan Morrison', type: 'part', location: 'rokko', aliases: ['Nathan', 'ネイサン'] },
            { num: 340, id: 'r17', name: 'Liedtke Giovanna Cecilia', type: 'part', location: 'rokko', aliases: ['Gio', 'ジオ', 'Liedtke'] },
            { num: 341, id: 'r18', name: 'Afrin Tanjida', type: 'part', location: 'rokko', aliases: ['Afrin', 'アフリン'] },
            { num: 342, id: 'r19', name: 'Huggins Alford Henry', type: 'part', location: 'rokko', aliases: ['Henry', 'ヘンリー', 'Huggins'] },
            { num: 52, id: 'm3', name: '大津真里', type: 'part', location: 'myodani', aliases: ['大津', 'おおつ'] },
            { num: 58, id: 'm4', name: '馬場亜希', type: 'part', location: 'myodani', aliases: ['馬場', 'ばば'] },
            { num: 74, id: 'm5', name: '篠崎真理子', type: 'part', location: 'myodani', aliases: ['篠崎', 'しのざき'] },
            { num: 75, id: 'm6', name: '吉野真緒', type: 'part', location: 'myodani', aliases: ['吉野', 'よしの'] },
            { num: 77, id: 'm7', name: '森佳織', type: 'part', location: 'myodani', aliases: ['もり', '森佳織'] },
            { num: 82, id: 'm9', name: 'Ashfaq Hamna', type: 'part', location: 'myodani', aliases: ['ハムナ', 'Hamna'] },
            { num: 83, id: 'm10', name: 'Khanum Tafriheen', type: 'part', location: 'myodani', aliases: ['Nilima', 'ニリマ', 'Tafriheen'] },
            { num: 84, id: 'm11', name: 'Islam Sadia', type: 'part', location: 'myodani', aliases: ['サディア', 'Sadia'] },
            { num: 86, id: 'm12', name: 'MonikaChowdhury', type: 'part', location: 'myodani', aliases: ['モニカ', 'Monika'] },
            { num: 88, id: 'm13', name: '中嶋莉真', type: 'part', location: 'myodani', aliases: ['中嶋', 'なかじま'] },
            { num: 89, id: 'm14', name: '顕谷 ユタカ', type: 'part', location: 'myodani', aliases: ['顕谷', 'あきたに'] },
            { num: 90, id: 'm15', name: 'MozelleBargamin', type: 'part', location: 'myodani', aliases: ['Mozelle', 'モゼル'] },
            { num: 91, id: 'm_bjoerg', name: 'BjoergBendix', type: 'part', location: 'myodani', aliases: ['Bjoerg', 'ビョルグ'] },
        ];

        const isHoliday = (dateStr) => [0, 6].includes(dayjs(dateStr).day()) || HOLIDAYS_2026.includes(dateStr);

        const padNum = (num) => String(num).padStart(3, '0');

        const calculateMinutes = (start, end) => {
            if (!start || !end) return 0;
            let s = dayjs(`2000-01-01 ${start}`);
            let e = dayjs(`2000-01-01 ${end}`);
            if (e.isBefore(s)) e = e.add(1, 'day');
            return e.diff(s, 'minute');
        };

        const formatVerboseMins = (mins) => {
            if (!mins || isNaN(mins) || mins <= 0) return '';
            const h = Math.floor(mins / 60);
            const m = Math.round(mins % 60);
            const hrsDecimal = (mins / 60).toFixed(2);
            if (h === 0) return `${m}分 (${hrsDecimal}H)`;
            return `${h}時間${m}分 (${hrsDecimal}H)`;
        };

        const formatVerboseHours = (hrs) => {
            if (!hrs || isNaN(hrs) || hrs <= 0) return '';
            const val = parseFloat(hrs);
            const mins = Math.round(val * 60);
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            if (h === 0) return `${m}分 (${val.toFixed(2)}H)`;
            return `${h}時間${m}分 (${val.toFixed(2)}H)`;
        };

        const getSafeText = (val) => {
            if (val === null || val === undefined) return '';
            if (typeof val === 'string') return val;
            if (typeof val === 'number') return String(val);
            if (val instanceof Date) return dayjs(val).format('YYYY/MM/DD');
            if (val.richText) return val.richText.map(rt => rt.text).join('');
            if (val.result !== undefined && val.result !== null) {
                if (val.result instanceof Date) return dayjs(val.result).format('YYYY/MM/DD');
                return String(val.result);
            }
            try { return String(val); } catch(e) { return ''; }
        };

        const calculateDriveMinsFromRemark = (remark) => {
            if (!remark) return 0;
            const regex = /(\d{1,2}:\d{2})\s*[-~]\s*(\d{1,2}:\d{2})/g;
            let match;
            let total = 0;
            while ((match = regex.exec(remark)) !== null) {
                total += calculateMinutes(match[1], match[2]);
            }
            return total;
        };

        const SettingPanel = ({ title, children, className = '' }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-gray-200 p-4 setting-panel-wrapper flex flex-col min-w-0 ${className}`}>
                <div className="mb-3 border-b pb-2 shrink-0">
                    <h2 className="text-[15px] font-bold text-gray-800">{title}</h2>
                </div>
                <div className="flex flex-col min-w-0 h-full">{children}</div>
            </div>
        );

        const EmployeeReport = ({ employee, data, payMonth, isLocked, onInput }) => {
            const [localEditable, setLocalEditable] = useState(false);
            const payDateObj = dayjs(`${payMonth}-01`);
            
            const periodStart = payDateObj.subtract(1, 'month').date(16);
            const periodEnd = payDateObj.date(15);

            const dates = [];
            let curr = periodStart;
            while (curr.isBefore(periodEnd) || curr.isSame(periodEnd, 'day')) {
                dates.push(curr.format('YYYY/MM/DD'));
                curr = curr.add(1, 'day');
            }

            const handleInput = (date, field, val) => {
                if (isLocked || !localEditable) return;
                onInput(employee.id, date, field, val);
            };

            let workDays = 0, earlyTotal = 0, lateTotal = 0, totalTrans = 0;
            let totalIgkA = 0, totalIgkB = 0, totalDrive = 0, totalInOutGlobal = 0, totalWorkMinsGlobal = 0;
            let leave2H = 0, leave4H = 0, leave6H = 0, leave8H = 0, sick = 0, absent = 0;

            const feeLabel = employee.type === 'full' ? '出張費' : '交通費';

            return (
                <div className="flex flex-col bg-white rounded-lg border border-gray-200 shadow-sm h-full max-h-full min-w-0">
                    <div className="shrink-0 flex justify-between items-end mb-2 border-b border-gray-200 pb-2 px-3 pt-3">
                        <h2 className="text-xl font-bold flex items-center gap-2 text-gray-800">
                            <span className="bg-blue-600 text-white px-2 py-0.5 rounded-md shadow text-sm font-mono">{padNum(employee.num)}</span>
                            {employee.name}
                        </h2>
                        <div className="flex items-center gap-2">
                            <div className="text-[11px] font-bold text-gray-600 tracking-wide bg-gray-50 pl-3 pr-1 py-1 rounded shadow-sm flex items-center gap-3 border border-gray-200">
                                <span>対象月: {payMonth.replace('-', '')} | 雇用形態: {employee.type === 'full' ? '正社員' : employee.type === 'driver' ? '司機' : 'アルバイト'}</span>
                                <button 
                                    onClick={() => setLocalEditable(!localEditable)}
                                    disabled={isLocked}
                                    className={`px-3 py-1 rounded border shadow-sm transition-colors font-bold flex items-center gap-1.5 ${
                                        isLocked ? 'opacity-50 cursor-not-allowed bg-gray-200 text-gray-400 border-gray-300' 
                                        : localEditable ? 'bg-white text-blue-700 border-blue-400' 
                                        : 'bg-gray-400 text-white border-gray-500 hover:bg-gray-500'
                                    }`}
                                >
                                    <i className={`fa-solid ${localEditable ? 'fa-pen-to-square' : 'fa-lock'}`}></i>
                                    {localEditable ? '手動入力 ON' : '手動入力 OFF'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto custom-scrollbar mx-2 pb-2 min-w-0">
                        <table className="w-full text-left border-collapse whitespace-nowrap text-[11px]">
                            <thead className="bg-gray-100 sticky top-0 shadow-sm z-10 text-gray-700">
                                <tr>
                                    <th className="border border-gray-200 p-1 min-w-[70px]">日付</th>
                                    <th className="border border-gray-200 p-1 text-center bg-blue-50/50">入室1<br/>退室1</th>
                                    <th className="border border-gray-200 p-1 text-center bg-blue-50/50">入室2<br/>退室2</th>
                                    <th className="border border-gray-200 p-1 text-blue-800 text-center">シフト</th>
                                    <th className="border border-gray-200 p-1 text-center">休憩(分)</th>
                                    <th className="border border-gray-200 p-1 bg-green-50 text-center">勤務時間</th>
                                    {employee.type === 'full' && <><th className="border border-gray-200 p-1 text-center">早残業</th><th className="border border-gray-200 p-1 text-center">後残業</th></>}
                                    {employee.type === 'driver' && <><th className="border border-gray-200 p-1 text-center">運転時間(分)</th><th className="border border-gray-200 p-1 text-center">IGK A(H)</th><th className="border border-gray-200 p-1 text-center">IGK B(H)</th></>}
                                    {employee.type === 'part' && <><th className="border border-gray-200 p-1 text-center">IGK A(H)</th><th className="border border-gray-200 p-1 text-center">IGK B(H)</th></>}
                                    <th className="border border-gray-200 p-1 bg-yellow-50 text-yellow-800 text-center w-[70px]">{feeLabel}</th>
                                    <th className="border border-gray-200 p-1 min-w-[120px]">備考・出勤狀況</th>
                                </tr>
                            </thead>
                            <tbody>
                                {dates.map((date) => {
                                    const isH = isHoliday(date);
                                    const dayData = data[date] || {};
                                    const hasData = !!(dayData.in?.trim() || dayData.out?.trim() || dayData.in2?.trim() || dayData.out2?.trim()); 
                                    
                                    let shiftStart = dayData.shiftStart || '';
                                    let shiftEnd = dayData.shiftEnd || '';
                                    
                                    // ★ 需求2: 正社員即使有休/欠勤，仍顯示班表
                                    if (employee.type === 'full' && !isH && !shiftStart && !shiftEnd) {
                                        shiftStart = employee.location === 'rokko' ? '09:30' : '09:15';
                                        shiftEnd = employee.location === 'rokko' ? '18:30' : '18:15';
                                    }
                                    
                                    if (hasData || parseFloat(dayData.igkAHours) > 0 || parseInt(dayData.driveMins) > 0) {
                                        workDays++;
                                    }

                                    const isLeave = dayData.leaveType && (dayData.leaveType.includes('休') || dayData.leaveType.includes('欠'));
                                    
                                    if (dayData.leaveType === '有休(2時間)') leave2H++;
                                    if (dayData.leaveType === '有休(4時間)') leave4H++;
                                    if (dayData.leaveType === '有休(6時間)') leave6H++;
                                    if (dayData.leaveType === '有休(8時間)') leave8H++;
                                    if (dayData.leaveType && dayData.leaveType.includes('病欠')) sick++;
                                    if (dayData.leaveType && dayData.leaveType.includes('欠勤')) absent++;

                                    const mins1 = calculateMinutes(dayData.in, dayData.out);
                                    const mins2 = calculateMinutes(dayData.in2, dayData.out2);
                                    const inOutMins = mins1 + mins2;
                                    totalInOutGlobal += inOutMins;

                                    const leaveMatch = dayData.leaveType ? dayData.leaveType.match(/\((\d)時間\)/) : null;
                                    const leaveHrs = leaveMatch ? parseInt(leaveMatch[1]) : 0;
                                    
                                    let breakMins = hasData ? (employee.type === 'full' ? (leaveHrs >= 4 ? 0 : 60) : (dayData.break || 0)) : 0;
                                    const workMins = Math.max(0, inOutMins - breakMins);
                                    const workHours = workMins / 60;
                                    totalWorkMinsGlobal += workMins;
                                    
                                    let early = 0, late = 0;
                                    if (employee.type === 'full' && hasData && shiftStart && shiftEnd) {
                                        let sStart = dayjs(`2000-01-01 ${shiftStart}`);
                                        let sEnd = dayjs(`2000-01-01 ${shiftEnd}`);
                                        
                                        let aIn = dayData.in ? dayjs(`2000-01-01 ${dayData.in}`) : null;
                                        let latestOutTime = dayData.out2 || dayData.out;
                                        let aOut = latestOutTime ? dayjs(`2000-01-01 ${latestOutTime}`) : null;

                                        if (sEnd.isBefore(sStart)) sEnd = sEnd.add(1, 'day');
                                        if (aIn && aOut && aOut.isBefore(aIn)) aOut = aOut.add(1, 'day');

                                        let adjustedSStart = sStart.clone();
                                        if (leaveHrs > 0) {
                                            if (leaveHrs === 2) {
                                                adjustedSStart = adjustedSStart.add(2, 'hour');
                                            } else if (leaveHrs >= 4) {
                                                adjustedSStart = adjustedSStart.add(leaveHrs + 1, 'hour');
                                            }
                                        }

                                        if (aIn) early = Math.max(0, adjustedSStart.diff(aIn, 'minute'));
                                        if (aOut) late = Math.max(0, aOut.diff(sEnd, 'minute'));

                                        earlyTotal += early;
                                        lateTotal += late;
                                    }

                                    let drive = parseInt(dayData.driveMins) || 0;
                                    let igkA = parseFloat(dayData.igkAHours) || 0;
                                    let igkB = 0;

                                    if (employee.type === 'driver') {
                                        igkB = Math.max(0, workHours - (drive / 60)); 
                                        totalDrive += drive;
                                    } else if (employee.type === 'part') {
                                        igkB = Math.max(0, workHours - igkA);
                                    }
                                    totalIgkA += igkA;
                                    totalIgkB += igkB;
                                    
                                    const transFee = parseInt(dayData.transFee) || 0;
                                    totalTrans += transFee;

                                    let rowClass = "hover:bg-gray-200 border-b transition-colors ";
                                    if (isLeave) rowClass += "leave-row "; 
                                    else if (isH) rowClass += "holiday-row holiday-text "; 
                                    else if (hasData) rowClass += "worked-row "; 

                                    return (
                                        <tr key={date} className={rowClass}>
                                            <td className="border border-gray-200 p-1 text-center align-middle font-mono">{dayjs(date).format('MM/DD')}({['日','月','火','水','木','金','土'][dayjs(date).day()]})</td>
                                            
                                            <td className="border border-gray-200 p-0.5 align-middle">
                                                <div className="flex flex-col gap-1 items-center">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5" value={dayData.in || ''} placeholder="--:--" onChange={e => handleInput(date, 'in', e.target.value)} />
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5" value={dayData.out || ''} placeholder="--:--" onChange={e => handleInput(date, 'out', e.target.value)} />
                                                </div>
                                            </td>
                                            
                                            <td className="border border-gray-200 p-0.5 align-middle">
                                                <div className="flex flex-col gap-1 items-center">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5 text-gray-500" value={dayData.in2 || ''} placeholder="--:--" onChange={e => handleInput(date, 'in2', e.target.value)} />
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center bg-transparent outline-none focus:ring-1 focus:ring-blue-400 border border-gray-200 rounded py-0.5 text-gray-500" value={dayData.out2 || ''} placeholder="--:--" onChange={e => handleInput(date, 'out2', e.target.value)} />
                                                </div>
                                            </td>
                                            
                                            <td className="border border-gray-200 p-0.5 text-center text-blue-600 font-bold bg-blue-50/20 align-middle">
                                                <div className="flex justify-center items-center gap-0.5">
                                                    <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftStart} onChange={e=>handleInput(date,'shiftStart',e.target.value)} />
                                                    -
                                                    <input disabled={isLocked || !localEditable} className="w-11 text-center bg-transparent outline-none" value={shiftEnd} onChange={e=>handleInput(date,'shiftEnd',e.target.value)} />
                                                </div>
                                            </td>
                                            
                                            <td className="border border-gray-200 p-0.5 text-center align-middle">
                                                <input disabled={isLocked || !localEditable} className="w-10 text-center bg-transparent outline-none border border-gray-200 rounded py-0.5 mx-auto block" value={dayData.break || (hasData && employee.type==='full' ? (leaveHrs >= 4 ? '0' : '60') : '')} onChange={e=>handleInput(date,'break',e.target.value)} />
                                            </td>

                                            <td className="border border-gray-200 p-1 text-center font-bold text-green-800 bg-green-50 align-middle whitespace-normal">
                                                {workMins > 0 ? formatVerboseMins(workMins) : ''}
                                            </td>
                                            
                                            {employee.type === 'full' && <>
                                                <td className="border border-gray-200 p-1 text-center text-orange-600 align-middle">{early > 0 ? formatVerboseMins(early) : ''}</td>
                                                <td className="border border-gray-200 p-1 text-center text-orange-600 align-middle">{late > 0 ? formatVerboseMins(late) : ''}</td>
                                            </>}
                                            {employee.type === 'driver' && <>
                                                <td className="border border-gray-200 p-0.5 text-center align-middle">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center border border-gray-200 outline-none rounded bg-transparent font-bold text-purple-700 py-0.5" value={dayData.driveMins || ''} onChange={e=>handleInput(date,'driveMins',e.target.value)} />
                                                    {dayData.driveMins > 0 && <div className="text-[9px] text-purple-600 mt-0.5">{formatVerboseMins(dayData.driveMins)}</div>}
                                                </td>
                                                <td className="border border-gray-200 p-0.5 text-center align-middle">
                                                    <input disabled={isLocked || !localEditable} className="w-12 text-center border border-gray-200 outline-none rounded bg-transparent py-0.5 text-blue-700" value={dayData.igkAHours || ''} onChange={e=>handleInput(date,'igkAHours',e.target.value)} />

                    <div className="shrink-0 px-3 pb-3">

                                        <div className="text-[10px] text-indigo-700 font-bold mb-1">A+B 総労働</div>
                                        <div className="text-xs font-black text-indigo-800 flex flex-col items-center leading-tight">
                                            <span>{formatVerboseHours(totalIgkA) || '0分 (0.00H)'} <span className="text-indigo-400">+</span> {formatVerboseHours(totalIgkB) || '0分 (0.00H)'}</span>
                                            <span className="text-[13px] mt-0.5"><span className="text-indigo-400">=</span> {formatVerboseHours(totalIgkA+totalIgkB) || '0分 (0.00H)'}</span>

                                <div className="text-sm font-black text-green-900">{formatVerboseMins(totalWorkMinsGlobal) || '0分 (0.00H)'}</div>
                            </div>

                            <div className="bg-yellow-100/80 rounded-lg p-2 flex flex-col justify-center items-center shadow-sm border border-yellow-400 min-w-[140px] flex-[1.2]">

                                <div className="font-black text-xl text-gray-900">{totalTrans.toLocaleString()} <span className="text-[11px] font-bold text-gray-600">円</span></div>
