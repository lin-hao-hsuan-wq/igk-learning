<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGK Attendance System - Folder Tabs Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body className="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- 核心資料：人員名單與別名 (完全保留我們之前的記憶) ---
        const EMPLOYEES = [
            // 正社員
            { id: 'e1', name: 'Toshi', aliases: ['トシ'], type: 'full' },
            { id: 'e2', name: 'Minori', aliases: ['葛野みのり', '葛野 みのり', 'みのり', 'Minori'], type: 'full' },
            { id: 'e3', name: 'Yassmyn', aliases: ['ヤスミン', 'Ratu Yassmyn Khairussalima', 'Yassmyn'], type: 'full' },
            { id: 'e4', name: 'Yoon', aliases: ['ユン', 'Yoon Honey Aung', 'Yoon'], type: 'full' },
            { id: 'e5', name: 'Koukei', aliases: ['林昊嬛', '林 昊嬛', '林'], type: 'full' },
            { id: 'e6', name: '加藤友梨', aliases: ['加藤', 'かとう'], type: 'full' },
            { id: 'e7', name: 'Linh', aliases: ['リン'], type: 'full' },
            // 打工 / 兼職
            { id: 'p1', name: 'Mikuma', aliases: ['実熊', 'みくま', '實熊功光', '實熊 功光', '実熊功光'], type: 'part' },
            { id: 'p2', name: 'Taka', aliases: ['上山', 'たか', '上山貴行', '上山 貴行'], type: 'part' },
            { id: 'p3', name: 'Fergus', aliases: ['ファーガス'], type: 'part' },
            { id: 'p4', name: 'Sammy', aliases: ['サミー', 'Sammy Abukmeil'], type: 'part' },
            { id: 'p5', name: 'Kim Nakyung', aliases: ['キム', 'Kim', 'Nakyung'], type: 'part' },
            { id: 'p6', name: 'Nathan', aliases: ['ネイサン', 'Nathan Morrison'], type: 'part' },
            { id: 'p7', name: 'Mariko', aliases: ['マリコ', 'まりこ', '沼田真里子', '沼田 真里子'], type: 'part' },
            { id: 'p8', name: 'Ando', aliases: ['安藤', 'あんどう', '安藤佑也', '安藤 佑也'], type: 'part' },
            { id: 'p9', name: 'Misato', aliases: ['ミサト', 'みさと'], type: 'part' },
            { id: 'p10', name: 'Nao', aliases: ['ナオ', 'なお'], type: 'part' },
            { id: 'p11', name: '金栄美', aliases: ['kim eimi', 'eimi', '金'], type: 'part' },
            { id: 'p12', name: '角田紀子', aliases: ['角田', 'つのだ'], type: 'part' },
            { id: 'p13', name: '大津真里', aliases: ['大津', 'おおつ'], type: 'part' },
            { id: 'p14', name: '馬場亜希', aliases: ['馬場', 'ばば'], type: 'part' },
            { id: 'p15', name: 'Mozelle', aliases: ['Mozelle Bargamin', 'モゼル'], type: 'part' }
        ];

        // 可愛資料夾顏色池
        const TAB_COLORS = [
            'bg-pink-100 text-pink-700 border-pink-200',
            'bg-blue-100 text-blue-700 border-blue-200',
            'bg-emerald-100 text-emerald-700 border-emerald-200',
            'bg-purple-100 text-purple-700 border-purple-200',
            'bg-orange-100 text-orange-700 border-orange-200',
            'bg-teal-100 text-teal-700 border-teal-200',
        ];

        // 輔助函數：時間轉換
        const timeToMins = (t) => {
            if (!t) return 0;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        };
        const minsToTime = (m) => {
            if (!m || m <= 0) return '';
            return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        };

        function App() {
            const [activePage, setActivePage] = useState('import'); // 'import' or 'preview'
            
            // 日期區間設定 (16日~15日)
            const today = new Date();
            let initM = today.getDate() >= 16 ? today.getMonth() + 2 : today.getMonth() + 1;
            let initY = today.getFullYear();
            if (initM > 12) { initM -= 12; initY += 1; }
            const [period, setPeriod] = useState(`${initY}-${String(initM).padStart(2, '0')}`);
            
            const [settings, setSettings] = useState({
                baseStart: '09:30', baseEnd: '18:30', special: []
            });
            const [newSp, setNewSp] = useState({ name: '', start: '', end: '', timeIn: '09:30', timeOut: '18:30' });

            const [pastedData, setPastedData] = useState('');
            const [attendance, setAttendance] = useState({}); // { empId: { dateKey: { inTime, outTime, shiftIn, shiftOut, leave, igka, remark } } }
            const [activeEmp, setActiveEmp] = useState(EMPLOYEES[0].id);

            const dates = useMemo(() => {
                const [y, m] = period.split('-').map(Number);
                const start = new Date(y, m - 2, 16);
                const end = new Date(y, m - 1, 15);
                let arr = [];
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    arr.push(new Date(d));
                }
                return arr;
            }, [period]);

            const dKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;
            
            // --- 處理貼上的打卡資料 ---
            const handlePaste = () => {
                if (!pastedData.trim()) return alert("請貼上打卡資料");
                
                let newData = { ...attendance };
                const text = pastedData.toLowerCase().replace(/\r/g, '');
                // 找出所有符合日期與時間的區塊
                const timeRegex = /(?:(?:20)?\d{2}[\/\-])?(\d{1,2})[\/\-](\d{1,2})日?.*?(?:入室|退室|in|out)?.*?(\d{1,2})[:：](\d{2})/gi;
                
                let match;
                let count = 0;
                while ((match = timeRegex.exec(text)) !== null) {
                    const month = match[1];
                    const day = match[2];
                    const hr = match[3];
                    const min = match[4];
                    const timeStr = `${hr.padStart(2,'0')}:${min.padStart(2,'0')}`;
                    const idx = match.index;

                    // 往前找 150 字元看是誰，看是入室還退室
                    const context = text.substring(Math.max(0, idx - 150), idx + 50);
                    
                    let foundEmpId = null;
                    for (let emp of EMPLOYEES) {
                        const names = [emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/\s/g,''))];
                        if (names.some(n => context.replace(/\s/g,'').includes(n))) {
                            foundEmpId = emp.id; break;
                        }
                    }

                    if (foundEmpId) {
                        const y = new Date().getFullYear(); // 簡化為今年
                        const dateObj = new Date(y, parseInt(month)-1, parseInt(day));
                        const key = dKey(dateObj);

                        let type = context.includes('退') || context.includes('out') ? 'outTime' : 'inTime';
                        
                        if (!newData[foundEmpId]) newData[foundEmpId] = {};
                        if (!newData[foundEmpId][key]) newData[foundEmpId][key] = {};
                        
                        newData[foundEmpId][key][type] = timeStr;
                        count++;
                    }
                }
                setAttendance(newData);
                setPastedData('');
                alert(`成功匯入 ${count} 筆打卡資料！`);
            };

            // --- 處理 Excel 班表 ---
            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let newData = { ...attendance };
                        let count = 0;

                        // 遍歷所有 Sheet
                        wb.worksheets.forEach(ws => {
                            for (let r = 1; r <= ws.rowCount; r++) {
                                // 找日期
                                let rowDateStr = ws.getCell(r, 1).text || ws.getCell(r, 2).text;
                                let dMatch = rowDateStr.match(/(\d{1,2})[\/\-月](\d{1,2})/);
                                if (!dMatch) continue;
                                const dateKeyStr = dKey(new Date(new Date().getFullYear(), parseInt(dMatch[1])-1, parseInt(dMatch[2])));

                                // 找人名表頭 (假設這行上方 1~3 行內有人名)
                                let colMap = {};
                                for (let c = 2; c <= 30; c++) {
                                    let headCell = ws.getCell(Math.max(1, r - 2), c).text || ws.getCell(Math.max(1, r - 1), c).text;
                                    let nameClean = headCell.toLowerCase().replace(/\s/g, '');
                                    EMPLOYEES.forEach(emp => {
                                        if ([emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/\s/g,''))].includes(nameClean)) {
                                            colMap[c] = emp.id;
                                        }
                                    });
                                }

                                // 找這行的時間區段
                                let timeCell = ws.getCell(r, 1).text || '';
                                let tMatch = timeCell.match(/(\d{1,2})[:：](\d{2})/);
                                if (tMatch && Object.keys(colMap).length > 0) {
                                    let rowMins = timeToMins(`${tMatch[1]}:${tMatch[2]}`);

                                    Object.keys(colMap).forEach(c => {
                                        const empId = colMap[c];
                                        const cell = ws.getCell(r, parseInt(c));
                                        const actualCell = cell.isMerged ? ws.getCell(cell.master.address) : cell;
                                        const hasContent = actualCell.text.trim().length > 0;
                                        const isColored = actualCell.fill && actualCell.fill.type === 'pattern' && actualCell.fill.pattern !== 'none';
                                        
                                        // 只要有顏色或有字，就視為有班
                                        if (hasContent || isColored) {
                                            if (!newData[empId]) newData[empId] = {};
                                            if (!newData[empId][dateKeyStr]) newData[empId][dateKeyStr] = {};
                                            
                                            let curIn = timeToMins(newData[empId][dateKeyStr].shiftIn || '23:59');
                                            let curOut = timeToMins(newData[empId][dateKeyStr].shiftOut || '00:00');
                                            
                                            if (rowMins < curIn) newData[empId][dateKeyStr].shiftIn = minsToTime(rowMins);
                                            // 預設每格 30 分鐘，如果塗色到底，加 30 分
                                            if (rowMins + 30 > curOut) newData[empId][dateKeyStr].shiftOut = minsToTime(rowMins + 30);
                                            
                                            count++;
                                        }
                                    });
                                }
                            }
                        });
                        setAttendance(newData);
                        alert(`成功從班表抽取並派發 ${count} 個時段區塊！`);
                    } catch (err) {
                        alert("讀取 Excel 失敗");
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const updateCell = (id, d, field, val) => {
                setAttendance(prev => ({
                    ...prev, [id]: { ...prev[id], [d]: { ...prev[id]?.[d], [field]: val } }
                }));
            };

            // --- 核心計算邏輯 (Shift 5分進位、殘業、IGKB) ---
            const calculateRow = (date, row, emp) => {
                const isWknd = isWeekend(date);
                let { inTime, outTime, shiftIn, shiftOut, leave, igka } = row;
                
                // 正社員預設班表
                if (emp.type === 'full') {
                    shiftIn = shiftIn || settings.baseStart;
                    shiftOut = shiftOut || settings.baseEnd;
                    // TODO: 檢查 Special Period 覆蓋
                    settings.special.forEach(sp => {
                        if (new Date(date) >= new Date(sp.start) && new Date(date) <= new Date(sp.end)) {
                            shiftIn = sp.timeIn; shiftOut = sp.timeOut;
                        }
                    });
                }

                // 【遲到 5 分鐘進位邏輯】
                let actualShiftIn = shiftIn;
                if (inTime && shiftIn) {
                    const inM = timeToMins(inTime);
                    const sInM = timeToMins(shiftIn);
                    if (inM > sInM && inM <= sInM + 4) {
                        actualShiftIn = minsToTime(sInM + 5); // 14:01-04 變成 14:05
                    } else if (inM > sInM + 4) {
                        actualShiftIn = minsToTime(Math.ceil(inM / 5) * 5); // 更晚的話以 5 分為單位進位
                    }
                }

                // 【早殘業、後殘業】(僅正社員)
                let earlyOtMins = 0;
                let lateOtMins = 0;
                if (emp.type === 'full') {
                    if (inTime && shiftIn) {
                        let diff = timeToMins(shiftIn) - timeToMins(inTime);
                        if (diff > 0) earlyOtMins = diff;
                    }
                    if (outTime && shiftOut) {
                        let diff = timeToMins(outTime) - timeToMins(shiftOut);
                        if (diff > 0) lateOtMins = diff;
                    }
                }

                // 【總上班時間與 IGKB】
                let totalWorkMins = 0;
                if (inTime && outTime) {
                    totalWorkMins = timeToMins(outTime) - timeToMins(actualShiftIn); // 扣除進位後的上班時間
                    if (totalWorkMins < 0) totalWorkMins = 0;
                } else if (shiftIn && shiftOut && emp.type === 'full' && !leave) {
                    // 正社員正常班
                    totalWorkMins = timeToMins(shiftOut) - timeToMins(shiftIn);
                }

                const igkaMins = timeToMins(igka || '00:00');
                const igkbMins = Math.max(0, totalWorkMins - igkaMins);

                return {
                    isWknd,
                    actualShiftIn, shiftOut,
                    earlyOtMins, lateOtMins,
                    totalWorkMins, igkaMins, igkbMins
                };
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Header Tabs */}
                    <div className="bg-slate-800 text-white p-4 flex gap-4 print:hidden">
                        <h1 className="text-xl font-bold mr-8">IGK 勤怠總部</h1>
                        <button onClick={() => setActivePage('import')} className={`px-4 py-1 rounded font-bold ${activePage === 'import' ? 'bg-white text-slate-800' : 'text-gray-300 hover:bg-slate-700'}`}>① 資料指揮中心</button>
                        <button onClick={() => setActivePage('preview')} className={`px-4 py-1 rounded font-bold ${activePage === 'preview' ? 'bg-white text-slate-800' : 'text-gray-300 hover:bg-slate-700'}`}>② 個人勤務表</button>
                    </div>

                    {/* --- Page 1: 指揮中心 --- */}
                    {activePage === 'import' && (
                        <div className="p-6 max-w-5xl mx-auto space-y-6 w-full">
                            {/* 上區 */}
                            <div className="bg-white p-6 rounded-xl shadow border-t-4 border-indigo-500">
                                <h2 className="text-lg font-bold text-indigo-900 mb-4">【上區】正社員勤務與特別期間設定</h2>
                                <div className="flex gap-4 mb-4">
                                    <div><label className="block text-xs font-bold text-gray-500">預設入室</label><input type="time" value={settings.baseStart} onChange={e=>setSettings({...settings, baseStart: e.target.value})} className="border rounded p-1"/></div>
                                    <div><label className="block text-xs font-bold text-gray-500">預設退室</label><input type="time" value={settings.baseEnd} onChange={e=>setSettings({...settings, baseEnd: e.target.value})} className="border rounded p-1"/></div>
                                </div>
                                <div className="bg-indigo-50 p-3 rounded flex gap-2 items-end">
                                    <input type="text" placeholder="特別原因 (如 Summer school)" value={newSp.name} onChange={e=>setNewSp({...newSp, name: e.target.value})} className="border rounded p-1 flex-1"/>
                                    <input type="date" value={newSp.start} onChange={e=>setNewSp({...newSp, start: e.target.value})} className="border rounded p-1"/>
                                    <input type="date" value={newSp.end} onChange={e=>setNewSp({...newSp, end: e.target.value})} className="border rounded p-1"/>
                                    <input type="time" value={newSp.timeIn} onChange={e=>setNewSp({...newSp, timeIn: e.target.value})} className="border rounded p-1 w-24"/>
                                    <input type="time" value={newSp.timeOut} onChange={e=>setNewSp({...newSp, timeOut: e.target.value})} className="border rounded p-1 w-24"/>
                                    <button onClick={() => { setSettings(s => ({...s, special: [...s.special, newSp]})); setNewSp({name:'',start:'',end:'',timeIn:'09:30',timeOut:'18:30'})}} className="bg-indigo-600 text-white px-3 py-1 rounded font-bold">新增</button>
                                </div>
                            </div>

                            {/* 中區 */}
                            <div className="bg-white p-6 rounded-xl shadow border-t-4 border-emerald-500">
                                <h2 className="text-lg font-bold text-emerald-900 mb-2">【中區】打卡紀錄無縫貼上區</h2>
                                <p className="text-xs text-gray-500 mb-3">直接貼上包含 Kim Nakyung 等名字、入室退室及時間的文字，系統自動派發。</p>
                                <textarea value={pastedData} onChange={e=>setPastedData(e.target.value)} className="w-full h-32 border rounded-lg p-3 text-sm bg-gray-50" placeholder="貼上打卡紀錄..."></textarea>
                                <button onClick={handlePaste} className="mt-2 bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold w-full hover:bg-emerald-700">解析並匯入打卡資料</button>
                            </div>

                            {/* 下區 */}
                            <div className="bg-white p-6 rounded-xl shadow border-t-4 border-blue-500">
                                <h2 className="text-lg font-bold text-blue-900 mb-2">【下區】班表檔案上傳自動派發</h2>
                                <p className="text-xs text-gray-500 mb-3">上傳 Excel (.xlsx) 班表，Koukei的格子自動放入林昊嬛的表單中！自動累積不覆蓋。</p>
                                <input type="file" accept=".xlsx" onChange={handleExcelUpload} className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-dashed border-blue-300 p-4 rounded-xl bg-blue-50/30" />
                            </div>
                        </div>
                    )}

                    {/* --- Page 2: 個人勤務表 --- */}
                    {activePage === 'preview' && (
                        <div className="p-4 sm:p-6 w-full max-w-[1400px] mx-auto overflow-hidden flex flex-col">
                            {/* 控制列 */}
                            <div className="flex gap-4 mb-4 items-center print:hidden">
                                <input type="month" value={period} onChange={e=>setPeriod(e.target.value)} className="border-2 border-slate-300 rounded-lg p-2 font-bold text-lg"/>
                                <button onClick={() => window.print()} className="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold">列印 / PDF</button>
                            </div>

                            {/* 可愛資料夾標籤列 */}
                            <div className="flex overflow-x-auto gap-1 pb-0 border-b-4 border-slate-300 print:hidden scrollbar-hide">
                                {EMPLOYEES.map((emp, i) => {
                                    const colorClass = TAB_COLORS[i % TAB_COLORS.length];
                                    const isActive = activeEmp === emp.id;
                                    return (
                                        <button key={emp.id} onClick={() => setActiveEmp(emp.id)} 
                                            className={`whitespace-nowrap px-5 py-2 font-bold text-sm rounded-t-xl border-t-2 border-x-2 transition-all ${isActive ? `${colorClass} shadow-inner -mb-1 pb-3 text-base` : 'bg-gray-200 text-gray-500 border-transparent hover:bg-gray-300'}`}>
                                            {emp.name}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* 表格主體 */}
                            {(() => {
                                const emp = EMPLOYEES.find(e => e.id === activeEmp);
                                let sumDays = 0, sumIgka = 0, sumIgkb = 0, sumTotal = 0, sumEarly = 0, sumLate = 0;

                                return (
                                    <div className="bg-white p-6 border-x-2 border-b-2 border-slate-300 rounded-b-xl shadow-lg print:border-none print:shadow-none">
                                        <h2 className="text-2xl font-black mb-4">{emp.name} <span className="text-sm font-normal text-gray-500 ml-2">({emp.type === 'full' ? '正社員' : 'アルバイト'})</span></h2>
                                        
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm border-collapse border border-slate-300">
                                                <thead>
                                                    <tr className="bg-slate-100 text-slate-700">
                                                        <th className="border p-2 min-w-[100px]">日付</th>
                                                        <th className="border p-2 w-24">入室</th>
                                                        <th className="border p-2 w-24">退室</th>
                                                        <th className="border p-2 w-32">シフト</th>
                                                        <th className="border p-2 w-24 text-pink-700">IGKA</th>
                                                        <th className="border p-2 w-24 text-blue-700">IGKB</th>
                                                        <th className="border p-2 min-w-[150px]">備考欄</th>
                                                        {emp.type === 'full' && <><th className="border p-2 w-20 text-orange-600">早残業</th><th className="border p-2 w-20 text-orange-600">後残業</th></>}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {dates.map(d => {
                                                        const key = dKey(d);
                                                        const row = attendance[emp.id]?.[key] || {};
                                                        const calc = calculateRow(d, row, emp);
                                                        
                                                        // 統計累加
                                                        if (row.inTime || row.outTime || row.leave) sumDays++;
                                                        sumIgka += calc.igkaMins; sumIgkb += calc.igkbMins;
                                                        sumTotal += calc.totalWorkMins;
                                                        sumEarly += calc.earlyOtMins; sumLate += calc.lateOtMins;

                                                        // 行底色邏輯
                                                        let rowBg = calc.isWknd ? 'bg-pink-50' : 'hover:bg-slate-50';
                                                        let textClass = calc.isWknd ? 'text-red-600 font-bold' : '';
                                                        if (row.leave) {
                                                            rowBg = 'bg-blue-50'; textClass = 'text-blue-600 font-bold';
                                                        }

                                                        return (
                                                            <tr key={key} className={`${rowBg} ${textClass}`}>
                                                                <td className="border p-2 text-center">{formatDisplayDate(d)}</td>
                                                                
                                                                {/* 入室：正社員無打卡顯示假單下拉 */}
                                                                <td className="border p-1 text-center">
                                                                    {!row.inTime && !row.outTime && emp.type === 'full' ? (
                                                                        <select value={row.leave || ''} onChange={e => updateCell(emp.id, key, 'leave', e.target.value)} className="w-full bg-transparent text-center text-xs font-bold outline-none cursor-pointer">
                                                                            <option value="">-</option><option value="有休">有休</option><option value="事欠">事欠</option><option value="病欠">病欠</option>
                                                                        </select>
                                                                    ) : (
                                                                        <input type="time" value={row.inTime || ''} onChange={e => updateCell(emp.id, key, 'inTime', e.target.value)} className="w-full bg-transparent text-center outline-none font-mono"/>
                                                                    )}
                                                                </td>
                                                                
                                                                <td className="border p-1 text-center">
                                                                    {row.leave ? '-' : <input type="time" value={row.outTime || ''} onChange={e => updateCell(emp.id, key, 'outTime', e.target.value)} className="w-full bg-transparent text-center outline-none font-mono"/>}
                                                                </td>
                                                                
                                                                <td className="border p-2 text-center font-mono text-xs font-bold text-slate-600">
                                                                    {calc.actualShiftIn && calc.shiftOut ? `${calc.actualShiftIn}-${calc.shiftOut}` : '-'}
                                                                </td>
                                                                
                                                                <td className="border p-1 text-center">
                                                                    <input type="time" value={row.igka || ''} onChange={e => updateCell(emp.id, key, 'igka', e.target.value)} className="w-full bg-transparent text-center outline-none text-pink-700 font-bold"/>
                                                                </td>
                                                                
                                                                <td className="border p-2 text-center font-bold text-blue-700">{minsToTime(calc.igkbMins) || '-'}</td>
                                                                
                                                                <td className="border p-1">
                                                                    <input type="text" value={row.remark || (row.leave ? row.leave : '')} onChange={e => updateCell(emp.id, key, 'remark', e.target.value)} className="w-full bg-transparent outline-none px-2 text-sm" placeholder="備考..."/>
                                                                </td>

                                                                {emp.type === 'full' && (
                                                                    <>
                                                                        <td className="border p-2 text-center font-bold text-orange-600">{calc.earlyOtMins > 0 ? `${calc.earlyOtMins}分` : '-'}</td>
                                                                        <td className="border p-2 text-center font-bold text-orange-600">{calc.lateOtMins > 0 ? `${calc.lateOtMins}分` : '-'}</td>
                                                                    </>
                                                                )}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>

                                        {/* 下方總結區塊 */}
                                        <div className="mt-6 border-t-4 border-slate-800 pt-6 grid grid-cols-2 md:grid-cols-5 gap-4">
                                            <div className="bg-slate-100 p-4 rounded-xl border border-slate-300 text-center shadow-sm">
                                                <div className="text-sm font-bold text-slate-500 mb-1">出勤總日數</div>
                                                <div className="text-3xl font-black text-slate-800">{sumDays} <span className="text-lg">日</span></div>
                                            </div>
                                            
                                            <div className="bg-pink-50 p-4 rounded-xl border border-pink-200 text-center shadow-sm">
                                                <div className="text-sm font-bold text-pink-700 mb-1">IGKA 總時間</div>
                                                <div className="text-3xl font-black text-pink-800">{minsToTime(sumIgka) || '00:00'}</div>
                                            </div>

                                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center shadow-sm">
                                                <div className="text-sm font-bold text-blue-700 mb-1">IGKB 總時間</div>
                                                <div className="text-3xl font-black text-blue-800">{minsToTime(sumIgkb) || '00:00'}</div>
                                            </div>

                                            <div className="bg-purple-50 p-4 rounded-xl border border-purple-300 text-center shadow-sm md:col-span-2 relative overflow-hidden flex flex-col justify-center">
                                                <div className="absolute top-0 left-0 w-2 h-full bg-purple-500"></div>
                                                <div className="text-sm font-bold text-purple-700 mb-1">A + B 總時間 (總上班)</div>
                                                <div className="text-4xl font-black text-purple-900">{minsToTime(sumIgka + sumIgkb) || '00:00'}</div>
                                            </div>

                                            {emp.type === 'full' && (
                                                <>
                                                    <div className="bg-orange-50 p-4 rounded-xl border border-orange-200 text-center shadow-sm">
                                                        <div className="text-sm font-bold text-orange-700 mb-1">早残業</div>
                                                        <div className="text-2xl font-black text-orange-800">{sumEarly} <span className="text-sm">分</span></div>
                                                    </div>
                                                    <div className="bg-orange-50 p-4 rounded-xl border border-orange-200 text-center shadow-sm">
                                                        <div className="text-sm font-bold text-orange-700 mb-1">後残業</div>
                                                        <div className="text-2xl font-black text-orange-800">{sumLate} <span className="text-sm">分</span></div>
                                                    </div>
                                                    <div className="bg-red-50 p-4 rounded-xl border border-red-300 text-center shadow-sm md:col-span-3 flex flex-col justify-center items-center">
                                                        <div className="text-sm font-bold text-red-700 mb-1">残業總計 (早+後)</div>
                                                        <div className="text-3xl font-black text-red-900">{sumEarly + sumLate} <span className="text-lg">分</span> <span className="text-sm font-bold text-red-600">({minsToTime(sumEarly+sumLate)})</span></div>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        /* 隱藏滾動條但保留功能 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
