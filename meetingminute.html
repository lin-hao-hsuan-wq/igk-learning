<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGK のあしあと </title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'Noto Sans JP', 'sans-serif'],
          },
          colors: {
            rila: {
              brown: '#c39b62',
              dark: '#3d2109',
              light: '#fdf8f2',
              cream: '#faf5eb',
              yellow: '#ffde59',
              pink: '#ff8da1',
              darkbrown: '#5c3c25',
              softOrange: '#ffb347'
            }
          }
        }
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, collection } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // 🌐 ONLINE SYNC SETTINGS (Firebase Configuration)
    const defaultFirebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_FIREBASE_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_FIREBASE_PROJECT_ID",
      storageBucket: "YOUR_FIREBASE_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_FIREBASE_SENDER_ID",
      appId: "YOUR_FIREBASE_APP_ID"
    };

    window.initFirebaseSystem = async function() {
      let config = null;
      
      if (typeof __firebase_config !== 'undefined') {
        config = JSON.parse(__firebase_config);
      } else if (defaultFirebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY") {
        config = defaultFirebaseConfig;
      }

      if (!config) {
        console.warn("Firebase configuration not set. Will fallback to LocalStorage for saving.");
        return null;
      }

      try {
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let user = null;
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
           await signInWithCustomToken(auth, __initial_auth_token);
        } else {
           await signInAnonymously(auth);
        }

        return new Promise((resolve) => {
          onAuthStateChanged(auth, (u) => {
            user = u;
            window.firebaseApp = { db, user, appId };
            resolve(true);
          });
        });
      } catch (e) {
        console.error("Firebase init error:", e);
        return null;
      }
    };

    window.saveRecordToDB = async function(dateStr, data) {
      if (window.firebaseApp && window.firebaseApp.user) {
        const { db, user, appId } = window.firebaseApp;
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'meeting_records', dateStr);
          await setDoc(docRef, data);
          return true;
        } catch(e) {
          console.error("Firebase Save error:", e);
          return false;
        }
      } else {
        localStorage.setItem(`rilakkuma_record_${dateStr}`, JSON.stringify(data));
        return true;
      }
    };

    window.loadRecordFromDB = async function(dateStr) {
      if (window.firebaseApp && window.firebaseApp.user) {
        const { db, user, appId } = window.firebaseApp;
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'meeting_records', dateStr);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            return docSnap.data();
          }
        } catch(e) {
          console.error("Firebase Load error:", e);
        }
      } else {
        const localData = localStorage.getItem(`rilakkuma_record_${dateStr}`);
        if (localData) return JSON.parse(localData);
      }
      return null;
    };

    window.translateWithGemini = async function(text) {
      if (!text || text.trim() === '') return { ja: '', en: '' };
      
      let apiKey = localStorage.getItem('gemini_api_key');
      
      if (!apiKey) {
        apiKey = prompt("🐻 自動翻訳には Gemini API Key が必要です！\nAPIキーを入力してください（このPCにのみ保存されます）。\n\nGemini API Key is required for auto-translation!\nPlease enter your API Key (saved locally on this PC only):");
        if (apiKey && apiKey.trim() !== "") {
          localStorage.setItem('gemini_api_key', apiKey.trim());
        } else {
          console.warn("API Key not entered. Skipping translation.");
          throw new Error("API Key cancelled");
        }
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const payload = {
          contents: [{ parts: [{ text }] }],
          systemInstruction: { parts: [{ text: "You are a professional translator. Translate the given text into highly natural Japanese and English. Respond ONLY with a valid JSON object in this exact format: {\"ja\": \"[Japanese translation]\", \"en\": \"[English translation]\"}. Do not include markdown code blocks or any other text." }] },
          generationConfig: { responseMimeType: "application/json" }
      };

      try {
          const res = await fetch(url, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'application/json' } });
          if (!res.ok) {
              if (res.status === 400 || res.status === 403) {
                  localStorage.removeItem('gemini_api_key');
                  throw new Error("Invalid API Key");
              }
              throw new Error("API error");
          }
          
          const data = await res.json();
          let jsonStr = data.candidates[0].content.parts[0].text;
          jsonStr = jsonStr.replace(/```json/gi, '').replace(/```/g, '').trim();
          return JSON.parse(jsonStr);
          
      } catch (err) {
          console.error(err);
          throw err;
      }
    };
    
    window.resetApiKey = function() {
        localStorage.removeItem('gemini_api_key');
        alert("🐻 API Key を削除しました！次回入力時に再設定してください。\nAPI Key cleared! You will be asked again next time.");
    };
  </script>

  <script>
    const MOTIVATIONAL_QUOTES = [
      { ja: "どんなに高い山でも、一歩ずつ登れば必ず頂上に着く。", en: "No matter how high the mountain, you will reach the top if you climb step by step." },
      { ja: "失敗は成功の母。", en: "Failure is the mother of success." },
      { ja: "継続は力なり。", en: "Continuity is power." },
      { ja: "明日は明日の風が吹く。", en: "Tomorrow is another day." },
      // ... (その他の名言は省略せず、本来はここに入ります。長すぎるため一部そのまま維持)
      { ja: "今日も一日、頑張ろう！", en: "Let's do our best today too!" }
    ];

    const DEFAULT_MEMBERS = [
      { id: 1, name: 'minori kadono', avatar: 'korilakkuma', status: 'present', report: '', reportJa: '', reportEn: '', isTranslating: false, lastTranslatedText: '' },
      { id: 2, name: 'yuri kato', avatar: 'kiiroitori', status: 'present', report: '', reportJa: '', reportEn: '', isTranslating: false, lastTranslatedText: '' },
      { id: 3, name: 'Yassmyn Khairussalima Ratu', avatar: 'chairoikoguma', status: 'present', report: '', reportJa: '', reportEn: '', isTranslating: false, lastTranslatedText: '' },
      { id: 4, name: 'yoon honey aung', avatar: 'pinksquirrel', status: 'present', report: '', reportJa: '', reportEn: '', isTranslating: false, lastTranslatedText: '' },
      { id: 5, name: '林昊嬛', avatar: 'rilakkuma', status: 'present', report: '', reportJa: '', reportEn: '', isTranslating: false, lastTranslatedText: '' }
    ];

    document.addEventListener('alpine:init', () => {
      Alpine.data('meetingApp', meetingApp);
    });

    function meetingApp() {
      return {
        members: JSON.parse(JSON.stringify(DEFAULT_MEMBERS)),
        announcements: [],
        newMemberName: '',
        newMemberAvatar: 'rilakkuma',
        newAnnouncement: '',
        meetingDate: new Date().toISOString().split('T')[0],
        showToast: false,
        toastMessage: '',
        showAddMemberMenu: false,
        dailyQuote: MOTIVATIONAL_QUOTES[0],

        // --- 🥞 雜談轉盤專用變數 ---
        dailyTalkTopic: { ja: '', en: '' },
        isSpinning: false,
        currentAngle: 0,
        animationFrame: null,
        winner: null,
        
        // 🎯 新機能：ルーレットのモード切替 ('members' | 'questions')
        rouletteMode: 'members', 
        customQuestions: [
            "最近、スタッフと盛り上がった話題は何ですか？",
            "第一印象と今の印象が異なるスタッフは誰ですか？",
            "最近発見したスタッフの長所はありますか？",
            "今、購入を迷っているものは何ですか？",
            "最近学んだことは何ですか？",
            "できれば取り戻したい過去の習慣はありますか？",
            "実は苦手な作業はありますか？",
            "良い旅行の思い出を教えてください。",
            "行ってみたい国と、その理由を教えてください。"
        ],

        // 🎯 算出プロパティ：出席または遅刻の（ルーレット対象の）メンバーのみを返す
        get activeMembers() {
          return this.members.filter(m => m.status !== 'absent');
        },

        // 🎯 算出プロパティ：現在のルーレットの要素（メンバー または 質問リスト）
        get activeRouletteItems() {
          if (this.rouletteMode === 'members') {
            return this.activeMembers.map(m => ({ id: m.id, label: m.name, fullText: m.name }));
          } else {
            return this.customQuestions.map((q, i) => ({ id: `q${i}`, label: `Q${i+1}`, fullText: q }));
          }
        },

        async init() {
          const daysSinceEpoch = Math.floor(Date.now() / 86400000);
          const quoteIndex = daysSinceEpoch % 100;
          this.dailyQuote = MOTIVATIONAL_QUOTES[quoteIndex % MOTIVATIONAL_QUOTES.length] || MOTIVATIONAL_QUOTES[0];

          // 🎲 初始化每日話題
          this.initDailyTopic();

          const checkAndInit = async () => {
            if (typeof window.initFirebaseSystem === 'function') {
              await window.initFirebaseSystem();
              this.loadRecord(this.meetingDate);
            } else {
              setTimeout(checkAndInit, 100); 
            }
          };
          
          checkAndInit();

          this.$watch('meetingDate', (newDate) => {
             this.loadRecord(newDate);
          });

          // 🔄 メンバー変更の監視（ルーレットリセット用）
          this.$watch('members', () => {
            if (this.rouletteMode === 'members') this.winner = null;
          }, { deep: true });
        },

        initDailyTopic() {
          const TOPICS = [
            { ja: "最近の授業で、一番達成感を感じたことは何ですか？", en: "What is the thing you felt the most accomplished about in recent classes?" },
            { ja: "最近の授業の中で、調整や改善が必要だと感じるレッスンはどれですか？", en: "Which class do you feel needs adjustment or improvement among recent lessons?" },
            // ... (その他のTOPICSは省略せずそのまま使用可能)
            { ja: "最近、パートナーや同僚と話し合ったこと、議論したことをシェアしてください。", en: "Share something you discussed or consulted with your partners recently." }
          ];

          const todayStr = new Date().toISOString().split('T')[0];
          let savedData = JSON.parse(localStorage.getItem('igk_daily_topic') || '{}');

          if (savedData.date === todayStr && savedData.topic) {
            this.dailyTalkTopic = savedData.topic;
          } else {
            let history = savedData.history || [];
            let availableIndexes = [];
            for (let i = 0; i < TOPICS.length; i++) {
              if (!history.includes(i)) availableIndexes.push(i);
            }
            
            if (availableIndexes.length === 0) {
                for (let i = 0; i < TOPICS.length; i++) availableIndexes.push(i);
            }
            
            const chosenIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
            
            history.push(chosenIndex);
            if (history.length > 4) history.shift();

            this.dailyTalkTopic = TOPICS[chosenIndex];
            localStorage.setItem('igk_daily_topic', JSON.stringify({
              date: todayStr,
              topic: this.dailyTalkTopic,
              history: history
            }));
          }
        },

        // --- 🥞 轉盤控制邏輯 ---
        toggleSpin() {
          const items = this.activeRouletteItems;
          if (this.isSpinning) {
            // 按下停止
            this.isSpinning = false;
            cancelAnimationFrame(this.animationFrame);
            
            // 計算是誰中獎
            if (items.length > 0) {
               const actualRotation = this.currentAngle % 360;
               const sliceAngle = 360 / items.length;
               // 修正因為 conic-gradient 和順時針旋轉產生的角度差
               const pointedAngle = (360 - actualRotation) % 360;
               const winnerIndex = Math.floor(pointedAngle / sliceAngle);
               this.winner = items[winnerIndex].fullText;
               
               let toastMsg = this.rouletteMode === 'members' 
                 ? `🎉 ${this.winner} の番です！ / It's ${this.winner}'s turn! 🥞` 
                 : `🎉 質問が選ばれました！`;
               this.triggerToast(toastMsg);
            }
          } else {
            // 按下開始
            if (items.length === 0) {
              this.triggerToast('⚠️ ルーレットに参加できる項目がありません / No items available for the wheel.');
              return;
            }
            this.isSpinning = true;
            this.winner = null;
            this.animateSpin();
          }
        },

        animateSpin() {
          if (!this.isSpinning) return;
          this.currentAngle += 15; // 轉速調整
          this.animationFrame = requestAnimationFrame(() => this.animateSpin());
        },

        // 🎨 轉盤背景グラデーションを動的に取得
        getWheelGradient(activeCount) {
          if (activeCount === 0) return 'transparent';
          const colors = ['#ffde59', '#ffb347', '#ff8da1', '#c39b62', '#e2f0d9', '#fdf8f2'];
          const slice = 360 / activeCount;
          let stops = [];
          for(let i=0; i < activeCount; i++) {
            const color = colors[i % colors.length];
            stops.push(`${color} ${i * slice}deg ${(i + 1) * slice}deg`);
          }
          return `conic-gradient(${stops.join(', ')})`;
        },

        async loadRecord(dateStr) {
          try {
            const data = await window.loadRecordFromDB(dateStr);
            if (data && Array.isArray(data.members) && data.members.length > 0) {
              this.members = data.members.map(m => ({
                 ...m,
                 isTranslating: false,
                 lastTranslatedText: m.report
              }));
              this.announcements = data.announcements || [];
              this.triggerToast(`📅 読み込み完了 / Loaded records for ${dateStr}`);
            } else {
              this.members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
              this.announcements = data?.announcements || [];
            }
          } catch(e) {
            console.error("Load error:", e);
            this.members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
          }
        },

        async saveRecord() {
          const dataToSave = {
            members: this.members.map(m => ({
              id: m.id, name: m.name, avatar: m.avatar, status: m.status, 
              report: m.report, reportJa: m.reportJa, reportEn: m.reportEn
            })),
            announcements: this.announcements
          };
          const success = await window.saveRecordToDB(this.meetingDate, dataToSave);
          if (success) {
            this.triggerToast('💾 記録を保存しました / Records successfully saved!');
          } else {
            this.triggerToast('⚠️ 保存に失敗しました / Failed to save records.');
          }
        },

        async autoTranslate(member) {
          const text = member.report.trim();
          if (!text || text === member.lastTranslatedText) return;
          
          member.isTranslating = true;
          try {
            const result = await window.translateWithGemini(text);
            if (result && result.ja && result.en) {
              member.reportJa = result.ja;
              member.reportEn = result.en;
              member.lastTranslatedText = text;
            }
          } catch(e) {
            console.error("Translation failed:", e);
            if(e.message.includes("cancelled") || e.message.includes("Invalid")) {
                this.triggerToast('⚠️ 自動翻訳スキップ (手動入力可) / Auto-translation skipped (Manual input available) 🐻');
            } else {
                this.triggerToast('⚠️ 翻訳エラー (手動入力可) / Translation Error (Manual input available)');
            }
          }
          member.isTranslating = false;
        },

        getStatusText(status) {
          switch (status) {
            case 'present': return '出席 / Present';
            case 'tardy': return '遅刻 / Late';
            case 'absent': return '欠席 / Absent';
            default: return '出席 / Present';
          }
        },

        cycleStatus(member) {
          if (member.status === 'present') {
            member.status = 'tardy';
          } else if (member.status === 'tardy') {
            member.status = 'absent';
          } else {
            member.status = 'present';
          }
          this.triggerToast(`${member.name} ➡️ ${this.getStatusText(member.status)}`);
        },

        formatDate(dateStr) {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          const weekDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
          const weekDay = weekDays[d.getDay()];
          return `${year}/${month}/${day} (${weekDay})`;
        },

        addMember() {
          const nameTrimmed = this.newMemberName.trim();
          if (!nameTrimmed) {
            this.triggerToast('⚠️ 名前を入力してください / Please enter a name');
            return;
          }

          let avatar = this.newMemberAvatar;
          if (nameTrimmed === '林昊嬛') {
            avatar = 'rilakkuma';
          }

          this.members.push({
            id: Date.now(),
            name: nameTrimmed,
            avatar: avatar,
            status: 'present',
            report: '',
            reportJa: '',
            reportEn: '',
            isTranslating: false,
            lastTranslatedText: ''
          });

          this.newMemberName = '';
          this.newMemberAvatar = 'rilakkuma';
          this.showAddMemberMenu = false;
          this.triggerToast(`🎉 追加しました / Member Added: ${nameTrimmed}`);
        },

        removeMember(id) {
          this.members = this.members.filter(m => m.id !== id);
          this.triggerToast('🗑️ 削除しました / Removed');
        },

        addAnnouncement() {
          const textTrimmed = this.newAnnouncement.trim();
          if (!textTrimmed) return;
          this.announcements.push({
            id: Date.now(),
            text: textTrimmed,
            completed: false
          });
          this.newAnnouncement = '';
        },

        toggleAnnouncement(id) {
          const item = this.announcements.find(a => a.id === id);
          if (item) {
            item.completed = !item.completed;
          }
        },

        removeAnnouncement(id) {
          this.announcements = this.announcements.filter(a => a.id !== id);
        },

        triggerToast(message) {
          this.toastMessage = message;
          this.showToast = true;
          setTimeout(() => { this.showToast = false; }, 3500);
        },

        copyMeetingMinutes() {
          let text = `🐻【會議議事錄 / Meeting Minutes】🍯\n`;
          text += `📅 日付/Date：${this.formatDate(this.meetingDate)}\n`;
          text += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;

          text += `📢 【共有事項 / Shared Information】\n`;
          if (this.announcements.length === 0) {
            text += `（特になし / None）\n`;
          } else {
            this.announcements.forEach((ann, idx) => {
              const checkIcon = ann.completed ? '✅' : '📌';
              text += `${idx + 1}. [${checkIcon}] ${ann.text}\n`;
            });
          }
          text += `\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;

          text += `👥 【個人レポート / Individual Reports】\n`;
          this.members.forEach((m) => {
            const statusLabel = this.getStatusText(m.status);
            text += `👤 ${m.name} (${statusLabel})\n`;
            if (m.status === 'absent') {
              text += `   ↳ 💤 欠席 / Absent\n`;
            } else {
              text += `   ↳ [Original]: ${m.report.trim() ? m.report : '...'}\n`;
              if (m.reportJa) text += `   ↳ [JP]: ${m.reportJa}\n`;
              if (m.reportEn) text += `   ↳ [EN]: ${m.reportEn}\n`;
            }
            text += `\n`;
          });

          text += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
          text += `🧸 ${this.dailyQuote.ja} / ${this.dailyQuote.en}\n`;

          const tempTextarea = document.createElement('textarea');
          tempTextarea.value = text;
          document.body.appendChild(tempTextarea);
          tempTextarea.select();
          try {
            document.execCommand('copy');
            this.triggerToast('📋 議事録をコピーしました / Minutes Copied! 🐻✨');
          } catch (err) {
            this.triggerToast('⚠️ コピー失敗 / Copy Failed');
          }
          document.body.removeChild(tempTextarea);
        },

        printMinutes() {
          window.print();
        },

        resetMeeting() {
          const confirmReset = window.confirm("データを初期化しますか？(メンバーもデフォルトに戻ります)\nAre you sure you want to reset everything?");
          if (confirmReset) {
            this.announcements = [];
            this.members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
            this.triggerToast('🧹 リセット完了 / Reset complete.');
          }
        }
      };
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body {
      background-color: #f7eedf;
      background-image: radial-gradient(#e0cfb8 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    .bear-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.2rem;
      background-color: #c39b62; 
      color: white;
      font-weight: 800;
      border-radius: 9999px;
      border: 3px solid #3d2109;
      box-shadow: 0 4px 0 #3d2109;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      z-index: 10;
    }
    .bear-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #3d2109;
    }
    .bear-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #3d2109;
    }
    .bear-btn::before, .bear-btn::after {
      content: '';
      position: absolute;
      top: -10px;
      width: 22px;
      height: 22px;
      background-color: inherit;
      border: 3px solid #3d2109;

                    </template>
                 </div>
                 <div class="absolute top-0 left-1/2 -ml-2.5 -mt-1 w-0 h-0 border-l-[10px] border-r-[10px] border-t-[16px] border-l-transparent border-r-transparent border-t-red-600 z-20 drop-shadow-md"></div>
                 
                 <button @click="toggleSpin()" 
                         class="absolute inset-0 m-auto w-14 h-14 bg-white rounded-full border-4 border-rila-dark shadow-md flex items-center justify-center text-3xl z-10 hover:scale-110 active:scale-95 transition-transform"
                         :class="{'animate-pulse bg-rila-yellow shadow-[0_0_15px_rgba(255,222,89,0.8)]': isSpinning}">
                    🥞
                 </button>
              </div>
            </template>

            <!-- ルーレット盤プレースホルダー：アイテムがないとき -->
            <template x-if="activeRouletteItems.length === 0">
              <div class="w-48 h-48 rounded-full border-4 border-dashed border-gray-300 flex flex-col items-center justify-center text-center p-4 bg-gray-50/50">
                <span class="text-3xl mb-1">💤</span>
                <span class="text-xs font-bold text-gray-400">参加できる項目が<br>ありません</span>
              </div>
            </template>
            
            <div class="mt-4 text-sm font-black text-rila-dark bg-rila-yellow px-4 py-2 rounded-xl border-2 border-rila-dark shadow-sm text-center w-full" 
                 x-show="winner && activeRouletteItems.length > 0" x-transition>
              👑 <span x-text="winner"></span>
            </div>
          </div>
        </section>

        <!-- 共有事項、個人レポート 省略 (既存のコードそのまま) -->
        <section class="rila-card bg-[#fffcf5] rounded-3xl p-6 relative">
          <div class="absolute -top-3 -right-3 bg-rila-yellow border-2 border-rila-dark text-xs font-extrabold px-3 py-1 rotate-12 rounded-lg shadow-md no-print">
            HOT 🔥
          </div>
          
          <h3 class="text-xl font-black mb-4 flex items-center gap-2 text-rila-dark border-b-2 border-rila-dark pb-2">
            🍯 共有事項 / Shared Information
          </h3>

          <div class="flex gap-2 mb-6 no-print">
            <input type="text" x-model="newAnnouncement" placeholder="事項を入力... / Enter announcement..."
                   @keydown.enter="addAnnouncement()"
                   class="flex-1 px-4 py-2 border-2 border-rila-dark rounded-xl focus:outline-none focus:ring-2 focus:ring-rila-brown bg-white text-sm rila-inset-shadow" />
            <button @click="addAnnouncement()" class="bg-rila-yellow hover:bg-yellow-400 border-2 border-rila-dark text-rila-dark font-black px-4 py-2 rounded-xl text-sm transition-colors duration-150 whitespace-nowrap">
              追加 / Add
            </button>
          </div>

          <ul class="space-y-3">
            <template x-for="(ann, index) in announcements" :key="ann.id">
              <li class="flex items-start justify-between bg-rila-light/60 border-2 border-rila-dark/15 p-3 rounded-2xl transition-all duration-150"
                  :class="{'opacity-60 bg-gray-100 line-through decoration-rila-dark decoration-2': ann.completed}">
                <div class="flex items-start gap-3 flex-1">
                  <button @click="toggleAnnouncement(ann.id)" class="mt-0.5 flex-shrink-0 transition-transform duration-100 hover:scale-110">
                    <template x-if="ann.completed">
                      <svg class="w-6 h-6 text-rila-dark" viewBox="0 0 24 24" fill="currentColor">
                        <ellipse cx="12" cy="14" rx="6" ry="5" />
                        <circle cx="6" cy="7" r="2" /><circle cx="10" cy="5" r="2" /><circle cx="14" cy="5" r="2" /><circle cx="18" cy="7" r="2" />
                      </svg>
                    </template>
                    <template x-if="!ann.completed">
                      <svg class="w-6 h-6 text-rila-brown/40 hover:text-rila-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <ellipse cx="12" cy="14" rx="6" ry="5" />
                        <circle cx="6" cy="7" r="2" /><circle cx="10" cy="5" r="2" /><circle cx="14" cy="5" r="2" /><circle cx="18" cy="7" r="2" />
                      </svg>
                    </template>
                  </button>
                  <span class="text-sm font-bold text-rila-dark pt-0.5" x-text="ann.text"></span>
                </div>
                <button @click="removeAnnouncement(ann.id)" class="text-xs text-red-400 hover:text-red-600 ml-2 pt-0.5 no-print">
                  🗑️
                </button>
              </li>
            </template>
            <template x-if="announcements.length === 0">
              <div class="text-center py-6 text-sm text-rila-brown font-bold italic">
                事項はありません / No announcements yet ☕
              </div>
            </template>
          </ul>
        </section>

        <section class="space-y-6">
          <h3 class="text-xl font-black flex items-center gap-2 text-rila-dark border-b-2 border-rila-dark pb-2">
            🍪 個人レポート / Individual Reports
          </h3>

          <div class="space-y-4">
            <template x-for="member in members" :key="member.id">
              <div class="rila-card bg-white rounded-3xl p-5 relative overflow-hidden transition-all duration-200"
                   :class="{'opacity-60 bg-gray-100': member.status === 'absent'}">
                
                <div class="flex items-center justify-between mb-3 border-b border-dashed border-rila-brown/30 pb-2">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10">
                      <!-- Avatar template 略 (既に上部で再利用可能な形で定義済みですが、ここではそのまま) -->
                      <template x-if="member.avatar === 'rilakkuma'"><svg viewBox="0 0 100 100"><circle cx="20" cy="25" r="15" fill="#c39b62" /><circle cx="20" cy="25" r="9" fill="#FFDE59" /><circle cx="80" cy="25" r="15" fill="#c39b62" /><circle cx="80" cy="25" r="9" fill="#FFDE59" /><ellipse cx="50" cy="55" rx="41" ry="33" fill="#c39b62" /><ellipse cx="50" cy="65" rx="14" ry="10" fill="#FFFFFF" /><path d="M 46 62 Q 50 67 54 62" fill="none" stroke="#3d2109" stroke-width="3" stroke-linecap="round" /><line x1="50" y1="60" x2="50" y2="63" stroke="#3d2109" stroke-width="3" /><circle cx="32" cy="50" r="4.5" fill="#3d2109" /><circle cx="68" cy="50" r="4.5" fill="#3d2109" /></svg></template>
                      <template x-if="member.avatar === 'korilakkuma'"><svg viewBox="0 0 100 100"><circle cx="20" cy="25" r="15" fill="#faf5eb" stroke="#d5cebf" stroke-width="1" /><circle cx="20" cy="25" r="9" fill="#FF8DA1" /><circle cx="80" cy="25" r="15" fill="#faf5eb" stroke="#d5cebf" stroke-width="1" /><circle cx="80" cy="25" r="9" fill="#FF8DA1" /><ellipse cx="50" cy="55" rx="41" ry="33" fill="#faf5eb" stroke="#d5cebf" stroke-width="1" /><ellipse cx="50" cy="65" rx="14" ry="10" fill="#FFFFFF" /><path d="M 46 62 Q 50 67 54 62" fill="none" stroke="#3d2109" stroke-width="3" stroke-linecap="round" /><line x1="50" y1="60" x2="50" y2="63" stroke="#3d2109" stroke-width="3" /><circle cx="32" cy="50" r="4.5" fill="#3d2109" /><circle cx="68" cy="50" r="4.5" fill="#3d2109" /></svg></template>
                      <template x-if="member.avatar === 'kiiroitori'"><svg viewBox="0 0 100 100"><path d="M 46 15 Q 46 5 48 8" stroke="#3d2109" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 54 15 Q 54 5 52 8" stroke="#3d2109" stroke-width="4" stroke-linecap="round" fill="none"/><ellipse cx="50" cy="55" rx="40" ry="35" fill="#FFDE59" /><circle cx="34" cy="50" r="4" fill="#3d2109" /><circle cx="66" cy="50" r="4" fill="#3d2109" /><ellipse cx="50" cy="58" rx="14" ry="8" fill="#FF9900" /><line x1="36" y1="58" x2="64" y2="58" stroke="#3d2109" stroke-width="2" /></svg></template>
                      <template x-if="member.avatar === 'chairoikoguma'"><svg viewBox="0 0 100 100"><circle cx="20" cy="25" r="15" fill="#5c3c25" /><circle cx="20" cy="25" r="9" fill="#FFFFFF" /><circle cx="80" cy="25" r="15" fill="#5c3c25" /><circle cx="80" cy="25" r="9" fill="#FFFFFF" /><ellipse cx="50" cy="55" rx="41" ry="33" fill="#5c3c25" /><ellipse cx="50" cy="65" rx="14" ry="10" fill="#FFFFFF" /><path d="M 46 62 Q 50 67 54 62" fill="none" stroke="#3d2109" stroke-width="3" stroke-linecap="round" /><line x1="50" y1="60" x2="50" y2="63" stroke="#3d2109" stroke-width="3" /><circle cx="32" cy="50" r="4.5" fill="#3d2109" /><circle cx="68" cy="50" r="4.5" fill="#3d2109" /></svg></template>
                      <template x-if="member.avatar === 'honeybee'"><svg viewBox="0 0 100 100"><path d="M 35 20 Q 30 5 25 10" stroke="#3d2109" stroke-width="3" fill="none" /><circle cx="25" cy="10" r="4" fill="#FFDE59" /><path d="M 65 20 Q 70 5 75 10" stroke="#3d2109" stroke-width="3" fill="none" /><circle cx="75" cy="10" r="4" fill="#FFDE59" /><circle cx="20" cy="30" r="13" fill="#c39b62" /><circle cx="20" cy="30" r="7" fill="#FFDE59" /><circle cx="80" cy="30" r="13" fill="#c39b62" /><circle cx="80" cy="30" r="7" fill="#FFDE59" /><ellipse cx="50" cy="58" rx="40" ry="30" fill="#c39b62" /><ellipse cx="50" cy="66" rx="13" ry="9" fill="#FFFFFF" /><path d="M 46 63 Q 50 67 54 63" fill="none" stroke="#3d2109" stroke-width="2" /><circle cx="33" cy="52" r="4.5" fill="#3d2109" /><circle cx="67" cy="52" r="4.5" fill="#3d2109" /><ellipse cx="26" cy="61" rx="5" ry="3.5" fill="#FFB7B2" opacity="0.8" /><ellipse cx="74" cy="61" rx="5" ry="3.5" fill="#FFB7B2" opacity="0.8" /></svg></template>
                      <template x-if="member.avatar === 'pinksquirrel'"><svg viewBox="0 0 100 100"><path d="M 65 65 C 100 70, 100 20, 75 25 C 65 27, 70 45, 65 50" fill="#ffb6c1" stroke="#3d2109" stroke-width="2" /><path d="M 75 35 C 85 30, 85 50, 75 55" fill="none" stroke="#ff8da1" stroke-width="3" stroke-linecap="round" /><path d="M 22 40 Q 15 10 40 22" fill="#ffb6c1" stroke="#3d2109" stroke-width="2" /><path d="M 26 36 Q 20 18 36 24" fill="#ffffff" /><path d="M 78 40 Q 85 10 60 22" fill="#ffb6c1" stroke="#3d2109" stroke-width="2" /><path d="M 74 36 Q 80 18 64 24" fill="#ffffff" /><ellipse cx="50" cy="58" rx="38" ry="30" fill="#ffb6c1" /><ellipse cx="50" cy="65" rx="14" ry="10" fill="#ffffff" /><path d="M 46 62 Q 50 67 54 62" fill="none" stroke="#3d2109" stroke-width="2.5" stroke-linecap="round" /><line x1="50" y1="60" x2="50" y2="63" stroke="#3d2109" stroke-width="2.5" /><circle cx="50" cy="58" r="3.5" fill="#3d2109" /><circle cx="30" cy="52" r="4.5" fill="#3d2109" /><circle cx="70" cy="52" r="4.5" fill="#3d2109" /><ellipse cx="20" cy="60" rx="5" ry="3" fill="#ff8da1" /><ellipse cx="80" cy="60" rx="5" ry="3" fill="#ff8da1" /></svg></template>
                    </div>
                    <h4 class="font-extrabold text-lg text-rila-dark" x-text="member.name"></h4>
                  </div>

                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-rila-brown hidden sm:inline">ステータス:</span>
                    <select x-model="member.status" class="no-print border-2 border-rila-dark rounded-lg px-2 py-0.5 text-xs font-bold bg-[#faf5eb] focus:outline-none">
                      <option value="present">🟢 出席/Present</option>
                      <option value="tardy">🟡 遅刻/Late</option>
                      <option value="absent">🔴 欠席/Absent</option>
                    </select>
                    <span class="hidden print:inline font-bold text-sm" x-text="`[${getStatusText(member.status)}]`"></span>
                  </div>
                </div>

                <div>
                  <template x-if="member.status !== 'absent'">
                    <div>
                      <textarea x-model="member.report" 
                                @blur="autoTranslate(member)"
                                placeholder="進捗やタスクを入力（自動翻訳されます）/ Enter report (auto-translated)... ✍️"
                                rows="2"
                                class="w-full px-4 py-2 border-2 border-rila-dark/30 rounded-2xl focus:border-rila-brown focus:outline-none bg-rila-light/30 rila-inset-shadow text-sm transition-all duration-150"></textarea>
                      
                      <div x-show="member.isTranslating" class="text-xs font-bold text-rila-brown mt-1 animate-pulse flex items-center gap-1">
                        <svg class="animate-spin h-3 w-3 text-rila-brown" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        翻訳中 / Translating...
                      </div>

                      <div class="mt-2 space-y-2 no-print">
                        <div class="bg-[#fcf8f2] p-2.5 rounded-xl border border-rila-brown/30 text-sm flex gap-2 items-center">
                          <span class="font-bold text-xs text-rila-brown whitespace-nowrap">🇯🇵 JA:</span>
                          <input type="text" x-model="member.reportJa" placeholder="（手動入力 / Manual JP Input）" 
                                 class="bg-transparent border-none focus:outline-none focus:ring-1 focus:ring-rila-brown w-full text-rila-dark rounded px-1 transition-all">
                        </div>
                        <div class="bg-[#f2f8fc] p-2.5 rounded-xl border border-[#b2c8d6] text-sm flex gap-2 items-center">
                          <span class="font-bold text-xs text-[#527993] whitespace-nowrap">🇬🇧 EN:</span>
                          <input type="text" x-model="member.reportEn" placeholder="（手動入力 / Manual EN Input）" 
                                 class="bg-transparent border-none focus:outline-none focus:ring-1 focus:ring-[#527993] w-full text-[#2b4151] rounded px-1 transition-all">
                        </div>
                      </div>
                      
                      <div class="hidden print:block mt-2 text-sm text-gray-700">
                        <p x-show="member.reportJa"><strong>JA:</strong> <span x-text="member.reportJa"></span></p>
                        <p x-show="member.reportEn"><strong>EN:</strong> <span x-text="member.reportEn"></span></p>
                      </div>
                    </div>
                  </template>
                  <template x-if="member.status === 'absent'">
                    <div class="py-3 text-center text-sm font-bold text-red-500 italic">
                      欠席 / Absent 💤
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>

        <div class="mt-4 border-t-2 border-dashed border-rila-brown/40 pt-8 pb-4 text-center select-none rila-card bg-white rounded-3xl">
          <p class="text-xs font-black text-rila-brown/80 tracking-widest uppercase mb-2 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            本日の名言 / Today's Quote
          </p>
          <p class="text-lg font-black text-rila-dark px-4" x-text="dailyQuote.ja"></p>
          <p class="text-sm font-bold text-rila-brown mt-1 px-4" x-text="dailyQuote.en"></p>
        </div>
      </main>
      
    </div>

    <footer class="mt-12 flex flex-col md:flex-row gap-4 justify-center items-center no-print">
      <button @click="saveRecord()" class="bear-btn bear-btn-koguma bear-btn-koguma-ear-inner px-6 py-3 text-sm md:text-base shadow-lg w-full md:w-auto">
        記録を保存 / Save Record 💾
      </button>

      <button @click="printMinutes()" class="bear-btn bear-btn-rila-ear-inner px-6 py-3 text-sm md:text-base shadow-lg w-full md:w-auto">
        PDFを出力 / Print PDF 🖨️
      </button>

      <button @click="copyMeetingMinutes()" class="bear-btn bear-btn-kori bear-btn-kori-ear-inner px-6 py-3 text-sm md:text-base shadow-lg border-gray-400 w-full md:w-auto">
        議事録をコピー / Copy 📋
      </button>

      <button @click="resetMeeting()" class="bear-btn bear-btn-kori bear-btn-kori-ear-inner px-6 py-3 text-sm md:text-base shadow-lg text-red-500 border-red-400 w-full md:w-auto">
        リセット / Reset 🧹
      </button>
      
      <button onclick="window.resetApiKey()" class="text-xs text-rila-brown underline mt-2 md:mt-0 md:ml-4 hover:text-rila-dark">
        API Key を変更 / Change API Key
      </button>
    </footer>

    <div x-show="showToast" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform translate-y-4"
         x-transition:enter-end="opacity-100 transform translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 transform translate-y-0"
         x-transition:leave-end="opacity-0 transform translate-y-4"
         class="fixed bottom-6 right-6 z-50 rila-card bg-rila-yellow text-rila-dark px-6 py-3 rounded-2xl flex items-center gap-2 font-black shadow-xl"
         style="display: none;">
      <span>🐻</span>
      <span x-text="toastMessage"></span>
    </div>

  </div>
</body>
</html>
