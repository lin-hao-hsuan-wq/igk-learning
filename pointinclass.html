<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IGK Classroom Point System</title>
  
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (JSX轉譯) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

  <style>
    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-30px) scale(1.3) rotate(10deg); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.5) rotate(-10deg); }
    }
    .animate-float {
      animation: floatUpFade 0.8s ease-out forwards;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .font-crayon { font-family: 'Caveat', 'Comic Sans MS', 'Chalkboard SE', cursive; }
    .font-ui { font-family: 'Nunito', sans-serif; }
    .crayon-border {
      border-width: 4px;
      border-style: solid;
      border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
    }
    .crayon-shadow {
      box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
    }
    .crayon-shadow:hover {
      box-shadow: 7px 7px 0px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }
    .crayon-shadow:active {
      box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
      transform: translateY(2px) !important;
    }
    .paper-bg {
      background-color: #fdfbf7;
      background-image: radial-gradient(#e0dcd3 2px, transparent 2px);
      background-size: 30px 30px;
    }
    /* 平板觸控優化 */
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="paper-bg font-ui text-slate-800 min-h-screen select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // 圖示元件
    const Icon = ({ name, className = "", size = 20 }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
    };

    const cardColors = [
      'bg-red-50 text-red-700 border-red-400',
      'bg-orange-50 text-orange-700 border-orange-400',
      'bg-amber-50 text-amber-700 border-amber-400',
      'bg-green-50 text-green-700 border-green-400',
      'bg-emerald-50 text-emerald-700 border-emerald-400',
      'bg-teal-50 text-teal-700 border-teal-400',
      'bg-cyan-50 text-cyan-700 border-cyan-400',
      'bg-blue-50 text-blue-700 border-blue-400',
      'bg-indigo-50 text-indigo-700 border-indigo-400',
      'bg-violet-50 text-violet-700 border-violet-400',
      'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-400',
      'bg-pink-50 text-pink-700 border-pink-400',
    ];

    const getCardColor = (name) => {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return cardColors[Math.abs(hash) % cardColors.length];
    };

    // 學生卡片元件
    const StudentCard = ({ student, onAddPoint, isEditMode, onUpdate, onHide, onDelete }) => {
      const [clicks, setClicks] = useState([]);
      const [isEditingData, setIsEditingData] = useState(false);
      const [editName, setEditName] = useState(student.name);
      const [editScore, setEditScore] = useState(student.score);
      const cardRef = useRef(null);

      const handlePointerDown = (e) => {
        if (isEditMode) return;
        
        const rect = cardRef.current.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const newClick = { id: Date.now() + Math.random(), x, y };
        setClicks((prev) => [...prev, newClick]);
        onAddPoint(student.id);

        setTimeout(() => {
          setClicks((prev) => prev.filter((c) => c.id !== newClick.id));
        }, 800);
      };

      const handleSaveEdit = () => {
        onUpdate(student.id, { name: editName, score: Number(editScore) });
        setIsEditingData(false);
      };

      const colorClass = getCardColor(student.name);

      return (
        <div
          ref={cardRef}
          onPointerDown={handlePointerDown}
          className={`relative crayon-border crayon-shadow ${colorClass} p-4 sm:p-5 flex flex-col justify-between items-center cursor-pointer transition-all duration-150 transform active:scale-95 min-h-[130px] sm:min-h-[150px] overflow-hidden`}
        >
          {clicks.map((click) => (
            <div
              key={click.id}
              className="absolute font-crayon font-bold text-3xl sm:text-4xl text-amber-500 pointer-events-none animate-float drop-shadow-md z-20"
              style={{ left: `${click.x - 15}px`, top: `${click.y - 25}px` }}
            >
              +1
            </div>
          ))}

          {isEditingData ? (
            <div className="w-full flex flex-col gap-2 z-30" onClick={(e) => e.stopPropagation()} onPointerDown={(e) => e.stopPropagation()}>
              <input
                type="text"
                value={editName}
                onChange={(e) => setEditName(e.target.value)}
                className="w-full text-center font-bold text-base rounded-xl px-2 py-1 border-2 border-slate-300 bg-white text-gray-800"
              />
              <div className="flex items-center justify-center gap-1">
                <span className="text-xs font-bold text-gray-500">Score:</span>
                <input
                  type="number"
                  value={editScore}
                  onChange={(e) => setEditScore(e.target.value)}
                  className="w-16 text-center font-bold text-base rounded-xl px-2 py-1 border-2 border-slate-300 bg-white text-gray-800"
                />
              </div>
              <button
                onClick={handleSaveEdit}
                className="bg-emerald-500 text-white font-bold py-1 px-3 rounded-lg text-xs flex items-center justify-center gap-1 shadow"
              >
                Save
              </button>
            </div>
          ) : (
            <>
              <div className="w-full text-center mt-1">
                <span className="text-xs font-bold uppercase tracking-wider opacity-60 bg-white/60 px-2 py-0.5 rounded-full inline-block mb-1">
                  {student.grade || 'G1'}
                </span>
                <h3 className="font-crayon text-2xl sm:text-3xl font-bold tracking-wide truncate max-w-full px-1">
                  {student.name}
                </h3>
              </div>

              <div className="font-crayon text-4xl sm:text-5xl font-bold my-1 text-slate-800 drop-shadow-sm">
                {student.score}
              </div>
            </>
          )}

          {isEditMode && !isEditingData && (
            <div className="absolute top-2 right-2 flex gap-1 z-30" onClick={(e) => e.stopPropagation()} onPointerDown={(e) => e.stopPropagation()}>
              <button
                onClick={() => setIsEditingData(true)}
                className="bg-blue-500 text-white p-1.5 rounded-full hover:bg-blue-600 shadow-md"
                title="Edit"
              >
                <Icon name="pencil" size={14} />
              </button>
              <button
                onClick={() => onHide(student.id)}
                className="bg-orange-500 text-white p-1.5 rounded-full hover:bg-orange-600 shadow-md"
                title="Hide (Absent)"
              >
                <Icon name="eye-off" size={14} />
              </button>
              <button
                onClick={() => onDelete(student)}
                className="bg-red-500 text-white p-1.5 rounded-full hover:bg-red-600 shadow-md"
                title="Delete"
              >
                <Icon name="trash-2" size={14} />
              </button>
            </div>
          )}
        </div>
      );
    };

    // 主應用程式元件
    function App() {
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('classroom_points_data');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [
          { id: '1', name: 'Alex', score: 0, grade: 'G1', isHidden: false },
          { id: '2', name: 'Bella', score: 0, grade: 'G1', isHidden: false },
          { id: '3', name: 'Chris', score: 0, grade: 'G2', isHidden: false },
          { id: '4', name: 'Daisy', score: 0, grade: 'G2', isHidden: false },
        ];
      });

      const [activeGrades, setActiveGrades] = useState([]);
      const [isEditMode, setIsEditMode] = useState(false);
      const [showBatchModal, setShowBatchModal] = useState(false);
      const [showHiddenModal, setShowHiddenModal] = useState(false);
      const [studentToDelete, setStudentToDelete] = useState(null);

      const [batchGrade, setBatchGrade] = useState('G1');
      const [batchNames, setBatchNames] = useState('');

      useEffect(() => {
        localStorage.setItem('classroom_points_data', JSON.stringify(students));
      }, [students]);

      // 取得所有年級列表
      const grades = useMemo(() => {
        const list = Array.from(new Set(students.map((s) => s.grade).filter(Boolean)));
        return list.sort();
      }, [students]);

      // 安全的點擊切換年級邏輯
      const toggleGrade = (grade) => {
        if (grade === 'All') {
          setActiveGrades([]);
        } else {
          setActiveGrades((prev) => {
            if (prev.includes(grade)) {
              return prev.filter((g) => g !== grade);
            } else {
              return [...prev, grade];
            }
          });
        }
      };

      const handleAddPoint = useCallback((id) => {
        setStudents((prev) =>
          prev.map((s) => (s.id === id ? { ...s, score: s.score + 1 } : s))
        );
      }, []);

      const handleUpdateStudent = (id, updates) => {
        setStudents((prev) =>
          prev.map((s) => (s.id === id ? { ...s, ...updates } : s))
        );
      };

      const handleHideStudent = (id) => {
        setStudents((prev) =>
          prev.map((s) => (s.id === id ? { ...s, isHidden: true } : s))
        );
      };

      const handleUnhideStudent = (id) => {
        setStudents((prev) =>
          prev.map((s) => (s.id === id ? { ...s, isHidden: false } : s))
        );
      };

      const handleDeleteStudent = (student) => {
        setStudentToDelete(student);
      };

      const confirmDelete = () => {
        if (studentToDelete) {
          setStudents((prev) => prev.filter((s) => s.id !== studentToDelete.id));
          setStudentToDelete(null);
        }
      };

      const handleBatchAdd = (e) => {
        e.preventDefault();
        if (!batchGrade.trim() || !batchNames.trim()) return;

        const names = batchNames
          .split(/[\n,]+/)
          .map((n) => n.trim())
          .filter(Boolean);

        const newStudents = names.map((name) => ({
          id: Date.now() + Math.random().toString(),
          name,
          score: 0,
          grade: batchGrade.trim(),
          isHidden: false,
        }));

        setStudents((prev) => [...prev, ...newStudents]);
        setBatchNames('');
        setShowBatchModal(false);

        if (!activeGrades.includes(batchGrade.trim())) {
          setActiveGrades((prev) => [...prev, batchGrade.trim()]);
        }
      };

      // 計算目前可見學生
      const visibleStudents = useMemo(() => {
        return students.filter((s) => {
          if (s.isHidden) return false;
          if (activeGrades.length === 0) return true;
          return activeGrades.includes(s.grade);
        });
      }, [students, activeGrades]);

      const hiddenStudents = useMemo(() => {
        return students.filter((s) => s.isHidden);
      }, [students]);

      return (
        <div className="max-w-6xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col">
          {/* HEADER */}
          <header className="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b-4 border-dashed border-amber-200">
            <div className="flex items-center gap-3">
              <div className="w-28 h-12 flex items-center justify-center p-1 bg-white border-2 border-slate-300 rounded-xl shadow-sm overflow-hidden">
                <img
                  src="image_5223fe.png"
                  alt="IGK Logo"
                  className="w-full h-full object-contain"
                  onError={(e) => {
                    e.target.style.display = 'none';
                    if (e.target.parentNode) {
                      e.target.parentNode.innerText = 'IGK';
                    }
                  }}
                />
              </div>
              <h1 className="font-crayon text-3xl sm:text-4xl font-bold text-amber-600 tracking-wide">
                Classroom Scoreboard
              </h1>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setShowBatchModal(true)}
                className="crayon-border crayon-shadow bg-amber-400 hover:bg-amber-500 text-slate-800 font-bold px-3 py-1.5 rounded-xl text-sm flex items-center gap-1 transition"
              >
                <Icon name="users" size={16} /> Add Class
              </button>

              {hiddenStudents.length > 0 && (
                <button
                  onClick={() => setShowHiddenModal(true)}
                  className="crayon-border crayon-shadow bg-purple-200 hover:bg-purple-300 text-purple-800 font-bold px-3 py-1.5 rounded-xl text-sm flex items-center gap-1 transition"
                >
                  <Icon name="eye" size={16} /> Absent ({hiddenStudents.length})
                </button>
              )}

              <button
                onClick={() => setIsEditMode(!isEditMode)}
                className={`crayon-border crayon-shadow font-bold px-3 py-1.5 rounded-xl text-sm flex items-center gap-1 transition ${
                  isEditMode
                    ? 'bg-rose-500 text-white'
                    : 'bg-slate-200 hover:bg-slate-300 text-slate-700'
                }`}
              >
                <Icon name="settings" size={16} /> {isEditMode ? 'Done' : 'Manage'}
              </button>
            </div>
          </header>

          {/* 年級多選標籤 */}
          <div className="flex items-center gap-2 mb-6 overflow-x-auto pb-2 hide-scrollbar">
            <button
              onClick={() => toggleGrade('All')}
              className={`crayon-border font-bold px-4 py-1.5 rounded-2xl text-sm whitespace-nowrap transition ${
                activeGrades.length === 0
                  ? 'bg-amber-500 text-white border-amber-600 shadow-md'
                  : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
              }`}
            >
              All Students
            </button>
            {grades.map((grade) => {
              const isSelected = activeGrades.includes(grade);
              return (
                <button
                  key={grade}
                  onClick={() => toggleGrade(grade)}
                  className={`crayon-border font-bold px-4 py-1.5 rounded-2xl text-sm whitespace-nowrap transition flex items-center gap-1.5 ${
                    isSelected
                      ? 'bg-amber-500 text-white border-amber-600 shadow-md'
                      : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
                  }`}
                >
                  <span>{grade}</span>
                  {isSelected && <Icon name="check" size={14} />}
                </button>
              );
            })}
          </div>

          {/* 學生列表 */}
          {visibleStudents.length === 0 ? (
            <div className="flex-1 flex flex-col items-center justify-center p-12 text-center bg-white/50 rounded-3xl border-2 border-dashed border-slate-300 my-4">
              <p className="font-crayon text-2xl text-slate-400 mb-4">No students found here!</p>
              <button
                onClick={() => setShowBatchModal(true)}
                className="crayon-border bg-amber-400 text-slate-800 font-bold px-4 py-2 rounded-xl text-sm"
              >
                Add New Class
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5 mb-8">
              {visibleStudents.map((student) => (
                <StudentCard
                  key={student.id}
                  student={student}
                  onAddPoint={handleAddPoint}
                  isEditMode={isEditMode}
                  onUpdate={handleUpdateStudent}
                  onHide={handleHideStudent}
                  onDelete={handleDeleteStudent}
                />
              ))}
            </div>
          )}

          {/* 批次新增 Modal */}
          {showBatchModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white crayon-border border-amber-400 rounded-3xl p-6 max-w-md w-full shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="font-crayon text-2xl font-bold text-amber-600">Batch Add Students</h2>
                  <button onClick={() => setShowBatchModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <form onSubmit={handleBatchAdd} className="flex flex-col gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Grade / Class Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. G1, G2, Class A"
                      value={batchGrade}
                      onChange={(e) => setBatchGrade(e.target.value)}
                      className="w-full px-3 py-2 border-2 border-slate-300 rounded-xl font-bold focus:border-amber-400 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Student Names</label>
                    <textarea
                      required
                      rows={5}
                      placeholder="Enter names separated by newline or comma..."
                      value={batchNames}
                      onChange={(e) => setBatchNames(e.target.value)}
                      className="w-full px-3 py-2 border-2 border-slate-300 rounded-xl font-bold focus:border-amber-400 outline-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2 mt-2">
                    <button
                      type="button"
                      onClick={() => setShowBatchModal(false)}
                      className="px-4 py-2 rounded-xl text-slate-500 font-bold hover:bg-slate-100 text-sm"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="crayon-border bg-amber-400 hover:bg-amber-500 text-slate-800 font-bold px-5 py-2 rounded-xl text-sm"
                    >
                      Save Students
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 請假/隱藏 Modal */}
          {showHiddenModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white crayon-border border-purple-400 rounded-3xl p-6 max-w-md w-full shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="font-crayon text-2xl font-bold text-purple-600">Absent Students</h2>
                  <button onClick={() => setShowHiddenModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <div className="max-h-60 overflow-y-auto flex flex-col gap-2 pr-1 mb-4">
                  {hiddenStudents.map((student) => (
                    <div key={student.id} className="flex justify-between items-center bg-purple-50 p-3 rounded-xl border border-purple-200">
                      <div>
                        <span className="font-bold text-slate-800 mr-2">{student.name}</span>
                        <span className="text-xs text-purple-600 font-bold bg-purple-200 px-2 py-0.5 rounded-full">{student.grade}</span>
                      </div>
                      <button
                        onClick={() => handleUnhideStudent(student.id)}
                        className="bg-purple-600 text-white font-bold px-3 py-1 rounded-lg text-xs hover:bg-purple-700 flex items-center gap-1"
                      >
                        <Icon name="eye" size={14} /> Restore
                      </button>
                    </div>
                  ))}
                </div>
                <button
                  onClick={() => setShowHiddenModal(false)}
                  className="w-full bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-sm hover:bg-slate-300"
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* 刪除確認 Modal */}
          {studentToDelete && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white crayon-border border-red-400 rounded-3xl p-6 max-w-xs w-full shadow-2xl text-center">
                <h3 className="font-crayon text-2xl font-bold text-red-500 mb-2">Delete Student?</h3>
                <p className="text-slate-600 font-bold mb-6">Are you sure you want to remove <span className="text-red-500">{studentToDelete.name}</span>?</p>
                <div className="flex justify-center gap-3">
                  <button
                    onClick={() => setStudentToDelete(null)}
                    className="px-4 py-2 rounded-xl text-slate-500 font-bold hover:bg-slate-100 text-sm"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDelete}
                    className="crayon-border bg-red-500 text-white font-bold px-5 py-2 rounded-xl text-sm hover:bg-red-600"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 渲染應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
