<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IGK Classroom Point System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

  <style>
    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-30px) scale(1.3) rotate(10deg); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.5) rotate(-10deg); }
    }
    .animate-float {
      position: absolute;
      font-family: 'Caveat', cursive;
      font-weight: bold;
      font-size: 2.25rem;
      color: #f59e0b;
      pointer-events: none;
      animation: floatUpFade 0.8s ease-out forwards;
      z-index: 50;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .font-crayon { font-family: 'Caveat', 'Comic Sans MS', 'Chalkboard SE', cursive; }
    .font-ui { font-family: 'Nunito', sans-serif; }
    .crayon-border {
      border-width: 4px;
      border-style: solid;
      border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;
    }
    .crayon-shadow {
      box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
    }
    .crayon-shadow:hover {
      box-shadow: 7px 7px 0px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }
    .crayon-shadow:active {
      box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
      transform: translateY(2px) !important;
    }
    .paper-bg {
      background-color: #fdfbf7;
      background-image: radial-gradient(#e0dcd3 2px, transparent 2px);
      background-size: 30px 30px;
    }
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="paper-bg font-ui text-slate-800 min-h-screen select-none">
  <div class="max-w-6xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col">
    <!-- HEADER -->
    <header class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b-4 border-dashed border-amber-200">
      <div class="flex items-center gap-3">
        <div class="w-28 h-12 flex items-center justify-center p-1 bg-white border-2 border-slate-300 rounded-xl shadow-sm overflow-hidden">
          <img src="image_5223fe.png" alt="IGK Logo" class="w-full h-full object-contain" onerror="this.style.display='none'; this.parentNode.innerText='IGK';" />
        </div>
        <h1 class="font-crayon text-3xl sm:text-4xl font-bold text-amber-600 tracking-wide">
          Classroom Scoreboard
        </h1>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="btn-add-class" class="crayon-border crayon-shadow bg-amber-400 hover:bg-amber-500 text-slate-800 font-bold px-3 py-1.5 rounded-xl text-sm flex items-center gap-1 transition">
          👥 Add Class
        </button>
        <button id="btn-absent" class="hidden crayon-border crayon-shadow bg-purple-200 hover:bg-purple-300 text-purple-800 font-bold px-3 py-1.5 rounded-xl text-sm transition">
          👁️ Absent (<span id="absent-count">0</span>)
        </button>
        <button id="btn-manage" class="crayon-border crayon-shadow bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-xl text-sm transition">
          ⚙️ Manage
        </button>
      </div>
    </header>

    <!-- 年級標籤 -->
    <div id="grade-tabs" class="flex items-center gap-2 mb-6 overflow-x-auto pb-2 hide-scrollbar"></div>

    <!-- 學生卡片區域 -->
    <div id="students-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5 mb-8"></div>
  </div>

  <!-- 批次新增 Modal -->
  <div id="modal-batch" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white crayon-border border-amber-400 rounded-3xl p-6 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-crayon text-2xl font-bold text-amber-600">Batch Add Students</h2>
        <button class="btn-close-modal text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
      </div>
      <form id="form-batch" class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Grade / Class Name</label>
          <input id="input-grade" type="text" required placeholder="e.g. G1, G2, Class A" class="w-full px-3 py-2 border-2 border-slate-300 rounded-xl font-bold focus:border-amber-400 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Student Names</label>
          <textarea id="input-names" required rows="5" placeholder="Enter names separated by newline or comma..." class="w-full px-3 py-2 border-2 border-slate-300 rounded-xl font-bold focus:border-amber-400 outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 mt-2">
          <button type="button" class="btn-close-modal px-4 py-2 rounded-xl text-slate-500 font-bold hover:bg-slate-100 text-sm">Cancel</button>
          <button type="submit" class="crayon-border bg-amber-400 hover:bg-amber-500 text-slate-800 font-bold px-5 py-2 rounded-xl text-sm">Save Students</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 請假 Modal -->
  <div id="modal-absent" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white crayon-border border-purple-400 rounded-3xl p-6 max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-crayon text-2xl font-bold text-purple-600">Absent Students</h2>
        <button class="btn-close-modal text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
      </div>
      <div id="absent-list" class="max-h-60 overflow-y-auto flex flex-col gap-2 pr-1 mb-4"></div>
      <button class="btn-close-modal w-full bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-sm hover:bg-slate-300">Close</button>
    </div>
  </div>

  <script>
    // 預設資料與狀態
    let students = JSON.parse(localStorage.getItem('classroom_points_data_vanilla')) || [
      { id: '1', name: 'Alex', score: 0, grade: 'G1', isHidden: false },
      { id: '2', name: 'Bella', score: 0, grade: 'G1', isHidden: false },
      { id: '3', name: 'Chris', score: 0, grade: 'G2', isHidden: false },
      { id: '4', name: 'Daisy', score: 0, grade: 'G2', isHidden: false },
    ];
    let activeGrades = [];
    let isEditMode = false;

    const cardColors = [
      'bg-red-50 text-red-700 border-red-400',
      'bg-orange-50 text-orange-700 border-orange-400',
      'bg-amber-50 text-amber-700 border-amber-400',
      'bg-green-50 text-green-700 border-green-400',
      'bg-emerald-50 text-emerald-700 border-emerald-400',
      'bg-teal-50 text-teal-700 border-teal-400',
      'bg-cyan-50 text-cyan-700 border-cyan-400',
      'bg-blue-50 text-blue-700 border-blue-400',
      'bg-indigo-50 text-indigo-700 border-indigo-400',
      'bg-violet-50 text-violet-700 border-violet-400',
      'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-400',
      'bg-pink-50 text-pink-700 border-pink-400',
    ];

    function getColor(name) {
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return cardColors[Math.abs(hash) % cardColors.length];
    }

    function saveData() {
      localStorage.setItem('classroom_points_data_vanilla', JSON.stringify(students));
      render();
    }

    // 渲染 UI
    function render() {
      // 1. 年級標籤
      const grades = [...new Set(students.map(s => s.grade).filter(Boolean))].sort();
      const tabsEl = document.getElementById('grade-tabs');
      
      let tabsHTML = `<button onclick="setGrade('All')" class="crayon-border font-bold px-4 py-1.5 rounded-2xl text-sm whitespace-nowrap transition ${
        activeGrades.length === 0 ? 'bg-amber-500 text-white border-amber-600 shadow-md' : 'bg-white text-slate-600 border-slate-300'
      }">All Students</button>`;

      grades.forEach(g => {
        const isSelected = activeGrades.includes(g);
        tabsHTML += `<button onclick="toggleGrade('${g}')" class="crayon-border font-bold px-4 py-1.5 rounded-2xl text-sm whitespace-nowrap transition ${
          isSelected ? 'bg-amber-500 text-white border-amber-600 shadow-md' : 'bg-white text-slate-600 border-slate-300'
        }">${g} ${isSelected ? '✓' : ''}</button>`;
      });
      tabsEl.innerHTML = tabsHTML;

      // 2. 學生卡片
      const visible = students.filter(s => {
        if (s.isHidden) return false;
        if (activeGrades.length === 0) return true;
        return activeGrades.includes(s.grade);
      });

      const gridEl = document.getElementById('students-grid');
      if (visible.length === 0) {
        gridEl.className = "w-full";
        gridEl.innerHTML = `
          <div class="flex flex-col items-center justify-center p-12 text-center bg-white/50 rounded-3xl border-2 border-dashed border-slate-300 my-4">
            <p class="font-crayon text-2xl text-slate-400 mb-4">No students found here!</p>
            <button onclick="document.getElementById('modal-batch').classList.remove('hidden')" class="crayon-border bg-amber-400 text-slate-800 font-bold px-4 py-2 rounded-xl text-sm">Add New Class</button>
          </div>`;
      } else {
        gridEl.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5 mb-8";
        gridEl.innerHTML = visible.map(s => `
          <div onpointerdown="addPoint(event, '${s.id}')" class="relative crayon-border crayon-shadow ${getColor(s.name)} p-4 sm:p-5 flex flex-col justify-between items-center cursor-pointer transition-all duration-150 transform active:scale-95 min-h-[130px] sm:min-h-[150px] overflow-hidden">
            <div class="w-full text-center mt-1">
              <span class="text-xs font-bold uppercase tracking-wider opacity-60 bg-white/60 px-2 py-0.5 rounded-full inline-block mb-1">${s.grade || 'G1'}</span>
              <h3 class="font-crayon text-2xl sm:text-3xl font-bold tracking-wide truncate max-w-full px-1">${s.name}</h3>
            </div>
            <div class="font-crayon text-4xl sm:text-5xl font-bold my-1 text-slate-800 drop-shadow-sm">${s.score}</div>
            ${isEditMode ? `
              <div class="absolute top-2 right-2 flex gap-1 z-30" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()">
                <button onclick="hideStudent('${s.id}')" class="bg-orange-500 text-white p-1.5 rounded-full hover:bg-orange-600 shadow-md text-xs font-bold">🙈</button>
                <button onclick="deleteStudent('${s.id}')" class="bg-red-500 text-white p-1.5 rounded-full hover:bg-red-600 shadow-md text-xs font-bold">🗑️</button>
              </div>` : ''}
          </div>
        `).join('');
      }

      // 3. 請假按鈕
      const hiddenList = students.filter(s => s.isHidden);
      const absentBtn = document.getElementById('btn-absent');
      if (hiddenList.length > 0) {
        absentBtn.classList.remove('hidden');
        document.getElementById('absent-count').innerText = hiddenList.length;
      } else {
        absentBtn.classList.add('hidden');
      }

      // 4. 請假 Modal 清單
      document.getElementById('absent-list').innerHTML = hiddenList.map(s => `
        <div class="flex justify-between items-center bg-purple-50 p-3 rounded-xl border border-purple-200">
          <div>
            <span class="font-bold text-slate-800 mr-2">${s.name}</span>
            <span class="text-xs text-purple-600 font-bold bg-purple-200 px-2 py-0.5 rounded-full">${s.grade}</span>
          </div>
          <button onclick="unhideStudent('${s.id}')" class="bg-purple-600 text-white font-bold px-3 py-1 rounded-lg text-xs hover:bg-purple-700">👁️ Restore</button>
        </div>
      `).join('');
    }

    // 事件控制
    function setGrade(g) {
      activeGrades = [];
      render();
    }

    function toggleGrade(g) {
      if (activeGrades.includes(g)) {
        activeGrades = activeGrades.filter(x => x !== g);
      } else {
        activeGrades.push(g);
      }
      render();
    }

    function addPoint(e, id) {
      if (isEditMode) return;
      
      const s = students.find(x => x.id === id);
      if (s) {
        s.score++;
        saveData();

        // 動畫 (+1)
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : rect.left + 50)) - rect.left;
        const y = (e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : rect.top + 50)) - rect.top;

        const floatEl = document.createElement('div');
        floatEl.className = 'animate-float';
        floatEl.innerText = '+1';
        floatEl.style.left = (x - 15) + 'px';
        floatEl.style.top = (y - 25) + 'px';
        e.currentTarget.appendChild(floatEl);

        setTimeout(() => floatEl.remove(), 800);
      }
    }

    function hideStudent(id) {
      const s = students.find(x => x.id === id);
      if (s) { s.isHidden = true; saveData(); }
    }

    function unhideStudent(id) {
      const s = students.find(x => x.id === id);
      if (s) { s.isHidden = false; saveData(); }
    }

    function deleteStudent(id) {
      if (confirm('Are you sure you want to delete this student?')) {
        students = students.filter(s => s.id !== id);
        saveData();
      }
    }

    // Modal 與按鈕綁定
    document.getElementById('btn-add-class').onclick = () => document.getElementById('modal-batch').classList.remove('hidden');
    document.getElementById('btn-absent').onclick = () => document.getElementById('modal-absent').classList.remove('hidden');
    document.getElementById('btn-manage').onclick = () => {
      isEditMode = !isEditMode;
      document.getElementById('btn-manage').innerText = isEditMode ? '✓ Done' : '⚙️ Manage';
      render();
    };

    document.querySelectorAll('.btn-close-modal').forEach(b => {
      b.onclick = () => {
        document.getElementById('modal-batch').classList.add('hidden');
        document.getElementById('modal-absent').classList.add('hidden');
      };
    });

    document.getElementById('form-batch').onsubmit = (e) => {
      e.preventDefault();
      const grade = document.getElementById('input-grade').value.trim();
      const names = document.getElementById('input-names').value.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);

      const newStudents = names.map(name => ({
        id: Date.now() + Math.random().toString(),
        name,
        score: 0,
        grade,
        isHidden: false
      }));

      students.push(...newStudents);
      if (!activeGrades.includes(grade)) activeGrades.push(grade);

      document.getElementById('input-names').value = '';
      document.getElementById('modal-batch').classList.add('hidden');
      saveData();
    };

    // 初始化執行
    render();
  </script>
</body>
</html>
