<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文快打旋風：辰辰的試煉</title>
    <!-- 引入 Tailwind CSS 確保響應式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            /* 讓整體頁面在手機上可以滑動 */
            overflow-x: hidden;
            overflow-y: auto;
        }

        .game-font {
            font-family: 'Press Start 2P', cursive;
        }

        .pixel-border {
            box-shadow: 
                inset -4px -4px 0px 0px rgba(0,0,0,0.5),
                inset 4px 4px 0px 0px rgba(255,255,255,0.5);
            border: 4px solid #fff;
        }

        .btn-game {
            background-color: #e53e3e;
            color: white;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        .btn-game:hover {
            background-color: #c53030;
            transform: scale(1.05);
        }

        .btn-game:active {
            transform: scale(0.95);
            box-shadow: inset 4px 4px 0px 0px rgba(0,0,0,0.5);
        }

        .character-sprite {
            /* 在小螢幕上使用 clamp 讓角色圖示動態縮放 */
            width: clamp(80px, 20vw, 150px);
            height: clamp(80px, 20vw, 150px);
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(2rem, 10vw, 4rem);
            border: 2px dashed #666;
            margin: 0 auto;
        }

        .zangief-color { color: #f56565; }
        .ryu-color { color: #fff; }
        .chunli-color { color: #4299e1; }
        .ken-color { color: #ecc94b; }
        .guile-color { color: #48bb78; }

        .health-bar-container {
            width: 100%;
            height: clamp(15px, 4vw, 30px);
            background-color: #333;
            border: 2px solid #fff;
            position: relative;
        }

        .health-bar {
            height: 100%;
            background-color: #48bb78;
            width: 100%;
            transition: width 0.3s ease-out;
        }

        .health-bar.danger {
            background-color: #e53e3e;
        }

        #game-screen {
            background: linear-gradient(to bottom, #2b6cb0 0%, #2a4365 100%);
            /* 讓對戰畫面適應螢幕，並允許內部滑動 */
            height: 75vh;
            min-height: 400px;
            overflow-y: auto;
        }
        
        .hit-animation {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 劇烈震動 (高 Combo 時觸發) */
        .violent-shake {
            animation: violentShake 0.4s;
            filter: brightness(1.5) drop-shadow(0 0 10px red);
        }

        @keyframes violentShake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            10% { transform: translate(-3px, -4px) rotate(-2deg); }
            20% { transform: translate(-5px, 0px) rotate(2deg); }
            30% { transform: translate(5px, 4px) rotate(0deg); }
            40% { transform: translate(3px, -3px) rotate(2deg); }
            50% { transform: translate(-3px, 4px) rotate(-2deg); }
            60% { transform: translate(-5px, 3px) rotate(0deg); }
            70% { transform: translate(5px, 3px) rotate(-2deg); }
            80% { transform: translate(-3px, -3px) rotate(2deg); }
            90% { transform: translate(3px, 4px) rotate(0deg); }
            100% { transform: translate(3px, -4px) rotate(-2deg); }
        }

        /* Combo 浮動文字特效 */
        .combo-floating-text {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1rem, 5vw, 2rem);
            color: #fbbf24; /* 亮黃色 */
            text-shadow: 2px 2px 0 #dc2626, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            pointer-events: none; /* 避免擋住點擊 */
            z-index: 50;
            animation: floatUpAndFade 0.8s ease-out forwards;
        }

        @keyframes floatUpAndFade {
            0% { 
                opacity: 0; 
                transform: translateX(-50%) translateY(20px) scale(0.5); 
            }
            20% { 
                opacity: 1; 
                transform: translateX(-50%) translateY(-10px) scale(1.2); 
            }
            50% { 
                opacity: 1; 
                transform: translateX(-50%) translateY(-30px) scale(1); 
            }
            100% { 
                opacity: 0; 
                transform: translateX(-50%) translateY(-60px) scale(0.8); 
            }
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen bg-gray-900 text-white p-2 md:p-4">

    <header class="text-center mb-4 md:mb-8 mt-2">
        <h1 class="game-font text-2xl md:text-5xl text-yellow-400 mb-2 drop-shadow-lg" style="text-shadow: 2px 2px 4px #000;">日文語法特訓</h1>
        <h2 class="text-lg md:text-2xl text-red-500 font-bold tracking-widest">~ 桑吉爾夫的試煉 ~</h2>

    <div id="app-container" class="w-full max-w-4xl bg-gray-800 pixel-border p-2 md:p-8 rounded-lg shadow-2xl relative flex-grow flex flex-col">

            <h3 class="text-lg md:text-2xl font-bold text-center mb-2 text-yellow-400 drop-shadow-md">【第一關】基礎與進階動詞變化 (全 11 種)</h3>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 md:gap-3 w-full px-2">
                <button onclick="startBasic('dict')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-gray-600 hover:bg-gray-500 flex flex-col items-center justify-center">
                    <span>ます ➔ 辞書形</span><span class="text-[10px] font-normal opacity-80">(vs. 隆)</span>
                </button>
                <button onclick="startBasic('nai')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-blue-600 hover:bg-blue-500 flex flex-col items-center justify-center">

                </button>
                <button onclick="startBasic('ta')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-yellow-600 hover:bg-yellow-500 text-black flex flex-col items-center justify-center">
                    <span>ます ➔ た形</span><span class="text-[10px] font-normal text-white opacity-80">(vs. 肯)</span>
                </button>
                <button onclick="startBasic('te')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-cyan-600 hover:bg-cyan-500 flex flex-col items-center justify-center">
                    <span>ます ➔ て形</span><span class="text-[10px] font-normal opacity-80">(vs. 本田)</span>

                <button onclick="startBasic('imper')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-red-700 hover:bg-red-600 flex flex-col items-center justify-center">

                </button>
                <button onclick="startBasic('vol')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-green-600 hover:bg-green-500 flex flex-col items-center justify-center">

                <button onclick="startBasic('ba')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-purple-600 hover:bg-purple-500 flex flex-col items-center justify-center">
                    <span>ます ➔ 条件(ば)</span><span class="text-[10px] font-normal opacity-80">(vs. 羅絲)</span>
                </button>
                <button onclick="startBasic('pot')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-pink-600 hover:bg-pink-500 flex flex-col items-center justify-center">

                </button>
                <button onclick="startBasic('caus_pass')" class="btn-game pixel-border py-2 px-1 font-bold text-xs md:text-sm bg-slate-700 hover:bg-slate-600 col-span-2 md:col-span-1 lg:col-span-2 flex flex-col items-center justify-center">
                    <span>ます ➔ 使役受身</span><span class="text-[10px] font-normal opacity-80">(vs. 拳王)</span>
                </button>
            </div>

            <!-- 自訂綜合動詞特訓 -->
            <div class="w-full mt-4 p-3 border-2 border-dashed border-gray-500 rounded-lg bg-gray-800 text-sm md:text-base">
                <h4 class="font-bold text-center text-blue-300 mb-1">🛠️ 綜合動詞特訓</h4>
                <p class="text-xs text-gray-400 text-center mb-2">大亂鬥(無盡波數)</p>
                
                <div class="grid grid-cols-3 md:grid-cols-4 gap-1 text-xs text-gray-200 mb-3" id="custom-checkboxes">
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="dict" checked class="w-3 h-3 md:w-4 md:h-4"> <span>辞書形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="nai" checked class="w-3 h-3 md:w-4 md:h-4"> <span>ない形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="ta" checked class="w-3 h-3 md:w-4 md:h-4"> <span>た形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="te" checked class="w-3 h-3 md:w-4 md:h-4"> <span>て形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="imper" class="w-3 h-3 md:w-4 md:h-4"> <span>命令形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="vol" class="w-3 h-3 md:w-4 md:h-4"> <span>意向形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="ba" class="w-3 h-3 md:w-4 md:h-4"> <span>条件(ば)</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="pot" class="w-3 h-3 md:w-4 md:h-4"> <span>可能形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="pass" class="w-3 h-3 md:w-4 md:h-4"> <span>受身形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer"><input type="checkbox" value="caus" class="w-3 h-3 md:w-4 md:h-4"> <span>使役形</span></label>
                    <label class="flex items-center space-x-1 cursor-pointer col-span-2"><input type="checkbox" value="caus_pass" class="w-3 h-3 md:w-4 md:h-4"> <span>使役受身形</span></label>
                </div>
                
                <div class="flex flex-col sm:flex-row justify-center items-center space-y-2 sm:space-y-0 sm:space-x-4">

                    </div>
                    <button onclick="startCustomBasic()" class="btn-game pixel-border py-1 px-4 font-bold bg-blue-800 hover:bg-blue-700 text-sm flex items-center space-x-1">
                        <span>開始特訓</span> <span class="text-[10px] font-normal text-gray-300">(vs. 剛拳)</span>
                    </button>
                </div>
                <p id="custom-error" class="text-red-400 text-xs text-center mt-1 hidden">⚠️ 請至少勾選一種！</p>
            </div>

            <h3 class="text-lg md:text-2xl font-bold text-center mt-4 mb-2 text-green-400 drop-shadow-md">【第二關】普通形 ↔ 丁寧形 互換</h3>
            
            <div class="grid grid-cols-2 gap-2 w-full px-2">
                <button onclick="startSwap('verb', 'polite_to_plain')" class="btn-game pixel-border py-2 px-2 font-bold text-xs md:text-md bg-green-700 hover:bg-green-600 flex flex-col items-center justify-center">
                    <span>動詞:丁寧➔普通</span><span class="text-[10px] font-normal opacity-80">(vs. 古烈)</span>
                </button>
                <button onclick="startSwap('verb', 'plain_to_polite')" class="btn-game pixel-border py-2 px-2 font-bold text-xs md:text-md bg-purple-700 hover:bg-purple-600 flex flex-col items-center justify-center">
                    <span>動詞:普通➔丁寧</span><span class="text-[10px] font-normal opacity-80">(vs. 薩加特)</span>
                </button>
                <button onclick="startSwap('adj_noun', 'polite_to_plain')" class="btn-game pixel-border py-2 px-2 font-bold text-xs md:text-md bg-teal-700 hover:bg-teal-600 flex flex-col items-center justify-center">
                    <span>形/名:丁寧➔普通</span><span class="text-[10px] font-normal opacity-80">(vs. 達爾西姆)</span>
                </button>
                <button onclick="startSwap('adj_noun', 'plain_to_polite')" class="btn-game pixel-border py-2 px-2 font-bold text-xs md:text-md bg-orange-700 hover:bg-orange-600 flex flex-col items-center justify-center">
                    <span>形/名:普通➔丁寧</span><span class="text-[10px] font-normal opacity-80">(vs. 布蘭卡)</span>
                </button>
            </div>

            <button onclick="startSurvival()" class="btn-game pixel-border py-3 px-4 mt-2 w-11/12 md:w-2/3 font-bold text-sm md:text-xl bg-red-800 hover:bg-red-700 mx-auto flex flex-col items-center justify-center">
                <span>🔥 終極大亂鬥：自選綜合複習 🔥</span><span class="text-[10px] md:text-xs font-normal text-gray-200 mt-1">(vs. 拜森 - 包含所有詞性與方向)</span>
            </button>
        </div>

        <div id="game-screen" class="hidden flex-col justify-between p-2 md:p-4 rounded relative pixel-border flex-grow">
            
            <!-- 頂部資訊：血條與名字 -->
            <div class="flex justify-between items-start mb-2 md:mb-4">
                <!-- 辰辰 (桑吉爾夫) -->
                <div class="w-[45%] md:w-2/5">
                    <div class="flex justify-between mb-1">
                        <span class="game-font text-yellow-300 text-[10px] md:text-base drop-shadow-md truncate">ZANGIEF</span>
                    </div>
                    <div class="health-bar-container">
                        <div id="player-health" class="health-bar" style="width: 100%;"></div>
                    </div>
                    <div class="text-[10px] md:text-xs mt-1">Score: <span id="score-display">0</span> | <span class="text-yellow-400 font-bold">Combo: <span id="combo-display">0</span></span></div>
                </div>

                <!-- 回合/時間 (返回按鈕) -->
                <div class="w-[10%] md:w-1/5 text-center flex flex-col justify-start items-center pt-1 z-10 px-1">
                    <button onclick="returnToMenu()" title="回到訓練中心" class="mb-1 text-[10px] md:text-xs bg-red-900 hover:bg-red-700 text-white py-1 px-1 rounded pixel-border transition-colors whitespace-nowrap shadow-lg">
                        返回
                    </button>
                    <span class="game-font text-sm md:text-2xl text-yellow-400 drop-shadow-md mt-1 hidden md:inline-block" id="timer-display">VS</span>
                </div>

                <!-- 對手 -->
                <div class="w-[45%] md:w-2/5 flex flex-col items-end">
                    <div class="flex justify-between w-full mb-1 flex-row-reverse">
                        <span id="enemy-name" class="game-font text-white text-[10px] md:text-base drop-shadow-md text-right truncate">ENEMY</span>
                    </div>
                    <div class="health-bar-container">
                        <div id="enemy-health" class="health-bar" style="width: 100%; transform-origin: right;"></div>
                    </div>
                     <div class="text-[10px] md:text-xs mt-1 text-right">Wave: <span id="wave-display">1</span></div>
                </div>
            </div>

            <!-- 中間對戰區域 (角色與對話框) -->
            <div class="flex justify-between items-end flex-grow pb-2 px-1 md:px-4 min-h-[150px]">
                
                <!-- 玩家角色 -->
                <div class="flex flex-col items-center w-1/2">
                    <div id="player-dialog" class="bg-white text-black p-2 md:p-3 rounded-xl mb-2 font-bold text-sm md:text-lg min-h-[50px] flex items-center justify-center relative shadow-lg text-center break-words w-11/12">
                        <span id="question-text">準備...</span>
                        <div class="absolute bottom-[-8px] left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[8px] border-l-transparent border-t-[8px] border-t-white border-r-[8px] border-r-transparent"></div>
                    </div>
                    <div id="player-sprite" class="character-sprite zangief-color">
                        💪
                    </div>
                </div>

                <!-- 對手角色 -->
                <div class="flex flex-col items-center w-1/2 relative">
                    <div id="enemy-dialog" class="bg-gray-200 text-black p-2 md:p-3 rounded-xl mb-2 font-bold text-sm md:text-lg min-h-[50px] flex items-center justify-center relative shadow-lg opacity-0 transition-opacity text-center w-11/12">

                        <div class="absolute bottom-[-8px] left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[8px] border-l-transparent border-t-[8px] border-t-gray-200 border-r-[8px] border-r-transparent"></div>
                    </div>
                    <!-- 加入 relative 定位，讓浮動文字以敵人為基準 -->
                    <div id="enemy-sprite" class="character-sprite relative">
                        🥋

                </div>
            </div>

            <!-- 底部答題區域 -->
            <div class="bg-gray-800 bg-opacity-90 p-3 md:p-4 rounded-t-lg mt-auto border-t-4 border-gray-600">
                <p class="text-center text-yellow-300 font-bold mb-2 text-sm md:text-lg drop-shadow" id="instruction-text">請轉換為：<span id="target-form-text" class="text-white block sm:inline mt-1 sm:mt-0"></span></p>

        </div>
    </div>

    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-80 hidden flex-col items-center justify-center z-50 p-4">
        <h2 id="overlay-title" class="game-font text-3xl md:text-6xl text-yellow-400 mb-6 text-center shadow-black drop-shadow-2xl">YOU WIN!</h2>
        <p id="overlay-msg" class="text-lg md:text-xl mb-8 text-white text-center"></p>
        <button onclick="returnToMenu()" class="btn-game pixel-border py-3 px-8 font-bold text-lg md:text-xl">
            返回主選單
        </button>
    </div>

    <footer class="mt-4 md:mt-8 text-gray-500 text-xs md:text-sm text-center mb-4">
        &copy; 2026 日文快打旋風特訓 - 辰辰的試煉
    </footer>

    <script>
        // 第一關：基礎動詞題庫 (固定從ます形出發，新增全11種變化)
        const basicVerbs = [
            { polite: '書きます', dict: '書く', nai: '書かない', ta: '書いた', te: '書いて', imper: '書け', vol: '書こう', ba: '書けば', pot: '書ける', pass: '書かれる', caus: '書かせる', caus_pass: '書かされる', trans: '寫' },
            { polite: '行きます', dict: '行く', nai: '行かない', ta: '行った', te: '行って', imper: '行け', vol: '行こう', ba: '行けば', pot: '行ける', pass: '行かれる', caus: '行かせる', caus_pass: '行かされる', trans: '去' },
            { polite: '飲みます', dict: '飲む', nai: '飲まない', ta: '飲んだ', te: '飲んで', imper: '飲め', vol: '飲もう', ba: '飲めば', pot: '飲める', pass: '飲まれる', caus: '飲ませる', caus_pass: '飲まされる', trans: '喝' },
            { polite: '遊びます', dict: '遊ぶ', nai: '遊ばない', ta: '遊んだ', te: '遊んで', imper: '遊べ', vol: '遊ぼう', ba: '遊べば', pot: '遊べる', pass: '遊ばれる', caus: '遊ばせる', caus_pass: '遊ばされる', trans: '玩' },
            { polite: '食べます', dict: '食べる', nai: '食べない', ta: '食べた', te: '食べて', imper: '食べろ', vol: '食べよう', ba: '食べれば', pot: '食べられる', pass: '食べられる', caus: '食べさせる', caus_pass: '食べさせられる', trans: '吃' },
            { polite: '見ます', dict: '見る', nai: '見ない', ta: '見た', te: '見て', imper: '見ろ', vol: '見よう', ba: '見れば', pot: '見られる', pass: '見られる', caus: '見させる', caus_pass: '見させられる', trans: '看' },
            { polite: '来ます', dict: '来る', nai: '来ない', ta: '来た', te: '来て', imper: '来い', vol: '来よう', ba: '来れば', pot: '来られる', pass: '来られる', caus: '来させる', caus_pass: '来させられる', trans: '來' },
            { polite: 'します', dict: 'する', nai: 'しない', ta: 'した', te: 'して', imper: 'しろ', vol: 'しよう', ba: 'すれば', pot: 'できる', pass: 'される', caus: 'させる', caus_pass: 'させられる', trans: '做' }
        ];

        // 第二關：互換題庫 (涵蓋肯定、否定、過去)
        const swapPairs = [
            // 動詞 (Verbs)
            { type: 'verb', polite: '買います', plain: '買う', trans: '買 (肯定)' },
            { type: 'verb', polite: '買いません', plain: '買わない', trans: '不買 (否定)' },
            { type: 'verb', polite: '買いました', plain: '買った', trans: '買了 (過去)' },
            { type: 'verb', polite: '買いませんでした', plain: '買わなかった', trans: '沒買 (過去否定)' },
            { type: 'verb', polite: '寝ます', plain: '寝る', trans: '睡覺 (肯定)' },
            { type: 'verb', polite: '寝ません', plain: '寝ない', trans: '不睡 (否定)' },
            { type: 'verb', polite: '寝ました', plain: '寝た', trans: '睡了 (過去)' },
            
            // 形容詞/名詞 (Adj/Noun)
            { type: 'adj_noun', polite: '高いです', plain: '高い', trans: '高/貴 (肯定)' },
            { type: 'adj_noun', polite: '高くないです', plain: '高くない', trans: '不高/貴 (否定)' },
            { type: 'adj_noun', polite: '高かったです', plain: '高かった', trans: '以前高/貴 (過去)' },
            { type: 'adj_noun', polite: '静かです', plain: '静かだ', trans: '安靜 (肯定)' },
            { type: 'adj_noun', polite: '静かではありません', plain: '静かではない', trans: '不安靜 (否定)' },
            { type: 'adj_noun', polite: '静かでした', plain: '静かだった', trans: '以前安靜 (過去)' },
            { type: 'adj_noun', polite: '雨です', plain: '雨だ', trans: '下雨 (肯定)' },
            { type: 'adj_noun', polite: '雨ではありません', plain: '雨ではない', trans: '沒下雨 (否定)' },
            { type: 'adj_noun', polite: '休みでした', plain: '休みだった', trans: '以前是休息日 (過去)' }
        ];

        const enemies = {
            'dict': { name: 'RYU', sprite: '🥋', color: 'text-white', formName: '辞書形' },
            'nai': { name: 'CHUN-LI', sprite: '🦵', color: 'text-blue-400', formName: 'ない形' },
            'ta': { name: 'KEN', sprite: '🔥', color: 'text-yellow-400', formName: 'た形' },
            'te': { name: 'E.HONDA', sprite: '🖐️', color: 'text-cyan-400', formName: 'て形' },
            'imper': { name: 'AKUMA', sprite: '👹', color: 'text-red-600', formName: '命令形' },
            'vol': { name: 'CAMMY', sprite: '🐝', color: 'text-green-400', formName: '意向形' },
            'ba': { name: 'ROSE', sprite: '🔮', color: 'text-purple-400', formName: '条件形' },
            'pot': { name: 'SAKURA', sprite: '🌸', color: 'text-pink-400', formName: '可能形' },
            'pass': { name: 'DAN', sprite: '😭', color: 'text-orange-400', formName: '受身形' },
            'caus': { name: 'VEGA', sprite: '💅', color: 'text-indigo-400', formName: '使役形' },
            'caus_pass': { name: 'BALROG', sprite: '🥊', color: 'text-gray-400', formName: '使役受身' },
            'verb_polite_to_plain': { name: 'GUILE', sprite: '🪖', color: 'text-green-400', formName: '普通形' },
            'verb_plain_to_polite': { name: 'SAGAT', sprite: '👁️‍🗨️', color: 'text-red-400', formName: '丁寧形' },
            'adj_noun_polite_to_plain': { name: 'DHALSIM', sprite: '🧘', color: 'text-orange-400', formName: '普通形' },
            'adj_noun_plain_to_polite': { name: 'BLANKA', sprite: '⚡', color: 'text-green-500', formName: '丁寧形' },
            'survival': { name: 'M.BISON', sprite: '😈', color: 'text-red-600', formName: '指定(隨機)' },
            'custom_basic': { name: 'GOUKEN', sprite: '🥋', color: 'text-blue-400', formName: '指定(隨機)' }
        };

        let currentGameMode = '';
        let currentBasicTarget = ''; 
        let currentSwapType = ''; 
        let currentSwapDirection = ''; 
        let score = 0, wave = 1, playerHealth = 100, enemyHealth = 100, combo = 0;
        let selectedCustomTargets = []; 
        let currentCorrectAnswer = "";

        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const overlay = document.getElementById('overlay');
        const playerHealthBar = document.getElementById('player-health');
        const enemyHealthBar = document.getElementById('enemy-health');
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const waveDisplay = document.getElementById('wave-display');
        const enemyNameText = document.getElementById('enemy-name');
        const enemySprite = document.getElementById('enemy-sprite');
        const playerSprite = document.getElementById('player-sprite');
        const questionText = document.getElementById('question-text');
        const targetFormText = document.getElementById('target-form-text');
        const optionsContainer = document.getElementById('options-container');
        const enemyDialog = document.getElementById('enemy-dialog');
        const enemyReactionText = document.getElementById('enemy-reaction');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');

        function toggleAllCustom(checked) {
            const checkboxes = document.querySelectorAll('#custom-checkboxes input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = checked);
        }

        function startBasic(target) {
            currentGameMode = 'basic';
            currentBasicTarget = target;
            setupGameScreen(enemies[target]);
        }

        function startSwap(type, direction) {
            currentGameMode = 'swap';
            currentSwapType = type;
            currentSwapDirection = direction;
            setupGameScreen(enemies[`${type}_${direction}`]);
        }

        function startCustomBasic() {
            const checkboxes = document.querySelectorAll('#custom-checkboxes input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                document.getElementById('custom-error').classList.remove('hidden');
                return;
            }
            document.getElementById('custom-error').classList.add('hidden');
            selectedCustomTargets = Array.from(checkboxes).map(cb => cb.value);
            currentGameMode = 'custom_basic';
            setupGameScreen(enemies['custom_basic']);
        }

        function startSurvival() {
            currentGameMode = 'survival';
            setupGameScreen(enemies['survival']);
        }

        function setupGameScreen(enemy) {
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            enemyNameText.textContent = enemy.name;
            // 保留原本的 relative，這樣 combo 數字才能定位
            enemySprite.className = `character-sprite relative ${enemy.color}`;
            enemySprite.textContent = enemy.sprite;
            
            if (currentGameMode !== 'survival' && currentGameMode !== 'custom_basic') {
                targetFormText.textContent = enemy.formName;
            }
            
            initGameUI();
        }

        function nextTurn() {
            enemyDialog.style.opacity = '0';
            optionsContainer.innerHTML = '';
            playerSprite.classList.remove('hit-animation');
            enemySprite.classList.remove('hit-animation');
            enemySprite.classList.remove('violent-shake');
            waveDisplay.textContent = wave;

            let questionTextStr = "";
            let targetTextStr = "";
            
            if (currentGameMode === 'basic') {
                let q = basicVerbs[Math.floor(Math.random() * basicVerbs.length)];
                questionTextStr = `${q.polite} (${q.trans})`;
                targetTextStr = enemies[currentBasicTarget].formName;
                currentCorrectAnswer = q[currentBasicTarget];
                generateOptions(currentCorrectAnswer, getBasicWrongAnswers(q, currentBasicTarget));
            } else if (currentGameMode === 'custom_basic') {
                let q = basicVerbs[Math.floor(Math.random() * basicVerbs.length)];
                let targetForm = selectedCustomTargets[Math.floor(Math.random() * selectedCustomTargets.length)];
                questionTextStr = `${q.polite} (${q.trans})`;
                targetTextStr = enemies[targetForm].formName;
                currentCorrectAnswer = q[targetForm];
                generateOptions(currentCorrectAnswer, getBasicWrongAnswers(q, targetForm));
            } else if (currentGameMode === 'swap') {
                let availableQs = swapPairs.filter(p => p.type === currentSwapType);
                let q = availableQs[Math.floor(Math.random() * availableQs.length)];
                if (currentSwapDirection === 'polite_to_plain') {
                    questionTextStr = `${q.polite} (${q.trans})`;
                    currentCorrectAnswer = q.plain;
                } else {
                    questionTextStr = `${q.plain} (${q.trans})`;
                    currentCorrectAnswer = q.polite;
                }
                targetTextStr = enemies[`${currentSwapType}_${currentSwapDirection}`].formName;
                generateOptions(currentCorrectAnswer, getSwapWrongAnswers(q, currentCorrectAnswer, currentSwapType));
            } else if (currentGameMode === 'survival') {
                let q = swapPairs[Math.floor(Math.random() * swapPairs.length)];
                let dir = Math.random() > 0.5 ? 'polite_to_plain' : 'plain_to_polite';
                if (dir === 'polite_to_plain') {
                    questionTextStr = `${q.polite} (${q.trans})`;
                    currentCorrectAnswer = q.plain;
                    targetTextStr = "普通形";
                } else {
                    questionTextStr = `${q.plain} (${q.trans})`;
                    currentCorrectAnswer = q.polite;
                    targetTextStr = "丁寧形";
                }
                generateOptions(currentCorrectAnswer, getSwapWrongAnswers(q, currentCorrectAnswer, q.type));
            }
            
            questionText.textContent = questionTextStr;
            targetFormText.textContent = targetTextStr;
        }

        function getBasicWrongAnswers(qObj, targetKey) {
            let forms = ['dict', 'nai', 'ta', 'te', 'imper', 'vol', 'ba', 'pot', 'pass', 'caus', 'caus_pass', 'polite'];
            let wrong = forms.filter(k => k !== targetKey).map(k => qObj[k]);
            return wrong.sort(() => 0.5 - Math.random()).slice(0, 3);
        }
        
        function getSwapWrongAnswers(qObj, correct, type) {
            let available = swapPairs.filter(p => p.type === type && p.plain !== correct && p.polite !== correct);
            let wrongs = available.map(p => Math.random() > 0.5 ? p.plain : p.polite);
            return wrongs.sort(() => 0.5 - Math.random()).slice(0, 3);
        }

        function generateOptions(correct, wrongs) {
            let options = [correct, ...wrongs];
            options.sort(() => 0.5 - Math.random()); 
            
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                let btn = document.createElement('button');
                // 調整按鈕字體，確保手機上不會過大被截斷
                btn.className = 'btn-game pixel-border py-2 px-2 md:px-4 font-bold text-sm md:text-lg bg-gray-700 hover:bg-gray-600 transition break-all md:break-normal';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt === correct);
                optionsContainer.appendChild(btn);
            });
        }

        function showFloatingCombo(comboCount) {
            const container = document.getElementById('enemy-sprite');
            const floatText = document.createElement('div');
            floatText.className = 'combo-floating-text';
            floatText.textContent = comboCount + ' HITS!';
            
            // 隨機左右偏移
            const randomX = Math.floor(Math.random() * 60) - 30; 
            floatText.style.left = `calc(50% + ${randomX}px)`;

            container.appendChild(floatText);

            setTimeout(() => {
                if (container.contains(floatText)) {
                    container.removeChild(floatText);
                }
            }, 800);
        }

        function playHitAnimation(element) {
            element.classList.add('hit-animation');
            setTimeout(() => element.classList.remove('hit-animation'), 500);
        }

        function showEnemyReaction(text, colorClass) {
            enemyReactionText.textContent = text;
            enemyReactionText.className = `text-sm md:text-base ${colorClass}`;
            enemyDialog.style.opacity = '1';
        }

        function checkAnswer(isCorrect) {
            const btns = optionsContainer.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);

            if (isCorrect) {
                combo++;
                score += 10;
                enemyHealth = 100 - (combo * 10); 
                
                if (combo >= 3) {
                    enemySprite.classList.add('violent-shake');
                    setTimeout(() => enemySprite.classList.remove('violent-shake'), 400);
                } else {
                    playHitAnimation(enemySprite);
                }
                
                if (combo >= 2) {
                    showFloatingCombo(combo);
                }

                showEnemyReaction("ぐあっ！", "text-red-600 font-bold");
                
                if (enemyHealth <= 0) {
                    if (currentGameMode === 'survival' || currentGameMode === 'custom_basic') {
                        combo = 0;
                        enemyHealth = 100;
                        wave++;
                        playerHealth = Math.min(100, playerHealth + 20); 
                    } else {
                        updateUI();
                        setTimeout(() => gameOver(true), 500);
                        return;
                    }
                }
            } else {
                combo = 0; 
                enemyHealth = 100; 
                playerHealth -= 25; 
                playHitAnimation(playerSprite);
                showEnemyReaction("甘いな！", "text-blue-600 font-bold");
                
                if (playerHealth <= 0) {
                    updateUI();
                    setTimeout(() => gameOver(false), 500);
                    return;
                }
            }
            
            updateUI();
            if (window.turnTimer) clearTimeout(window.turnTimer);
            window.turnTimer = setTimeout(nextTurn, 1000); 
        }

        function initGameUI() {
            score = 0; wave = 1; playerHealth = 100; enemyHealth = 100; combo = 0;
            updateUI();
            if (window.turnTimer) clearTimeout(window.turnTimer);
            window.turnTimer = setTimeout(nextTurn, 1000);
        }

        function updateUI() {
            playerHealthBar.style.width = `${Math.max(0, playerHealth)}%`;
            enemyHealthBar.style.width = `${Math.max(0, enemyHealth)}%`;
            
            playerHealth <= 30 ? playerHealthBar.classList.add('danger') : playerHealthBar.classList.remove('danger');
            enemyHealth <= 30 ? enemyHealthBar.classList.add('danger') : enemyHealthBar.classList.remove('danger');
            
            scoreDisplay.textContent = score;
            if (comboDisplay) comboDisplay.textContent = combo;
        }

        function gameOver(isWin) {
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            if (isWin) {
                overlayTitle.textContent = "YOU WIN!";
                overlayTitle.classList.replace('text-red-500', 'text-yellow-400');
                overlayMsg.textContent = `太棒了！你的分數是: ${score}`;
            } else {
                overlayTitle.textContent = "K.O.";
                overlayTitle.classList.replace('text-yellow-400', 'text-red-500');
                if (currentGameMode === 'survival' || currentGameMode === 'custom_basic') {
                    overlayMsg.textContent = `特訓結束。到達 Wave ${wave}，分數: ${score}`;
                } else {
                    overlayMsg.textContent = "再接再厲！桑吉爾夫的肌肉不會放棄！";
                }
            }
        }

        function returnToMenu() {
            if (window.turnTimer) clearTimeout(window.turnTimer);
            
            gameScreen.classList.add('hidden');
            gameScreen.classList.remove('flex');
            menuScreen.classList.remove('hidden');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }
    </script>
</body>
</html>
