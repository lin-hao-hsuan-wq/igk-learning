<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODAY'S CLASS - 自動分班調度系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      user-select: none;
    }
    .schedule-table {
      border-collapse: collapse;
      border: 3px solid #888888;
      background-color: #ffffff;
      width: 100%;
      min-width: 1100px;
    }
    .schedule-table th, .schedule-table td {
      border: 1.5px solid #8f9aa6;
      vertical-align: top;
    }
    .bg-cyan-cell { background-color: #00ffff !important; }
    .bg-yellow-cell { background-color: #ffff00 !important; }
    .bg-orange-header { background-color: #ff9900 !important; color: #000; }
    .bg-green-header { background-color: #93c47d !important; color: #000; }
    
    .student-badge {
      display: inline-block;
      cursor: grab;
      transition: all 0.15s ease;
      line-height: 1.4;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 2px 6px;
      margin: 2px 1px;
      border-radius: 4px;
    }
    .student-badge:hover {
      background-color: rgba(0, 0, 0, 0.09);
    }
    .student-badge:active {
      cursor: grabbing;
    }
    .student-badge.absent {
      color: #e53935 !important;
      font-weight: 800 !important;
      text-decoration: none !important;
      background-color: rgba(229, 57, 53, 0.12);
    }
    .drag-over {
      outline: 3px dashed #2563eb !important;
      outline-offset: -3px;
      background-color: rgba(37, 99, 235, 0.08) !important;
    }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3 md:p-6">

  <!-- 頂部功能面板 -->
  <header class="max-w-7xl mx-auto w-full mb-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-2">
            <i class="fa-solid fa-graduation-cap text-blue-600"></i>
            TODAY'S CLASS
          </h1>
          <span id="currentWeekRangeBadge" class="text-xs bg-blue-50 text-blue-700 px-3 py-1 rounded-full border border-blue-200 font-bold flex items-center gap-1">
            <i class="fa-regular fa-clock"></i> 自動取得當週課表
          </span>
        </div>
        <p class="text-xs md:text-sm text-slate-500 mt-1.5 leading-relaxed">
          💡 <span class="text-slate-800 font-bold">操作提示：</span> 
          第一節與第二節名單與缺席狀態自動同步（G2 學生允許獨立跑班調整）。名單嚴格依照「年級 (G1-G6) ➔ 英文姓名 (A-Z)」排序。
        </p>
      </div>

      <!-- 右側功能按鈕 -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- 合班開關 -->
        <label class="flex items-center gap-2 px-3 py-2 text-xs md:text-sm font-bold rounded-lg bg-orange-50 border border-orange-300 text-orange-950 cursor-pointer shadow-sm hover:bg-orange-100 transition-all">
          <input type="checkbox" id="mergeKids23Checkbox" class="w-4 h-4 text-orange-600 rounded">
          <span>Kids02 & Kids03 合班 (6F)</span>
        </label>

        <!-- 學生程度管理按鈕 -->
        <button id="openLevelManagerBtn" class="flex items-center gap-1.5 px-3 py-2 text-xs md:text-sm font-bold rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-all shadow-sm">
          <i class="fa-solid fa-sliders"></i> 學生程度管理
        </button>

        <button id="resetBtn" class="flex items-center gap-1.5 px-3 py-2 text-xs md:text-sm font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-300 transition-all shadow-sm">
          <i class="fa-solid fa-arrow-rotate-left text-slate-500"></i> 重設當日課表
        </button>
      </div>
    </div>

    <!-- 星期切換按鈕組 -->
    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center gap-2 overflow-x-auto pb-1" id="dayButtonsContainer"></div>
  </header>

  <!-- 課表主展示區域 -->
  <main class="max-w-7xl mx-auto w-full flex-1 overflow-hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col">
    <div class="w-full overflow-x-auto flex-1 pb-4">
      <div id="tableContainer"></div>
    </div>
  </main>

  <!-- 學生程度管理 Modal (支援表格視圖與文字化呈現) -->
  <div id="levelModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl p-6 border border-slate-200 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b">
        <div>
          <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-user-graduate text-indigo-600"></i> 學生程度與星期分班管理
          </h3>
          <p class="text-xs text-slate-500">程度代碼：Jr 01, Jr 02, Kids01, Kids02, Kids03。可在此自訂預設程度與各星期的指定班級。</p>
        </div>
        <button id="closeLevelModalBtn" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>

      <!-- 分頁切換 Tabs -->
      <div class="flex border-b border-slate-200 mb-3 gap-4 text-sm font-bold">
        <button id="tabTableBtn" class="pb-2 border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-1.5">
          <i class="fa-solid fa-table-list"></i> 表格清單視圖
        </button>
        <button id="tabTextBtn" class="pb-2 text-slate-500 hover:text-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-code"></i> 文字化呈現與整批匯入
        </button>
      </div>

      <!-- Tab 1: 表格視圖 -->
      <div id="levelTableView" class="flex-1 overflow-y-auto pr-1">
        <table class="w-full text-left text-xs md:text-sm border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-700 border-b">
              <th class="p-2 font-bold">姓名</th>
              <th class="p-2 font-bold">學年</th>
              <th class="p-2 font-bold">預設程度</th>
              <th class="p-2 font-bold">週一</th>
              <th class="p-2 font-bold">週二</th>
              <th class="p-2 font-bold">週三</th>
              <th class="p-2 font-bold">週四</th>
              <th class="p-2 font-bold">週五</th>
            </tr>
          </thead>
          <tbody id="studentLevelTableBody" class="divide-y divide-slate-100">
            <!-- 動態生成每位學生的下拉選單 -->
          </tbody>
        </table>
      </div>

      <!-- Tab 2: 純文字格式視圖 -->

        <label class="block text-xs font-bold text-slate-600 mb-1">

            <i class="fa-solid fa-floppy-disk"></i> 儲存並重新產生課表

        </div>
      </div>

      { name: 'Kosuke', grade: 'G5', defaultLevel: 'Kids02', levels: { Monday: 'Kids02', Tuesday: 'Kids02', Wednesday: 'Kids01', Thursday: 'Kids01', Friday: 'Kids01' } },

      { name: 'Sakuya', grade: 'G6', defaultLevel: 'Kids02', levels: { Monday: 'Kids02', Tuesday: 'Kids02', Wednesday: 'Kids02', Thursday: 'Kids02', Friday: 'Kids02' } },
      { name: 'Yui', grade: 'G6', defaultLevel: 'Kids02', levels: { Monday: 'Kids02', Tuesday: 'Kids02', Wednesday: 'Kids02', Thursday: 'Kids02', Friday: 'Kids02' } },
      { name: 'Sarasa', grade: 'G6', defaultLevel: 'Kids02', levels: { Monday: 'Kids02', Tuesday: 'Kids02', Wednesday: 'Kids01', Thursday: 'Kids01', Friday: 'Kids01' } },
      { name: 'Haruto.Y', grade: 'G6', defaultLevel: 'Kids01', levels: { Monday: 'Kids01', Tuesday: 'Kids01', Wednesday: 'Kids02', Thursday: 'Kids01', Friday: 'Kids01' } }
    ];

    // 全域運行狀態
    let appState = {};
    let currentDay = 'Monday';
    let isKids23Merged = false;
    let draggedStudentInfo = null;

    // 1. 自動計算當週週一至週五
    function getWeekDays() {
      const now = new Date();
      const day = now.getDay();
      const diffToMonday = (day === 0 ? -6 : 1) - day;
      
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday);
      if (day === 0 || day === 6) {
        monday.setDate(monday.getDate() + 7);
      }

      return DAYS_KEYS.map((key, idx) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + idx);
        const m = d.getMonth() + 1;
        const dateNum = d.getDate();
        return {
          key: key,
          label: DAY_LABELS[key],
          dateStr: `(${key})\n${m}/${dateNum}`,
          shortDate: `${m}/${dateNum}`
        };
      });
    }

    const CURRENT_WEEK_DAYS = getWeekDays();

    // 2. 嚴格排序函式：學年 (G1~G6) ➔ 英文名字 (A-Z)
    function sortStudentsStrict(students) {
      const gradeRank = { 'G1': 1, 'G2': 2, 'G3': 3, 'G4': 4, 'G5': 5, 'G6': 6, 'Grad': 7 };
      return students.slice().sort((a, b) => {
        const rA = gradeRank[a.grade] || 99;
        const rB = gradeRank[b.grade] || 99;
        if (rA !== rB) return rA - rB;
        return a.name.localeCompare(b.name);
      });
    }

    // 3. 依據程度資料庫動態構建當日課表
    function buildScheduleForDay(dayKey) {
      const dayInfo = CURRENT_WEEK_DAYS.find(d => d.key === dayKey) || CURRENT_WEEK_DAYS[0];

      let columns = [
        { id: 'j1', name: 'Junior 01 (4F)', levelCode: 'Jr 01', headerBg: 'bg-white' },
        { id: 'j2', name: 'Junior 02 (4F)', levelCode: 'Jr 02', headerBg: 'bg-white' },
        { id: 'k5f', name: 'Kids01 (5F)', levelCode: 'Kids01', headerBg: 'bg-orange-header' }
      ];

      if (isKids23Merged) {
        columns.push({ id: 'k6f_merged', name: 'Kids02 & 03 (6F)\nBig Room [合班]', levelCode: 'KidsMerged', headerBg: 'bg-green-header' });
      } else {
        columns.push({ id: 'k6f1', name: 'Kids02 (6F)\nBig Room', levelCode: 'Kids02', headerBg: 'bg-green-header' });
        columns.push({ id: 'k6f2', name: 'Kids03 (6F)\nSmall Room', levelCode: 'Kids03', headerBg: 'bg-green-header' });
      }

      // 從 STUDENTS_MASTER 依當天程度分派學生
      const cellStudents = {};
      columns.forEach(col => cellStudents[col.id] = []);

      STUDENTS_MASTER.forEach(stu => {
        const level = stu.levels[dayKey] || stu.defaultLevel || 'Jr 01';
        
        let assignedRoomId = null;
        if (level === 'Jr 01') assignedRoomId = 'j1';
        else if (level === 'Jr 02') assignedRoomId = 'j2';
        else if (level === 'Kids01') assignedRoomId = 'k5f';
        else if (level === 'Kids02') assignedRoomId = isKids23Merged ? 'k6f_merged' : 'k6f1';
        else if (level === 'Kids03') assignedRoomId = isKids23Merged ? 'k6f_merged' : 'k6f2';

        if (assignedRoomId && cellStudents[assignedRoomId]) {
          cellStudents[assignedRoomId].push({
            id: `stu_${stu.name}_${stu.grade}`,
            name: stu.name,
            grade: stu.grade,
            absent: false
          });
        }
      });

      // 排序每一間教室學生
      Object.keys(cellStudents).forEach(roomId => {
        cellStudents[roomId] = sortStudentsStrict(cellStudents[roomId]);
      });

      // 同一組學生在第一節與第二節維持完全對應連動 (包含 G2 特別跑班)
      const periods = {
        '1st': {
          time: '1st\n(4PM-\n4:50PM)',
          cells: {}
        },
        '2nd': {
          time: '2nd\n(5PM-\n5:50PM)',
          cells: {}
        }
      };

      columns.forEach(col => {
        const studentsClone1 = JSON.parse(JSON.stringify(cellStudents[col.id]));
        const studentsClone2 = JSON.parse(JSON.stringify(cellStudents[col.id]));

        periods['1st'].cells[col.id] = {
          title: col.name.split('\n')[0],
          teacher: col.id.startsWith('j') ? 'Gio / Taka' : 'Toshi / Nathan',
          colorType: col.id === 'j1' ? 'cyan' : (col.id === 'j2' ? 'yellow' : 'white'),
          students: studentsClone1
        };

        periods['2nd'].cells[col.id] = {
          title: col.name.split('\n')[0],
          teacher: col.id.startsWith('j') ? 'Gio / Taka' : 'Nathan / Afrin',
          colorType: col.id === 'j1' ? 'yellow' : (col.id === 'j2' ? 'cyan' : 'white'),
          students: studentsClone2
        };
      });

      return {
        dateStr: dayInfo.dateStr,
        columns: columns,
        periods: periods
      };
    }

    function initAppState() {
      appState = {};
      DAYS_KEYS.forEach(k => {
        appState[k] = buildScheduleForDay(k);
      });
    }

    // 4. 渲染星期按鈕
    function renderDayButtons() {
      const container = document.getElementById('dayButtonsContainer');
      container.innerHTML = '';

      CURRENT_WEEK_DAYS.forEach(day => {
        const btn = document.createElement('button');
        const isActive = day.key === currentDay;
        btn.className = `px-4 py-2 rounded-lg font-bold text-sm whitespace-nowrap transition-all duration-150 flex items-center gap-1.5 ${
          isActive 
            ? 'bg-blue-600 text-white shadow-md ring-2 ring-blue-500 ring-offset-1' 
            : 'bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200'
        }`;
        btn.innerHTML = `<i class="fa-regular fa-calendar-check"></i> <span>${day.label}</span> <span class="text-xs opacity-80 font-mono">(${day.shortDate})</span>`;
        btn.onclick = () => {
          currentDay = day.key;
          renderDayButtons();
          renderTable();
        };
        container.appendChild(btn);
      });

      document.getElementById('currentWeekRangeBadge').innerHTML = 
        `<i class="fa-regular fa-calendar-days text-blue-600"></i> 本週區間：${CURRENT_WEEK_DAYS[0].shortDate} 〜 ${CURRENT_WEEK_DAYS[4].shortDate}`;
    }

    // 5. 渲染課表
    function renderTable() {
      const dayData = appState[currentDay];
      const tableContainer = document.getElementById('tableContainer');
      tableContainer.innerHTML = '';

      const table = document.createElement('table');
      table.className = 'schedule-table text-center';

      // 表頭
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      headerRow.className = 'h-16 text-sm font-bold';

      const thDate = document.createElement('th');
      thDate.className = 'w-24 p-2 bg-slate-50 text-slate-800 whitespace-pre-line leading-tight text-center border-r-2 font-mono';
      thDate.textContent = dayData.dateStr;
      headerRow.appendChild(thDate);

      dayData.columns.forEach(col => {
        const th = document.createElement('th');
        th.className = `p-2 ${col.headerBg} text-slate-950 whitespace-pre-line leading-snug font-bold border-r`;
        th.style.width = `${100 / (dayData.columns.length + 1)}%`;
        th.textContent = col.name;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      // 課堂列 (1st & 2nd)
      const tbody = document.createElement('tbody');

      ['1st', '2nd'].forEach(periodKey => {
        const periodData = dayData.periods[periodKey];
        if (!periodData) return;

        const row = document.createElement('tr');
        row.className = 'min-h-[220px]';

        const tdTime = document.createElement('td');
        tdTime.className = 'p-3 bg-white font-extrabold text-blue-600 text-lg leading-tight whitespace-pre-line border-r-2 align-middle text-center font-mono';
        tdTime.textContent = periodData.time;
        row.appendChild(tdTime);

        dayData.columns.forEach(col => {
          const cellData = periodData.cells[col.id] || { students: [] };
          const td = document.createElement('td');
          let bgClass = 'bg-white';
          if (cellData.colorType === 'cyan') bgClass = 'bg-cyan-cell';
          if (cellData.colorType === 'yellow') bgClass = 'bg-yellow-cell';

          td.className = `p-2.5 text-left transition-colors relative ${bgClass}`;
          td.dataset.period = periodKey;
          td.dataset.roomId = col.id;

          // 拖曳監聽
          td.addEventListener('dragover', (e) => { e.preventDefault(); td.classList.add('drag-over'); });
          td.addEventListener('dragleave', () => td.classList.remove('drag-over'));
          td.addEventListener('drop', (e) => handleDrop(e, periodKey, col.id));

          const cellContent = document.createElement('div');
          cellContent.className = 'flex flex-col h-full min-h-[190px]';

          // 標頭
          const headerDiv = document.createElement('div');
          headerDiv.className = 'mb-2 font-sans';
          const titleSpan = document.createElement('div');
          titleSpan.className = 'font-black text-slate-900 text-base leading-tight';
          titleSpan.textContent = `${cellData.title} (${cellData.students.length})`;
          const teacherSpan = document.createElement('div');
          teacherSpan.className = 'text-xs font-bold text-slate-700 mt-0.5';
          teacherSpan.textContent = cellData.teacher || '';
          headerDiv.appendChild(titleSpan);
          headerDiv.appendChild(teacherSpan);
          cellContent.appendChild(headerDiv);

          // 學生名單 (分學年整理，同學年內 A-Z 排序)
          const studentsDiv = document.createElement('div');
          studentsDiv.className = 'flex-1 text-base font-semibold leading-relaxed';

          const sortedStudents = sortStudentsStrict(cellData.students);
          const groups = {};
          sortedStudents.forEach(stu => {
            const g = stu.grade || 'G1';
            if (!groups[g]) groups[g] = [];
            groups[g].push(stu);
          });

          Object.keys(groups).sort().forEach(gradeKey => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'mt-1.5 first:mt-0';

            const gLabel = document.createElement('span');
            gLabel.className = 'font-bold text-slate-950 block text-xs underline decoration-slate-400 mb-0.5';
            gLabel.textContent = gradeKey;
            groupDiv.appendChild(gLabel);

            const namesContainer = document.createElement('div');
            namesContainer.className = 'flex flex-wrap items-center gap-x-1 gap-y-1';

            groups[gradeKey].forEach((stu, idx) => {
              namesContainer.appendChild(createStudentBadge(stu, periodKey, col.id));
              if (idx < groups[gradeKey].length - 1) {
                const comma = document.createElement('span');
                comma.textContent = ',';
                comma.className = 'text-slate-500 font-bold mr-1 select-none';
                namesContainer.appendChild(comma);
              }
            });

            groupDiv.appendChild(namesContainer);
            studentsDiv.appendChild(groupDiv);
          });

          cellContent.appendChild(studentsDiv);
          td.appendChild(cellContent);
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      tableContainer.appendChild(table);
    }

    // 建立學生徽章（點擊紅字同步兩節課、拖曳功能）
    function createStudentBadge(student, periodKey, roomId) {
      const span = document.createElement('span');
      span.textContent = student.name;
      span.className = `student-badge ${student.absent ? 'absent' : 'text-slate-900'}`;
      span.setAttribute('draggable', 'true');
      span.title = `學年: ${student.grade} | 點擊: 標記請假/缺席(紅字) | 拖曳: 移動教室`;

      // 點擊缺席切換：第 1 節與第 2 節同步連動
      span.addEventListener('click', (e) => {
        e.stopPropagation();
        student.absent = !student.absent;

        // 同步更新當天另一節課的相同學生
        const dayData = appState[currentDay];
        ['1st', '2nd'].forEach(p => {
          Object.values(dayData.periods[p].cells).forEach(cell => {
            const match = cell.students.find(s => s.name === student.name && s.grade === student.grade);
            if (match) match.absent = student.absent;
          });
        });

        renderTable();
      });

      // 拖曳開始
      span.addEventListener('dragstart', (e) => {
        draggedStudentInfo = {
          studentName: student.name,
          studentGrade: student.grade,
          sourcePeriod: periodKey,
          sourceRoomId: roomId
        };
        e.dataTransfer.setData('text/plain', student.name);
        e.dataTransfer.effectAllowed = 'move';
        span.style.opacity = '0.4';
      });

      span.addEventListener('dragend', () => {
        span.style.opacity = '1';
        draggedStudentInfo = null;
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      });

      return span;
    }

    // 拖曳放置處理
    function handleDrop(e, targetPeriod, targetRoomId) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (!draggedStudentInfo) return;

      const { studentName, studentGrade, sourcePeriod, sourceRoomId } = draggedStudentInfo;
      const dayData = appState[currentDay];

      const srcCell = dayData.periods[sourcePeriod]?.cells[sourceRoomId];
      const tgtCell = dayData.periods[targetPeriod]?.cells[targetRoomId];
      if (!srcCell || !tgtCell) return;

      const idx = srcCell.students.findIndex(s => s.name === studentName && s.grade === studentGrade);
      if (idx === -1) return;

      const [movedStudent] = srcCell.students.splice(idx, 1);
      tgtCell.students.push(movedStudent);

      // 重新排序
      tgtCell.students = sortStudentsStrict(tgtCell.students);

      // 若非 G2 學生，則第一節與第二節連動移動
      if (studentGrade !== 'G2') {
        const otherPeriod = targetPeriod === '1st' ? '2nd' : '1st';
        const otherSrcCell = dayData.periods[otherPeriod]?.cells[sourceRoomId];
        const otherTgtCell = dayData.periods[otherPeriod]?.cells[targetRoomId];

        if (otherSrcCell && otherTgtCell) {
          const oIdx = otherSrcCell.students.findIndex(s => s.name === studentName && s.grade === studentGrade);
          if (oIdx !== -1) {
            const [oMoved] = otherSrcCell.students.splice(oIdx, 1);
            otherTgtCell.students.push(oMoved);
            otherTgtCell.students = sortStudentsStrict(otherTgtCell.students);
          }
        }
      }

      renderTable();
    }

    // 6. 學生程度管理 Modal (Table 視圖 + 文字化呈現)
    function setupLevelManager() {
      const modal = document.getElementById('levelModal');
      const openBtn = document.getElementById('openLevelManagerBtn');
      const closeBtn = document.getElementById('closeLevelModalBtn');
      const cancelBtn = document.getElementById('cancelLevelModalBtn');
      const saveBtn = document.getElementById('saveLevelModalBtn');

      const tabTableBtn = document.getElementById('tabTableBtn');
      const tabTextBtn = document.getElementById('tabTextBtn');
      const tableView = document.getElementById('levelTableView');
      const textView = document.getElementById('levelTextView');
      const tableBody = document.getElementById('studentLevelTableBody');
      const exportTextarea = document.getElementById('levelExportTextarea');

      // 切換分頁
      tabTableBtn.onclick = () => {
        tabTableBtn.className = 'pb-2 border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-1.5';
        tabTextBtn.className = 'pb-2 text-slate-500 hover:text-slate-700 flex items-center gap-1.5';
        tableView.classList.remove('hidden');
        textView.classList.add('hidden');
      };

      tabTextBtn.onclick = () => {
        tabTextBtn.className = 'pb-2 border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-1.5';
        tabTableBtn.className = 'pb-2 text-slate-500 hover:text-slate-700 flex items-center gap-1.5';
        textView.classList.remove('hidden');
        tableView.classList.add('hidden');
        // 更新文字化內容
        exportTextarea.value = generateMasterTextFormat();
      };

      // 產生純文字化格式 (學生 預設程度 星期程度)
      function generateMasterTextFormat() {
        return STUDENTS_MASTER.map(s => {
          return `${s.name} | ${s.grade} | 預設:${s.defaultLevel} | 週一:${s.levels.Monday} | 週二:${s.levels.Tuesday} | 週三:${s.levels.Wednesday} | 週四:${s.levels.Thursday} | 週五:${s.levels.Friday}`;
        }).join('\n');
      }

      // 從純文字解析覆蓋回 STUDENTS_MASTER
      function parseMasterTextFormat(rawText) {
        const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
        const parsed = [];

        lines.forEach(line => {
          const parts = line.split('|').map(p => p.trim());
          if (parts.length >= 8) {
            const name = parts[0];
            const grade = parts[1];
            const defLevel = parts[2].replace('預設:', '').trim();
            const mon = parts[3].replace('週一:', '').trim();
            const tue = parts[4].replace('週二:', '').trim();
            const wed = parts[5].replace('週三:', '').trim();
            const thu = parts[6].replace('週四:', '').trim();
            const fri = parts[7].replace('週五:', '').trim();

            parsed.push({
              name: name,
              grade: grade,
              defaultLevel: defLevel,
              levels: { Monday: mon, Tuesday: tue, Wednesday: wed, Thursday: thu, Friday: fri }
            });
          }
        });

        if (parsed.length > 0) {
          STUDENTS_MASTER = parsed;
        }
      }

      // 渲染表格選單視圖
      function renderTableRows() {
        tableBody.innerHTML = '';
        STUDENTS_MASTER.forEach((stu, index) => {
          const tr = document.createElement('tr');
          tr.className = index % 2 === 0 ? 'bg-white' : 'bg-slate-50/60';

          const createSelect = (value, onchange) => {
            const sel = document.createElement('select');
            sel.className = 'border border-slate-300 rounded px-1.5 py-1 text-xs bg-white focus:ring-1 focus:ring-indigo-500 font-semibold';
            LEVEL_OPTIONS.forEach(opt => {
              const o = document.createElement('option');
              o.value = opt;
              o.textContent = opt;
              if (opt === value) o.selected = true;
              sel.appendChild(o);
            });
            sel.onchange = onchange;
            return sel;
          };

          tr.innerHTML = `
            <td class="p-2 font-bold text-slate-900">${stu.name}</td>
            <td class="p-2 font-mono font-semibold">${stu.grade}</td>
          `;

          // 預設程度
          const tdDef = document.createElement('td');
          tdDef.className = 'p-2';
          tdDef.appendChild(createSelect(stu.defaultLevel, (e) => {
            stu.defaultLevel = e.target.value;
          }));
          tr.appendChild(tdDef);

          // 週一至週五
          DAYS_KEYS.forEach(day => {
            const tdDay = document.createElement('td');
            tdDay.className = 'p-2';
            tdDay.appendChild(createSelect(stu.levels[day] || stu.defaultLevel, (e) => {
              stu.levels[day] = e.target.value;
            }));
            tr.appendChild(tdDay);
          });

          tableBody.appendChild(tr);
        });

        document.getElementById('studentTotalCountText').textContent = `共計 ${STUDENTS_MASTER.length} 位學生`;
      }

      openBtn.onclick = () => {
        renderTableRows();
        exportTextarea.value = generateMasterTextFormat();
        modal.classList.remove('hidden');
      };

      const closeModal = () => modal.classList.add('hidden');
      closeBtn.onclick = closeModal;
      cancelBtn.onclick = closeModal;

      // 儲存
      saveBtn.onclick = () => {
        if (!textView.classList.contains('hidden')) {
          parseMasterTextFormat(exportTextarea.value);
        }
        initAppState();
        renderTable();
        closeModal();
      };
    }

    // 初始化載入
    window.onload = function() {
      initAppState();
      renderDayButtons();
      renderTable();
      setupLevelManager();

      // 合班核取方塊
      const mergeCheckbox = document.getElementById('mergeKids23Checkbox');
      mergeCheckbox.addEventListener('change', (e) => {
        isKids23Merged = e.target.checked;
        initAppState();
        renderTable();
      });

      // 重設按鈕
      document.getElementById('resetBtn').addEventListener('click', () => {
        appState[currentDay] = buildScheduleForDay(currentDay);
        renderTable();
      });
    };
  </script>
</body>
