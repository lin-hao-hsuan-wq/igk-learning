    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const INITIAL_EMPLOYEES = [

            { id: 'r8', name: 'Sammy Abukmeil', aliases: ['Sammy', 'サミー'], type: 'part', location: 'rokko', isActive: true },

            { id: 'r10', name: 'Nathan Morrison', aliases: ['Nathan', 'ネイサン'], type: 'part', location: 'rokko', isActive: true },
            { id: 'r11', name: '沼田真里子', aliases: ['Mariko', 'マリコ', 'まりこ', '沼田 真里子'], type: 'part', location: 'rokko', isActive: true },
            { id: 'r12', name: '安藤佑也', aliases: ['Ando', '安藤', 'あんどう', '安藤 佑也'], type: 'part', location: 'rokko', isActive: true },
            { id: 'r13', name: 'ミサト', aliases: ['Misato', 'みさと'], type: 'part', location: 'rokko', isActive: true },
            { id: 'r14', name: 'ナオ', aliases: ['Nao', 'なお'], type: 'part', location: 'rokko', isActive: true },

            { id: 'm1', name: '加藤友梨', aliases: ['加藤', 'かとう'], type: 'full', location: 'myodani', isActive: true },
            { id: 'm2', name: 'Linh', aliases: ['リン'], type: 'full', location: 'myodani', isActive: true },
            { id: 'm3', name: '大津真里', aliases: ['大津', 'おおつ'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm4', name: '馬場亜希', aliases: ['馬場', 'ばば'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm5', name: '篠崎', aliases: ['しのざき'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm6', name: '吉野', aliases: ['よしの'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm7', name: '森', aliases: ['もり'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm8', name: 'Ugiloy', aliases: ['ウギロイ'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm9', name: 'Hamna', aliases: ['ハムナ'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm10', name: 'タプリヒン', aliases: [], type: 'part', location: 'myodani', isActive: true },
            { id: 'm11', name: 'Sadia', aliases: ['サディア'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm12', name: 'Monika', aliases: ['モニカ'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm13', name: '中嶋莉真', aliases: ['中嶋', 'なかじま'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm14', name: '顕谷ユタカ', aliases: ['顕谷', 'あきたに'], type: 'part', location: 'myodani', isActive: true },
            { id: 'm15', name: 'Mozelle Bargamin', aliases: ['Mozelle', 'モゼル'], type: 'part', location: 'myodani', isActive: true }
        ];

        const TAB_COLORS = [
            'bg-pink-50 border-t-4 border-pink-400 text-pink-700 shadow-sm print:border-none',
            'bg-blue-50 border-t-4 border-blue-400 text-blue-700 shadow-sm print:border-none',
            'bg-emerald-50 border-t-4 border-emerald-400 text-emerald-700 shadow-sm print:border-none',
            'bg-purple-50 border-t-4 border-purple-400 text-purple-700 shadow-sm print:border-none',
            'bg-orange-50 border-t-4 border-orange-400 text-orange-700 shadow-sm print:border-none',
            'bg-teal-50 border-t-4 border-teal-400 text-teal-700 shadow-sm print:border-none',
        ];

        const timeToMins = (t) => {
            if (!t || typeof t !== 'string') return 0;
            const [h, m] = t.split(':').map(Number);
            return (h * 60) + (isNaN(m) ? 0 : m);
        };
        const minsToTime = (m) => {
            if (m === null || m === undefined || isNaN(m) || m <= 0) return '';
            return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
        };
        
        const formatTimeWithDec = (mins) => {
            if (!mins || mins === 0) return '-';
            const hm = minsToTime(mins);
            const dec = (mins / 60).toFixed(2).replace(/\.00$/, '');
            return <>{hm} <span className="text-xs font-bold opacity-60 print:text-[10px]">({dec} H)</span></>;
        };

        const loadSavedState = (key, defaultVal) => {
            try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : defaultVal; }
            catch(e) { return defaultVal; }
        };

        function App() {
            const [activePage, setActivePage] = useState(() => loadSavedState('igk_pro_activePage', 'import')); 
            const [activeLocation, setActiveLocation] = useState(() => loadSavedState('igk_pro_activeLocation', 'rokko')); 
            
            const [employees, setEmployees] = useState(() => loadSavedState('igk_pro_employees_v6', INITIAL_EMPLOYEES.map(e => ({...e, isActive: e.isActive !== false}))));
            const [isEmpManagerOpen, setIsEmpManagerOpen] = useState(false);

            const [period, setPeriod] = useState(() => {
                const saved = loadSavedState('igk_pro_period', null);
                if (saved) return saved;
                const today = new Date();
                let initM = today.getDate() >= 16 ? today.getMonth() + 2 : today.getMonth() + 1;
                let initY = today.getFullYear();
                if (initM > 12) { initM -= 12; initY += 1; }
                return `${initY}-${String(initM).padStart(2, '0')}`;
            });
            
            const [settings, setSettings] = useState(() => loadSavedState('igk_pro_settings', { baseStart: '09:30', baseEnd: '18:30', special: [] }));
            const [attendance, setAttendance] = useState(() => loadSavedState('igk_pro_attendance', {})); 
            const [monthlyData, setMonthlyData] = useState(() => loadSavedState('igk_pro_monthlyData', {})); 
            const [activeEmp, setActiveEmp] = useState(() => loadSavedState('igk_pro_activeEmp', employees[0].id)); 
            const [hourlyWage, setHourlyWage] = useState(() => loadSavedState('igk_pro_hourlyWage', 1200));
            const [empForm, setEmpForm] = useState({ id: '', name: '', aliases: '', type: 'part', location: 'rokko', isActive: true });

            useEffect(() => localStorage.setItem('igk_pro_activePage', JSON.stringify(activePage)), [activePage]);
            useEffect(() => localStorage.setItem('igk_pro_activeLocation', JSON.stringify(activeLocation)), [activeLocation]);
            useEffect(() => localStorage.setItem('igk_pro_activeEmp', JSON.stringify(activeEmp)), [activeEmp]);
            useEffect(() => localStorage.setItem('igk_pro_period', JSON.stringify(period)), [period]);
            useEffect(() => localStorage.setItem('igk_pro_attendance', JSON.stringify(attendance)), [attendance]);
            useEffect(() => localStorage.setItem('igk_pro_monthlyData', JSON.stringify(monthlyData)), [monthlyData]);
            useEffect(() => localStorage.setItem('igk_pro_settings', JSON.stringify(settings)), [settings]);
            useEffect(() => localStorage.setItem('igk_pro_hourlyWage', JSON.stringify(hourlyWage)), [hourlyWage]);
            useEffect(() => localStorage.setItem('igk_pro_employees_v6', JSON.stringify(employees)), [employees]);

            const FULL_TIME_EMPS = employees.filter(e => e.type === 'full' && e.isActive);

            const [newSp, setNewSp] = useState({ 
                name: '', start: '', end: '', timeIn: '09:30', timeOut: '18:30',
                targetEmps: FULL_TIME_EMPS.map(e => e.id) 
            });

            const [pastedData, setPastedData] = useState('');

            const dates = useMemo(() => {
                if (!period || !period.includes('-')) return [];
                const [y, m] = period.split('-').map(Number);
                if (isNaN(y) || isNaN(m)) return [];
                const start = new Date(y, m - 2, 16);
                const end = new Date(y, m - 1, 15);
                let arr = [];
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    arr.push(new Date(d));
                }
                return arr;
            }, [period]);

            const dKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const formatDisplayDate = (d) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                return `${d.getMonth() + 1}/${d.getDate()} (${days[d.getDay()]})`;
            };
            const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;

            const handleSaveEmployee = () => {
                if (!empForm.name.trim()) return alert("名前を入力してください！");
                const aliasArray = empForm.aliases.split(',').map(s => s.trim()).filter(Boolean);
                
                if (empForm.id) {
                    setEmployees(prev => prev.map(e => e.id === empForm.id ? { ...empForm, aliases: aliasArray } : e));
                    alert(`「${empForm.name}」の情報を更新しました。`);
                } else {
                    const newId = 'emp_' + Date.now();
                    setEmployees(prev => [...prev, { ...empForm, id: newId, aliases: aliasArray }]);
                    alert(`新しい従業員「${empForm.name}」を追加しました。`);
                }
                setEmpForm({ id: '', name: '', aliases: '', type: 'part', location: 'rokko', isActive: true });
            };

            const handleEditEmployee = (emp) => {
                setEmpForm({ ...emp, aliases: (emp.aliases || []).join(', ') });
                setIsEmpManagerOpen(true);
            };

            const handlePaste = () => {
                if (!pastedData.trim()) return alert("打刻データを貼り付けてください。");
                let newData = JSON.parse(JSON.stringify(attendance)); 
                const text = pastedData.toLowerCase();
                const timeRegex = /(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?[\s\n]*(\d{1,2})[:：](\d{2})/g;
                
                const matches = [...text.matchAll(timeRegex)];
                if (matches.length === 0) return alert("一致する名前や時間のフォーマットが見つかりませんでした。");

                let count = 0;
                let autoPeriod = null;
                let lastEmpLoc = null;
                let lastFoundEmpId = null;

                const getClosestDist = (str, char, pivot) => {
                    let left = str.lastIndexOf(char, pivot);
                    let right = str.indexOf(char, pivot);
                    let d1 = left !== -1 ? pivot - left : 9999;
                    let d2 = right !== -1 ? right - pivot : 9999;
                    return Math.min(d1, d2);
                };

                for (let i = 0; i < matches.length; i++) {
                    const match = matches[i];
                    const month = match[1], day = match[2], hr = match[3], min = match[4];
                    const timeStr = `${hr.padStart(2,'0')}:${min.padStart(2,'0')}`;
                    
                    const startIdx = i === 0 ? Math.max(0, match.index - 150) : matches[i-1].index + matches[i-1][0].length;
                    const endIdx = i === matches.length - 1 ? Math.min(text.length, match.index + 150) : matches[i+1].index;
                    const block = text.substring(startIdx, endIdx);
                    
                    let foundEmpId = null;
                    for (let emp of employees) { 
                        const names = [emp.name.toLowerCase(), ...emp.aliases.map(a => a.toLowerCase().replace(/\s/g,''))];
                        if (names.some(n => block.replace(/\s/g,'').includes(n))) {
                            foundEmpId = emp.id;
                            lastEmpLoc = emp.location; 
                            break;
                        }
                    }

                    if (foundEmpId) lastFoundEmpId = foundEmpId;
                    else foundEmpId = lastFoundEmpId; 

                    if (foundEmpId) {
                        const y = new Date().getFullYear(); 
                        const dateObj = new Date(y, parseInt(month)-1, parseInt(day));
                        const key = dKey(dateObj);
                        
                        if (!autoPeriod) {
                            let tmpy = dateObj.getFullYear();
                            let tmpm = dateObj.getDate() >= 16 ? dateObj.getMonth() + 2 : dateObj.getMonth() + 1;
                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                        }

                        let timeLocalIdx = match.index - startIdx;
                        let outDist = Math.min(getClosestDist(block, '退', timeLocalIdx), getClosestDist(block, 'out', timeLocalIdx));
                        let inDist = Math.min(getClosestDist(block, '入', timeLocalIdx), getClosestDist(block, 'in', timeLocalIdx));
                        
                        let type = 'inTime';
                        if (outDist < inDist) {
                            type = 'outTime';
                        } else if (outDist === 9999 && inDist === 9999) {
                            if (newData[foundEmpId] && newData[foundEmpId][key] && newData[foundEmpId][key].inTime) type = 'outTime';
                        }

                        if (!newData[foundEmpId]) newData[foundEmpId] = {};
                        if (!newData[foundEmpId][key]) newData[foundEmpId][key] = {};
                        newData[foundEmpId][key][type] = timeStr;
                        count++;
                    }
                }
                
                if (count > 0) {
                    setAttendance(newData);
                    setPastedData('');
                    if (autoPeriod) setPeriod(autoPeriod);
                    if (lastEmpLoc) setActiveLocation(lastEmpLoc); 
                    setActivePage('preview');
                    alert(`${count} 件の打刻データを正常に取り込みました！`);
                } else {
                    alert("一致する名前や時間のフォーマットが見つかりませんでした。");
                }
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = new ExcelJS.Workbook();
                        await wb.xlsx.load(evt.target.result);
                        let newData = JSON.parse(JSON.stringify(attendance));
                        let localEmps = JSON.parse(JSON.stringify(employees));
                        let employeesChanged = false;
                        let count = 0;
                        let autoPeriod = null;
                        
                        let sessionIgnores = new Set(); 

                        const extractTime = (val) => {
                            if (!val) return null;
                            let v = val.value !== undefined ? val.value : val;
                            if (v && v.result !== undefined) v = v.result;
                            if (typeof v === 'number' && v > 0 && v < 1) {
                                let tm = Math.round(v * 24 * 60);
                                return `${String(Math.floor(tm/60)).padStart(2,'0')}:${String(tm%60).padStart(2,'0')}`;
                            }
                            let str = (val.text || (typeof v === 'string' ? v : '')).trim();
                            const m = str.match(/^(\d{1,2})[:：](\d{2})$/);
                            if (m) return `${m[1].padStart(2, '0')}:${m[2]}`;
                            if (v instanceof Date) {
                                return `${String(v.getUTCHours()).padStart(2,'0')}:${String(v.getUTCMinutes()).padStart(2,'0')}`;
                            }
                            return null;
                        };

                        wb.worksheets.forEach(ws => {
                            let currentDates = {}; 
                            let currentColMap = {};

                            for (let r = 1; r <= ws.rowCount; r++) {
                                for (let c = 1; c <= 10; c++) {
                                    let t = (ws.getCell(r, c).text || '').replace(/\s+/g, '');
                                    const m = t.match(/(?:(?:20)?\d{2}[\/\-年])?(\d{1,2})[\/\-月](\d{1,2})日?/);
                                    if (m) {
                                        let y = new Date().getFullYear();
                                        const yMatch = t.match(/(20\d{2})/); if (yMatch) y = parseInt(yMatch[1]);
                                        let dObj = new Date(y, parseInt(m[1])-1, parseInt(m[2]));
                                        currentDates[r] = { key: dKey(dObj), obj: dObj };
                                        break;
                                    }
                                }

                                let matches = 0;
                                let tempMap = {};
                                let tempUnknown = [];

                                for (let c = 1; c <= 40; c++) {
                                    let cellRaw = ws.getCell(r, c).text || '';
                                    let v = cellRaw.toLowerCase().replace(/\s+/g, '');
                                    if (v.length >= 1) {
                                        let matched = false;
                                        for (const emp of localEmps) { 
                                            let s = [emp.name.toLowerCase().replace(/\s+/g, ''), ...emp.aliases.map(a => a.toLowerCase().replace(/\s+/g, ''))];
                                            if (s.includes(v) || s.some(name => v.includes(name) && name.length >= 2)) {
                                                tempMap[c] = emp.id; matches++; matched = true; break;
                                            }
                                        }
                                        if (!matched && v.length >= 2 && v.length <= 20 && !v.match(/^[0-9:\.\-\/]+$/)) {
                                            if (!sessionIgnores.has(v)) {
                                                tempUnknown.push({col: c, name: cellRaw.trim(), key: v});
                                            }
                                        }
                                    }
                                }
                                
                                if (matches >= 2) { 
                                    if (tempUnknown.length > 0) {
                                        tempUnknown.forEach(unk => {
                                            if (sessionIgnores.has(unk.key)) return; 
                                            
                                            const mappedName = window.prompt(`未知の担当者/項目「${unk.name}」が見つかりました。\n既存の従業員に紐付ける場合は、その従業員の名前（または一部）を入力してください。\n（無視する場合はそのまま空白でOKを押してください）`);
                                            
                                            if (mappedName && mappedName.trim()) {
                                                const targetIdx = localEmps.findIndex(e => e.name.includes(mappedName.trim()) || e.aliases.some(a => a.includes(mappedName.trim())));
                                                if (targetIdx !== -1) {
                                                    alert(`「${unk.name}」を ${localEmps[targetIdx].name} に紐付けました。`);
                                                    localEmps[targetIdx].aliases.push(unk.name);
                                                    tempMap[unk.col] = localEmps[targetIdx].id;
                                                    employeesChanged = true;
                                                } else {
                                                    sessionIgnores.add(unk.key);
                                                }
                                            } else {
                                                sessionIgnores.add(unk.key);
                                            }
                                        });
                                    }
                                    currentColMap = tempMap;
                                }

                                let activeDateRow = Object.keys(currentDates).reverse().find(dr => r >= parseInt(dr));
                                if (activeDateRow && Object.keys(currentColMap).length > 0) {
                                    let dateInfo = currentDates[activeDateRow];
                                    
                                    let rowTimeStr = null;
                                    for(let c=1; c<=3; c++) {
                                        rowTimeStr = extractTime(ws.getCell(r, c));
                                        if(rowTimeStr) break;
                                    }
                                    
                                    if (rowTimeStr) {
                                        let rowMins = timeToMins(rowTimeStr);
                                        if (!autoPeriod) {
                                            let tmpy = dateInfo.obj.getFullYear();
                                            let tmpm = dateInfo.obj.getDate() >= 16 ? dateInfo.obj.getMonth() + 2 : dateInfo.obj.getMonth() + 1;
                                            if (tmpm > 12) { tmpm -= 12; tmpy += 1; }
                                            autoPeriod = `${tmpy}-${String(tmpm).padStart(2, '0')}`;
                                        }

                                        let allExtractedData = {};

                                        Object.keys(currentColMap).forEach(c => {
                                            const empId = currentColMap[c];
                                            let actCell = ws.getCell(r, parseInt(c));
                                            if (actCell.isMerged) actCell = ws.getCell(actCell.master.address);
                                            
                                            let cellText = (actCell.text || '').trim();
                                            let hasContent = /[a-zA-Z0-9\u3040-\u30FF\u4E00-\u9FFF]/.test(cellText);
                                            const exactMatches = [...cellText.matchAll(/([0-9]{1,2})[:：]([0-9]{2})/g)];
                                            
                                            let fill = actCell.fill || {};
                                            let hex = '';
                                            
                                            if (fill.type === 'pattern' && fill.pattern !== 'none') {
                                                hex = (fill.fgColor?.argb || fill.bgColor?.argb || '').toUpperCase();
                                                if (hex && ['FFFFFFFF', '00000000', 'FF000000', '00FFFFFF'].includes(hex)) hex = '';
                                            }

                                            let theme = fill.fgColor?.theme ?? fill.bgColor?.theme ?? -1;
                                            let indexed = fill.fgColor?.indexed ?? fill.bgColor?.indexed ?? -1;

                                            if (hasContent || hex || theme !== -1 || indexed !== -1) {
                                                const yellowHexes = ['FFFF00', 'FFC000', 'FFD966', 'FFE699', 'FFF2CC', 'FFEB9C', 'D965'];
                                                let isYellow = (hex && yellowHexes.some(y => hex.includes(y))) || theme === 7 || indexed === 34 || indexed === 51 || indexed === 13;
                                                
                                                const blueHexes = ['B4C6E7', 'D9E1F2', '8EA9DB', '2F75B5', '9BC2E6', 'DDEBF7', '0070C0', '002060', '00B0F0', 'AADC', 'E1F2', 'CCFF', '3366FF', '0000FF'];
                                                let isBlue = (hex && blueHexes.some(b => hex.includes(b))) || theme === 4 || theme === 8 || indexed === 4 || indexed === 12 || indexed === 20 || indexed === 37;

                                                let isGrey = (hex && (hex.includes('A6A6') || hex.includes('D9D9') || hex.includes('BFBF') || hex.includes('8080') || hex.includes('AEAAAA'))) || theme === 3 || indexed === 15 || indexed === 22 || indexed === 23;

                                                let blockType = 'igkB'; 

                                                if (cellText.includes('欠') || cellText.includes('休') || isGrey) {
                                                    if (cellText.includes('欠') || cellText.includes('休')) {
                                                        if (!newData[empId]) newData[empId] = {};
                                                        if (!newData[empId][dateInfo.key]) newData[empId][dateInfo.key] = {};
                                                        newData[empId][dateInfo.key].leave = cellText.substring(0, 10);
                                                    }
                                                    return; 
                                                }

                                                let isDriverKeyword = cellText.includes('乗車') || cellText.includes('下車') || cellText.includes('降車') || cellText.includes('車') || cellText.includes('返却');
                                                
                                                if ((isYellow || isDriverKeyword) && exactMatches.length > 0) {
                                                    blockType = 'driver_with_time';
                                                } else if (isYellow || isDriverKeyword) {
                                                    blockType = 'igkB';
                                                } else if (!isBlue && hasContent) {
                                                    blockType = 'igkA';
                                                }

                                                if (!allExtractedData[empId]) allExtractedData[empId] = {};
                                                if (!allExtractedData[empId][dateInfo.key]) {
                                                    allExtractedData[empId][dateInfo.key] = { minTime: 9999, maxTime: -1, exactTimes: [], driverExactTimes: [], igkAMins: 0, igkBMins: 0 };
                                                }
                                                
                                                let ed = allExtractedData[empId][dateInfo.key];
                                                
                                                if (rowMins < ed.minTime) ed.minTime = rowMins;
                                                if (rowMins > ed.maxTime) ed.maxTime = rowMins;

                                                if (blockType === 'igkA') {
                                                    ed.igkAMins += 30;
                                                } else if (blockType === 'igkB') {
                                                    ed.igkBMins += 30;
                                                }

                                                exactMatches.forEach(m => {
                                                    let tMins = timeToMins(`${m[1].padStart(2, '0')}:${m[2]}`);
                                                    if (blockType === 'driver_with_time') {
                                                        ed.driverExactTimes.push(tMins);
                                                    } else {
                                                        ed.exactTimes.push(tMins);
                                                    }
                                                });
                                            }
                                        });

                                        Object.keys(allExtractedData).forEach(empId => {
                                            Object.keys(allExtractedData[empId]).forEach(dateKey => {
                                                const data = allExtractedData[empId][dateKey];
                                                let startMins = data.minTime;
                                                let endMins = data.maxTime + 30; 

                                                if (data.exactTimes.length > 0) {
                                                    const minExact = Math.min(...data.exactTimes);
                                                    const maxExact = Math.max(...data.exactTimes);
                                                    if (Math.abs(minExact - startMins) <= 120) startMins = minExact;
                                                    if (Math.abs(maxExact - endMins) <= 120) endMins = maxExact;
                                                }

                                                if (startMins < 9999 && endMins > -1) {
                                                    if (!newData[empId]) newData[empId] = {};
                                                    if (!newData[empId][dateKey]) newData[empId][dateKey] = {};
                                                    
                                                    let curIn = timeToMins(newData[empId][dateKey].shiftIn || '23:59');
                                                    let curOut = timeToMins(newData[empId][dateKey].shiftOut || '00:00');
                                                    
                                                    if (startMins < curIn) newData[empId][dateKey].shiftIn = minsToTime(startMins);
                                                    if (endMins > curOut) newData[empId][dateKey].shiftOut = minsToTime(endMins);
                                                    
                                                    newData[empId][dateKey].igkA = data.igkAMins > 0 ? minsToTime(data.igkAMins) : '';
                                                    
                                                    if (data.driverExactTimes && data.driverExactTimes.length > 0) {
                                                        let times = data.driverExactTimes.sort((a,b) => a - b);
                                                        let totalDriverMins = 0;
                                                        let tripStrs = [];
                                                        
                                                        for (let i = 0; i < times.length - 1; i += 2) {
                                                            totalDriverMins += (times[i+1] - times[i]);
                                                            tripStrs.push(`${minsToTime(times[i])}-${minsToTime(times[i+1])}`);
                                                        }
                                                        
                                                        newData[empId][dateKey].driverMins = minsToTime(totalDriverMins);
                                                        let existingRemark = newData[empId][dateKey].remark || '';
                                                        let newRemark = tripStrs.join(', ');
                                                        newData[empId][dateKey].remark = existingRemark ? (existingRemark + ' / ' + newRemark) : newRemark;
                                                    } else {
                                                        newData[empId][dateKey].driverMins = ''; 
                                                    }
                                                    count++;
                                                }
                                            });
                                        });
                                    }
                                }
                            });
                        });
                        
                        if (employeesChanged) setEmployees(localEmps);
                        if (count > 0) {
                            setAttendance(newData);
                            if (autoPeriod) setPeriod(autoPeriod);
                            setActivePage('preview');
                            alert(`取り込み完了！セクション数: ${count}`);
                        }
                    } catch (err) {
                        alert(`❌ 解析エラー: ${err.message}`);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const updateCell = (id, d, field, val) => {
                setAttendance(prev => ({
                    ...prev, [id]: { ...prev[id], [d]: { ...prev[id]?.[d], [field]: val } }
                }));
            };

            const updateMonthlyData = (id, p, field, val) => {
                const key = `${id}_${p}`;
                setMonthlyData(prev => ({
                    ...prev, [key]: { ...prev[key], [field]: val }
                }));
            };

            const calculateRow = (date, row, emp) => {
                const isWknd = isWeekend(date);
                let inTime = row.inTime || '';
                let outTime = row.outTime || '';
                let shiftIn = row.shiftIn || '';
                let shiftOut = row.shiftOut || '';
                let leave = row.leave || '';
                let igkA = row.igkA || '';
                let breakTime = row.breakTime !== undefined ? row.breakTime : (emp.type === 'full' ? '01:00' : '00:00');
                let breakMins = timeToMins(breakTime);

                if (emp.type === 'full') {
                    shiftIn = shiftIn || settings.baseStart;
                    shiftOut = shiftOut || settings.baseEnd;
                    (settings.special || []).forEach(sp => {
                        const isTarget = sp.targetEmps ? sp.targetEmps.includes(emp.id) : true;
                        if (isTarget && new Date(date) >= new Date(sp.start) && new Date(date) <= new Date(sp.end)) {
                            shiftIn = sp.timeIn; shiftOut = sp.timeOut;
                        }
                    });
                }

                let actualShiftIn = shiftIn;
                if (inTime && shiftIn) {
                    const inM = timeToMins(inTime);
                    const sInM = timeToMins(shiftIn);
                    if (inM > sInM && inM <= sInM + 4) actualShiftIn = minsToTime(sInM + 5);
                    else if (inM > sInM + 4) actualShiftIn = minsToTime(Math.ceil(inM / 5) * 5);
                }

                let earlyOtMins = 0, lateOtMins = 0;
                if (emp.type === 'full' && !leave) {
                    if (inTime && shiftIn) {
                        let diff = timeToMins(shiftIn) - timeToMins(inTime);
                        if (diff > 0) earlyOtMins = diff;
                    }
                    if (outTime && shiftOut) {
                        let diff = timeToMins(outTime) - timeToMins(shiftOut);
                        if (diff > 0) lateOtMins = diff;
                    }
                }

                let totalWorkMins = 0;
                if (inTime && outTime && !leave) {
                    totalWorkMins = Math.max(0, timeToMins(outTime) - timeToMins(actualShiftIn) - breakMins);
                } else if (shiftIn && shiftOut && emp.type === 'full' && !leave) {
                    totalWorkMins = Math.max(0, timeToMins(shiftOut) - timeToMins(shiftIn) - breakMins);
                }

                const igkAMins = timeToMins(igkA);
                const igkBMins = Math.max(0, totalWorkMins - igkAMins);
                const driverMins = row.driverMins ? timeToMins(row.driverMins) : 0;

                return { isWknd, actualShiftIn, shiftOut, earlyOtMins, lateOtMins, totalWorkMins, igkAMins, igkBMins, driverMins, breakTime };
            };

            const switchLocation = (loc) => setActiveLocation(loc);

            const hasDataInPeriod = (empId) => {
                if (!attendance[empId]) return false;
                return dates.some(d => {
                    const k = dKey(d);
                    const r = attendance[empId][k];
                    return r && (r.inTime || r.outTime || r.leave || r.driverMins || r.igkA || r.remark);
                });
            };

            const currentEmployees = employees.filter(e => e.location === activeLocation && (e.isActive !== false || hasDataInPeriod(e.id)));
            
            useEffect(() => {
                if (currentEmployees.length > 0 && !currentEmployees.find(e => e.id === activeEmp)) {
                    setActiveEmp(currentEmployees[0].id);
                }
            }, [currentEmployees, activeEmp]);

            const currentEmp = currentEmployees.find(e => e.id === activeEmp) || currentEmployees[0];

            const handleExportAllExcel = async () => {
                const wb = new ExcelJS.Workbook();
                const activeEmpsThisMonth = employees.filter(e => hasDataInPeriod(e.id));
                if (activeEmpsThisMonth.length === 0) return alert('この月のデータがありません！');

                const wsSummary = wb.addWorksheet('給与・勤怠まとめ');
                wsSummary.columns = [
                    { header: '所属校', key: 'loc', width: 12 },
                    { header: '氏名', key: 'name', width: 20 },
                    { header: '雇用形態', key: 'type', width: 12 },
                    { header: '出勤日数', key: 'days', width: 10 },
                    { header: '有休', key: 'paidLeave', width: 8 },
                    { header: '事/病欠', key: 'unpaidLeave', width: 10 },
                    { header: '総労働時間(H)', key: 'totalH', width: 15 },
                    { header: 'IGK A (H)', key: 'igkaH', width: 12 },
                    { header: 'IGK B (H)', key: 'igkbH', width: 12 },
                    { header: '運転 (H)', key: 'driverH', width: 12 },
                    { header: '早残業(分)', key: 'earlyOT', width: 12 },
                    { header: '後残業(分)', key: 'lateOT', width: 12 },
                    { header: '交通費(円)', key: 'transport', width: 12 },
                    { header: '推定給与(円)', key: 'salary', width: 15 },
                ];

                activeEmpsThisMonth.forEach(emp => {
                    let sumDays = 0, sumPaidLeave = 0, sumUnpaidLeave = 0, sumSickLeave = 0;
                    let sumIgka = 0, sumIgkb = 0, sumEarly = 0, sumLate = 0, sumDriver = 0;

                    const wsEmp = wb.addWorksheet(emp.name.substring(0, 30).replace(/[/\\?*:[\]]/g, ''));
                    const isDriver = ['實熊功光', '上山貴行', '安藤佑也', 'Mikuma', 'Taka', 'Ando'].some(n => emp.name.includes(n) || (emp.aliases || []).includes(n));

                    wsEmp.addRow(['氏名', emp.name, '雇用形態', emp.type === 'full' ? '正社員' : 'アルバイト', '対象月', period]);
                    wsEmp.addRow([]);

                    // ★ 修正重點：確定 headers 不包含乗車下車字眼
                    let headers = ['日付', '入室', '退室', 'シフト', '休憩'];
                    if (emp.type === 'full') {
                        headers.push('備考・特記事項', '早残業(分)', '後残業(分)');
                    } else {
                        if (isDriver) headers.push('運転時間'); 
                        headers.push('IGK A', 'IGK B', '備考・特記事項');
                    }
                    const headerRow = wsEmp.addRow(headers);
                    headerRow.font = { bold: true };
                    headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFCBD5E1' } };

                    dates.forEach(d => {
                        const key = dKey(d);
                        const row = attendance[emp.id]?.[key] || {};
                        const calc = calculateRow(d, row, emp);
                        if (row.inTime || row.outTime) sumDays++;
                        if (row.leave === '有休') sumPaidLeave++;
                        else if (row.leave === '事欠') sumUnpaidLeave++;
                        else if (row.leave === '病欠') sumSickLeave++;
                        sumIgka += calc.igkAMins; sumIgkb += calc.igkBMins;
                        sumEarly += calc.earlyOtMins; sumLate += calc.lateOtMins;
                        sumDriver += calc.driverMins;

                        let rowData = [formatDisplayDate(d), row.leave ? row.leave : (row.inTime || ''), row.leave ? '-' : (row.outTime || ''), calc.actualShiftIn && calc.shiftOut && !row.leave ? `${calc.actualShiftIn}-${calc.shiftOut}` : '-', row.leave ? '-' : calc.breakTime];
                        if (emp.type === 'full') {
                            rowData.push(row.remark || (row.leave ? row.leave : ''), calc.earlyOtMins > 0 ? calc.earlyOtMins : '', calc.lateOtMins > 0 ? calc.lateOtMins : '');
                        } else {
                            if (isDriver) rowData.push(row.driverMins || (calc.driverMins > 0 ? minsToTime(calc.driverMins) : ''));
                            rowData.push(row.igkA || '', calc.igkBMins > 0 ? minsToTime(calc.igkBMins) : '', row.remark || '');
                        }
                        wsEmp.addRow(rowData);
                    });
                    wsEmp.columns.forEach(col => col.width = 14);
                });

                const buffer = await wb.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                window.saveAs(blob, `IGK_勤怠給与まとめ_${period}.xlsx`);
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* UI 頁面結構保持不變... */}
                    <div className="bg-white text-slate-800 p-4 flex gap-4 print:hidden shadow-sm items-center border-b border-gray-200">
                        <h1 className="text-xl font-black mr-4 text-indigo-900">IGK 勤怠管理</h1>
                        <button onClick={() => setActivePage('import')} className={`px-5 py-1.5 rounded-full font-bold text-sm ${activePage === 'import' ? 'bg-indigo-500 text-white' : 'text-gray-400'}`}>① データ入力・設定</button>
                        <button onClick={() => setActivePage('preview')} className={`px-5 py-1.5 rounded-full font-bold text-sm ${activePage === 'preview' ? 'bg-emerald-500 text-white' : 'text-gray-400'}`}>② 個人勤務表・給与</button>
                    </div>

                    {activePage === 'import' && (
                        <div className="p-6 max-w-5xl mx-auto space-y-6 w-full animate-fadeIn">
                             <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <h2 onClick={() => setIsEmpManagerOpen(!isEmpManagerOpen)} className="text-lg font-black cursor-pointer">従業員名簿管理</h2>
                                {isEmpManagerOpen && (<div>...名簿 UI...</div>)}
                             </div>
                             <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <label className="block w-full cursor-pointer border-2 border-dashed border-blue-200 p-8 rounded-2xl bg-blue-50 hover:bg-blue-100 text-center">
                                    <input type="file" accept=".xlsx" onChange={handleExcelUpload} className="hidden" />
                                    <div className="text-blue-600 font-bold">Excel ファイルを取り込む</div>
                                </label>
                            </div>
                        </div>
                    )}

                    {activePage === 'preview' && (
                        <div className="p-4 w-full max-w-[1400px] mx-auto">
                            {/* ...預覽 UI... */}
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
